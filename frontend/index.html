const af = (url,opts={})=>fetch(url,{...opts,headers:{'ngrok-skip-browser-warning':'true',...(opts.headers||{})}});
const authFetch = (url,token,opts={})=>fetch(url,{...opts,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json','ngrok-skip-browser-warning':'true',...(opts.headers||{})}});
const authFetchForm = (url,token,body)=>fetch(url,{method:'POST',headers:{'Authorization':'Bearer '+token,'ngrok-skip-browser-warning':'true'},body});
const sleep = (ms)=>new Promise(resolve=>setTimeout(resolve,ms));
const getModelValue = (m)=>m?.name||'yolo26n.pt';
const getModelRequiredItems = (m)=>Array.isArray(m?.required_items)?m.required_items:[];
const findModelByValue = (models,val)=>models.find(m=>getModelValue(m)===val)||null;
const maskCameraUrl=(value)=>{
  let s=String(value||'');
  if(!s) return s;
  s=s.replace(/(rtsp:\/\/)([^@/\s]+)@/i,(m,p,cred)=>{
    const user=cred.split(':')[0]||'usuario';
    return p+user+':***@';
  });
  s=s.replace(/((?:password|passwd|pwd|pass)=)[^&\s/]+/ig,'$1***');
  s=s.replace(/((?:_password_|password_|passwd_|pwd_))[^&\s/]+/ig,'$1***');
  return s;
};

async function resolveBackendFromHub({attempts=1,delayMs=1200}={}){
  if(!CONFIG_HUB_URL) return '';
  let lastError='Hub sem backend disponivel';
  for(let i=0;i<attempts;i++){
    try{
      const r=await fetch(CONFIG_HUB_URL+'/nodes',{cache:'no-store',headers:{'ngrok-skip-browser-warning':'true'}});
      const d=await r.json().catch(()=>({}));
      if(r.ok){
        const nodes=Array.isArray(d.nodes)?d.nodes:[];
        const live=(await Promise.all(nodes.map(probeBackendNode))).filter(Boolean);
        live.sort((a,b)=>
          (b.availability-a.availability) ||
          (a.activeStreams-b.activeStreams) ||
          (a.pingMs-b.pingMs)
        );
        if(live[0]) return live[0].url;
        lastError=nodes.length?'Nenhum backend respondeu ao teste de disponibilidade':'Hub sem backend disponivel';
      }else{
        lastError=d.error || lastError;
      }
    }catch(e){
      lastError=e.message || lastError;
    }
    if(i<attempts-1) await sleep(delayMs);
  }
  throw new Error(lastError);
}

async function probeBackendNode(node){
  const url=cleanUrl(node&&node.url);
  if(!url) return null;
  const started=performance.now();
  try{
    const r=await af(url+'/status',{cache:'no-store'});
    if(!r.ok) return null;
    const status=await r.json().catch(()=>({}));
    return {
      url,
      node,
      status,
      availability:Number(status.availability ?? node.availability ?? 0),
      activeStreams:Number(status.active_streams ?? node.active_streams ?? 0),
      pingMs:Math.round(performance.now()-started)
    };
  }catch{
    return null;
  }
}
/* ═══ AUTH ═══════════════════════════════════════════════════ */
function AuthScreen({onLogin,backendUrl}){
  const [tab,setTab]=useState('login');
  const [err,setErr]=useState('');
  const [ok,setOk]=useState('');
  const [loading,setLoading]=useState(false);
  const [cred,setCred]=useState('');
  const [senha,setSenha]=useState('');
  const [form,setForm]=useState({nome:'',doc:'',telefone:'',email:'',setor:'',senha:'',confirmar_senha:''});
  const api=backendUrl || INITIAL_API;

  const doLogin=async()=>{
    if(!cred||!senha){setErr('Preencha todos os campos');return;}
    setLoading(true);setErr('');
    try{
      const r=await af(api+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credencial:cred,senha})});
      const d=await r.json();
      if(!r.ok){setErr(d.error||'Erro');setLoading(false);return;}
      onLogin(d.token,d.user);
    }catch(e){setErr('Falha ao conectar: '+e.message);}
    setLoading(false);
  };

  const doCadastro=async()=>{
    if(!form.nome||!form.doc||!form.email||!form.senha){setErr('Preencha todos os campos obrigatórios');return;}
    if(form.senha!==form.confirmar_senha){setErr('Senhas não conferem');return;}
    if(form.senha.length<6){setErr('Senha deve ter ao menos 6 caracteres');return;}
    setLoading(true);setErr('');
    try{
      const r=await af(api+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(form)});
      const d=await r.json();
      if(!r.ok){setErr(d.error||'Erro');setLoading(false);return;}
      setOk('Cadastro realizado! Faça login.');setTab('login');
    }catch(e){setErr('Erro de conexão: '+e.message);}
    setLoading(false);
  };

  const sf=(k,v)=>setForm(p=>({...p,[k]:v}));
  return(
    <div className="auth-wrap">
      <div className="auth-hero">
        <div className="auth-hero-marca">
          {LOGO_URL&&<img src={LOGO_URL} alt=""/>}
          <Brand size="xl" logo={false}/>
        </div>
        <p>Monitoramento inteligente do uso de EPIs com câmeras e visão computacional.</p>
      </div>
      <div className="auth-box">
        <div className="auth-tabs" role="tablist">
          <button type="button" role="tab" aria-selected={tab==='login'} className={"auth-tab"+(tab==='login'?' active':'')} onClick={()=>{setTab('login');setErr('');setOk('');}}>Login</button>
          <button type="button" role="tab" aria-selected={tab==='cadastro'} className={"auth-tab"+(tab==='cadastro'?' active':'')} onClick={()=>{setTab('cadastro');setErr('');setOk('');}}>Cadastrar</button>
        </div>
        {err&&<div className="err-msg" role="alert">{err}</div>}
        {ok&&<div className="ok-msg" role="status">{ok}</div>}
        {tab==='login'?(
          <div>
            <div className="field"><label>CPF, CNPJ ou E-mail</label><input value={cred} onChange={e=>setCred(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doLogin()} placeholder="000.000.000-00 ou email@..."/></div>
            <div className="field"><label>Senha</label><input type="password" value={senha} onChange={e=>setSenha(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doLogin()} placeholder="••••••••"/></div>
            <div className="auth-submit"><button className="btn btn-primary" onClick={doLogin} disabled={loading}>{loading?'Entrando...':'Entrar'}</button></div>
          </div>
        ):(
          <div>
            <div className="field"><label>Nome completo *</label><input value={form.nome} onChange={e=>sf('nome',e.target.value)} placeholder="João da Silva"/></div>
            <div className="field-row">
              <div className="field"><label>CPF ou CNPJ *</label><input value={form.doc} onChange={e=>sf('doc',e.target.value)} placeholder="000.000.000-00"/></div>
              <div className="field"><label>Telefone</label><input value={form.telefone} onChange={e=>sf('telefone',e.target.value)} placeholder="(11) 99999-9999"/></div>
            </div>
            <div className="field"><label>E-mail *</label><input type="email" value={form.email} onChange={e=>sf('email',e.target.value)} placeholder="email@empresa.com"/></div>
            <div className="field"><label>Setor</label><select value={form.setor} onChange={e=>sf('setor',e.target.value)}><option value="">Selecione...</option><option>Construção Civil</option><option>Mineração</option><option>Metalurgia</option><option>Química</option><option>Elétrica</option><option>Logística</option><option>Alimentício</option><option>Outro</option></select></div>
            <div className="field-row">
              <div className="field"><label>Senha *</label><input type="password" value={form.senha} onChange={e=>sf('senha',e.target.value)} placeholder="••••••••"/></div>
              <div className="field"><label>Confirmar *</label><input type="password" value={form.confirmar_senha} onChange={e=>sf('confirmar_senha',e.target.value)} placeholder="••••••••"/></div>
            </div>
            <div className="auth-submit"><button className="btn btn-primary" onClick={doCadastro} disabled={loading}>{loading?'Cadastrando...':'Cadastrar'}</button></div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ═══ STREAM CARD ═══════════════════════════════════════════ */
function formatListPreview(items,maxItems=6){
  const arr=(items||[]).filter(Boolean).map(x=>String(x));
  if(arr.length===0) return '—';
  if(arr.length<=maxItems) return arr.join(', ');
  return arr.slice(0,maxItems).join(', ')+` +${arr.length-maxItems}`;
}

function StreamCard({streamId,token,backendUrl,availableModels,defaultModel,device,index,onRemove,alarmeLigado,onToast,visual='medio'}){
  const [status,setStatus]=useState(null);
  const [info,setInfo]=useState(null);
  const [showZonas,setShowZonas]=useState(false);
  const [usingCam,setUsingCam]=useState(false);
  const inferredSource = /^remote_cam_|^cam_/.test(streamId) ? 'remote' : 'cam';
  const [sourceType,setSourceType]=useState(()=>inferredSource==='remote' ? 'remote' : (localStorage.getItem('epi_source_'+streamId)||inferredSource));
  const [showLongInfo,setShowLongInfo]=useState(false);
  // apelido da câmera ("Portaria", "Solda 2"): fica no navegador de quem configurou
  const [apelido,setApelido]=useState(()=>localStorage.getItem('epi_apelido_'+streamId)||'');
  useEffect(()=>{
    if(apelido) localStorage.setItem('epi_apelido_'+streamId,apelido);
    else localStorage.removeItem('epi_apelido_'+streamId);
  },[apelido,streamId]);
  const manualModelRef=useRef(Boolean(localStorage.getItem('epi_sm_'+streamId)));
  const [camUrl,setCamUrl]=useState(()=>localStorage.getItem('epi_camurl_'+streamId)||'');
  const [applying,setApplying]=useState(false);
  const [streamModel,setStreamModel]=useState(()=>localStorage.getItem('epi_sm_'+streamId)||defaultModel||'yolo26n.pt');
  // modo, fps e resolução ficam no servidor: valem para a câmera deste navegador, o celular e as câmeras IP
  const [config,setConfig]=useState({modo:'tempo_real',fps:60,resolucao:720});
  const [net,setNet]=useState(null);
  const [conn,setConn]=useState('');
  const [playStats,setPlayStats]=useState(null);
  const selectedModel=findModelByValue(availableModels,streamModel);
  const videoRef=useRef(null);
  const canvasRef=useRef(null);
  const playerRef=useRef(null);
  const senderRef=useRef(null);
  const streamRef=useRef(null);
  const kindRef=useRef('camera');
  const videoOuterRef=useRef(null);
  const removedRef=useRef(false);
  const lastStatusAt=useRef(0);

  useEffect(()=>{
    if(!localStorage.getItem('epi_sm_'+streamId) && defaultModel && streamModel!==defaultModel){
      setStreamModel(defaultModel);
    }
  },[defaultModel,streamId]);

  useEffect(()=>{
    if(!localStorage.getItem('epi_sm_'+streamId) && status && status.model && streamModel!==status.model){
      setStreamModel(status.model);
    }
  },[status ? status.model : '',streamId]);

  useEffect(()=>{
    localStorage.setItem('epi_source_'+streamId, sourceType);
  },[sourceType,streamId]);
  useEffect(()=>{
    if(camUrl) localStorage.setItem('epi_camurl_'+streamId, camUrl);
    else localStorage.removeItem('epi_camurl_'+streamId);
  },[camUrl,streamId]);

  useEffect(()=>{
    authFetch(backendUrl+'/streams/'+encodeURIComponent(streamId)+'/config',token)
      .then(r=>r.ok?r.json():null).then(d=>{if(d&&d.config) setConfig(d.config);}).catch(()=>{});
  },[streamId,backendUrl,token]);

  // o resultado chega a cada quadro (até 60 por segundo); o painel lateral atualiza 4 vezes por segundo
  const onResult=useCallback(d=>{
    const t=performance.now();
    if(t-lastStatusAt.current<250) return;
    lastStatusAt.current=t;
    setStatus(prev=>({...(prev||{}),...d}));
  },[]);
  const onInfo=useCallback(d=>{
    setInfo(d);
    if(d.config) setConfig(d.config);
    setStatus(prev=>({...(prev||{}),model:d.model,required_labels:d.required_labels,required_items:d.required_items,
      classes:d.classes,pose:d.pose,camera:d.camera}));
  },[]);

  useEffect(()=>{
    const player=new ArgosStream.LivePlayer({
      canvas:canvasRef.current,
      getFrame:seq=>senderRef.current?senderRef.current.frameBlob(seq):null,
      onStats:setPlayStats,
    });
    playerRef.current=player;
    return()=>{player.close();playerRef.current=null;};
  },[]);

  // Streams do servidor (dispositivo remoto, RTSP, HTTP, arquivo): vídeo + resultado pelo WebSocket.
  useEffect(()=>{
    if(usingCam||!playerRef.current) return;
    const viewer=new ArgosStream.LiveViewer({
      backendUrl,token,streamId,player:playerRef.current,onResult,onInfo,
      onStatus:st=>setConn(st),
    });
    viewer.start();
    return()=>{viewer.stop();if(playerRef.current) playerRef.current.clear();setConn('');};
  },[streamId,token,backendUrl,usingCam]);

  const enterFs=()=>{
    const el=videoOuterRef.current;
    if(!el) return;
    if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  };
  const exitFs=()=>{
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
  };

  const stopCam=useCallback(async()=>{
    const sender=senderRef.current;
    senderRef.current=null;
    if(sender){
      sender.stop();
      authFetch(backendUrl+'/streams/stop_external',token,{method:'POST',body:JSON.stringify({stream_id:streamId})}).catch(()=>{});
    }
    if(streamRef.current){streamRef.current.getTracks().forEach(t=>t.stop());streamRef.current=null;}
    if(videoRef.current) videoRef.current.srcObject=null;
    if(playerRef.current) playerRef.current.clear();
    setUsingCam(false);
    setNet(null);
  },[backendUrl,token,streamId]);
  const stopCamRef=useRef(stopCam);
  stopCamRef.current=stopCam;
  useEffect(()=>()=>{stopCamRef.current();},[]);

  const openLocal=async(cfg,kind)=>{
    const stream=await ArgosStream.openCamera({fps:cfg.fps,height:cfg.resolucao,screen:kind==='screen'});
    const v=videoRef.current;
    if(!v){stream.getTracks().forEach(t=>t.stop());return false;}
    const old=streamRef.current;
    streamRef.current=stream;
    v.srcObject=stream;
    v.play().catch(()=>{});
    await new Promise(res=>{
      if(v.readyState>=2) return res();
      v.onloadeddata=res;
      setTimeout(res,2500);
    });
    if(old) old.getTracks().forEach(t=>t.stop());
    return true;
  };

  const startCam=async(kind)=>{
    kindRef.current=kind;
    if(!await openLocal(config,kind)) return;
    const r=await authFetch(backendUrl+'/update',token,{method:'POST',body:JSON.stringify({model:streamModel,device,camera:'webcam',stream_id:streamId,required_items:getModelRequiredItems(selectedModel)})});
    if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'Falha ao iniciar a IA');}
    setUsingCam(true);
    const sender=new ArgosStream.LiveSender({
      video:videoRef.current,backendUrl,token,streamId,
      onResult:d=>{if(playerRef.current) playerRef.current.pushResult(d);onResult(d);},
      onInfo,
      onStats:s=>setNet(s),
      onConfig:(c,old)=>{
        setConfig(c);
        // tela compartilhada não reabre sozinha (o navegador pediria permissão de novo)
        if(kindRef.current!=='screen'&&old&&(old.fps!==c.fps||old.resolucao!==c.resolucao)){
          openLocal(c,kindRef.current).catch(()=>{});
        }
      },
      onStatus:st=>{
        if(st==='removido') stopCamRef.current();
        if(playerRef.current) playerRef.current.setMessage(st==='reconectando'?'Sem conexão · guardando quadros e tentando de novo...':'');
        setConn(st);
      },
    });
    senderRef.current=sender;
    sender.start();
  };

  const apply=async()=>{
    setApplying(true);
    try{
      if(usingCam) await stopCam();
      if(sourceType==='cam'||sourceType==='screen') await startCam(sourceType==='screen'?'screen':'camera');
      else{
        const remoteCamera = sourceType==='remote' ? 'webcam' : camUrl;
        const r=await authFetch(backendUrl+'/update',token,{method:'POST',body:JSON.stringify({model:streamModel,device,camera:remoteCamera,stream_id:streamId,required_items:getModelRequiredItems(selectedModel)})});
        if(!r.ok){const d=await r.json();alert(d.error||'Erro');}
      }
    }catch(e){
      await stopCam();
      alert('Erro ao iniciar: '+e.message);
    }
    setApplying(false);
  };

  const changeConfig=async(patch)=>{
    const next={...config,...patch};
    setConfig(next);
    try{
      const r=await authFetch(backendUrl+'/streams/'+encodeURIComponent(streamId)+'/config',token,{method:'POST',body:JSON.stringify(next)});
      if(r.ok){const d=await r.json();if(d.config) setConfig(d.config);}
    }catch{}
  };

  const changeModel=async(newModel)=>{
    manualModelRef.current=true;
    setStreamModel(newModel);
    localStorage.setItem('epi_sm_'+streamId, newModel);
    const modelCfg=getModelRequiredItems(findModelByValue(availableModels,newModel));
    if(usingCam || sourceType==='remote'){
      try{
        await authFetch(backendUrl+'/update',token,{method:'POST',body:JSON.stringify({model:newModel,device,camera:'webcam',stream_id:streamId,required_items:modelCfg})});
      }catch{}
    }
  };

  const handleRemove=()=>{
    removedRef.current=true;
    stopCam();
    onRemove();
  };

  const st=status&&status.status;
  const isPerigo=st==='perigo';
  const isOk=st==='seguro';
  const cardCls=isPerigo?'danger':isOk?'safe':'unknown';
  const fallOnly=isPerigo&&!(status.missing||[]).length&&(status.alerts||[]).some(a=>a.includes('queda'));
  // alarme: toca enquanto houver EPI faltando ou queda nesta câmera
  useAlarme(isPerigo,alarmeLigado);
  const pillIcon=isPerigo?'🚨':isOk?'✅':st==='verificando'?'🔎':st==='sem_pessoa'?'👤':'⏳';
  const pillText=isPerigo?(fallOnly?'POSSÍVEL QUEDA':'FALTA EPI'):isOk?'SEGURO':st==='verificando'?'Verificando':st==='sem_pessoa'?'Sem pessoas':'Aguardando';
  const persons=(status&&status.persons)||[];
  const requiredLabels=(status&&(status.required_labels||status.required_items))||[];
  const pipe=(info&&info.pipeline)||{};
  const modeInfo=ArgosStream.MODES[config.modo]||ArgosStream.MODES.tempo_real;
  const connLabel={ws:'WebSocket',http:'HTTP (reserva)',reconectando:'reconectando...',aguardando:'aguardando a câmera',erro:'erro'}[conn]||conn||'—';
  const hasImage=Boolean(playStats&&playStats.fps>0)||Boolean(status&&status.frame_w);
  const cameraDisplay=sourceType==='remote'
    ? 'Dispositivo remoto'
    : (usingCam?(sourceType==='screen'?'Tela deste navegador':'Câmera deste navegador'):maskCameraUrl((status&&status.camera)||camUrl)||'—');

  // Apelido: "Portaria", "Solda 2"... fica no navegador de quem configurou.
  const nome=apelido||('Câmera '+(index+1));
  const fps=Math.round((playStats&&playStats.fps)||0);
  const modeloNome=(status&&status.model)||selectedModel?.display_name||streamModel||'—';

  const ajudaCard=(
    <Ajuda titulo={'Câmera · '+nome}
      resumo="O que esta câmera está vendo e como ela decide se está tudo certo.">
      <p>O quadrado colorido é o <strong>resultado agora</strong>: verde quando todo mundo
      está com o EPI exigido, vermelho quando falta alguma coisa e cinza quando ainda não
      chegou imagem.</p>
      <p>Quando fica vermelho, o sistema também guarda o episódio no histórico e tira
      até 3 fotos, que aparecem na ficha do funcionário em <strong>Funcionários → Desempenho</strong>.</p>
      <ul>
        <li><strong>fps</strong> — quantas imagens por segundo estão chegando. Número baixo
        costuma ser internet fraca, não defeito do sistema.</li>
        <li><strong>Modelo</strong> — qual IA está olhando esta câmera. Dá para trocar em
        "Ajustes desta câmera".</li>
        <li><strong>Áreas</strong> — se você desenhou áreas sobre a imagem, cada pedaço da
        cena cobra a sua própria lista de EPIs.</li>
      </ul>
      <p>Em "Ajustes desta câmera" ficam a fonte do vídeo, o modelo, a qualidade e o
      mapa de áreas. Quem só acompanha não precisa abrir isso.</p>
    </Ajuda>
  );

  // modo lista: uma linha por câmera, sem vídeo
  if(visual==='lista'){
    const classe=isPerigo?'perigo':(hasImage||usingCam?'ok':'espera');
    return(
      <div className={"stream-linha "+classe}>
        <span className="stream-linha-ico" aria-hidden="true">{pillIcon}</span>
        <span className="stream-linha-nome" title={streamId}>{nome}</span>
        <div className="stream-linha-tags">
          {isPerigo&&(status.missing||[]).length>0
            && <span className="tagzinha alerta">Sem {status.missing.join(', ').toLowerCase()}</span>}
          <span className="tagzinha">{fps} fps</span>
          <span className="tagzinha">{modeloNome}</span>
          <span className="tagzinha">{persons.length} pessoa(s)</span>
          {ajudaCard}
          <button className="btn btn-danger btn-xs" onClick={handleRemove} aria-label={'Remover '+nome}>✕</button>
        </div>
      </div>
    );
  }

  return(
    <div className={"stream-card v-"+visual}>
      <div className="stream-header">
        <span className="stream-title" style={{flex:1,display:'flex',alignItems:'center',gap:8}}>
          <input className="apelido-input" value={nome} aria-label="Apelido da câmera"
            onChange={e=>setApelido(e.target.value)}
            onFocus={e=>e.target.select()}/>
        </span>
        {ajudaCard}
        <button className="btn btn-danger btn-sm" onClick={handleRemove}>✕<span className="hide-sm"> Remover</span></button>
      </div>
      <div className="stream-body">
        <div className="video-outer" ref={videoOuterRef}>
          <video ref={videoRef} className="video-live" autoPlay playsInline muted style={{display:usingCam?'block':'none'}}/>
          <canvas ref={canvasRef} className="video-overlay"/>
          {!hasImage&&!usingCam&&<div className="no-sig"><span style={{fontSize:'2rem',opacity:.5}}>📷</span><span>{conn==='aguardando'?'Aguardando a câmera...':'Aguardando...'}</span></div>}
          {(hasImage||usingCam)&&<span className="fps-b">{modeInfo.icone} {Math.round((playStats&&playStats.fps)||0)} fps{pipe.atraso_ms!=null?` · ${(pipe.atraso_ms/1000).toFixed(1)} s`:''}</span>}
          <button className="btn-fs" onClick={enterFs} title="Tela cheia">⛶</button>
          <button className="btn-exit-fs" onClick={exitFs}>✕ Sair da tela cheia</button>
        </div>
        <div className="stream-side">
          <div className={"status-pill "+cardCls} role="status">
            <div className="s-icon">{pillIcon}</div>
            <div className="s-lbl">{pillText}</div>
            {isPerigo&&(status.missing||[]).length>0&&<div className="missing">{status.missing.join(', ')}</div>}
          </div>
          {visual!=='pequeno'&&(
            <div className="stream-info">
              <div>Pessoas: <span style={{color:'var(--tx)'}}>{persons.length}</span></div>
              {persons.slice(0,showLongInfo?persons.length:3).map((p,i)=>(
                <div key={p.track_id!=null?p.track_id:'p'+i} className="person-line">
                  <strong>{p.nome||(p.track_id!=null?`Pessoa ${p.track_id}`:'Pessoa')}</strong>
                  {(p.faltando||[]).length>0
                    ?<span className="person-missing"> · sem {p.faltando.map(ArgosStream.itemLabel).join(', ').toLowerCase()}</span>
                    :<span> · com o EPI</span>}
                </div>
              ))}
              {persons.length>3&&<button className="btn btn-dark btn-xs" style={{marginTop:6}}
                onClick={()=>setShowLongInfo(v=>!v)}>{showLongInfo?'Menos':'Ver as '+persons.length}</button>}
            </div>
          )}
          {usingCam&&<button className="btn btn-warn btn-sm" style={{fontSize:'.75rem',padding:'5px 10px'}} onClick={stopCam}>⏹ Parar cam</button>}
        </div>
      </div>
      <div className="fita">
        <span className="tagzinha">{fps} fps</span>
        <span className="tagzinha">{modeInfo.icone} {modeInfo.nome}</span>
        <span className="tagzinha" title={modeloNome}>{modeloNome}</span>
        {conn==='reconectando'&&<span className="tagzinha alerta">Reconectando</span>}
        {(status&&(status.zonas||[]).length>0)&&<span className="tagzinha">{status.zonas.length} área(s)</span>}
        <Ajuda titulo="Os números desta faixa"
          resumo="fps, modo de análise e qual IA está olhando esta câmera.">
          <ul>
            <li><strong>fps</strong> — imagens por segundo chegando do aparelho. Abaixo de
            uns 5 fps a cena fica "aos saltos"; quase sempre é a rede, não o servidor.</li>
            <li><strong>Modo de análise</strong> — quanto mais detalhado, melhor a IA
            enxerga, e mais pesado fica. "Tempo real" responde na hora; "Super detalhado"
            demora alguns segundos mas erra menos.</li>
            <li><strong>Modelo</strong> — o arquivo de IA usado. Cada câmera pode usar um
            diferente, e a troca vale na hora.</li>
            <li><strong>Áreas</strong> — quantos pedaços da cena têm lista própria de EPIs.</li>
          </ul>
          <p>Detalhes finos (atraso, buffer, quadros que o servidor analisa por segundo)
          ficam em "Ajustes desta câmera".</p>
        </Ajuda>
      </div>

      <details className="card-ajustes">
        <summary>⚙ Ajustes desta câmera</summary>
      <div className="stream-model-bar">
        <span className="bar-label">🧠 Modelo:</span>
        <select value={streamModel} onChange={e=>changeModel(e.target.value)} style={{maxWidth:220}}>
          {availableModels.length>0
            ? availableModels.map(m=>{
                const label=m.display_name||(m.tipo==='customizado'?'★ '+m.name:m.name);
                return <option key={m.name} value={m.name}>{label} ({m.size_mb}MB)</option>;
              })
            : <>
                <option value="yolo26n.pt">YOLO26 Nano</option>
                <option value="yolo26s.pt">YOLO26 Small</option>
              </>
          }
        </select>
        <span style={{fontSize:'.7rem',color:'var(--mt)',marginLeft:4}}>{status&&status.pose===false?'só detector':'pose + EPI por pessoa'}</span>
      </div>
      <div className="stream-ctrl">
        <select value={sourceType} onChange={e=>setSourceType(e.target.value)} disabled={usingCam} aria-label="Fonte do vídeo">
          <option value="cam">📱 Câmera do navegador</option>
          <option value="remote">🔗 Dispositivo remoto</option>
          <option value="screen">🖥 Tela</option>
          <option value="rtsp">📡 RTSP</option>
          <option value="http">🌐 HTTP Stream</option>
          <option value="file_url">📁 URL de arquivo</option>
        </select>
        {(sourceType==='rtsp'||sourceType==='http'||sourceType==='file_url')&&
          <input className="inline-input" value={camUrl} onChange={e=>setCamUrl(e.target.value)} placeholder={sourceType==='rtsp'?'rtsp://...':'http://...'} aria-label="Endereço da câmera"/>
        }
        <button className="btn btn-primary btn-sm" onClick={apply} disabled={applying}>{applying?'...':usingCam?'Reiniciar':'Aplicar'}</button>
      </div>
      <div className="stream-ctrl">
        <select value={config.modo} onChange={e=>changeConfig({modo:e.target.value})} aria-label="Modo de análise">
          {Object.entries(ArgosStream.MODES).map(([k,m])=><option key={k} value={k}>{m.icone} {m.nome}</option>)}
        </select>
        <select value={config.fps} onChange={e=>changeConfig({fps:Number(e.target.value)})} aria-label="Quadros por segundo">
          {ArgosStream.FPS_OPTIONS.map(f=><option key={f} value={f}>{f} fps</option>)}
        </select>
        <select value={config.resolucao} onChange={e=>changeConfig({resolucao:Number(e.target.value)})} aria-label="Resolução">
          {ArgosStream.RES_OPTIONS.map(r=><option key={r} value={r}>{r}p</option>)}
        </select>
      </div>
      <div className="stream-ctrl">
        <button className="btn btn-secondary btn-sm" onClick={()=>setShowZonas(true)}>🗺️ Mapear áreas</button>
        {(status&&(status.zonas||[]).length>0)&&(
          <span className="bar-label">{status.zonas.length} área(s) nesta câmera</span>
        )}
      </div>
      <div className="stream-ctrl" style={{fontSize:'.76rem',color:'var(--mt)',display:'block',lineHeight:1.6}}>
        <div>Fonte: {cameraDisplay}</div>
        <div>Conexão: {connLabel}{pipe.atraso_ms!=null?` · atraso ${pipe.atraso_ms} ms`:''}</div>
        <div>Servidor: {pipe.fps_analise!=null?`IA ${pipe.fps_analise} q/s · recebe ${pipe.fps_entrada} q/s`:'—'}{pipe.sem_sinal?' · sem sinal':''}</div>
        {usingCam&&net&&<div>Envio: {net.sentFps.toFixed(0)} q/s · {(net.kbps/1000).toFixed(1)} Mb/s · qualidade {Math.round(net.quality*100)}%</div>}
        <div>EPIs exigidos: {requiredLabels.join(', ')||'—'}</div>
        {status&&status.classes&&status.classes.length>0&&<div>Classes do modelo ({status.classes.length}): {formatListPreview(status.classes)}</div>}
      </div>
      </details>
      {showZonas&&<ZonaEditor streamId={streamId} token={token} backendUrl={backendUrl}
        onClose={()=>setShowZonas(false)} onToast={onToast}/>}
    </div>
  );
}

/* ═══ EPI CARD ═══════════════════════════════════════════════ */
function EpiCard({epi,token,backendUrl,onUpdate,onDelete}){
  const [uploading,setUploading]=useState(false);
  const [treinando,setTreinando]=useState(false);
  const [importando,setImportando]=useState(false);
  const fileRef=useRef();
  const roboRef=useRef();

  const uploadFoto=async(e)=>{
    const files=[...e.target.files];
    if(!files.length) return;
    setUploading(true);
    for(const file of files){
      const fd=new FormData();
      fd.append('foto',file);
      await authFetchForm(backendUrl+'/epis/'+epi.id+'/fotos',token,fd).catch(()=>{});
    }
    setUploading(false);
    e.target.value='';
    onUpdate();
  };

  const deleteFoto=async(fid)=>{
    await authFetch(backendUrl+'/epis/'+epi.id+'/fotos/'+fid,token,{method:'DELETE'}).catch(()=>{});
    onUpdate();
  };

  const importarDataset=async(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    if(!file.name.endsWith('.zip')){alert('Envie um arquivo .zip do Roboflow');return;}
    setImportando(true);
    const fd=new FormData();
    fd.append('dataset',file);
    try{
      const r=await authFetchForm(backendUrl+'/epis/'+epi.id+'/importar_dataset',token,fd);
      const d=await r.json();
      if(r.ok){
        alert(`Dataset importado!\n${d.total} imagens, ${d.anotadas} com anotacao real.\n${d.sem_label} sem label (usara bbox de tela cheia).`);
        onUpdate();
      }else{alert(d.error||'Erro ao importar');}
    }catch(e){alert('Erro: '+e.message);}
    setImportando(false);
    e.target.value='';
  };

  const treinar=async()=>{
    if(!confirm(`Treinar modelo para "${epi.nome}"?\nIsso pode levar vários minutos.`)) return;
    setTreinando(true);
    const r=await authFetch(backendUrl+'/epis/'+epi.id+'/treinar',token,{method:'POST'}).catch(()=>null);
    if(r&&r.status===202) alert('Treinamento iniciado! Aguarde — isso leva alguns minutos.\nVerifique novamente depois.');
    else alert('Erro ao iniciar treinamento.');
    setTreinando(false);
    onUpdate();
  };

  const deleteEpi=async()=>{
    if(!confirm(`Remover EPI "${epi.nome}"? Isso apaga todas as fotos e o modelo.`)) return;
    await authFetch(backendUrl+'/epis/'+epi.id,token,{method:'DELETE'}).catch(()=>{});
    onUpdate();
  };

  const fotos=epi.fotos||[];
  return(
    <div className="epi-card">
      <div className="epi-card-header">
        <div className="epi-dot" style={{background:epi.cor||'var(--ac)'}}/>
        <div className="epi-nome">{epi.nome}</div>
        {epi.modelo_treinado
          ? <span className="badge-treinado">✓ Treinado</span>
          : <span className="badge-pendente">⏳ Pendente</span>
        }
      </div>
      {epi.descricao&&<div className="epi-desc">{epi.descricao}</div>}
      <div>
        <div style={{fontSize:'.74rem',color:'var(--mt)',marginBottom:6}}>{fotos.length} foto{fotos.length!==1?'s':''} cadastrada{fotos.length!==1?'s':''}</div>
        <div className="foto-grid">
          {fotos.map(f=>(
            <div key={f.id} className="foto-thumb">
              <img src={backendUrl+'/epis/foto/'+f.id+'?token='+token} alt=""
                onError={e=>{e.target.style.background='var(--sf3)';e.target.style.display='block';}}
                style={{objectFit:'cover'}}/>
              <button className="foto-del" onClick={()=>deleteFoto(f.id)} title="Remover foto">✕</button>
            </div>
          ))}
          <div className="upload-area" style={{width:60,height:60,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}
            onClick={()=>fileRef.current.click()}>
            {uploading?'..':'+ foto'}
          </div>
        </div>
        <input ref={fileRef} type="file" accept="image/*" multiple style={{display:'none'}} onChange={uploadFoto}/>
      </div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        <button className="btn btn-ok btn-xs" onClick={treinar} disabled={treinando||fotos.length<5}
          title={fotos.length<5?`Envie pelo menos 5 fotos (tem ${fotos.length})`:'Treinar modelo YOLO'}>
          {treinando?'Treinando...':'🧠 Treinar modelo'}
        </button>
        <button className="btn btn-secondary btn-xs" onClick={()=>roboRef.current.click()}
          title="Importe um .zip do Roboflow com images/ e labels/ para treino preciso">
          📦 Importar dataset anotado
        </button>
        <button className="btn btn-danger btn-xs" onClick={deleteEpi}>✕ Remover</button>
      </div>
      <input ref={roboRef} type="file" accept=".zip" style={{display:'none'}} onChange={importarDataset}/>
      {fotos.length<5&&<p className="hint yellow" style={{marginTop:0}}>Envie pelo menos 5 fotos para treinar o modelo. Quanto mais fotos, melhor a detecção.</p>}
      <p className="hint" style={{marginTop:0,fontSize:'.72rem'}}>
        💡 Para melhor precisão: anote as fotos no <a href="https://roboflow.com" target="_blank" style={{color:'var(--ac2)'}}>Roboflow</a> (gratuito) e importe o dataset .zip aqui.
      </p>
    </div>
  );
}

/* ═══ FUNCIONARIO CARD ═══════════════════════════════════════ */
function FuncCard({func,token,backendUrl,onUpdate,onDelete,onToast}){
  const [uploading,setUploading]=useState(false);
  const [verDesempenho,setVerDesempenho]=useState(false);
  const fileRef=useRef();

  const uploadFoto=async(e)=>{
    const files=[...e.target.files];
    if(!files.length) return;
    setUploading(true);
    let enviadas=0;
    for(const file of files){
      const fd=new FormData();
      fd.append('foto',file);
      try{
        const r=await authFetchForm(backendUrl+'/funcionarios/'+func.id+'/fotos',token,fd);
        const d=await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(d.error||('Erro '+r.status));
        enviadas++;
      }catch(err){
        onToast&&onToast('Falha ao enviar "'+file.name+'": '+err.message,'err');
      }
    }
    setUploading(false);
    e.target.value='';
    if(enviadas) onToast&&onToast(enviadas+' foto'+(enviadas>1?'s':'')+' salva'+(enviadas>1?'s':'')+'!');
    onUpdate();
  };

  const deleteFoto=async(fid)=>{
    await authFetch(backendUrl+'/funcionarios/'+func.id+'/fotos/'+fid,token,{method:'DELETE'}).catch(()=>{});
    onUpdate();
  };

  const deleteFunc=async()=>{
    if(!confirm(`Remover funcionário "${func.nome}"?`)) return;
    await authFetch(backendUrl+'/funcionarios/'+func.id,token,{method:'DELETE'}).catch(()=>{});
    onUpdate();
  };

  const fotos=func.fotos_rosto||[];
  return(
    <div className="func-card">
      <div className="func-card-header">
        <div className="func-avatar"><Icon name="person"/></div>
        <div style={{flex:1,minWidth:0}}>
          <div className="func-nome">{func.nome}</div>
          <div className="func-info">{func.cargo||'Sem cargo'}{func.matricula?' · '+func.matricula:''}</div>
        </div>
      </div>
      <div>
        <div className="func-info" style={{marginBottom:6}}>{fotos.length} foto{fotos.length!==1?'s':''} de rosto</div>
        <div className="foto-grid">
          {fotos.map(f=>(
            <div key={f.id} className="foto-thumb">
              <img src={backendUrl+'/funcionarios/foto/'+f.id+'?token='+token} alt=""
                onError={e=>{e.target.style.background='var(--sf3)';e.target.style.display='block';}}
                style={{objectFit:'cover'}}/>
              <button className="foto-del" onClick={()=>deleteFoto(f.id)} title="Remover">✕</button>
            </div>
          ))}
          <div className="upload-area" style={{width:60,height:60,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}
            onClick={()=>fileRef.current.click()}>
            {uploading?'..':'+ foto'}
          </div>
        </div>
        <input ref={fileRef} type="file" accept="image/*" multiple style={{display:'none'}} onChange={uploadFoto}/>
      </div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        <button className="btn btn-secondary btn-xs" onClick={()=>setVerDesempenho(true)}>📊 Desempenho</button>
        <button className="btn btn-danger btn-xs" onClick={deleteFunc}>✕ Remover</button>
      </div>
      {fotos.length<3&&<p className="hint yellow" style={{marginTop:0}}>Envie pelo menos 3 fotos do rosto para o reconhecimento funcionar bem.</p>}
      {verDesempenho&&<FuncDesempenho func={func} token={token} backendUrl={backendUrl} onClose={()=>setVerDesempenho(false)}/>}
    </div>
  );
}

function ModelCard({model,token,backendUrl,onRefresh,onToast,onSetDefault,defaultModel}){
  const [saving,setSaving]=useState(false);
  const [converting,setConverting]=useState(false);
  const [requiredText,setRequiredText]=useState((model.required_items||[]).join(', '));
  const classes=(model.classes||[]);
  const canConfig=model.configurable!==false;
  const isDefault=defaultModel===model.name;
  const trt=model.tensorrt||{};
  const trtJob=trt.job||{};
  const trtRunning=trtJob.status==='running';
  const trtError=trt.dependency_error||trtJob.error||'';
  const trtStatusText=trt.engine_exists?'engine pronto':(trtRunning?'convertendo...':(trtError?(trt.dependency_error?'dependencia faltando':'erro'):(trt.available?'disponivel':'indisponivel')));
  const trtStatusColor=trt.engine_exists?'var(--ok)':(trtRunning?'var(--wn)':(trtError?'var(--dn)':(trt.available?'var(--wn)':'var(--dn)')));
  const canConvertTensorRT=trt.available&&!converting&&!trtRunning&&!trt.dependency_error;
  const trtButtonText=trt.engine_exists?'Reconverter TensorRT':(converting||trtRunning?'Convertendo...':(trtError&&!trt.dependency_error?'Tentar novamente':(trt.dependency_error?'Dependencia faltando':'Converter TensorRT')));
  useEffect(()=>{
    if(!trtRunning) return;
    const id=setInterval(()=>onRefresh&&onRefresh(),5000);
    return()=>clearInterval(id);
  },[trtRunning,model.name]);
  const saveConfig=async()=>{
    if(!canConfig){onToast&&onToast('Faça login para configurar modelos','err');return;}
    setSaving(true);
    try{
      const required_items=requiredText.split(',').map(x=>x.trim()).filter(Boolean);
      const r=await authFetch(backendUrl+'/models/'+encodeURIComponent(model.name)+'/config',token,{method:'PUT',body:JSON.stringify({required_items,classes:model.classes||[]})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Erro ao salvar');
      onToast&&onToast(model.tipo==='base'?'Cópia da regra salva no seu usuário!':'Configuração salva!');
      onRefresh&&onRefresh();
    }catch(e){onToast&&onToast(e.message||'Erro ao salvar','err');}
    setSaving(false);
  };
  const removeModel=async()=>{
    if(!model.editable) return;
    if(!confirm('Remover este modelo do usuário atual?')) return;
    try{
      const r=await authFetch(backendUrl+'/models/'+encodeURIComponent(model.name),token,{method:'DELETE'});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Erro ao remover');
      onToast&&onToast('Modelo removido!');
      onRefresh&&onRefresh();
    }catch(e){onToast&&onToast(e.message||'Erro ao remover','err');}
  };
  const convertTensorRT=async()=>{
    setConverting(true);
    try{
      const r=await authFetch(backendUrl+'/models/'+encodeURIComponent(model.name)+'/tensorrt',token,{method:'POST'});
      const d=await r.json();
      if(!r.ok) throw new Error(d.tensorrt?.error||d.error||'Erro ao converter');
      onToast&&onToast('Conversao TensorRT iniciada');
      onRefresh&&onRefresh();
    }catch(e){onToast&&onToast(e.message||'Erro ao converter','err');}
    setConverting(false);
  };
  return(
    <div className="epi-card">
      <div className="epi-card-header">
        <div className="epi-nome">{model.tipo==='customizado'?'★ ':'🧠 '}{model.display_name||model.name}</div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {isDefault&&<span className="badge-treinado">padrão</span>}
          {model.user_override&&<span className="badge-treinado">minha regra</span>}
          {model.editable?<span className="badge-treinado">meu</span>:<span className="badge-pendente">base</span>}
        </div>
      </div>
      <div className="epi-desc">
        Arquivo: <strong>{model.name}</strong><br/>
        Tamanho: <strong>{model.size_mb} MB</strong><br/>
        Classes detectadas: <strong style={{color:classes.length?'var(--ok)':'var(--dn)'}}>{classes.length?classes.join(', '):'não lidas'}</strong><br/>
        TensorRT: <strong style={{color:trtStatusColor}}>{trtStatusText}</strong>
        {trtError&&!trtRunning&&<><br/><span style={{color:'var(--dn)'}}>Erro: {trtError}</span></>}
      </div>
      <div className="field">
        <label>{model.tipo==='base'?'Sua cópia da regra para este modelo base':'EPIs obrigatórios desse modelo'}</label>
        <input value={requiredText} onChange={e=>setRequiredText(e.target.value)} disabled={!canConfig} placeholder="helmet, vest"/>
      </div>
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
        <button className="btn btn-primary btn-sm" onClick={saveConfig} disabled={!canConfig||saving}>{saving?'Salvando...':(model.tipo==='base'?'Salvar minha cópia':'Salvar regra')}</button>
        <button className="btn btn-secondary btn-sm" onClick={()=>onSetDefault&&onSetDefault(model.name)}>{isDefault?'✓ Modelo padrão':'Usar como padrão'}</button>
        <button className="btn btn-secondary btn-sm" onClick={convertTensorRT} disabled={!canConvertTensorRT}>{trtButtonText}</button>
        {model.editable&&<button className="btn btn-danger btn-sm" onClick={removeModel}>Remover</button>}
      </div>
    </div>
  );
}

function NetworkCameraModal({open,onClose,backendUrl,token,onUseStream,onToast}){
  const [username,setUsername]=useState(()=>localStorage.getItem('epi_scan_user')||'');
  const [password,setPassword]=useState('');
  const [subnet,setSubnet]=useState('');
  const [jobId,setJobId]=useState('');
  const [job,setJob]=useState(null);
  const [result,setResult]=useState(null);
  const [choices,setChoices]=useState({});
  const [credDevice,setCredDevice]=useState(null);
  const [addedUris,setAddedUris]=useState({});
  const devices=result?.devices||[];
  const streamTotal=devices.reduce((acc,d)=>acc+(d.streams?.length||0),0);
  const loading=job&&job.status==='running';

  const runScan=async(extra={})=>{
    try{
      localStorage.setItem('epi_scan_user',username||'');
      setResult(null);
      setChoices({});
      setJob({status:'running',message:'Iniciando analise em segundo plano'});
      const r=await authFetch(backendUrl+'/cameras/scan/start',token,{method:'POST',body:JSON.stringify({
        username:(extra.username ?? username).trim(),
        password:extra.password ?? password,
        subnet:(extra.subnet ?? subnet).trim(),
        timeout:0.35,
        include_onvif:true
      })});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||'Erro ao iniciar analise');
      setJobId(d.job_id);
      setJob(d.job);
    }catch(e){
      onToast&&onToast(e.message||'Erro ao analisar a rede','err');
      setJob(null);
    }
  };

  useEffect(()=>{
    if(!open) return;
    if(!jobId) return;
    let alive=true;
    const poll=async()=>{
      try{
        const r=await authFetch(backendUrl+'/cameras/scan/jobs/'+jobId,token,{method:'GET'});
        const d=await r.json().catch(()=>({}));
        if(!alive) return;
        if(!r.ok) throw new Error(d.error||'Erro ao acompanhar analise');
        setJob(d.job);
        if(d.job.status==='done'){
          setResult(d.job.result||{devices:[]});
          setJobId('');
          onToast&&onToast(`${d.job.result?.count||0} camera(s) encontradas`);
        }else if(d.job.status==='error'){
          setJobId('');
          onToast&&onToast(d.job.error||'Erro ao analisar a rede','err');
        }
      }catch(e){
        if(alive){
          setJobId('');
          setJob(null);
          onToast&&onToast(e.message||'Erro ao acompanhar analise','err');
        }
      }
    };
    poll();
    const iv=setInterval(poll,900);
    return()=>{alive=false;clearInterval(iv);};
  },[open,jobId,backendUrl,token]);

  const streamLabel=(st,i)=>{
    const bits=[st.label||('Stream '+(i+1))];
    if(st.resolution) bits.push(st.resolution);
    bits.push(st.source==='onvif'?'ONVIF':'RTSP sugerido');
    return bits.join(' | ');
  };
  const selectedStreamFor=(dev)=>{
    const streams=dev.streams||[];
    if(!streams.length) return null;
    const idx=Number(choices[dev.ip]||0);
    return streams[Math.max(0,Math.min(idx,streams.length-1))]||streams[0];
  };
  const addDevice=(dev,force=false)=>{
    const st=selectedStreamFor(dev);
    if(!st){
      setCredDevice(dev);
      return;
    }
    if(!force && st.source!=='onvif' && !username.trim() && !String(st.uri||'').includes('@')){
      setCredDevice(dev);
      return;
    }
    onUseStream&&onUseStream({...st,device:dev});
    setAddedUris(p=>({...p,[st.uri]:true}));
  };
  const retryWithCredentials=()=>{
    if(!credDevice) return;
    setCredDevice(null);
    runScan({subnet:credDevice.ip,username,password});
  };

  if(!open) return null;

  return(
    <div className="modal-bg">
      <div className="modal net-modal">
        <div className="net-modal-head">
          <div>
            <div className="net-modal-title">Adicionar camera de rede</div>
            <div className="net-modal-sub">Busca ONVIF/RTSP em paralelo, sem parar os streams ativos.</div>
          </div>
          <button className="btn btn-secondary btn-sm" onClick={onClose}>Fechar</button>
        </div>
        <div className="net-modal-body">
          <div className="scan-form">
            <div className="field"><label>Usuario</label><input value={username} onChange={e=>setUsername(e.target.value)} placeholder="admin"/></div>
            <div className="field"><label>Senha</label><input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="opcional"/></div>
            <div className="field"><label>Faixa / IP</label><input value={subnet} onChange={e=>setSubnet(e.target.value)} placeholder="auto ou 192.168.1.0/24"/></div>
            <button className="btn btn-primary" onClick={()=>runScan()} disabled={loading}>{loading?'Analisando...':'Analisar rede'}</button>
          </div>
          <div className="scan-status">
            <div>
              <strong>{loading?'Analisando em segundo plano':result?'Resultado da ultima analise':'Pronto para analisar'}</strong>
              <div className="scan-meta">{result?`${devices.length} dispositivo(s), ${streamTotal} stream(s), redes: ${(result.networks||[]).join(', ')||'auto'}`:'Informe credenciais se a camera exigir autenticacao.'}</div>
            </div>
            {loading&&<div className="scan-bar"><span/></div>}
          </div>
          <div className="scan-results">
            {!result&&!loading&&<div className="scan-empty">Clique em "Analisar rede" para localizar cameras disponiveis.</div>}
            {result&&devices.length===0&&<div className="scan-empty">Nenhuma camera encontrada nesta faixa.</div>}
            {devices.map(dev=>{
              const streams=dev.streams||[];
              const selected=selectedStreamFor(dev);
              const selectedUri=selected?.uri||'';
              const alreadyAdded=Boolean(selectedUri&&addedUris[selectedUri]);
              const showCred=credDevice&&credDevice.ip===dev.ip;
              return(
                <div className={"scan-device"+(showCred?' credential-open':'')} key={dev.ip}>
                  <div className="scan-device-top">
                    <div className="scan-device-main">
                      <div className="scan-title" title={dev.display_name||('Camera '+dev.ip)}>{dev.display_name||('Camera '+dev.ip)}</div>
                      <div className="scan-meta">IP {dev.ip} | portas {(dev.open_ports||[]).join(', ')||'--'} | {(dev.discovery||[]).join(', ')||'scan'}</div>
                      <div className="scan-badges">
                        {streams.length>1&&<span className="scan-badge">{streams.length} faixas</span>}
                        {(dev.discovery||[]).includes('onvif')&&<span className="scan-badge">ONVIF</span>}
                        {(dev.open_ports||[]).includes(554)&&<span className="scan-badge">RTSP</span>}
                        {alreadyAdded&&<span className="scan-badge" style={{color:'var(--ok)',borderColor:'var(--ok)'}}>adicionada</span>}
                      </div>
                    </div>
                  </div>
                  <div className="scan-device-controls">
                    <div style={{minWidth:0}}>
                      {streams.length>0?(
                        <>
                          <select className="scan-select" value={choices[dev.ip]||0} onChange={e=>setChoices(p=>({...p,[dev.ip]:e.target.value}))}>
                            {streams.slice(0,24).map((st,i)=><option key={(st.uri||'')+i} value={i}>{streamLabel(st,i)}</option>)}
                          </select>
                          <div className="scan-uri" title={maskCameraUrl(selected?.masked_uri||selected?.uri)}>{maskCameraUrl(selected?.masked_uri||selected?.uri)}</div>
                        </>
                      ):(
                        <div className="scan-meta">Sem URL de video. Tente com usuario e senha.</div>
                      )}
                    </div>
                    <button className={alreadyAdded?'btn btn-ok btn-sm':'btn btn-primary btn-sm'} onClick={()=>addDevice(dev)} disabled={alreadyAdded}>
                      {streams.length?(alreadyAdded?'Adicionado':'Adicionar'):'Credenciais'}
                    </button>
                  </div>
                  {showCred&&(
                    <div className="inline-cred">
                      <div>
                        <div className="inline-cred-title">Credenciais da camera {dev.ip}</div>
                        <div className="scan-meta">
                          Informe usuario e senha para tentar buscar perfis ONVIF/RTSP reais desta camera.
                        </div>
                      </div>
                      <div className="scan-form" style={{marginTop:0}}>
                        <div className="field"><label>Usuario</label><input value={username} onChange={e=>setUsername(e.target.value)} placeholder="admin"/></div>

/* ═══ ANÁLISES DE VÍDEO ═══════════════════════════════════════ */
const JOB_STATUS={recebendo:'Recebendo vídeo',na_fila:'Na fila',processando:'Analisando',revisando:'Revisando',gerando_video:'Gerando vídeo',concluido:'Concluído',erro:'Erro',cancelando:'Cancelando'};
const JOB_ACTIVE=['processando','revisando','gerando_video'];
const POSTURA_TXT={em_pe:'Em pé',agachado:'Agachado',curvado:'Curvado',caido:'Caído',desconhecida:'Não identificada'};
const MOV_TXT={parado:'Parado',andando:'Andando',correndo:'Correndo'};
const topEntries=(obj,names)=>Object.entries(obj||{}).filter(([,s])=>s>=0.5).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,s])=>`${names[k]||k} ${Math.round(s)}s`).join(', ')||'—';

function Stat({label,value,danger}){
  return <div className={"stat"+(danger?' danger':'')}><div className="stat-value">{value}</div><div className="stat-label">{label}</div></div>;
}

function AnalysisDetail({job,fileUrl,videoRef,onSeek,onRemove}){
