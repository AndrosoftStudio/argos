  const running=!['concluido','erro'].includes(job.status);
  const pct=Math.round((job.progresso||0)*100);
  return(
    <section className="board">
      <div className="board-bar">
        <div>
          <h2 className="board-title">{job.nome}</h2>
          <p className="page-lead">{job.modo_nome} · {JOB_STATUS[job.status]||job.status}{job.etapa&&job.etapa!==JOB_STATUS[job.status]?` · ${job.etapa}`:''}</p>
        </div>
        <button className="btn btn-danger btn-sm" onClick={onRemove}>{running?'Cancelar':'Remover'}</button>
      </div>
      <div className="board-body light">
        {running&&(
          <div className="upload-progress">
            <div className="upload-progress-label">{JOB_ACTIVE.includes(job.status)?`${pct}%`:(JOB_STATUS[job.status]||job.status)}{job.posicao_fila?` · posição ${job.posicao_fila} na fila`:''}{job.fps_processamento?` · ${job.fps_processamento} quadros/s`:''}{job.restante_s?` · ~${ArgosStream.formatDuration(job.restante_s)} restantes`:''}</div>
            <div className="upload-progress-track"><div className="upload-progress-fill" style={{width:pct+'%'}}/></div>
          </div>
        )}
        {job.erro&&<div className="err-msg">{job.erro}</div>}
        {r&&(<>
          <div className="stat-row">
            <Stat label="Duração" value={ArgosStream.formatDuration(r.duracao_s)}/>
            <Stat label="Pessoas" value={r.pessoas.length}/>
            <Stat label="Alertas" value={r.eventos.length} danger={r.eventos.length>0}/>
            <Stat label="Tempo seguro" value={r.percentual_seguro!=null?r.percentual_seguro+'%':'—'}/>
            <Stat label="Processamento" value={`${r.fps_processamento} q/s`}/>
          </div>
          {r.video&&<video ref={videoRef} className="analysis-video" src={fileUrl(job,r.video)} controls playsInline preload="metadata"/>}
          <div className="analysis-grid">
            <div>
              <h3 className="sub-title">Alertas</h3>
              {r.eventos.length===0&&<p className="panel-text">Nenhum alerta: ninguém ficou sem os EPIs exigidos nem caiu durante o vídeo.</p>}
              <div className="event-list">
                {r.eventos.map((e,i)=>(
                  <button key={i} type="button" className="event-item" onClick={()=>onSeek(e.inicio)} title="Ir para este momento do vídeo">
                    {e.miniatura&&<img src={fileUrl(job,'miniaturas/'+e.miniatura)} alt="" loading="lazy"/>}
                    <div>
                      <div className="event-title">{e.tipo==='possivel_queda'?'⚠ Possível queda':'Sem '+String(e.rotulo).toLowerCase()}</div>
                      <div className="analysis-meta">{e.track_id!=null?`ID ${e.track_id}`:'Pessoa'}{e.nome?` · ${e.nome}`:''} · {ArgosStream.formatDuration(e.inicio)} → {ArgosStream.formatDuration(e.fim)} ({e.duracao}s)</div>
                    </div>
                  </button>
                ))}
              </div>
            </div>
            <div>
              <h3 className="sub-title">Pessoas</h3>
              <div className="table-wrap">
                <table className="people-table">
                  <thead><tr><th>ID</th><th>Em cena</th><th>Sem EPI</th><th>Postura</th><th>Movimento</th></tr></thead>
                  <tbody>
                    {r.pessoas.map(p=>(
                      <tr key={p.track_id}>
                        <td>{p.track_id}{p.nome?` · ${p.nome}`:''}</td>
                        <td>{ArgosStream.formatDuration(p.inicio)}–{ArgosStream.formatDuration(p.fim)}</td>
                        <td>{Object.entries(p.faltando_s||{}).filter(([,s])=>s>=1).map(([k,s])=>`${ArgosStream.itemLabel(k)} ${Math.round(s)}s`).join(', ')||'—'}</td>
                        <td>{topEntries(p.postura_s,POSTURA_TXT)}</td>
                        <td>{topEntries(p.movimento_s,MOV_TXT)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <p className="hint">EPIs exigidos: {(r.epis_exigidos||[]).map(ArgosStream.itemLabel).join(', ')||'nenhum'}{r.quadros_para_revisao?` · ${r.quadros_para_revisao} quadros duvidosos guardados para reforçar o dataset`:''}</p>
            </div>
          </div>
        </>)}
      </div>
    </section>
  );
}

function AnalysesPage({token,backendUrl,availableModels,defaultModel,onToast,focusId}){
  const [jobs,setJobs]=useState([]);
  const [selected,setSelected]=useState(focusId||null);
  const [detail,setDetail]=useState(null);
  const [file,setFile]=useState(null);
  const [mode,setMode]=useState('detalhado');
  const [model,setModel]=useState('');
  const [uploadPct,setUploadPct]=useState(null);
  const videoRef=useRef(null);
  const fileUrl=(job,rel)=>`${backendUrl}/analises/${job.id}/arquivo/${rel}?token=${encodeURIComponent(token)}`;

  const load=useCallback(async()=>{
    try{const r=await authFetch(backendUrl+'/analises',token);if(r.ok){const d=await r.json();setJobs(d.analises||[]);}}catch{}
  },[backendUrl,token]);
  const loadDetail=useCallback(async(id)=>{
    try{
      const r=await authFetch(backendUrl+'/analises/'+id,token);
      if(r.ok){const d=await r.json();setDetail(d.analise);}
      else if(r.status===404){setSelected(null);setDetail(null);}
    }catch{}
  },[backendUrl,token]);

  const anyActive=jobs.some(j=>!['concluido','erro'].includes(j.status));
  useEffect(()=>{load();},[load]);
  useEffect(()=>{if(focusId) setSelected(focusId);},[focusId]);
  useEffect(()=>{if(selected) loadDetail(selected); else setDetail(null);},[selected,loadDetail]);
  useEffect(()=>{
    if(!anyActive) return;
    const iv=setInterval(()=>{load();if(selected) loadDetail(selected);},2000);
    return()=>clearInterval(iv);
  },[anyActive,selected,load,loadDetail]);

  const send=async()=>{
    if(!file) return;
    setUploadPct(0);
    try{
      const job=await ArgosStream.uploadAnalysisFile({backendUrl,token,file,mode,model,name:file.name,onProgress:p=>setUploadPct(Math.round(p*100))});
      onToast('Vídeo enviado para a fila de análise');
      setFile(null);
      setSelected(job.id);
      load();
    }catch(e){onToast(e.message,'err');}
    setUploadPct(null);
  };
  const remove=async(job)=>{
    const running=!['concluido','erro'].includes(job.status);
    if(!confirm(running?`Cancelar a análise "${job.nome}"?`:`Remover a análise "${job.nome}"?`)) return;
    await authFetch(backendUrl+'/analises/'+job.id,token,{method:'DELETE'}).catch(()=>{});
    setSelected(null);
    load();
  };
  const seek=(t)=>{
    const v=videoRef.current;
    if(!v) return;
    v.currentTime=Math.max(0,t-1);
    v.play().catch(()=>{});
    v.scrollIntoView({behavior:'smooth',block:'center'});
  };

  return(
    <div className="page">
      <section className="board">
        <div className="board-bar">
          <div>
            <h2 className="board-title">Análises de vídeo</h2>
            <Ajuda titulo="Análises gravadas"
              resumo="Vídeos gravados nas câmeras, revisados quadro a quadro depois.">
              <p>Quando uma câmera está em <strong>Detalhado</strong> ou <strong>Super
              detalhado</strong>, o vídeo também é gravado e sobe para o servidor enquanto
              você grava.</p>
              <p>Depois o servidor revisa esse vídeo quadro a quadro, com mais calma do que
              dá para fazer ao vivo. O resultado é uma lista de momentos em que alguém ficou
              sem EPI ou caiu, cada um com a hora exata — é só clicar para o vídeo pular
              para aquele instante.</p>
              <p>Serve para conferir um turno inteiro sem assistir a tudo.</p>
            </Ajuda>
          </div>
        </div>
        <div className="board-body light">
          <div className="analysis-upload">
            <label className="btn btn-secondary btn-sm" style={{cursor:'pointer',maxWidth:'100%',overflow:'hidden',textOverflow:'ellipsis'}}>
              {file?('🎞 '+file.name):'Escolher vídeo'}
              <input type="file" accept="video/*" style={{display:'none'}} onChange={e=>{setFile((e.target.files&&e.target.files[0])||null);e.target.value='';}}/>
            </label>
            <select value={mode} onChange={e=>setMode(e.target.value)} aria-label="Modo de análise">
              <option value="detalhado">🎯 Detalhado</option>
              <option value="super">🔬 Super detalhado</option>
            </select>
            <select value={model} onChange={e=>setModel(e.target.value)} aria-label="Modelo">
              <option value="">Modelo padrão{defaultModel?` (${defaultModel})`:''}</option>
              {availableModels.map(m=><option key={m.name} value={m.name}>{m.display_name||m.name}</option>)}
            </select>
            <button className="btn btn-primary btn-sm" onClick={send} disabled={!file||uploadPct!==null}>{uploadPct!==null?`Enviando ${uploadPct}%`:'Enviar para análise'}</button>
          </div>

          {jobs.length===0&&(
            <div className="empty" style={{marginTop:16}}>
              <div className="empty-ico" aria-hidden="true">🎞</div>
              <div className="empty-title">Nenhuma análise ainda</div>
              <div className="empty-sub">Grave no modo detalhado ou envie um vídeo.</div>
            </div>
          )}
          {jobs.length>0&&(
            <div className="analysis-list">
              {jobs.map(j=>{
                const pct=Math.round((j.progresso||0)*100);
                return(
                  <button key={j.id} type="button" className={"analysis-item"+(selected===j.id?' active':'')} onClick={()=>setSelected(j.id)}>
                    <div className="analysis-name">{j.nome}</div>
                    <div className="analysis-meta">{j.modo_nome} · {new Date(j.criado_em*1000).toLocaleString('pt-BR')}</div>
                    <div className={"analysis-status s-"+j.status}>{JOB_STATUS[j.status]||j.status}{JOB_ACTIVE.includes(j.status)?` · ${pct}%`:''}{j.posicao_fila?` · posição ${j.posicao_fila}`:''}</div>
                    {!['concluido','erro'].includes(j.status)&&<div className="upload-progress-track"><div className="upload-progress-fill" style={{width:pct+'%'}}/></div>}
                    {j.resumo&&<div className="analysis-meta">{j.resumo.eventos} alerta(s) · {j.resumo.pessoas} pessoa(s){j.resumo.percentual_seguro!=null?` · ${j.resumo.percentual_seguro}% seguro`:''}</div>}
                  </button>
                );
              })}
            </div>
          )}
        </div>
      </section>
      {detail&&<AnalysisDetail job={detail} fileUrl={fileUrl} videoRef={videoRef} onSeek={seek} onRemove={()=>remove(detail)}/>}
    </div>
  );
}

/* ═══ ALARME SONORO ══════════════════════════════════════════
   O navegador só libera áudio depois de um gesto do usuário; por isso o
   contexto é criado no primeiro clique/tecla e reaproveitado depois.      */
const Alarme={ctx:null};
function prepararAlarme(){
  if(Alarme.ctx) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  try{ Alarme.ctx=new AC(); }catch(e){}
}
if(typeof document!=='undefined'){
  const libera=()=>{prepararAlarme(); if(Alarme.ctx&&Alarme.ctx.state==='suspended') Alarme.ctx.resume();};
  document.addEventListener('pointerdown',libera);
  document.addEventListener('keydown',libera);
}
function bipAlarme(){
  const ctx=Alarme.ctx;
  if(!ctx||ctx.state!=='running') return;
  // duas notas curtas: lê como alarme, não como notificação
  [0,0.22].forEach((atraso,i)=>{
    const osc=ctx.createOscillator(),g=ctx.createGain();
    const t0=ctx.currentTime+atraso;
    osc.type='square';
    osc.frequency.setValueAtTime(i?760:980,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(0.16,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+0.18);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+0.2);
  });
}
function useAlarme(ativo,ligado){
  useEffect(()=>{
    if(!ativo||!ligado) return;
    bipAlarme();
    const id=setInterval(bipAlarme,2200);
    return ()=>clearInterval(id);
  },[ativo,ligado]);
}

/* ═══ GRÁFICOS ═══════════════════════════════════════════════
   Série única em todos: uma cor só (o azul do sistema). O índice de
   conformidade é estado, então vem com número + ícone + rótulo.           */
function BarrasCategoria({dados,rotulo,valor,vazio}){
  if(!dados||!dados.length) return <div className="graf-vazio">{vazio}</div>;
  const max=Math.max(...dados.map(valor),1);
  return(
    <div>
      {dados.map((d,i)=>{
        const v=valor(d);
        return(
          <div key={i} className="barra-linha">
            <span className="barra-rot" title={rotulo(d)}>{rotulo(d)}</span>
            <div className="barra-trilho"><div className="barra-preenche" style={{width:Math.max(v/max*100,2)+'%'}}/></div>
            <span className="barra-val">{v}</span>
          </div>
        );
      })}
    </div>
  );
}

function ColunasPorDia({dados}){
  if(!dados||!dados.length) return <div className="graf-vazio">Nenhuma violação registrada no período.</div>;
  const max=Math.max(...dados.map(d=>d.violacoes),1);
  const dia=(s)=>{const p=String(s||'').split('-');return p.length===3?p[2]+'/'+p[1]:s;};
  return(
    <div>
      <div className="colunas">
        {dados.map(d=>(
          <div key={d.dia} className="coluna" title={dia(d.dia)+': '+d.violacoes+' violação(ões) · '+Math.round(d.segundos)+'s'}>
            {d.violacoes>0&&<span className="coluna-val">{d.violacoes}</span>}
            <div className="coluna-preenche" style={{height:Math.max(d.violacoes/max*100,1.5)+'%'}}/>
          </div>
        ))}
      </div>
      <div className="colunas-eixo">{dados.map(d=><span key={d.dia}>{dia(d.dia)}</span>)}</div>
    </div>
  );
}

function IndiceConformidade({valor,media,semRegistros,dias}){
  // Sem nenhum registro no periodo o indice nao e 100: e desconhecido. Marcar como
  // "boa conformidade" quem o sistema nunca identificou diz o contrario da verdade.
  if(semRegistros){
    return(
      <div className="indice sem-dado">
        <span style={{fontSize:'1.9rem'}} aria-hidden="true">➖</span>
        <div className="indice-num">—</div>
        <div style={{minWidth:0}}>
          <div className="indice-lbl">Sem registros nos últimos {dias} dias</div>
          <div className="indice-sub">
            Nenhuma ocorrência foi ligada a este funcionário. Isso <strong>não</strong> quer dizer que ele
            estava com o EPI: pode ser que as câmeras não tenham reconhecido o rosto dele.
          </div>
        </div>
      </div>
    );
  }
  const nivel=valor>=80?'bom':valor>=50?'medio':'ruim';
  const texto={bom:'Boa conformidade',medio:'Atenção necessária',ruim:'Conformidade crítica'}[nivel];
  const icone={bom:'✅',medio:'⚠️',ruim:'🚨'}[nivel];
  return(
    <div className={"indice "+nivel}>
      <span style={{fontSize:'1.9rem'}} aria-hidden="true">{icone}</span>
      <div className="indice-num">{valor}</div>
      <div style={{minWidth:0}}>
        <div className="indice-lbl">{texto}</div>
        <div className="indice-sub">Índice de uso correto de EPI · média de {media} violação(ões) por dia</div>
      </div>
    </div>
  );
}

/* ═══ FICHA DE DESEMPENHO DO FUNCIONÁRIO ════════════════════ */
function FuncDesempenho({func,token,backendUrl,onClose}){
  const [dados,setDados]=useState(null);
  const [erro,setErro]=useState('');
  const [dias,setDias]=useState(30);

  useEffect(()=>{
    let vivo=true;
    setDados(null);setErro('');
    authFetch(backendUrl+'/funcionarios/'+func.id+'/desempenho?dias='+dias,token)
      .then(r=>r.json().then(d=>{if(!r.ok) throw new Error(d.error||'Erro');return d;}))
      .then(d=>{if(vivo) setDados(d);})
      .catch(e=>{if(vivo) setErro(e.message);});
    return ()=>{vivo=false;};
  },[func.id,dias,token,backendUrl]);

  const quando=(ts)=>new Date(ts*1000).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  const dur=(s)=>!s?'—':s<60?Math.round(s)+'s':Math.floor(s/60)+'min '+Math.round(s%60)+'s';
  const urlFoto=(f)=>backendUrl+'/auditoria/evidencia/'+f+'?token='+token;

  return(
    <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal modal-largo">
        <h3>📊 Desempenho · {func.nome}</h3>
        <div className="field" style={{maxWidth:220}}>
          <label>Período</label>
          <select value={dias} onChange={e=>setDias(Number(e.target.value))}>
            <option value={7}>Últimos 7 dias</option>
            <option value={30}>Últimos 30 dias</option>
            <option value={90}>Últimos 90 dias</option>
          </select>
        </div>

        {erro&&<div className="err-msg">{erro}</div>}
        {!dados&&!erro&&<p className="hint">Carregando histórico...</p>}

        {dados&&(
          <div>
            <IndiceConformidade valor={dados.indice_conformidade} media={dados.media_por_dia}
              semRegistros={dados.sem_registros} dias={dados.dias}/>

            {dados.nao_atribuidas>0&&(
              <div className="aviso-orfas">
                <span aria-hidden="true" style={{fontSize:'1.3rem',lineHeight:1}}>⚠️</span>
                <div>
                  As câmeras registraram <strong>{dados.nao_atribuidas} violação(ões) sem dono</strong> no
                  mesmo período: o sistema viu alguém sem EPI, mas não reconheceu de quem era o rosto.
                  Essas ocorrências não entram na ficha de ninguém.
                  {' '}Cadastre ao menos 3 fotos de rosto de cada funcionário para reduzir esse número.
                </div>
              </div>
            )}

            <div className="stat-row" style={{marginTop:14}}>
              <Stat label="Violações" value={dados.total_violacoes} danger={dados.total_violacoes>0}/>
              <Stat label="Tempo sem EPI" value={dur(dados.segundos_em_violacao)}/>
              <Stat label="Média por dia" value={dados.media_por_dia}/>
            </div>

            <div className="graf">
              <div className="graf-titulo">Violações por dia</div>
              <ColunasPorDia dados={dados.por_dia}/>
            </div>

            <div className="graf">
              <div className="graf-titulo">EPI mais esquecido</div>
              <BarrasCategoria dados={dados.por_epi} rotulo={d=>d.label||d.epi} valor={d=>d.violacoes}
                vazio="Nenhuma violação de EPI no período."/>
            </div>

            <div className="graf">
              <div className="graf-titulo">Violações por área</div>
              <BarrasCategoria dados={dados.por_area} rotulo={d=>d.area} valor={d=>d.violacoes}
                vazio="Nenhuma violação associada a uma área."/>
            </div>

            <div className="graf">
              <div className="graf-titulo">Linha do tempo ({(dados.ultimos_eventos||[]).length} registro(s))</div>
              {(dados.ultimos_eventos||[]).length===0
                ? <div className="graf-vazio">Nada registrado para este funcionário nos últimos {dados.dias} dias.</div>
                : <div>
                    {dados.ultimos_eventos.map(ev=>(
                      <div key={ev.id} className="evento">
                        <span className="evento-quando">{quando(ev.ts)}</span>
                        <div className="evento-corpo">
                          <span className={"evento-tipo"+(ev.tipo==='queda'?' queda':'')}>
                            {ev.tipo==='queda'?'Possível queda':'Sem '+String(ev.epi_label||ev.epi||'EPI').toLowerCase()}
                          </span>
                          <div className="evento-meta">
                            {[ev.area_nome&&('Área: '+ev.area_nome),ev.stream_id&&('Câmera: '+ev.stream_id),
                              ev.duracao?('Duração: '+dur(ev.duracao)):null].filter(Boolean).join(' · ')}
                          </div>
                          {(ev.fotos||[]).length>0&&(
                            <div className="evidencias">
                              {ev.fotos.map(f=>(
                                <img key={f} src={urlFoto(f)} alt="Evidência do momento da violação"
                                  title="Abrir evidência em nova aba"
                                  onClick={()=>window.open(urlFoto(f),'_blank')}
                                  onError={e=>{e.target.style.display='none';}}/>
                              ))}
                            </div>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>}
              <p className="hint" style={{marginTop:10}}>
                As fotos de evidência são temporárias: saem do sistema automaticamente após 7 dias.
              </p>
            </div>
          </div>
        )}

        <div className="modal-actions"><button className="btn btn-secondary" onClick={onClose}>Fechar</button></div>
      </div>
    </div>
  );
}

/* ═══ ÁREAS DE RISCO ═════════════════════════════════════════ */
function AreaCard({area,episDisponiveis,onSalvar,onRemover}){
  const [edit,setEdit]=useState(false);
  const [form,setForm]=useState(area);
  useEffect(()=>{setForm(area);},[area]);
  const toggle=(key)=>setForm(p=>{
    const atuais=p.epis_obrigatorios||[];
    return {...p,epis_obrigatorios:atuais.includes(key)?atuais.filter(k=>k!==key):[...atuais,key]};
  });
  const labels=(area.epis_obrigatorios||[]).map(k=>(episDisponiveis.find(e=>e.key===k)||{}).label||k);

  return(
    <div className="area-card" style={{borderLeftColor:area.cor}}>
      <div className="area-topo">
        <span className="area-swatch" style={{background:area.cor}}/>
        <span className="area-nome">{area.nome}</span>
        <button className="btn btn-secondary btn-xs" onClick={()=>setEdit(v=>!v)}>{edit?'Cancelar':'Editar'}</button>
        <button className="btn btn-danger btn-xs" onClick={()=>onRemover(area)}>✕ Remover</button>
      </div>

      {!edit&&(
        labels.length
          ? <div className="epi-chips">{labels.map(l=><span key={l} className="epi-chip on">{l}</span>)}</div>
          : <div className="area-vazia">Nenhum EPI exigido: nesta área o sistema não vai alarmar.</div>
      )}

      {edit&&(
        <div>
          <div className="field-row">
            <div className="field"><label>Nome</label>
              <input value={form.nome} onChange={e=>setForm(p=>({...p,nome:e.target.value}))}/></div>
            <div className="field"><label>Cor no vídeo</label>
              <input type="color" value={form.cor} onChange={e=>setForm(p=>({...p,cor:e.target.value}))}/></div>
          </div>
          <div className="field">
            <label>EPIs obrigatórios nesta área</label>
            <div className="epi-chips">
              {episDisponiveis.map(e=>(
                <span key={e.key} className={"epi-chip sel"+((form.epis_obrigatorios||[]).includes(e.key)?' on':'')}
                  role="checkbox" aria-checked={(form.epis_obrigatorios||[]).includes(e.key)} tabIndex={0}
                  onClick={()=>toggle(e.key)}
                  onKeyDown={ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggle(e.key);}}}>
                  {e.label}
                </span>
              ))}
            </div>
          </div>
          <div className="modal-actions" style={{marginTop:10}}>
            <button className="btn btn-primary btn-sm" onClick={()=>{onSalvar(form);setEdit(false);}}>Salvar área</button>
          </div>
        </div>
      )}
    </div>
  );
}

function AreasBoard({token,backendUrl,onToast}){
  const [areas,setAreas]=useState([]);
  const [epis,setEpis]=useState([]);
  const [novo,setNovo]=useState('');

  const carregar=useCallback(()=>{
    authFetch(backendUrl+'/areas',token).then(r=>r.json())
      .then(d=>{setAreas(d.areas||[]);setEpis(d.epis_disponiveis||[]);})
      .catch(()=>{});
  },[token,backendUrl]);
  useEffect(()=>{carregar();},[carregar]);

  const criar=async()=>{
    const nome=novo.trim();
    if(!nome) return;
    try{
      const r=await authFetch(backendUrl+'/areas',token,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({nome})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Erro');
      setNovo('');carregar();onToast&&onToast('Área criada! Agora escolha os EPIs e desenhe-a na câmera.');
    }catch(e){onToast&&onToast(e.message,'err');}
  };

  const salvar=async(area)=>{
    try{
      const r=await authFetch(backendUrl+'/areas/'+area.id,token,{method:'PUT',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(area)});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Erro');
      carregar();onToast&&onToast('Área salva!');
    }catch(e){onToast&&onToast(e.message,'err');}
  };

  const remover=async(area)=>{
    if(!confirm('Remover a área "'+area.nome+'"? Os polígonos dela saem de todas as câmeras.')) return;
    try{
      await authFetch(backendUrl+'/areas/'+area.id,token,{method:'DELETE'});
      carregar();onToast&&onToast('Área removida!');
    }catch(e){onToast&&onToast(e.message,'err');}
  };

  return(
    <section className="board">
      <div className="board-bar">
        <div>
          <h2 className="board-title">Áreas de risco</h2>
          <Ajuda titulo="Áreas de risco"
            resumo="Cada pedaço da fábrica pode exigir uma lista diferente de EPIs.">
            <p>Sem áreas, todas as câmeras cobram a mesma lista de EPIs. Com áreas, cada
            pedaço da cena cobra o que faz sentido ali: capacete e óculos na solda, só
            capacete no corredor, nada no escritório.</p>
            <ol>
              <li>Crie a área aqui e escolha os EPIs obrigatórios dela.</li>
              <li>Vá em <strong>Câmeras</strong>, abra "Ajustes desta câmera" e clique em
              <strong> Mapear áreas</strong>.</li>
              <li>Desenhe o contorno da área por cima da imagem da câmera.</li>
            </ol>
            <p>A mesma área pode ser desenhada em várias câmeras. O sistema cobra de cada
            pessoa a lista da área onde ela está <strong>pisando</strong>.</p>
            <p>Área sem nenhum EPI marcado não alarma — é assim que se cria uma zona livre.</p>
          </Ajuda>
        </div>
        <div className="board-actions">
          <input className="inline-input" style={{minWidth:180}} value={novo} placeholder="Nome da área (ex: Solda)"
            onChange={e=>setNovo(e.target.value)} onKeyDown={e=>e.key==='Enter'&&criar()} aria-label="Nome da nova área"/>
          <button className="btn btn-primary btn-sm" onClick={criar}>+ Criar área</button>
        </div>
      </div>
      <div className="board-body light">
        {areas.length===0
          ? <div className="empty">
              <div className="empty-ico" aria-hidden="true">🗺️</div>
              <div className="empty-title">Nenhuma área cadastrada</div>
              <div className="empty-sub">Sem áreas, todas as câmeras cobram a mesma lista de EPIs do modelo.</div>
            </div>
          : <div className="grid-cards">
              {areas.map(a=><AreaCard key={a.id} area={a} episDisponiveis={epis} onSalvar={salvar} onRemover={remover}/>)}
            </div>}
      </div>
    </section>
  );
}

/* ═══ EDITOR DE ZONAS (desenha a área sobre o vídeo) ═════════ */
function ZonaEditor({streamId,token,backendUrl,onClose,onToast}){
  const [frame,setFrame]=useState(null);
  const [areas,setAreas]=useState([]);
  const [zonas,setZonas]=useState([]);
  const [areaAtual,setAreaAtual]=useState('');
  const [pontos,setPontos]=useState([]);
  const [salvando,setSalvando]=useState(false);
  const svgRef=useRef();

  useEffect(()=>{
    authFetch(backendUrl+'/streams/'+streamId+'/zonas',token).then(r=>r.json())
      .then(d=>{
        setZonas(d.zonas||[]);setAreas(d.areas||[]);
        if((d.areas||[]).length) setAreaAtual(d.areas[0].id);
      }).catch(()=>{});
    authFetch(backendUrl+'/frame?stream='+streamId,token)
      .then(r=>r.status===204?null:r.json())
      .then(d=>{if(d&&d.frame) setFrame('data:image/jpeg;base64,'+d.frame);})
      .catch(()=>{});
  },[streamId,token,backendUrl]);

  const areaPorId=(id)=>areas.find(a=>a.id===id);
  const corDe=(id)=>(areaPorId(id)||{}).cor||'#c81e1e';

  const clique=(e)=>{
    const r=svgRef.current.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
    setPontos(p=>[...p,[Math.min(Math.max(x,0),1),Math.min(Math.max(y,0),1)]]);
  };

  const fecharPoligono=()=>{
    if(pontos.length<3){onToast&&onToast('Marque pelo menos 3 pontos para fechar a área.','err');return;}
    if(!areaAtual){onToast&&onToast('Crie uma área primeiro, em Configurações.','err');return;}
    setZonas(z=>[...z,{id:'z'+Date.now(),area_id:areaAtual,pontos}]);
    setPontos([]);
  };

  const salvar=async()=>{
    setSalvando(true);
    try{
      const r=await authFetch(backendUrl+'/streams/'+streamId+'/zonas',token,
        {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({zonas})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Erro');
      onToast&&onToast('Áreas mapeadas nesta câmera!');
      onClose();
    }catch(e){onToast&&onToast(e.message,'err');}
    setSalvando(false);
  };

  const pathDe=(pts)=>pts.map(p=>(p[0]*100)+','+(p[1]*100)).join(' ');

  return(
    <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal modal-largo">
        <h3>🗺️ Mapear áreas · {streamId}</h3>

        {areas.length===0&&(
          <div className="err-msg">Nenhuma área cadastrada. Crie as áreas em Configurações → Áreas de risco antes de desenhar.</div>
        )}

        {frame
          ? <div className="zona-palco">
              <img src={frame} alt="Imagem atual da câmera"/>
              <svg ref={svgRef} className="zona-svg" viewBox="0 0 100 100" preserveAspectRatio="none" onClick={clique}>
                {zonas.map(z=>(
                  <polygon key={z.id} points={pathDe(z.pontos)} fill={corDe(z.area_id)} fillOpacity="0.28"
                    stroke={corDe(z.area_id)} strokeWidth="0.5" vectorEffect="non-scaling-stroke"/>
                ))}
                {pontos.length>1&&(
                  <polyline points={pathDe(pontos)} fill="none" stroke={corDe(areaAtual)} strokeWidth="2"
                    strokeDasharray="4 3" vectorEffect="non-scaling-stroke"/>
                )}
                {pontos.map((p,i)=>(
                  <circle key={i} cx={p[0]*100} cy={p[1]*100} r="1.1" fill="#fff"
                    stroke={corDe(areaAtual)} strokeWidth="2" vectorEffect="non-scaling-stroke"/>
                ))}
              </svg>
            </div>
          : <div className="zona-sem-frame">
              Sem imagem desta câmera no momento. Ligue o stream e reabra esta janela para desenhar sobre a cena real.
            </div>}

        <div className="field" style={{marginTop:14,maxWidth:280}}>
          <label>Área que estou desenhando</label>
          <select value={areaAtual} onChange={e=>setAreaAtual(e.target.value)} disabled={!areas.length}>
            {areas.map(a=><option key={a.id} value={a.id}>{a.nome}</option>)}
          </select>
        </div>

        <p className="hint">
          Clique na imagem para marcar os cantos da área ({pontos.length} ponto(s) marcado(s)) e depois em "Fechar área".
          Quem estiver pisando dentro do polígono passa a ser cobrado pelos EPIs daquela área.
        </p>

        <div className="board-actions" style={{marginTop:12}}>
          <button className="btn btn-secondary btn-sm" onClick={fecharPoligono} disabled={pontos.length<3}>✓ Fechar área</button>
          <button className="btn btn-secondary btn-sm" onClick={()=>setPontos(p=>p.slice(0,-1))} disabled={!pontos.length}>↶ Desfazer ponto</button>
        </div>

        {zonas.length>0&&(
          <div className="zona-legenda">
            {zonas.map(z=>(
              <span key={z.id} className="zona-item">
                <span className="area-swatch" style={{background:corDe(z.area_id)}}/>
                {(areaPorId(z.area_id)||{}).nome||'Área removida'}
                <button className="btn btn-danger btn-xs" onClick={()=>setZonas(list=>list.filter(x=>x.id!==z.id))}>✕</button>
              </span>
            ))}
          </div>
        )}

        <div className="modal-actions">
          <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={salvar} disabled={salvando}>{salvando?'Salvando...':'Salvar mapeamento'}</button>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [token,setToken]=useState(()=>localStorage.getItem('epi_token')||'');
  const [user,setUser]=useState(null);
  const [page,setPage]=useState('cameras');
  const [backendUrl,setBackendUrl]=useState(INITIAL_API);
  const [backendSource,setBackendSource]=useState(CONFIG_BACKEND_URL?'fixo':(CONFIG_HUB_URL?'hub':'manual'));
  const [resolvingBackend,setResolvingBackend]=useState(false);
  const [online,setOnline]=useState(false);
  const [streams_list,setStreamsList]=useState([]);
  const [defaultModel,setDefaultModel]=useState(()=>localStorage.getItem('epi_defaultModel')||'yolo26n.pt');
  const [device,setDevice]=useState(()=>localStorage.getItem('epi_device')||'auto');
  const [serverLinks,setServerLinks]=useState({});
  const [toast,setToast]=useState(null);
  const [paused,setPaused]=useState(false);
  // id estavel do backend (vem de /status); vai no link do celular para o hub achar o servidor
  const [nodeId,setNodeId]=useState('');
  // alarme sonoro do monitoramento: fica ligado por padrão e a escolha persiste
  const [alarmeLigado,setAlarmeLigado]=useState(()=>localStorage.getItem('epi_alarme')!=='0');
  // modo projetor: tudo maior e com mais contraste, para a tela ser projetada
  const [modoProjetor,setModoProjetor]=useState(()=>localStorage.getItem('epi_projetor')==='1');
  // tema: 'sistema' (padrão) segue o aparelho; 'claro' e 'escuro' mandam no aparelho
  const [tema,setTema]=useState(()=>localStorage.getItem('epi_tema')||'sistema');
  useEffect(()=>{
    document.documentElement.classList.toggle('modo-projetor',modoProjetor);
    localStorage.setItem('epi_projetor',modoProjetor?'1':'0');
  },[modoProjetor]);
  useEffect(()=>{
    localStorage.setItem('epi_tema',tema);
    // Projetor lava cor escura: enquanto ele está ligado o tema é sempre o claro
    // de alto contraste, independente do que o usuário escolheu aqui.
    const efetivo=modoProjetor?'claro':tema;
    if(efetivo==='sistema') document.documentElement.removeAttribute('data-tema');
    else document.documentElement.setAttribute('data-tema',efetivo);
    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta){
      const escuro=efetivo==='escuro'||(efetivo==='sistema'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
      meta.setAttribute('content',escuro?'#080a1d':'#3740b4');
    }
  },[tema,modoProjetor]);
  const [availableModels,setAvailableModels]=useState([]);
  const [uploadingModel,setUploadingModel]=useState(false);
  const [uploadPct,setUploadPct]=useState(0);
  const [camTokens,setCamTokens]=useState([]);
  const [epis,setEpis]=useState([]);
  const [funcs,setFuncs]=useState([]);
  const [showNovoEpi,setShowNovoEpi]=useState(false);
  const [showNovoFunc,setShowNovoFunc]=useState(false);
  const [showNetCam,setShowNetCam]=useState(false);
  const [treinandoFaces,setTreinandoFaces]=useState(false);
  const [rostos,setRostos]=useState(null);   // situação do reconhecimento facial
  const [analysisFocus,setAnalysisFocus]=useState(null);
  // modo de visualização das câmeras; vazio = decide sozinho pelo número de câmeras
  const [visual,setVisual]=useState(()=>localStorage.getItem('epi_visual')||'');
  const escolherVisual=(v)=>{setVisual(v);localStorage.setItem('epi_visual',v);};
  const nextIndex=useRef(0);
  // FIX remover câmera: conjunto de streams gerenciados localmente
  const managedStreams=useRef(new Set());

  const loadTokens=useCallback(async(bUrl,tok)=>{
    try{const r=await fetch((bUrl||INITIAL_API)+'/cam_tokens',{headers:{'Authorization':'Bearer '+(tok||token),'ngrok-skip-browser-warning':'true'}});
    if(r.ok){const d=await r.json();if(d.tokens)setCamTokens(d.tokens);}}catch{}
  },[token]);

  const loadEpis=useCallback(async()=>{
    try{const r=await authFetch(backendUrl+'/epis',token);if(r.ok){const d=await r.json();setEpis(d.epis||[]);}}catch{}
  },[token,backendUrl]);

  const loadFuncs=useCallback(async()=>{
    try{const r=await authFetch(backendUrl+'/funcionarios',token);if(r.ok){const d=await r.json();setFuncs(d.funcionarios||[]);}}catch{}
  },[token,backendUrl]);

  const addToken=async()=>{
    const n=prompt("Nome do celular / dispositivo remoto:");if(!n)return;
    try{await authFetch(backendUrl+'/cam_tokens',token,{method:'POST',body:JSON.stringify({nome:n})});loadTokens(backendUrl,token);}catch{}
  };
  const delToken=async(t)=>{
    if(!confirm("Remover acesso deste dispositivo de câmera remota?"))return;
    try{await authFetch(backendUrl+'/cam_tokens/'+t,token,{method:'DELETE'});loadTokens(backendUrl,token);}catch{}
  };

  const showToast=(msg,type='ok')=>{setToast({msg,type});setTimeout(()=>setToast(null),3000);};
  const copyURL=(t)=>{try{navigator.clipboard.writeText(t);}catch{} showToast('Copiado!');};

  const refreshBackendFromHub=useCallback(async({attempts=6,delayMs=1200}={})=>{
    if(!CONFIG_HUB_URL) return;
    setResolvingBackend(true);
    try{
      const url=await resolveBackendFromHub({attempts,delayMs});
      if(url){
        setBackendUrl(url);
        setBackendSource('hub');
        localStorage.setItem('epi_backendUrl',url);
        showToast('Backend selecionado pelo hub');
      }
    }catch(e){
      showToast(e.message||'Hub indisponivel','err');
    }
    setResolvingBackend(false);
  },[]);

  useEffect(()=>{
    if(CONFIG_HUB_URL && !backendUrl){
      refreshBackendFromHub({attempts:10,delayMs:1000});
    }
  },[backendUrl,refreshBackendFromHub]);

  const onLogin=(tok,usr)=>{
    setToken(tok);setUser(usr);
    localStorage.setItem('epi_token',tok);
  };

  const logout=()=>{
    authFetch(backendUrl+'/auth/logout',token,{method:'POST'}).catch(()=>{});
    setToken('');setUser(null);localStorage.removeItem('epi_token');
    setStreamsList([]);
    managedStreams.current.clear();
  };

  useEffect(()=>{
    if(!token || !backendUrl) return;
    authFetch(backendUrl+'/auth/me',token).then(r=>r.json()).then(d=>{
      if(d.user){setUser(d.user);loadTokens(backendUrl,token);}
      else{setToken('');localStorage.removeItem('epi_token');}
    }).catch(()=>{});
    authFetch(backendUrl+'/models',token).then(r=>r.json()).then(d=>{
      if(d.models&&d.models.length>0){setAvailableModels(d.models);const serverDefault=(d.models.find(m=>m.is_default)||{}).name;const saved=localStorage.getItem('epi_defaultModel');const pick=serverDefault||saved||d.models[0].name;setDefaultModel(pick);localStorage.setItem('epi_defaultModel',pick);}
    }).catch(()=>{});
  },[token,backendUrl]);

  useEffect(()=>{
    if(!token || !backendUrl) return;
    const iv=setInterval(async()=>{
      try{
        const r=await af(backendUrl+'/status');
        if(r.ok){
          setOnline(true);
          const d=await r.json();if(typeof d.paused==='boolean')setPaused(d.paused);
          if(d.node_id) setNodeId(d.node_id);
        }
        // Sincroniza streams EXTERNOS (criados por cam.html / outros dispositivos)
        // mas NUNCA readiciona streams que o usuário removeu (managedStreams controla isso)
        try{
          const rs=await authFetch(backendUrl+'/streams',token);
          if(rs.ok){
            const ds=await rs.json();
            if(ds.streams){
              setStreamsList(prev=>{
                const localIds=new Set(prev.map(s=>s.streamId));
                const toAdd=ds.streams.filter(s=>{
                  // Só adiciona se: não está na lista local E não foi o usuário que gerenciou (não é do managedStreams)
                  // Streams do managedStreams são gerenciados localmente — não readicionar se foram removidos
                  if(localIds.has(s.stream_id)) return false;
                  // Se começa com "cam_" é stream externo (de cam.html) — sempre mostrar
                  if(s.stream_id.startsWith('cam_')) return true;
                  // Se nunca foi gerenciado localmente, também mostrar (sessão anterior)
                  if(!managedStreams.current.has(s.stream_id)) return true;
                  return false;
                });
                if(toAdd.length===0) return prev;
                const novos=toAdd.map(s=>({streamId:s.stream_id,index:nextIndex.current++}));
                return [...prev,...novos];
              });
            }
          }
        }catch{}
      }catch{setOnline(false);}
    },3000);
    af(backendUrl+'/tunnels').then(r=>r.json()).then(d=>setServerLinks(d)).catch(()=>{});
    const iv2=setInterval(()=>af(backendUrl+'/tunnels').then(r=>r.json()).then(d=>setServerLinks(d)).catch(()=>{}),10000);
    return()=>{clearInterval(iv);clearInterval(iv2);};
  },[token,backendUrl]);

  const loadModels=useCallback(async()=>{
    try{
      const r=await af(backendUrl+'/models',{headers:{'Authorization':'Bearer '+token,'ngrok-skip-browser-warning':'true'}});
      if(r.ok){const d=await r.json();if(d.models){setAvailableModels(d.models);const serverDefault=(d.models.find(m=>m.is_default)||{}).name; if(serverDefault){setDefaultModel(serverDefault);localStorage.setItem('epi_defaultModel',serverDefault);} }}
    }catch{}
  },[token,backendUrl]);

  const setModelAsDefault=async(modelName)=>{
    try{
      const r=await authFetch(backendUrl+'/models/'+encodeURIComponent(modelName)+'/default',token,{method:'POST'});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Erro ao definir padrão');
      localStorage.setItem('epi_defaultModel',modelName);
      setDefaultModel(modelName);
      showToast('Modelo padrão salvo!');
      loadModels();
    }catch(e){showToast(e.message||'Erro ao definir padrão','err');}
  };

  const uploadModelFile=async(file)=>{
    if(!file) return;
    if(!String(file.name||'').toLowerCase().endsWith('.pt')){showToast('Envie um arquivo .pt','err');return;}
    setUploadingModel(true);
    setUploadPct(0);
    try{
      const fd=new FormData();
      fd.append('model',file);
      await new Promise((resolve,reject)=>{
        const xhr=new XMLHttpRequest();
        xhr.open('POST', backendUrl+'/models/upload');
        xhr.setRequestHeader('Authorization','Bearer '+token);
        xhr.setRequestHeader('ngrok-skip-browser-warning','true');
        xhr.upload.onprogress=(e)=>{if(e.lengthComputable) setUploadPct(Math.max(1,Math.round((e.loaded/e.total)*100)));};
        xhr.onload=()=>{
          try{
            const d=JSON.parse(xhr.responseText||'{}');
            if(xhr.status>=200&&xhr.status<300) resolve(d);
            else reject(new Error(d.error||'Erro ao enviar modelo'));
          }catch(err){reject(err);}
        };
        xhr.onerror=()=>reject(new Error('Falha no upload do modelo'));
        xhr.send(fd);
      });
      setUploadPct(100);
      await loadModels();
      showToast('Modelo enviado com sucesso!');
      setPage('config');
    }catch(e){showToast(e.message||'Erro ao enviar modelo','err');}
    setTimeout(()=>setUploadPct(0),700);
    setUploadingModel(false);
  };

  useEffect(()=>{
    if(token&&page==='epis') loadEpis();
    if(token&&page==='funcionarios'){ loadFuncs(); carregarRostos(); }
    // Recarregar modelos ao abrir qualquer aba (pode ter novos modelos treinados)
    if(token&&page==='cameras') loadModels();
    if(token&&page==='config') loadModels();
    if(token&&page==='analises') loadModels();
  },[page,token]);

  const addStream=()=>{
    const idx=nextIndex.current++;
    const sid=user.id+'_'+idx;
    managedStreams.current.add(sid);
    setStreamsList(p=>[...p,{streamId:sid,index:idx}]);
  };

  const addDiscoveredStream=async(stream)=>{
    const url=String(stream?.uri||'').trim();
    if(!url){showToast('Stream sem URL','err');return;}
    const idx=nextIndex.current++;
    const sid=user.id+'_'+idx;
    const source=url.toLowerCase().startsWith('rtsp://')?'rtsp':'http';
    managedStreams.current.add(sid);
    localStorage.setItem('epi_source_'+sid,source);
    localStorage.setItem('epi_camurl_'+sid,url);
    localStorage.setItem('epi_sm_'+sid,defaultModel);
    setStreamsList(p=>[...p,{streamId:sid,index:idx}]);
    try{
      const modelCfg=getModelRequiredItems(findModelByValue(availableModels,defaultModel));
      const r=await authFetch(backendUrl+'/streams/add',token,{method:'POST',body:JSON.stringify({
        model:defaultModel,
        device,
        camera:url,
        stream_id:sid,
        required_items:modelCfg
      })});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||'Erro ao iniciar stream');
      showToast('Camera adicionada');
    }catch(e){
      showToast(e.message||'Camera adicionada; clique em Aplicar para iniciar','err');
    }
  };

  // FIX remover câmera: remove apenas localmente + avisa o servidor
  const removeStream=async(sid)=>{
    managedStreams.current.delete(sid);
    setStreamsList(p=>p.filter(s=>s.streamId!==sid));
    try{await authFetch(backendUrl+'/streams/remove',token,{method:'POST',body:JSON.stringify({stream_id:sid})});}catch{}
  };

  const togglePause=async()=>{
    try{
      const r=await authFetch(backendUrl+'/pause',token,{method:'POST',body:JSON.stringify({paused:!paused})});
      const d=await r.json();setPaused(d.paused);
    }catch{}
  };

  const criarEpi=async(form)=>{
    setShowNovoEpi(false);
    const r=await authFetch(backendUrl+'/epis',token,{method:'POST',body:JSON.stringify(form)});
    if(r.ok){await loadEpis();showToast('EPI criado!');}
    else showToast('Erro ao criar EPI','err');
  };

  const criarFunc=async(form)=>{
    setShowNovoFunc(false);
    const r=await authFetch(backendUrl+'/funcionarios',token,{method:'POST',body:JSON.stringify(form)});
    if(r.ok){await loadFuncs();showToast('Funcionário cadastrado!');}
    else showToast('Erro ao cadastrar','err');
  };

  const carregarRostos=useCallback(async()=>{
    if(!token||!backendUrl) return;
    try{
      const r=await authFetch(backendUrl+'/funcionarios/reconhecimento/status',token);
      if(r.ok) setRostos(await r.json());
    }catch(e){}
  },[token,backendUrl]);

  // Não há mais treino: o rosto vira um vetor no momento do upload. Este botão
  // só reprocessa fotos que ficaram sem vetor (enviadas antes da mudança, ou
  // quando o modelo de rosto não estava disponível).
  const treinarFaces=async()=>{
    setTreinandoFaces(true);
    try{
      const r=await authFetch(backendUrl+'/funcionarios/reconhecimento/status',token);
      const st=await r.json();
      if(st.pendentes===0){
        showToast('Todos os rostos já estão processados.');
      }else{
        const rr=await authFetch(backendUrl+'/funcionarios/treinar_reconhecimento',token,{method:'POST'});
        const d=await rr.json();
        if(!rr.ok) throw new Error(d.error||'Erro');
        showToast(d.message||'Processando rostos...');
        setTimeout(()=>{carregarRostos();loadFuncs();},4000);
      }
    }catch(e){showToast(e.message||'Erro ao processar rostos','err');}
    setTreinandoFaces(false);
    carregarRostos();
  };

  const [navOpen,setNavOpen]=useState(()=>window.innerWidth>900);
  const go=(p)=>{
    setPage(p);
    if(p==='devices') loadTokens(backendUrl,token);
    if(window.innerWidth<=900) setNavOpen(false);
  };

  if(!backendUrl){
    return(
      <div className="auth-wrap">
        <div className="auth-hero">
          <div className="auth-hero-marca">
            {LOGO_URL&&<img src={LOGO_URL} alt=""/>}
            <Brand size="xl" logo={false}/>
          </div>
          <p>Conectando ao servidor de processamento de imagens.</p>
        </div>
        <div className="auth-box">
          <div className="err-msg" role="alert">{resolvingBackend?'Buscando backend no hub...':'Backend nao conectado. Tente buscar pelo hub ou informe o endereco do servidor abaixo.'}</div>
          {CONFIG_HUB_URL&&<button className="btn btn-primary btn-full" onClick={refreshBackendFromHub} disabled={resolvingBackend}>{resolvingBackend?'Conectando...':'Buscar backend disponivel'}</button>}
          <div className="field" style={{marginTop:16}}><label>Backend URL manual</label><input value={backendUrl} onChange={e=>{const v=cleanUrl(e.target.value);setBackendUrl(v);setBackendSource('manual');localStorage.setItem('epi_backendUrl',v);}} placeholder="https://seu-backend.trycloudflare.com"/></div>
        </div>
      </div>
    );
  }

  if(!token||!user) return <AuthScreen onLogin={onLogin} backendUrl={backendUrl}/>;

  // Sem escolha do usuário: uma câmera sozinha abre em "grande", várias em "médio".
  const visualAtivo=visual||(streams_list.length<=1?'grande':'medio');

  const flURL=serverLinks.frontend_local||null;
  const cfURL=serverLinks.cloudflare_url;

  return(
    <div className={"app-wrap"+(navOpen?' nav-open':'')}>
      <header className="topbar">
        <div className="hdr-left">
          <button type="button" className="hamburger" onClick={()=>setNavOpen(v=>!v)} aria-label={navOpen?'Fechar menu':'Abrir menu'} aria-expanded={navOpen} aria-controls="app-sidebar"><span/><span/><span/></button>
          <Brand/>
        </div>
        <div className="hdr-right">
          <div className="net-state" title={online?'Servidor online':'Servidor offline'}><div className={"dot"+(online?' on':'')}/><span className="lbl">{online?'Online':'Offline'}</span></div>
          <div className="user-chip">👤 {user.nome.split(' ')[0]}</div>
          <button className={"btn btn-sm "+(alarmeLigado?'btn-outline-light':'btn-gold')}
            onClick={()=>{const v=!alarmeLigado;setAlarmeLigado(v);localStorage.setItem('epi_alarme',v?'1':'0');}}
            title={alarmeLigado?'Silenciar alarme sonoro':'Ligar alarme sonoro'}

          {online&&<button className={"btn btn-sm "+(paused?'btn-gold':'btn-outline-light')} onClick={togglePause} title={paused?'Retomar IA':'Pausar IA'}>{paused?'▶':'⏸'}<span className="hide-sm">{paused?'Retomar':'Pausar IA'}</span></button>}
          <button className="btn btn-outline-gold" onClick={logout}>Sair</button>
        </div>
      </header>

      <div className="app-body">
        <aside className="sidebar" id="app-sidebar" aria-label="Menu principal">
          <nav className="side-nav">
            {NAV_ITEMS.map(item=>(
              <button key={item.id} type="button" className={"side-item"+(page===item.id?' active':'')} aria-current={page===item.id?'page':undefined} onClick={()=>go(item.id)}>
                <span className="side-icon"><Icon name={item.icon}/></span>
                <span>{item.label}</span>
              </button>

          </nav>
          <div className="side-foot">{online?'Servidor online':'Servidor offline'}{paused?' · IA pausada':''}</div>

        <button type="button" className="nav-scrim" aria-label="Fechar menu" onClick={()=>setNavOpen(false)}/>

      {page==='cameras'&&(

                  celular, do próprio navegador, de uma câmera de rede (RTSP) ou da tela
                  do computador.</p>
                  <p>Os quatro botões do lado direito trocam o <strong>tamanho da

                    <li><strong>Lista</strong> — uma linha por câmera, sem imagem. Bom para

                    <li><strong>Pequeno</strong> — várias imagens pequenas lado a lado.</li>
                    <li><strong>Médio</strong> — imagem média com o painel de status.</li>
                    <li><strong>Grande</strong> — uma câmera ocupando o espaço todo. É o

                  </ul>
                  <p>Trocar o tamanho não desliga nada: as câmeras continuam sendo
                  analisadas igual, mesmo no modo lista.</p>
                </Ajuda>
              </div>
              <div className="board-actions">
                <SeletorVisual valor={visualAtivo} onChange={escolherVisual}/>
                <CameraDiscoveryPanel onOpen={()=>setShowNetCam(true)}/>
                <button className="btn btn-primary btn-sm" onClick={addStream}>+ Adicionar</button>
              </div>
            </div>
            <div className="board-body blue">
              {streams_list.length===0&&(
                <div className="empty">
                  <div className="empty-ico" aria-hidden="true">📷</div>
                  <div className="empty-title">Nenhuma câmera ativa</div>
                  <div className="empty-sub">Adicione uma câmera de rede, navegador, RTSP manual ou dispositivo remoto.</div>
                </div>
              )}
              {streams_list.length>0&&(
                <div className={"streams-grid v-"+visualAtivo}>
                  {streams_list.map(s=>(
                    <StreamCard key={s.streamId} streamId={s.streamId} token={token} backendUrl={backendUrl}
                      availableModels={availableModels} defaultModel={defaultModel} device={device} index={s.index}
                      alarmeLigado={alarmeLigado} onToast={showToast} visual={visualAtivo}
                      onRemove={()=>removeStream(s.streamId)}/>
                  ))}
                </div>
              )}
            </div>
          </section>
        </div>
      )}

      {page==='analises'&&(
        <AnalysesPage token={token} backendUrl={backendUrl} availableModels={availableModels} defaultModel={defaultModel} onToast={showToast} focusId={analysisFocus}/>
      )}

      {page==='epis'&&(
        <div className="page">
          <section className="board">
            <div className="board-bar">
              <div>
                <h2 className="board-title">EPIs cadastrados</h2>
                <Ajuda titulo="EPIs cadastrados"
                  resumo="A lista de equipamentos que o sistema sabe procurar nas câmeras.">
                  <p>Cada EPI aqui é um equipamento que o sistema sabe reconhecer: capacete,
                  óculos, luva, bota, colete, protetor auricular.</p>
                  <p>Para o sistema cobrar um EPI, ele precisa estar <strong>na lista de alguma
                  área</strong> (em Configurações → Áreas de risco) ou fazer parte do modelo de IA
                  em uso. Só cadastrar aqui não faz a câmera cobrar.</p>
                  <p>As fotos servem para <strong>treinar um modelo próprio</strong>, quando o
                  equipamento da empresa é diferente do padrão (um capacete de cor incomum, por
                  exemplo). Quem usa o modelo que já veio pronto não precisa enviar foto nenhuma.</p>
                </Ajuda>
              </div>
              <button className="btn btn-primary btn-sm" onClick={()=>setShowNovoEpi(true)}>+ Adicionar EPI</button>
            </div>
            <div className="board-body gold">
              {epis.length===0&&(
                <div className="empty">
                  <div className="empty-ico" aria-hidden="true">🦺</div>
                  <div className="empty-title">Nenhum EPI cadastrado</div>
                  <div className="empty-sub">Crie seu primeiro EPI e envie fotos para treinar o modelo de detecção.</div>
                  <div className="empty-extra">Sugestão para TCC: comece com a Farda SENAI!</div>
                </div>
              )}
              {epis.length>0&&(
                <div className="grid-cards">
                  {epis.map(epi=>(
                    <EpiCard key={epi.id} epi={epi} token={token} backendUrl={backendUrl}
                      onUpdate={loadEpis} onDelete={loadEpis}/>
                  ))}
                </div>
              )}
            </div>
          </section>
          {showNovoEpi&&<ModalNovoEpi onClose={()=>setShowNovoEpi(false)} onSave={criarEpi}/>}
        </div>
      )}

      {page==='funcionarios'&&(
        <div className="page">
          <section className="board">
            <div className="board-bar">
              <div>
                <h2 className="board-title">Funcionários</h2>
                <Ajuda titulo="Funcionários"
                  resumo="Quem o sistema consegue reconhecer pelo rosto nas câmeras."
                  >
                  <p>Cadastrar um funcionário com foto do rosto é o que permite dizer
                  <strong> de quem</strong> foi cada ocorrência. Sem isso a câmera ainda vê que
                  alguém está sem capacete, mas o registro fica sem dono e não entra em ficha
                  nenhuma.</p>
                  <p>Não existe etapa de treino: assim que a foto sobe, a pessoa já passa a ser
                  reconhecida.</p>
                  <ul>
                    <li>Foto de frente, rosto visível e bem iluminado.</li>
                    <li>Três ou mais fotos, em ângulos e luzes diferentes, melhoram bastante
                    o acerto — mas uma só já funciona.</li>
                    <li>Sem óculos escuros nem máscara na foto de cadastro.</li>
                  </ul>
                  <p>O botão <strong>Desempenho</strong> de cada cartão mostra o histórico da
                  pessoa: violações por dia, qual EPI ela mais esquece e as fotos do momento.</p>
                </Ajuda>
              </div>
              <div className="board-actions">
                <button className="btn btn-ok btn-sm" onClick={treinarFaces}
                  disabled={treinandoFaces||funcs.length===0}
                  title="Recalcula o rosto das fotos que ainda não foram processadas">
                  {treinandoFaces?'Processando...':'🧠 Processar rostos pendentes'}
                </button>
                <button className="btn btn-primary btn-sm" onClick={()=>setShowNovoFunc(true)}>+ Cadastrar</button>
              </div>
            </div>
            <div className="board-body light">
              {funcs.length===0&&(
                <div className="empty">
                  <div className="empty-ico" aria-hidden="true">👷</div>
                  <div className="empty-title">Nenhum funcionário cadastrado</div>
                  <div className="empty-sub">Cadastre funcionários e envie fotos de rosto para reconhecimento automático nas câmeras.</div>
                </div>
              )}
              {funcs.length>0&&(
                <div className="grid-cards">
                  {funcs.map(func=>(
                    <FuncCard key={func.id} func={func} token={token} backendUrl={backendUrl}
                      onUpdate={loadFuncs} onDelete={loadFuncs} onToast={showToast}/>
                  ))}
                </div>
              )}
            </div>
          </section>
          <div className="panel">
            <h2>Reconhecimento facial{' '}
              <Ajuda titulo="Como funciona o reconhecimento"
                resumo="Como o sistema liga um rosto visto na câmera a um funcionário cadastrado.">
                <ol>
                  <li>Você cadastra o funcionário e envia uma foto do rosto, de frente e
                  bem iluminada.</li>
                  <li>O rosto vira na hora um vetor de 512 números. <strong>Não existe
                  treino</strong>: a pessoa já passa a ser reconhecida.</li>
                  <li>Nas câmeras, cada rosto encontrado é comparado com os cadastrados. O
                  mais parecido, dentro do limite de semelhança, dá o nome.</li>
                  <li>A partir daí as ocorrências passam a ser atribuídas àquela pessoa e
                  aparecem na ficha de desempenho dela.</li>
                </ol>
                <p><strong>Pendentes</strong> são fotos que ainda não viraram vetor. O botão
                "Processar rostos pendentes" resolve em alguns segundos.</p>
                <p>Tudo roda no próprio servidor: <strong>nenhuma foto sai daqui</strong> e
                nada é enviado para serviço de fora.</p>
              </Ajuda>
            </h2>
            {rostos&&(
              <div className="stat-row" style={{marginBottom:12}}>
                <Stat label="Fotos de rosto" value={rostos.fotos}/>
                <Stat label="Rostos prontos" value={rostos.rostos_prontos}/>
                <Stat label="Pendentes" value={rostos.pendentes} danger={rostos.pendentes>0}/>
              </div>
            )}
            {rostos&&!rostos.disponivel&&(
              <div className="err-msg">Reconhecimento facial indisponível neste servidor: {rostos.erro||'motor não carregado'}</div>
            )}
          </div>
          {showNovoFunc&&<ModalNovoFunc onClose={()=>setShowNovoFunc(false)} onSave={criarFunc}/>}
        </div>
      )}


      {page==='devices'&&(
        <div className="page">
          <section className="board">
            <div className="board-bar">
              <div>
                <h2 className="board-title">Dispositivos remotos</h2>
                <Ajuda titulo="Dispositivos remotos"
                  resumo="Link que transforma um celular em câmera do sistema.">
                  <p>Cada link gerado aqui abre uma página no celular que começa a transmitir
                  a câmera do aparelho para o Argos. O celular vira mais uma câmera na tela
                  de Câmeras, com análise de EPI igual às outras.</p>
                  <ul>
                    <li>Abra o link no próprio celular — ele já tenta começar sozinho.</li>
                    <li>Deixe a tela do celular ligada enquanto estiver transmitindo.</li>
                    <li>Um link por aparelho: assim dá para saber qual celular é qual e
                    remover o acesso de um sem derrubar os outros.</li>
                  </ul>
                  <p>{CAM_SHARE_BASE
                    ? 'Este link é permanente: ele aponta para o site fixo e encontra o servidor sozinho, mesmo depois de o servidor reiniciar.'
                    : 'Atenção: sem endereço fixo configurado, o link usa o túnel temporário e para de funcionar quando o servidor reinicia.'}</p>
                  <p>Remover um dispositivo derruba a transmissão dele na hora.</p>
                </Ajuda>
              </div>
              <button className="btn btn-primary btn-sm" onClick={addToken}>+ Gerar link de acesso</button>
            </div>
            <div className="board-body light">
              {camTokens.length===0&&(
                <div className="empty">
                  <div className="empty-ico" aria-hidden="true">📱</div>
                  <div className="empty-title">Nenhum dispositivo gerado</div>
                  <div className="empty-sub">Crie um link de acesso e abra no celular para usá-lo como câmera.</div>
                </div>
              )}
              <div className="device-list">
                {camTokens.map(t=>(
                  <div key={t.token} className="device-row">
                    <div style={{minWidth:0}}>
                      <div className="device-name">{t.nome}</div>
                      <div className="device-token">{t.token}</div>
                    </div>
                    <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                      <button className="btn btn-secondary btn-sm" onClick={()=>copyURL(buildCamLink(t.token,{nodeId,fallback:cfURL||flURL||backendUrl}))}>🔗 Copiar link</button>
                      <button className="btn btn-danger btn-sm" onClick={()=>delToken(t.token)}>✕ Remover</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>
        </div>
      )}

      {page==='config'&&(
        <div className="page">
          <div className="panel">
            <h2>Configurações</h2>
            <div className="pref-lista">
              <div className="pref">
                <div className="pref-txt">
                  <div className="pref-nome">🎨 Aparência{' '}
                    <Ajuda titulo="Aparência do sistema"
                      resumo="Claro, escuro, ou igual ao que o computador já usa.">
                      <ul>
                        <li><strong>Padrão do sistema</strong> — segue o computador ou o celular.
                        Se o aparelho vira escuro à noite, o Argos vira junto.</li>
                        <li><strong>Claro</strong> — sempre claro, mesmo que o aparelho esteja escuro.</li>
                        <li><strong>Escuro</strong> — sempre escuro. Cansa menos a vista em sala
                        com pouca luz.</li>
                      </ul>
                      <p>A escolha fica guardada neste navegador e não muda nada para os
                      outros usuários.</p>
                      <p>Com o <strong>modo projetor</strong> ligado o sistema usa sempre o tema
                      claro: projeção lava cor escura e o escuro fica ilegível na parede.</p>
                    </Ajuda>
                  </div>
                </div>
                <div className="temas" role="group" aria-label="Aparência">
                  {[{id:'sistema',ic:'🖥️',txt:'Padrão'},
                    {id:'claro',ic:'☀️',txt:'Claro'},
                    {id:'escuro',ic:'🌙',txt:'Escuro'}].map(t=>(
                    <button key={t.id} type="button" className={"tema-btn"+(tema===t.id?' ativo':'')}
                      aria-pressed={tema===t.id} onClick={()=>setTema(t.id)}>
                      <span aria-hidden="true">{t.ic}</span>{t.txt}
                    </button>
                  ))}
                </div>
              </div>
              {modoProjetor&&tema!=='claro'&&(
                <div className="pref-aviso">O modo projetor está ligado, então a tela fica clara
                  mesmo com "{tema==='escuro'?'Escuro':'Padrão'}" escolhido. Desligue o projetor
                  para o tema voltar a valer.</div>
              )}
              <div className="pref">
                <div className="pref-txt">
                  <div className="pref-nome">📽️ Modo projetor{' '}
                    <Ajuda titulo="Modo projetor"
                      resumo="Letras e avisos maiores, para a tela ser lida de longe na parede.">
                      <p>Projetor lava a cor e come traço fino: cinza-claro some no branco,
                      borda de 1px desaparece e o amarelo dourado puxa para mostarda.</p>
                      <p>Com o modo ligado o sistema aumenta o corpo do texto, escurece as
                      tintas, engrossa as bordas e tira o laranja do amarelo — sem mudar a
                      identidade do Argos.</p>
                      <p>Ele também força o tema claro, porque tela escura projetada
                      praticamente some na parede.</p>
                      <p>No celular ele se desliga sozinho: ali só atrapalharia.</p>
                    </Ajuda>
                  </div>
                </div>
                <label className="switch">
                  <input type="checkbox" checked={modoProjetor} onChange={e=>setModoProjetor(e.target.checked)}/>
                  <span className="switch-trilho"/><span className="switch-bolha"/>
                  <span className="switch-txt">{modoProjetor?'Ligado':'Desligado'}</span>
                </label>
              </div>
              <div className="pref">
                <div className="pref-txt">
                  <div className="pref-nome">🔊 Alarme sonoro{' '}
                    <Ajuda titulo="Alarme sonoro"
                      resumo="Toca um aviso quando alguém aparece sem o EPI obrigatório.">
                      <p>Sempre que uma câmera confirma que alguém está sem um EPI exigido, o
                      computador toca um aviso. Serve para quem não fica olhando a tela o
                      tempo todo.</p>
                      <p>O som só dispara depois que a falta se confirma por alguns segundos,
                      e não a cada quadro — senão viraria um apito contínuo.</p>
                      <p>O botão do alto da tela faz a mesma coisa, para calar o alarme
                      rapidamente sem vir até aqui.</p>
                    </Ajuda>
                  </div>
                </div>
                <label className="switch">
                  <input type="checkbox" checked={alarmeLigado}
                    onChange={e=>{const v=e.target.checked;setAlarmeLigado(v);localStorage.setItem('epi_alarme',v?'1':'0');}}/>
                  <span className="switch-trilho"/><span className="switch-bolha"/>
                  <span className="switch-txt">{alarmeLigado?'Ligado':'Mudo'}</span>
                </label>
              </div>
            </div>
          </div>

          <AreasBoard token={token} backendUrl={backendUrl} onToast={showToast}/>

          <div className="panel">
            <h2>Minha conta</h2>
            <div className="account-list">
              <div>Nome: <strong>{user.nome}</strong></div>
              <div>Email: <strong>{user.email}</strong></div>
              <div>Setor: <strong>{user.setor||'—'}</strong></div>
            </div>
            <button className="btn btn-danger btn-sm" style={{marginTop:12}} onClick={logout}>Sair da conta</button>
          </div>

          <details className="avancado">
            <summary>
              Ajustes técnicos
              <span className="avancado-sub">servidor, modelos de IA e placa de vídeo</span>
            </summary>
            <div className="avancado-corpo">
              <div className="panel" style={{marginTop:20}}>
                <h2>Servidor e processamento</h2>
                <div className="add-panel">
                  <div className="field"><label>Backend URL</label><input value={backendUrl} onChange={e=>{const v=cleanUrl(e.target.value);setBackendUrl(v);setBackendSource('manual');localStorage.setItem('epi_backendUrl',v);}}/></div>
                  <div className="field"><label>Hub / origem</label><button className="btn btn-secondary" onClick={refreshBackendFromHub} disabled={!CONFIG_HUB_URL||resolvingBackend}>{CONFIG_HUB_URL?(resolvingBackend?'Buscando...':'Atualizar via hub'):('Origem: '+backendSource)}</button></div>
                  <div className="field"><label>Modelo padrão (novas câmeras)</label>
                    <select value={defaultModel} onChange={e=>{setDefaultModel(e.target.value);localStorage.setItem('epi_defaultModel',e.target.value);}}>
                      {availableModels.length>0
                        ? availableModels.map(m=>{
                            const label=m.display_name||(m.tipo==='customizado'?'★ '+m.name:m.name);
                            const val=m.name;
                            return <option key={m.name} value={val}>{label} ({m.size_mb}MB)</option>;
                          })
                        : <>
                            <option value="yolo26n.pt">YOLO26 Nano</option>
                            <option value="yolo26s.pt">YOLO26 Small</option>
                          </>
                      }
                    </select>
                  </div>
                  <div className="field"><label>Hardware</label>
                    <select value={device} onChange={e=>{setDevice(e.target.value);localStorage.setItem('epi_device',e.target.value);}}>
                      <option value="auto">Auto</option>
                      <option value="0">GPU NVIDIA</option>
                      <option value="dml">GPU AMD/Intel</option>
                      <option value="cpu">CPU</option>
                    </select>
                  </div>
                </div>
                <p className="hint">Cada câmera roda seu próprio modelo, em uma linha de processamento separada.</p>
              </div>

              <section className="board">
                <div className="board-bar">
                  <div>
                    <h2 className="board-title">Modelos de IA</h2>
                    <p className="page-lead">Envie arquivos .pt, ajuste os EPIs obrigatórios e use o modelo nas câmeras. Ficam só nesta conta.</p>
                  </div>
                  <label className="btn btn-primary btn-sm" style={{cursor:'pointer'}}>
                    {uploadingModel?'Enviando...':'↑ Enviar modelo .pt'}
                    <input type="file" accept=".pt" style={{display:'none'}} disabled={uploadingModel} onChange={e=>{const f=e.target.files&&e.target.files[0]; if(f) uploadModelFile(f); e.target.value='';}}/>
                  </label>
                </div>
                <div className="board-body light">
                  {uploadingModel&&(
                    <div className="upload-progress">
                      <div className="upload-progress-label">Upload do modelo: {uploadPct}%</div>
                      <div className="upload-progress-track"><div className="upload-progress-fill" style={{width:(uploadPct||0)+'%'}}/></div>
                    </div>
                  )}
                  <div className="grid-cards">
                    {availableModels.map(model=><ModelCard key={model.name} model={model} token={token} backendUrl={backendUrl} onRefresh={loadModels} onToast={showToast} onSetDefault={setModelAsDefault} defaultModel={defaultModel}/>)}
                  </div>
                </div>
              </section>

              <div className="panel">
                <h2>Dados da conta</h2>
                <div className="account-list">
                  <div>CPF/CNPJ: <strong>{user.doc}</strong></div>
                  <div>Servidor: <strong>{online?'online':'offline'}</strong>{paused?' · IA pausada':''}</div>
                </div>
              </div>
            </div>
          </details>
        </div>
      )}
        </main>
      </div>

      <footer className="app-footer">
        <span>Argos EPI · IA para segurança do trabalho</span>
        <span>SENAI Lauro de Freitas/BA · TCC Desenvolvimento de Sistemas</span>
      </footer>

      <NetworkCameraModal open={showNetCam} onClose={()=>setShowNetCam(false)} backendUrl={backendUrl} token={token} onUseStream={addDiscoveredStream} onToast={showToast}/>
      {toast&&<div className={toast.type==='ok'?'copied-toast':'err-toast'} onClick={()=>setToast(null)}>{toast.msg}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body></html>
