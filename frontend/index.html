/* Link do celular-câmera. Sem endereço fixo configurado, cai no túnel (como antes).
   Com endereço fixo, o link é permanente e leva o node para a página achar o
   backend pelo hub, mesmo depois de o túnel trocar de endereço. */
function buildCamLink(token,{nodeId,fallback}={}){
  if(!CAM_SHARE_BASE) return `${fallback||''}/cam?token=${encodeURIComponent(token)}&auto=1`;
  const q=new URLSearchParams({token,auto:'1'});
  if(nodeId) q.set('node',nodeId);
  return `${CAM_SHARE_BASE}/cam.html?${q}`;
}

function Icon({n,className}){
  const c=ICONES[n];
  if(!c) return null;
  return <svg className={'ic'+(className?' '+className:'')} viewBox="0 0 24 24" fill="none" stroke="currentColor"
    strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" focusable="false">{c}</svg>;
}

   sobre as pessoas no vídeo), passados de canvas para SVG. Assim o painel e o
   vídeo falam a mesma língua: o capacete da lista é o capacete da imagem. */

  capacete:<><path d="M20 56A30 30 0 0 1 80 56Z"/><rect x="10" y="56" width="80" height="14" rx="7"/><rect x="46" y="22" width="8" height="20" rx="4"/></>,

  colete:<><path d="M20 18h18l12 18 12-18h18l4 70H16z"/><rect x="20" y="56" width="60" height="8" rx="4" fill="#fff" fillOpacity=".6"/></>,
  vestimenta:<path d="M22 16h56l6 26H68l2 46H54l-4-30-4 30H30l2-46H16z"/>,
  protetor_auricular:<><path d="M18.04 41.79A33 33 0 0 1 81.96 41.79" fill="none" stroke="currentColor" strokeWidth="10" strokeLinecap="round"/><rect x="6" y="44" width="22" height="38" rx="10"/><rect x="72" y="44" width="22" height="38" rx="10"/></>,
  protetor_facial:<><rect x="12" y="14" width="76" height="15" rx="7.5"/><path d="M8 31h84v31Q92 88 50 92 8 88 8 62z" fillOpacity=".42"/><path d="m28 40-4 32" fill="none" stroke="currentColor" strokeWidth="5" strokeLinecap="round" strokeOpacity=".85"/></>,
};
// escudo: EPI cadastrado fora da taxonomia
const EPI_ESCUDO=<path d="M50 12 86 26v28Q86 80 50 90 14 80 14 54V26z"/>;
const EPI_ORDEM=['capacete','protetor_facial','oculos','mascara','protetor_auricular','colete','vestimenta','luvas','botas'];
const ordenarEpis=(itens)=>[...(itens||[])].sort((a,b)=>{
  const ia=EPI_ORDEM.indexOf(a), ib=EPI_ORDEM.indexOf(b);
  return (ia<0?99:ia)-(ib<0?99:ib);
});

function EpiGlifo({item}){
  return <svg className="epi-g" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true" focusable="false">{EPI_GLIFOS[item]||EPI_ESCUDO}</svg>;
}
/* Selo de um EPI. estado: 'falta' (vermelho, riscado), 'ok' (verde) ou neutro. */
function EpiSelo({item,estado,sm,rotulo}){
  const nome=rotulo||ArgosStream.itemLabel(item);
  const dica=estado==='falta'?'Sem '+nome.toLowerCase():nome;
  return(
    <span className={'epi-b'+(estado?' '+estado:'')+(sm?' sm':'')} data-dica={dica} role="img" aria-label={dica}>
      <EpiGlifo item={item}/>
    </span>
  );
}
/* Lista de EPIs como <ul>: o leitor de tela anuncia "lista, 3 itens" e o nome de cada um. */
function EpiSelos({itens,estado,sm,max=6,rotulos,titulo}){
  const lista=ordenarEpis(itens);
  if(!lista.length) return null;
  return(
    <ul className="epis" aria-label={titulo||(estado==='falta'?'EPIs faltando':'EPIs')}>

/* EPI cadastrado pelo usuário tem nome livre ("Farda SENAI", "Capacete azul"):
   o nome aponta para o desenho mais próximo da taxonomia. */
function epiDoNome(nome){
  const s=String(nome||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const regras=[
    ['protetor_facial',/facial|viseira/],['protetor_auricular',/auricular|abafador|ouvido|plug/],
    ['capacete',/capacete|helmet/],['colete',/colete|\bvest\b|refletiv/],['luvas',/luva|glove/],
    ['botas',/bota|calcado|sapato|boot/],['oculos',/oculos|goggle|glass/],['mascara',/mascara|respirador|mask/],
    ['vestimenta',/vestimenta|macacao|farda|uniforme|jaleco/],
  ];
  const r=regras.find(([,re])=>re.test(s));
  return r?r[0]:'';
}

/* Janela: <dialog> nativo aberto com showModal(), que já prende o foco,
   escurece o fundo e fecha no Esc. Clique fora (no fundo) também fecha. */
function Janela({titulo,ic,onClose,tamanho,children,fecharFora=true}){
  const ref=useRef(null);
  const idTitulo=useId();
  useEffect(()=>{
    const d=ref.current;
    if(!d||d.open) return;
    try{d.showModal();}catch{d.setAttribute('open','');}
    const alvo=d.querySelector('[data-foco]');
    if(alvo) alvo.focus();
  },[]);
  return(
    <dialog ref={ref} className={"modal"+(tamanho?' '+tamanho:'')} aria-labelledby={idTitulo}
      onCancel={e=>{e.preventDefault();onClose();}}
      // o Esc também é tratado aqui: nem todo navegador dispara o "cancel" do <dialog>
      onKeyDown={e=>{if(e.key==='Escape'){e.preventDefault();onClose();}}}
      onClick={e=>{if(fecharFora&&e.target===e.currentTarget) onClose();}}>
      <div className="modal-corpo">
        <header className="modal-titulo">
          <Icon n={ic}/><h2 id={idTitulo}>{titulo}</h2>
          <button type="button" className="ib sm dica-dir" onClick={onClose} aria-label="Fechar" data-dica="Fechar"><Icon n="x"/></button>
        </header>
        {children}
      </div>
    </dialog>
  );
}

function Aviso({toast,onClose}){

  useEffect(()=>{

    <output ref={ref} popover="manual" className={"toast "+(toast.type==='ok'?'ok':'err')} onClick={onClose}>
      <Icon n={toast.type==='ok'?'check':'alert'}/>{toast.msg}
    </output>
  );
}

/* ═══ PERGUNTAS NA TELA ═══════════════════════════════════════
   No lugar das caixas cinzas do navegador (confirm, prompt, alert), uma janela
   do próprio sistema: ícone, frase curta e botões com o nome da ação.
   Uso: if(!await confirmar({titulo:'Remover a câmera?'})) return;           */
let _abrirPergunta=null;
function _perguntar(opcoes,reserva){
  return new Promise(res=>{
    if(_abrirPergunta) _abrirPergunta({...opcoes,res});
    else res(reserva());   // sem o componente montado (não deve acontecer), cai na caixa do navegador
  });
}
const confirmar=(o)=>_perguntar({tipo:'confirmar',ic:'trash',perigo:true,botao:'Remover',...o},
  ()=>window.confirm([o.titulo,o.texto].filter(Boolean).join('\n')));
const pedirTexto=(o)=>_perguntar({tipo:'texto',ic:'text',botao:'Salvar',...o},
  ()=>window.prompt(o.titulo)||null);
const informar=(o)=>_perguntar({tipo:'info',ic:'check',botao:'Entendi',...o},
  ()=>{window.alert([o.titulo,o.texto].filter(Boolean).join('\n'));return true;});

function Perguntas(){
  const [p,setP]=useState(null);
  const [valor,setValor]=useState('');
  useEffect(()=>{
    _abrirPergunta=(nova)=>{setValor(nova.valor||'');setP(nova);};
    return()=>{_abrirPergunta=null;};
  },[]);
  if(!p) return null;
  const responder=(v)=>{setP(null);p.res(v);};
  const cancelar=()=>responder(p.tipo==='texto'?null:false);
  const ok=()=>{
    if(p.tipo==='texto'){const v=valor.trim();if(!v) return;responder(v);}
    else responder(true);
  };
  return(
    <Janela titulo={p.titulo} ic={p.ic} onClose={cancelar}>
      <form onSubmit={enviar(ok)}>
        {p.texto&&<p className="pergunta-texto">{p.texto}</p>}
        {p.tipo==='texto'&&(
          <Campo ic={p.ic} rotulo={p.titulo}><input value={valor} onChange={e=>setValor(e.target.value)} placeholder={p.placeholder||''} data-foco required/></Campo>
        )}
        <footer className="modal-actions">
          {p.tipo!=='info'&&<button type="button" className="btn btn-secondary" onClick={cancelar}>Cancelar</button>}
          <button type="submit" className={'btn '+(p.perigo&&p.tipo==='confirmar'?'btn-danger':'btn-primary')} data-foco={p.tipo!=='texto'||undefined}>
            <Icon n={p.perigo&&p.tipo==='confirmar'?'trash':'check'}/>{p.botao}
          </button>
        </footer>
      </form>
    </Janela>
  );
}

/* Erro que a pessoa entende. "Failed to fetch" e afins viram "sem conexão". */
function mensagemErro(e,padrao='Algo deu errado. Tente de novo.'){
  const m=String((e&&e.message)||e||'');
  if(/failed to fetch|networkerror|load failed|network request failed/i.test(m))
    return 'Sem conexão com o servidor. Confira a internet e tente de novo.';
  if(/unexpected token|json/i.test(m)) return 'O servidor respondeu de um jeito inesperado. Tente de novo.';
  return m||padrao;
}

async function resolveBackendFromHub({attempts=1,delayMs=1200}={}){
  if(!CONFIG_HUB_URL) return '';
  let lastError='Hub sem backend disponivel';
  for(let i=0;i<attempts;i++){
    try{
      const r=await fetch(CONFIG_HUB_URL+'/nodes',{cache:'no-store',headers:{'ngrok-skip-browser-warning':'true'}});
      const d=await r.json().catch(()=>({}));
      if(r.ok){
        const nodes=Array.isArray(d.nodes)?d.nodes:[];
        const live=(await Promise.all(nodes.map(probeBackendNode))).filter(Boolean);
        live.sort((a,b)=>
          (b.availability-a.availability) ||
          (a.activeStreams-b.activeStreams) ||
          (a.pingMs-b.pingMs)
        );
        if(live[0]) return live[0].url;
        lastError=nodes.length?'Nenhum backend respondeu ao teste de disponibilidade':'Hub sem backend disponivel';
      }else{
        lastError=d.error || lastError;
      }
    }catch(e){
      lastError=e.message || lastError;
    }
    if(i<attempts-1) await sleep(delayMs);
  }
  throw new Error(lastError);
}

async function probeBackendNode(node){
  const url=cleanUrl(node&&node.url);
  if(!url) return null;
  const started=performance.now();
  try{
    const r=await af(url+'/status',{cache:'no-store'});
    if(!r.ok) return null;
    const status=await r.json().catch(()=>({}));
    return {
      url,
      node,
      status,
      availability:Number(status.availability ?? node.availability ?? 0),
      activeStreams:Number(status.active_streams ?? node.active_streams ?? 0),
      pingMs:Math.round(performance.now()-started)
    };
  }catch{
    return null;
  }
}

function AuthScreen({onLogin,backendUrl}){
  const [tab,setTab]=useState('login');

  const [ok,setOk]=useState('');
  const [loading,setLoading]=useState(false);
  const [cred,setCred]=useState('');
  const [senha,setSenha]=useState('');
  const [form,setForm]=useState({nome:'',doc:'',telefone:'',email:'',setor:'',senha:'',confirmar_senha:''});
  const api=backendUrl || INITIAL_API;

  const doLogin=async()=>{
    if(!cred||!senha){setErr('Preencha todos os campos');return;}
    setLoading(true);setErr('');
    try{
      const r=await af(api+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credencial:cred,senha})});
      const d=await r.json();
      if(!r.ok){setErr(d.error||'Erro');setLoading(false);return;}
      onLogin(d.token,d.user);
    }catch(e){setErr(mensagemErro(e));}
    setLoading(false);
  };

  const doCadastro=async()=>{
    if(!form.nome||!form.doc||!form.email||!form.senha){setErr('Preencha nome, CPF/CNPJ, e-mail e senha');return;}
    if(form.senha!==form.confirmar_senha){setErr('Senhas não conferem');return;}
    if(form.senha.length<6){setErr('Senha deve ter ao menos 6 caracteres');return;}
    setLoading(true);setErr('');
    try{
      const r=await af(api+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(form)});
      const d=await r.json();
      if(!r.ok){setErr(d.error||'Erro');setLoading(false);return;}
      setOk('Conta criada! Agora é só entrar.');setTab('login');
    }catch(e){setErr(mensagemErro(e));}
    setLoading(false);
  };

  const sf=(k,v)=>setForm(p=>({...p,[k]:v}));
  const trocar=(t)=>{setTab(t);setErr('');setOk('');};
  return(

      </header>

        <div className="auth-tabs" role="tablist" aria-label="Entrar ou criar conta">
          <button type="button" role="tab" id="aba-login" aria-controls="painel-login" aria-selected={tab==='login'} className={"auth-tab"+(tab==='login'?' active':'')} onClick={()=>trocar('login')}>Entrar</button>
          <button type="button" role="tab" id="aba-cadastro" aria-controls="painel-cadastro" aria-selected={tab==='cadastro'} className={"auth-tab"+(tab==='cadastro'?' active':'')} onClick={()=>trocar('cadastro')}>Criar conta</button>
        </div>
        {err&&<p className="err-msg" role="alert"><Icon n="alert"/>{err}</p>}
        {ok&&<p className="ok-msg" role="status"><Icon n="check"/>{ok}</p>}
        {tab==='login'?(
          <form id="painel-login" role="tabpanel" aria-labelledby="aba-login" onSubmit={enviar(doLogin)}>
            <Campo ic="user" rotulo="CPF, CNPJ ou e-mail"><input value={cred} onChange={e=>setCred(e.target.value)} placeholder="CPF, CNPJ ou e-mail" autoComplete="username"/></Campo>
            <Campo ic="lock" rotulo="Senha"><input type="password" value={senha} onChange={e=>setSenha(e.target.value)} placeholder="Senha" autoComplete="current-password"/></Campo>
            <p className="auth-submit"><button type="submit" className="btn btn-primary" disabled={loading}><Icon n="login"/>{loading?'Entrando...':'Entrar'}</button></p>
          </form>
        ):(
          <form id="painel-cadastro" role="tabpanel" aria-labelledby="aba-cadastro" onSubmit={enviar(doCadastro)}>
            <Campo ic="user" rotulo="Nome completo"><input value={form.nome} onChange={e=>sf('nome',e.target.value)} placeholder="Nome completo" autoComplete="name" required/></Campo>

  const [applying,setApplying]=useState(false);
  const [streamModel,setStreamModel]=useState(()=>localStorage.getItem('epi_sm_'+streamId)||defaultModel||'yolo26n.pt');
  // modo, fps e resolução ficam no servidor: valem para a câmera deste navegador, o celular e as câmeras IP
  const [config,setConfig]=useState({modo:'tempo_real',fps:60,resolucao:720});
  const [net,setNet]=useState(null);
  const [conn,setConn]=useState('');
  const [playStats,setPlayStats]=useState(null);
  const selectedModel=findModelByValue(availableModels,streamModel);
  const videoRef=useRef(null);
  const canvasRef=useRef(null);
  const playerRef=useRef(null);
  const senderRef=useRef(null);
  const streamRef=useRef(null);
  const kindRef=useRef('camera');
  const videoOuterRef=useRef(null);
  const removedRef=useRef(false);
  const lastStatusAt=useRef(0);

  useEffect(()=>{
    if(!localStorage.getItem('epi_sm_'+streamId) && defaultModel && streamModel!==defaultModel){
      setStreamModel(defaultModel);
    }
  },[defaultModel,streamId]);

  useEffect(()=>{
    if(!localStorage.getItem('epi_sm_'+streamId) && status && status.model && streamModel!==status.model){
      setStreamModel(status.model);
    }
  },[status ? status.model : '',streamId]);

  useEffect(()=>{
    localStorage.setItem('epi_source_'+streamId, sourceType);
  },[sourceType,streamId]);
  useEffect(()=>{
    if(camUrl) localStorage.setItem('epi_camurl_'+streamId, camUrl);
    else localStorage.removeItem('epi_camurl_'+streamId);
  },[camUrl,streamId]);

  useEffect(()=>{
    authFetch(backendUrl+'/streams/'+encodeURIComponent(streamId)+'/config',token)
      .then(r=>r.ok?r.json():null).then(d=>{if(d&&d.config) setConfig(d.config);}).catch(()=>{});
  },[streamId,backendUrl,token]);

  // o resultado chega a cada quadro (até 60 por segundo); o painel atualiza 4 vezes por segundo
  const onResult=useCallback(d=>{
    const t=performance.now();
    if(t-lastStatusAt.current<250) return;
    lastStatusAt.current=t;
    setStatus(prev=>({...(prev||{}),...d}));
  },[]);
  const onInfo=useCallback(d=>{
    setInfo(d);
    if(d.config) setConfig(d.config);
    setStatus(prev=>({...(prev||{}),model:d.model,required_labels:d.required_labels,required_items:d.required_items,
      classes:d.classes,pose:d.pose,camera:d.camera}));
  },[]);

  useEffect(()=>{
    const player=new ArgosStream.LivePlayer({
      canvas:canvasRef.current,
      getFrame:seq=>senderRef.current?senderRef.current.frameBlob(seq):null,
      onStats:setPlayStats,
    });
    playerRef.current=player;
    return()=>{player.close();playerRef.current=null;};
  },[]);

  // Streams do servidor (dispositivo remoto, RTSP, HTTP, arquivo): vídeo + resultado pelo WebSocket.
  useEffect(()=>{
    if(usingCam||!playerRef.current) return;
    const viewer=new ArgosStream.LiveViewer({
      backendUrl,token,streamId,player:playerRef.current,onResult,onInfo,
      onStatus:st=>setConn(st),
    });
    viewer.start();
    return()=>{viewer.stop();if(playerRef.current) playerRef.current.clear();setConn('');};
  },[streamId,token,backendUrl,usingCam]);

  const enterFs=()=>{
    const el=videoOuterRef.current;
    if(!el) return;
    if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  };
  const exitFs=()=>{
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
  };

  const stopCam=useCallback(async()=>{
    const sender=senderRef.current;
    senderRef.current=null;
    if(sender){
      sender.stop();
      authFetch(backendUrl+'/streams/stop_external',token,{method:'POST',body:JSON.stringify({stream_id:streamId})}).catch(()=>{});
    }
    if(streamRef.current){streamRef.current.getTracks().forEach(t=>t.stop());streamRef.current=null;}
    if(videoRef.current) videoRef.current.srcObject=null;
    if(playerRef.current) playerRef.current.clear();
    setUsingCam(false);
    setNet(null);
  },[backendUrl,token,streamId]);
  const stopCamRef=useRef(stopCam);
  stopCamRef.current=stopCam;
  useEffect(()=>()=>{stopCamRef.current();},[]);

  const openLocal=async(cfg,kind)=>{
    const stream=await ArgosStream.openCamera({fps:cfg.fps,height:cfg.resolucao,screen:kind==='screen'});
    const v=videoRef.current;
    if(!v){stream.getTracks().forEach(t=>t.stop());return false;}
    const old=streamRef.current;
    streamRef.current=stream;
    v.srcObject=stream;
    v.play().catch(()=>{});
    await new Promise(res=>{
      if(v.readyState>=2) return res();
      v.onloadeddata=res;
      setTimeout(res,2500);
    });
    if(old) old.getTracks().forEach(t=>t.stop());
    return true;
  };

  const startCam=async(kind)=>{
    kindRef.current=kind;
    if(!await openLocal(config,kind)) return;
    const r=await authFetch(backendUrl+'/update',token,{method:'POST',body:JSON.stringify({model:streamModel,device,camera:'webcam',stream_id:streamId,required_items:getModelRequiredItems(selectedModel)})});
    if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'Falha ao iniciar a IA');}
    setUsingCam(true);
    const sender=new ArgosStream.LiveSender({
      video:videoRef.current,backendUrl,token,streamId,
      onResult:d=>{if(playerRef.current) playerRef.current.pushResult(d);onResult(d);},
      onInfo,
      onStats:s=>setNet(s),
      onConfig:(c,old)=>{
        setConfig(c);
        // tela compartilhada não reabre sozinha (o navegador pediria permissão de novo)
        if(kindRef.current!=='screen'&&old&&(old.fps!==c.fps||old.resolucao!==c.resolucao)){
          openLocal(c,kindRef.current).catch(()=>{});
        }
      },
      onStatus:st=>{
        if(st==='removido') stopCamRef.current();
        if(playerRef.current) playerRef.current.setMessage(st==='reconectando'?'Sem conexão · guardando quadros e tentando de novo...':'');
        setConn(st);
      },
    });
    senderRef.current=sender;
    sender.start();
  };

  const apply=async()=>{
    setApplying(true);
    try{
      if(usingCam) await stopCam();
      if(sourceType==='cam'||sourceType==='screen') await startCam(sourceType==='screen'?'screen':'camera');
      else{
        const remoteCamera = sourceType==='remote' ? 'webcam' : camUrl;
        const r=await authFetch(backendUrl+'/update',token,{method:'POST',body:JSON.stringify({model:streamModel,device,camera:remoteCamera,stream_id:streamId,required_items:getModelRequiredItems(selectedModel)})});
        if(!r.ok){const d=await r.json().catch(()=>({}));onToast&&onToast(d.error||'Não foi possível ligar a câmera.','err');}
      }
    }catch(e){
      await stopCam();
      onToast&&onToast('Não foi possível ligar a câmera: '+mensagemErro(e),'err');
    }
    setApplying(false);
  };

  // botão grande de play no vídeo vazio: liga a fonte escolhida; sem endereço, abre os ajustes
  const precisaUrl=sourceType==='rtsp'||sourceType==='http'||sourceType==='file_url';
  const iniciar=()=>{
    if(precisaUrl&&!camUrl.trim()){setAjustes(true);return;}
    apply();
  };

  const changeConfig=async(patch)=>{
    const next={...config,...patch};
    setConfig(next);
    try{
      const r=await authFetch(backendUrl+'/streams/'+encodeURIComponent(streamId)+'/config',token,{method:'POST',body:JSON.stringify(next)});
      if(r.ok){const d=await r.json();if(d.config) setConfig(d.config);}
    }catch{}
  };

  const changeModel=async(newModel)=>{
    manualModelRef.current=true;
    setStreamModel(newModel);
    localStorage.setItem('epi_sm_'+streamId, newModel);
    const modelCfg=getModelRequiredItems(findModelByValue(availableModels,newModel));
    if(usingCam || sourceType==='remote'){
      try{
        await authFetch(backendUrl+'/update',token,{method:'POST',body:JSON.stringify({model:newModel,device,camera:'webcam',stream_id:streamId,required_items:modelCfg})});
      }catch{}
    }
  };

  const handleRemove=()=>{
    removedRef.current=true;
    stopCam();
    onRemove();
  };

  const st=status&&status.status;
  const isPerigo=st==='perigo';
  const isOk=st==='seguro';
  const fallOnly=isPerigo&&!(status.missing||[]).length&&(status.alerts||[]).some(a=>a.includes('queda'));
  // alarme: toca enquanto houver EPI faltando ou queda nesta câmera
  useAlarme(isPerigo,alarmeLigado);
  const estado=isPerigo?'perigo':isOk?'seguro':'espera';
  const estadoIco=isPerigo?'alert':isOk?'shield':st==='verificando'?'search':st==='sem_pessoa'?'user':'hourglass';
  const estadoTxt=isPerigo?(fallOnly?'Possível queda':'Falta EPI'):isOk?'Seguro':st==='verificando'?'Verificando':st==='sem_pessoa'?'Sem pessoas':'Aguardando';
  const persons=(status&&status.persons)||[];
  const exigidos=(status&&status.required_items)||[];
  const pipe=(info&&info.pipeline)||{};
  const connLabel={ws:'WebSocket',http:'HTTP (reserva)',reconectando:'reconectando...',aguardando:'aguardando a câmera',erro:'erro'}[conn]||conn||'—';
  const hasImage=Boolean(playStats&&playStats.fps>0)||Boolean(status&&status.frame_w);
  const cameraDisplay=sourceType==='remote'
    ? 'Celular (link)'
    : (usingCam?(sourceType==='screen'?'Tela deste navegador':'Câmera deste navegador'):maskCameraUrl((status&&status.camera)||camUrl)||'—');

  // Apelido: "Portaria", "Solda 2"... fica no navegador de quem configurou.
  const nome=apelido||('Câmera '+(index+1));
  const fps=Math.round((playStats&&playStats.fps)||0);
  const zonasN=(status&&(status.zonas||[]).length)||0;
  const PESSOAS_VISIVEIS=4;

  // modo lista: uma linha por câmera, sem vídeo
  if(visual==='lista'){
    return(
      <article className={"cam-linha "+estado} aria-labelledby={idTitulo}>
        <span className="estado-ico" role="img" aria-label={estadoTxt} data-dica={estadoTxt}><Icon n={estadoIco}/></span>
        <h2 className="cam-linha-nome" id={idTitulo} title={streamId}>{nome}</h2>
        {isPerigo&&<Faltas status={status} sm/>}
        <span className="pessoas"><Icon n="users"/>{persons.length}<span className="sr"> pessoa(s)</span></span>
        <button type="button" className="ib sm perigo dica-dir" onClick={handleRemove} aria-label={'Remover '+nome} data-dica="Remover"><Icon n="trash"/></button>
      </article>
    );
  }

  return(
    <article className={"cam v-"+visual+" "+estado} aria-labelledby={idTitulo}>
      <header className="cam-topo">
        {/* o nome é editável ali mesmo; o título (para leitor de tela) acompanha */}
        <h2 className="sr" id={idTitulo}>{nome}</h2>
        <label className="sr" htmlFor={idTitulo+'-nome'}>Nome da câmera</label>
        <input id={idTitulo+'-nome'} className="cam-nome" value={nome}
          onChange={e=>setApelido(e.target.value)}
          onFocus={e=>e.target.select()}/>
        {usingCam&&<button type="button" className="ib sm perigo" onClick={stopCam} aria-label="Parar câmera" data-dica="Parar"><Icon n="stop"/></button>}
        <button type="button" className={"ib sm"+(ajustes?' ativo':'')} onClick={()=>setAjustes(v=>!v)}
          aria-expanded={ajustes} aria-controls={idAjustes} aria-label="Ajustes da câmera" data-dica="Ajustes"><Icon n="sliders"/></button>
        <button type="button" className="ib sm perigo" onClick={handleRemove} aria-label="Remover câmera" data-dica="Remover"><Icon n="trash"/></button>
      </header>
      <figure className="cam-video" ref={videoOuterRef} aria-label={'Vídeo ao vivo: '+nome}>
        <video ref={videoRef} className="video-live" autoPlay playsInline muted style={{display:usingCam?'block':'none'}}/>
        <canvas ref={canvasRef} className="video-overlay" aria-hidden="true"/>
        {!hasImage&&!usingCam&&(
          <div className="sem-sinal">
            {sourceType==='remote'
              ? <><Icon n="phone"/><span>{conn==='aguardando'?'Aguardando o celular':'Aguardando...'}</span></>
              : <button type="button" className="play-grande" onClick={iniciar} disabled={applying} aria-label="Ligar câmera" data-dica="Ligar"><Icon n="play"/></button>}
          </div>
        )}
        {(hasImage||usingCam)&&<span className="fps"><Icon n={MODO_ICONE[config.modo]||'zap'}/>{fps} fps{pipe.atraso_ms!=null?` · ${(pipe.atraso_ms/1000).toFixed(1)} s`:''}</span>}
        <button type="button" className="ib sm tela-cheia dica-dir" onClick={enterFs} aria-label="Tela cheia" data-dica="Tela cheia"><Icon n="maximize"/></button>
        <button type="button" className="btn btn-sm sair-fs" onClick={exitFs}><Icon n="x"/>Sair</button>
      </figure>
      <div className={"cam-status "+estado}>
        <strong className="estado" role="status"><Icon n={estadoIco}/>{estadoTxt}</strong>
        {isPerigo&&<Faltas status={status} sm={visual==='pequeno'}/>}
        <span className="pessoas dica-cima dica-dir" data-dica="Pessoas na cena"><Icon n="users"/>{persons.length}<span className="sr"> pessoa(s) na cena</span></span>
      </div>
      {visual!=='pequeno'&&persons.length>0&&(
        <ul className="cam-pessoas" aria-label="Pessoas na cena">
          {persons.slice(0,showLongInfo?persons.length:PESSOAS_VISIVEIS).map((p,i)=>{
            const falta=p.faltando||[];
            return(
              <li key={p.track_id!=null?p.track_id:'p'+i} className={"pessoa "+(falta.length?'falta':'ok')}>
                <span className="pessoa-av"><Icon n="user"/></span>
                <span className="pessoa-nome">{p.nome||(p.track_id!=null?`Pessoa ${p.track_id}`:'Pessoa')}</span>
                {falta.length>0?<EpiSelos itens={falta} estado="falta" sm max={4}/>:<><Icon n="check"/><span className="sr">com todos os EPIs</span></>}
              </li>
            );
          })}
          {persons.length>PESSOAS_VISIVEIS&&(
            <li>
              <button type="button" className="chip" onClick={()=>setShowLongInfo(v=>!v)} aria-expanded={showLongInfo}>
                {showLongInfo?'Menos':'+'+(persons.length-PESSOAS_VISIVEIS)}
              </button>
            </li>
          )}
        </ul>
      )}

      {ajustes&&(
        <section className="cam-ajustes" id={idAjustes} aria-label={'Ajustes de '+nome}>
          <form className="aj-linha" onSubmit={enviar(apply)}>
            <label className="aj-rot" data-dica="Fonte do vídeo" htmlFor={idAjustes+'-fonte'}><Icon n="video"/><span className="sr">Fonte do vídeo</span></label>
            <select id={idAjustes+'-fonte'} value={sourceType} onChange={e=>setSourceType(e.target.value)} disabled={usingCam}>
              {FONTES.map(f=><option key={f.id} value={f.id}>{f.txt}</option>)}
            </select>
            {precisaUrl&&
              <input className="inline-input" type="url" value={camUrl} onChange={e=>setCamUrl(e.target.value)} placeholder={sourceType==='rtsp'?'rtsp://...':'http://...'} aria-label="Endereço da câmera"/>
            }
            <button type="submit" className="btn btn-primary btn-sm" disabled={applying}>
              <Icon n={usingCam?'refresh':'play'}/>{applying?'...':usingCam?'Reiniciar':'Ligar'}
            </button>
          </form>
          <div className="aj-linha">
            <label className="aj-rot" data-dica="Modelo de IA" htmlFor={idAjustes+'-modelo'}><Icon n="chip"/><span className="sr">Modelo de IA</span></label>
            <select id={idAjustes+'-modelo'} value={streamModel} onChange={e=>changeModel(e.target.value)} style={{maxWidth:240}}>
              {availableModels.length>0
                ? availableModels.map(m=>{
                    const label=m.display_name||(m.tipo==='customizado'?'★ '+m.name:m.name);
                    return <option key={m.name} value={m.name}>{label} ({m.size_mb}MB)</option>;
                  })
                : <>
                    <option value="yolo26n.pt">YOLO26 Nano</option>
                    <option value="yolo26s.pt">YOLO26 Small</option>
                  </>
              }
            </select>
          </div>
          <div className="aj-linha">
            <Opcoes rotulo="Modo de análise" valor={config.modo} onChange={k=>changeConfig({modo:k})}
              opcoes={Object.entries(ArgosStream.MODES).map(([k,m])=>({id:k,txt:m.nome,ic:MODO_ICONE[k]||'zap',dica:m.descricao}))}/>
            <select value={config.fps} onChange={e=>changeConfig({fps:Number(e.target.value)})} aria-label="Quadros por segundo">
              {ArgosStream.FPS_OPTIONS.map(f=><option key={f} value={f}>{f} fps</option>)}
            </select>
            <select value={config.resolucao} onChange={e=>changeConfig({resolucao:Number(e.target.value)})} aria-label="Resolução">
              {ArgosStream.RES_OPTIONS.map(r=><option key={r} value={r}>{r}p</option>)}
            </select>
          </div>
          <div className="aj-linha">
            <button type="button" className="btn btn-secondary btn-sm" onClick={()=>setShowZonas(true)}><Icon n="map"/>Áreas{zonasN>0?` (${zonasN})`:''}</button>
            {exigidos.length>0&&<EpiSelos itens={exigidos} sm max={9} titulo="EPIs exigidos"/>}
          </div>
          <ul className="diag" aria-label="Diagnóstico">
            <li className="chip" title={cameraDisplay}><Icon n="video"/>{cameraDisplay}</li>
            <li className={"chip"+(conn==='reconectando'?' alerta':'')}><Icon n="wifi"/>{connLabel}</li>
            {pipe.atraso_ms!=null&&<li className="chip"><Icon n="clock"/>{pipe.atraso_ms} ms</li>}
            {pipe.fps_analise!=null&&<li className="chip" title="IA analisa / servidor recebe (quadros por segundo)"><Icon n="chip"/>{pipe.fps_analise}/{pipe.fps_entrada} q/s</li>}
            {pipe.sem_sinal&&<li className="chip alerta"><Icon n="video-off"/>sem sinal</li>}
            {usingCam&&net&&<li className="chip" title="Envio desta câmera"><Icon n="upload"/>{net.sentFps.toFixed(0)} q/s · {(net.kbps/1000).toFixed(1)} Mb/s</li>}
            {status&&status.classes&&status.classes.length>0&&<li className="chip" title={status.classes.join(', ')}><Icon n="helmet"/>{status.classes.length} classes</li>}
            {status&&status.pose===false&&<li className="chip">só detector</li>}
          </ul>
        </section>
      )}
      {showZonas&&<ZonaEditor streamId={streamId} token={token} backendUrl={backendUrl}
        onClose={()=>setShowZonas(false)} onToast={onToast}/>}
    </article>
  );
}

/* ═══ PÁGINA ═════════════════════════════════════════════════
   Cada tela é uma <section> com um <h1> no cabeçalho: ícone, nome, total e ações. */
function Pagina({ic,titulo,total,acoes,children}){
  const id=useId();
  return(
    <section className="page" aria-labelledby={id}>
      <header className="cabeca">
        <span className="cabeca-ico"><Icon n={ic}/></span>
        <h1 id={id}>{titulo}</h1>
        {total!=null&&<span className="contador"><span className="sr">Total: </span>{total}</span>}
        {acoes&&<div className="cabeca-acoes">{acoes}</div>}
      </header>
      {children}
    </section>
  );
}

/* ═══ EPI CARD ═══════════════════════════════════════════════ */
function EpiCard({epi,token,backendUrl,onUpdate,onDelete,onToast,nivel=2}){
  const [uploading,setUploading]=useState(false);
  const [treinando,setTreinando]=useState(false);
  const [importando,setImportando]=useState(false);
  const fileRef=useRef();
  const roboRef=useRef();
  const idTitulo=useId();

  const uploadFoto=async(e)=>{
    const files=[...e.target.files];
    if(!files.length) return;
    setUploading(true);
    for(const file of files){
      const fd=new FormData();
      fd.append('foto',file);
      await authFetchForm(backendUrl+'/epis/'+epi.id+'/fotos',token,fd).catch(()=>{});
    }
    setUploading(false);
    e.target.value='';
    onUpdate();
  };

  const deleteFoto=async(fid)=>{
    await authFetch(backendUrl+'/epis/'+epi.id+'/fotos/'+fid,token,{method:'DELETE'}).catch(()=>{});
    onUpdate();
  };

  const importarDataset=async(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    if(!file.name.toLowerCase().endsWith('.zip')){onToast&&onToast('Escolha um arquivo .zip exportado do Roboflow.','err');e.target.value='';return;}
    setImportando(true);
    const fd=new FormData();
    fd.append('dataset',file);
    try{
      const r=await authFetchForm(backendUrl+'/epis/'+epi.id+'/importar_dataset',token,fd);
      const d=await r.json();
      if(r.ok){
        informar({titulo:'Dataset importado',ic:'box',texto:`${d.total} imagens, ${d.anotadas} com marcação feita à mão.`+(d.sem_label?` ${d.sem_label} sem marcação: nelas o EPI vale para a foto inteira.`:'')});
        onUpdate();
      }else{onToast&&onToast(d.error||'Não foi possível importar o arquivo.','err');}
    }catch(e){onToast&&onToast(mensagemErro(e),'err');}
    setImportando(false);
    e.target.value='';
  };

  const treinar=async()=>{
    if(!await confirmar({titulo:`Treinar "${epi.nome}"?`,texto:'O treino roda no servidor e leva alguns minutos. Pode continuar usando o sistema.',ic:'dumbbell',perigo:false,botao:'Treinar'})) return;
    setTreinando(true);
    const r=await authFetch(backendUrl+'/epis/'+epi.id+'/treinar',token,{method:'POST'}).catch(()=>null);
    if(r&&r.status===202) onToast&&onToast('Treino iniciado. O selo fica verde quando terminar.');
    else onToast&&onToast('Não foi possível iniciar o treino.','err');
    setTreinando(false);
    onUpdate();
  };

  const deleteEpi=async()=>{
    if(!await confirmar({titulo:`Remover "${epi.nome}"?`,texto:'As fotos e o modelo treinado deste EPI também serão apagados.'})) return;
    await authFetch(backendUrl+'/epis/'+epi.id,token,{method:'DELETE'}).catch(()=>{});
    onUpdate();
  };

  const fotos=epi.fotos||[];
  const faltam=Math.max(0,5-fotos.length);
  return(
    <article className="card" aria-labelledby={idTitulo}>
      <header className="card-topo">
        <span className="card-ico" style={{background:epi.cor||'var(--brand)'}}><EpiGlifo item={epiDoNome(epi.nome)}/></span>
        <div className="card-txt">
          <Titulo n={nivel} className="card-nome" id={idTitulo}>{epi.nome}</Titulo>
          {epi.descricao&&<p className="card-sub">{epi.descricao}</p>}
        </div>
        {epi.modelo_treinado
          ? <span className="selo ok dica-dir" data-dica="Modelo treinado" role="img" aria-label="Modelo treinado"><Icon n="check"/></span>
          : <span className="selo pendente dica-dir" data-dica="Ainda sem treino" role="img" aria-label="Ainda sem treino"><Icon n="clock"/></span>}
      </header>

      <footer className="card-acoes">

/* ═══ FUNCIONARIO CARD ═══════════════════════════════════════ */
function FuncCard({func,token,backendUrl,onUpdate,onDelete,onToast,nivel=2}){
  const [uploading,setUploading]=useState(false);
  const [verDesempenho,setVerDesempenho]=useState(false);
  const fileRef=useRef();
  const idTitulo=useId();

  const uploadFoto=async(e)=>{
    const files=[...e.target.files];
    if(!files.length) return;
    setUploading(true);
    let enviadas=0;
    for(const file of files){
      const fd=new FormData();
      fd.append('foto',file);
      try{
        const r=await authFetchForm(backendUrl+'/funcionarios/'+func.id+'/fotos',token,fd);
        const d=await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(d.error||('Erro '+r.status));
        enviadas++;
      }catch(err){
        onToast&&onToast('Falha ao enviar "'+file.name+'": '+err.message,'err');
      }
    }
    setUploading(false);
    e.target.value='';
    if(enviadas) onToast&&onToast(enviadas+' foto'+(enviadas>1?'s':'')+' salva'+(enviadas>1?'s':'')+'!');
    onUpdate();
  };

  const deleteFoto=async(fid)=>{
    await authFetch(backendUrl+'/funcionarios/'+func.id+'/fotos/'+fid,token,{method:'DELETE'}).catch(()=>{});
    onUpdate();
  };

  const deleteFunc=async()=>{
    if(!await confirmar({titulo:`Remover ${func.nome}?`,texto:'As fotos do rosto saem do sistema e a pessoa deixa de ser reconhecida nas câmeras.'})) return;
    await authFetch(backendUrl+'/funcionarios/'+func.id,token,{method:'DELETE'}).catch(()=>{});
    onUpdate();
  };

  const fotos=func.fotos_rosto||[];
  const urlFoto=(f)=>backendUrl+'/funcionarios/foto/'+f.id+'?token='+token;
  return(
    <article className="card" aria-labelledby={idTitulo}>
      <header className="card-topo">
        {/* a primeira foto do rosto vira o avatar; sem foto (ou se falhar), ficam as iniciais */}
        <span className="avatar grande" aria-hidden="true">{iniciais(func.nome)}{fotos[0]&&<img src={urlFoto(fotos[0])} alt="" onError={e=>{e.target.style.display='none';}}/>}</span>
        <div className="card-txt">
          <Titulo n={nivel} className="card-nome" id={idTitulo}>{func.nome}</Titulo>
          {(func.cargo||func.matricula)&&<p className="card-sub">{[func.cargo,func.matricula&&('Nº '+func.matricula)].filter(Boolean).join(' · ')}</p>}
        </div>
      </header>
      <ul className="fotos" aria-label="Fotos do rosto">
        {fotos.map((f,i)=>(
          <li key={f.id} className="foto">
            <img src={urlFoto(f)} alt={'Rosto '+(i+1)+' de '+func.nome}/>
            <button type="button" className="foto-del" onClick={()=>deleteFoto(f.id)} aria-label={'Remover foto '+(i+1)}><Icon n="x"/></button>
          </li>
        ))}
        <li>
          <button type="button" className="foto-add" onClick={()=>fileRef.current.click()} aria-label="Adicionar fotos do rosto" data-dica="Fotos do rosto" disabled={uploading}>
            {uploading?<span className="giro"/>:<Icon n="plus"/>}
          </button>
        </li>
      </ul>
      <input ref={fileRef} type="file" accept="image/*" multiple hidden onChange={uploadFoto}/>
      <Progresso atual={fotos.length} meta={3} ic="scan-face" dica="Fotos do rosto (ideal 3)"/>
      <footer className="card-acoes">
        <button type="button" className="btn btn-secondary btn-sm" onClick={()=>setVerDesempenho(true)}><Icon n="chart"/>Desempenho</button>
        <button type="button" className="ib sm perigo dica-dir" onClick={deleteFunc} aria-label={'Remover '+func.nome} data-dica="Remover"><Icon n="trash"/></button>
      </footer>
      {verDesempenho&&<FuncDesempenho func={func} token={token} backendUrl={backendUrl} onClose={()=>setVerDesempenho(false)}/>}
    </article>
  );
}

function ModelCard({model,token,backendUrl,onRefresh,onToast,onSetDefault,defaultModel,nivel=4}){
  const [saving,setSaving]=useState(false);
  const [converting,setConverting]=useState(false);
  const [requiredText,setRequiredText]=useState((model.required_items||[]).join(', '));
  const idTitulo=useId();
  const classes=(model.classes||[]);
  const canConfig=model.configurable!==false;
  const isDefault=defaultModel===model.name;
  const trt=model.tensorrt||{};
  const trtJob=trt.job||{};
  const trtRunning=trtJob.status==='running';
  const trtError=trt.dependency_error||trtJob.error||'';
  const trtStatusText=trt.engine_exists?'engine pronto':(trtRunning?'convertendo...':(trtError?(trt.dependency_error?'dependencia faltando':'erro'):(trt.available?'disponivel':'indisponivel')));
  const trtStatusColor=trt.engine_exists?'var(--ok)':(trtRunning?'var(--wn)':(trtError?'var(--dn)':(trt.available?'var(--wn)':'var(--dn)')));
  const canConvertTensorRT=trt.available&&!converting&&!trtRunning&&!trt.dependency_error;
  const trtButtonText=trt.engine_exists?'Reconverter TensorRT':(converting||trtRunning?'Convertendo...':(trtError&&!trt.dependency_error?'Tentar novamente':(trt.dependency_error?'Dependencia faltando':'Converter TensorRT')));
  useEffect(()=>{
    if(!trtRunning) return;
    const id=setInterval(()=>onRefresh&&onRefresh(),5000);
    return()=>clearInterval(id);
  },[trtRunning,model.name]);
  const saveConfig=async()=>{
    if(!canConfig){onToast&&onToast('Faça login para configurar modelos','err');return;}
    setSaving(true);
    try{
      const required_items=requiredText.split(',').map(x=>x.trim()).filter(Boolean);
      const r=await authFetch(backendUrl+'/models/'+encodeURIComponent(model.name)+'/config',token,{method:'PUT',body:JSON.stringify({required_items,classes:model.classes||[]})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Erro ao salvar');
      onToast&&onToast(model.tipo==='base'?'Cópia da regra salva no seu usuário!':'Configuração salva!');
      onRefresh&&onRefresh();
    }catch(e){onToast&&onToast(mensagemErro(e,'Erro ao salvar'),'err');}
    setSaving(false);
  };
  const removeModel=async()=>{
    if(!model.editable) return;
    if(!await confirmar({titulo:'Remover este modelo?',texto:'Câmeras que usam este modelo passam a usar o modelo padrão.'})) return;
    try{
      const r=await authFetch(backendUrl+'/models/'+encodeURIComponent(model.name),token,{method:'DELETE'});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Erro ao remover');
      onToast&&onToast('Modelo removido!');
      onRefresh&&onRefresh();
    }catch(e){onToast&&onToast(mensagemErro(e,'Erro ao remover'),'err');}
  };
  const convertTensorRT=async()=>{
    setConverting(true);
    try{
      const r=await authFetch(backendUrl+'/models/'+encodeURIComponent(model.name)+'/tensorrt',token,{method:'POST'});
      const d=await r.json();
      if(!r.ok) throw new Error(d.tensorrt?.error||d.error||'Erro ao converter');
      onToast&&onToast('Conversao TensorRT iniciada');
      onRefresh&&onRefresh();
    }catch(e){onToast&&onToast(mensagemErro(e,'Erro ao converter'),'err');}
    setConverting(false);
  };
  const exigidos=requiredText.split(',').map(x=>x.trim()).filter(Boolean);
  return(
    <article className="card" aria-labelledby={idTitulo}>
      <header className="card-topo">
        <span className="card-ico sm"><Icon n="chip"/></span>
        <div className="card-txt">
          <Titulo n={nivel} className="card-nome" id={idTitulo}>{model.display_name||model.name}</Titulo>
          <p className="card-sub" title={classes.join(', ')}>{model.size_mb} MB · {classes.length?classes.length+' classes':'classes não lidas'}</p>
        </div>
        {isDefault&&<span className="selo ok dica-dir" data-dica="Modelo padrão" role="img" aria-label="Modelo padrão"><Icon n="star"/></span>}
      </header>
      <ul className="diag" aria-label="Situação">
        <li className="chip">{model.editable?'meu':'base'}</li>
        {model.user_override&&<li className="chip">minha regra</li>}
        <li className="chip" style={{color:trtStatusColor}}><Icon n="zap"/>TensorRT: {trtStatusText}</li>
      </ul>
      {trtError&&!trtRunning&&<p className="err-msg" style={{margin:0}}><Icon n="alert"/>{trtError}</p>}
      <form className="field" style={{margin:0}} onSubmit={enviar(saveConfig)}>
        <label htmlFor={idTitulo+'-epis'}><Icon n="helmet"/>{model.tipo==='base'?'Minha regra (EPIs)':'EPIs obrigatórios'}</label>
        <input id={idTitulo+'-epis'} value={requiredText} onChange={e=>setRequiredText(e.target.value)} disabled={!canConfig} placeholder="capacete, colete"/>
        {exigidos.length>0&&<EpiSelos itens={exigidos} sm max={9} titulo="EPIs obrigatórios"/>}
      </form>
      <footer className="card-acoes">
        <button type="button" className="btn btn-primary btn-sm" onClick={saveConfig} disabled={!canConfig||saving}><Icon n="check"/>{saving?'Salvando...':'Salvar'}</button>
        <button type="button" className={"ib sm"+(isDefault?' ativo':'')} onClick={()=>onSetDefault&&onSetDefault(model.name)} aria-pressed={isDefault} aria-label="Usar como padrão" data-dica={isDefault?'Modelo padrão':'Usar como padrão'}><Icon n="star"/></button>
        <button type="button" className="ib sm" onClick={convertTensorRT} disabled={!canConvertTensorRT} aria-label={trtButtonText} data-dica={trtButtonText}><Icon n="zap"/></button>
        {model.editable&&<button type="button" className="ib sm perigo dica-dir" onClick={removeModel} aria-label="Remover modelo" data-dica="Remover"><Icon n="trash"/></button>}
      </footer>
    </article>
  );
}

function NetworkCameraModal({open,onClose,backendUrl,token,onUseStream,onToast}){
  const [username,setUsername]=useState(()=>localStorage.getItem('epi_scan_user')||'');
  const [password,setPassword]=useState('');
  const [subnet,setSubnet]=useState('');
  const [jobId,setJobId]=useState('');
  const [job,setJob]=useState(null);
  const [result,setResult]=useState(null);
  const [choices,setChoices]=useState({});
  const [credDevice,setCredDevice]=useState(null);
  const [addedUris,setAddedUris]=useState({});
  const devices=result?.devices||[];
  const streamTotal=devices.reduce((acc,d)=>acc+(d.streams?.length||0),0);
  const loading=job&&job.status==='running';

  const runScan=async(extra={})=>{
    try{
      localStorage.setItem('epi_scan_user',username||'');
      setResult(null);
      setChoices({});
      setJob({status:'running',message:'Iniciando analise em segundo plano'});
      const r=await authFetch(backendUrl+'/cameras/scan/start',token,{method:'POST',body:JSON.stringify({
        username:(extra.username ?? username).trim(),
        password:extra.password ?? password,
        subnet:(extra.subnet ?? subnet).trim(),
        timeout:0.35,
        include_onvif:true
      })});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||'Erro ao iniciar analise');
      setJobId(d.job_id);
      setJob(d.job);
    }catch(e){
      onToast&&onToast(mensagemErro(e,'Erro ao analisar a rede'),'err');
      setJob(null);
    }
  };

  useEffect(()=>{
    if(!open) return;
    if(!jobId) return;
    let alive=true;
    const poll=async()=>{
      try{
        const r=await authFetch(backendUrl+'/cameras/scan/jobs/'+jobId,token,{method:'GET'});
        const d=await r.json().catch(()=>({}));
        if(!alive) return;
        if(!r.ok) throw new Error(d.error||'Erro ao acompanhar analise');
        setJob(d.job);
        if(d.job.status==='done'){
          setResult(d.job.result||{devices:[]});
          setJobId('');
          onToast&&onToast(`${d.job.result?.count||0} camera(s) encontradas`);
        }else if(d.job.status==='error'){
          setJobId('');
          onToast&&onToast(d.job.error||'Erro ao analisar a rede','err');
        }
      }catch(e){
        if(alive){
          setJobId('');
          setJob(null);
          onToast&&onToast(mensagemErro(e,'Erro ao acompanhar analise'),'err');
        }
      }
    };
    poll();
    const iv=setInterval(poll,900);
    return()=>{alive=false;clearInterval(iv);};
  },[open,jobId,backendUrl,token]);

  const streamLabel=(st,i)=>{
    const bits=[st.label||('Stream '+(i+1))];
    if(st.resolution) bits.push(st.resolution);
    bits.push(st.source==='onvif'?'ONVIF':'RTSP sugerido');
    return bits.join(' | ');
  };
  const selectedStreamFor=(dev)=>{
    const streams=dev.streams||[];
    if(!streams.length) return null;
    const idx=Number(choices[dev.ip]||0);
    return streams[Math.max(0,Math.min(idx,streams.length-1))]||streams[0];
  };
  const addDevice=(dev,force=false)=>{
    const st=selectedStreamFor(dev);
    if(!st){
      setCredDevice(dev);
      return;
    }
    if(!force && st.source!=='onvif' && !username.trim() && !String(st.uri||'').includes('@')){
      setCredDevice(dev);
      return;
    }
    onUseStream&&onUseStream({...st,device:dev});
    setAddedUris(p=>({...p,[st.uri]:true}));
  };
  const retryWithCredentials=()=>{
    if(!credDevice) return;
    setCredDevice(null);
    runScan({subnet:credDevice.ip,username,password});
  };

  if(!open) return null;

  return(
    <Janela titulo="Câmeras na rede" ic="wifi" onClose={onClose} tamanho="medio" fecharFora={false}>
      <div className="net-corpo">
        <form className="scan-form" onSubmit={enviar(()=>runScan())} aria-label="Buscar câmeras">
          <Campo ic="user" rotulo="Usuário da câmera"><input value={username} onChange={e=>setUsername(e.target.value)} placeholder="Usuário" autoComplete="off" data-foco/></Campo>
          <Campo ic="lock" rotulo="Senha da câmera"><input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Senha" autoComplete="off"/></Campo>
          <Campo ic="globe" rotulo="Faixa de IP (auto ou 192.168.1.0/24)"><input value={subnet} onChange={e=>setSubnet(e.target.value)} placeholder="Faixa: auto" title="auto ou 192.168.1.0/24"/></Campo>
          <button type="submit" className="btn btn-primary" disabled={loading}><Icon n="search"/>{loading?'Buscando...':'Buscar'}</button>
        </form>
        {loading&&<div className="scan-bar" role="progressbar" aria-label="Buscando câmeras"><span/></div>}
        {result&&(
          <ul className="diag" aria-label="Resultado">
            <li className="chip"><Icon n="camera"/>{devices.length} câmera(s)</li>
            <li className="chip"><Icon n="video"/>{streamTotal} stream(s)</li>
            <li className="chip"><Icon n="globe"/>{(result.networks||[]).join(', ')||'auto'}</li>
          </ul>
        )}
        {!result&&!loading&&<p className="scan-empty"><Icon n="wifi"/>Toque em Buscar</p>}
        {result&&devices.length===0&&<p className="scan-empty"><Icon n="video-off"/>Nenhuma câmera encontrada</p>}
        {devices.length>0&&(
          <ul className="scan-results" aria-label="Câmeras encontradas">
            {devices.map(dev=>{
              const streams=dev.streams||[];
              const selected=selectedStreamFor(dev);
              const selectedUri=selected?.uri||'';
              const alreadyAdded=Boolean(selectedUri&&addedUris[selectedUri]);
              const showCred=credDevice&&credDevice.ip===dev.ip;
              const nomeDev=dev.display_name||('Câmera '+dev.ip);
              return(
                <li key={dev.ip}>
                  <article className={"scan-device"+(showCred?' credential-open':'')} aria-label={nomeDev}>
                    <header className="scan-device-top">
                      <span className="card-ico sm"><Icon n="camera"/></span>
                      <div className="scan-device-main">
                        <h3 className="scan-title" title={nomeDev}>{nomeDev}</h3>
                        <ul className="diag" style={{marginTop:4}}>
                          <li className="chip"><Icon n="globe"/>{dev.ip}</li>
                          {streams.length>1&&<li className="chip">{streams.length} faixas</li>}
                          {(dev.discovery||[]).includes('onvif')&&<li className="chip">ONVIF</li>}
                          {(dev.open_ports||[]).includes(554)&&<li className="chip">RTSP</li>}
                          {alreadyAdded&&<li className="chip bom"><Icon n="check"/>adicionada</li>}
                        </ul>
                      </div>
                    </header>
                    <div className="scan-device-controls">
                      <div style={{minWidth:0}}>
                        {streams.length>0?(
                          <>
                            <select className="scan-select largo" value={choices[dev.ip]||0} onChange={e=>setChoices(p=>({...p,[dev.ip]:e.target.value}))} aria-label={'Stream de '+nomeDev}>
                              {streams.slice(0,24).map((st,i)=><option key={(st.uri||'')+i} value={i}>{streamLabel(st,i)}</option>)}
                            </select>
                            <p className="scan-uri" title={maskCameraUrl(selected?.masked_uri||selected?.uri)}><code>{maskCameraUrl(selected?.masked_uri||selected?.uri)}</code></p>
                          </>
                        ):(
                          <p className="scan-meta"><Icon n="lock"/>Precisa de usuário e senha</p>
                        )}
                      </div>
                      <button type="button" className={alreadyAdded?'btn btn-secondary btn-sm':'btn btn-primary btn-sm'} onClick={()=>addDevice(dev)} disabled={alreadyAdded}>
                        <Icon n={alreadyAdded?'check':streams.length?'plus':'lock'}/>{streams.length?(alreadyAdded?'Adicionada':'Adicionar'):'Senha'}
                      </button>
                    </div>
                    {showCred&&(
                      <form className="inline-cred" onSubmit={enviar(retryWithCredentials)} aria-label={'Usuário e senha de '+dev.ip}>
                        <p className="scan-meta" style={{fontWeight:700}}><Icon n="lock"/>{dev.ip}</p>
                        <div className="scan-form">
                          <Campo ic="user" rotulo="Usuário da câmera"><input value={username} onChange={e=>setUsername(e.target.value)} placeholder="Usuário" autoComplete="off"/></Campo>
                          <Campo ic="lock" rotulo="Senha da câmera"><input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Senha" autoComplete="off"/></Campo>
                          <button type="submit" className="btn btn-primary" disabled={!username.trim()||loading}><Icon n="search"/>Buscar</button>
                          {streams.length>0&&<button type="button" className="btn btn-secondary" onClick={()=>{setCredDevice(null);addDevice(dev,true);}}>Adicionar assim</button>}
                        </div>
                      </form>
                    )}
                  </article>
                </li>
              );
            })}
          </ul>
        )}
      </div>
    </Janela>
  );
}

/* ═══ ANÁLISES DE VÍDEO ═══════════════════════════════════════ */
const JOB_STATUS={recebendo:'Recebendo vídeo',na_fila:'Na fila',processando:'Analisando',revisando:'Revisando',gerando_video:'Gerando vídeo',concluido:'Concluído',erro:'Erro',cancelando:'Cancelando'};
const JOB_ACTIVE=['processando','revisando','gerando_video'];
const JOB_ICONE={recebendo:'upload',na_fila:'clock',processando:'search',revisando:'search',gerando_video:'film',concluido:'check',erro:'alert',cancelando:'x'};
const POSTURA_TXT={em_pe:'Em pé',agachado:'Agachado',curvado:'Curvado',caido:'Caído',desconhecida:'Não identificada'};
const MOV_TXT={parado:'Parado',andando:'Andando',correndo:'Correndo'};
const topEntries=(obj,names)=>Object.entries(obj||{}).filter(([,s])=>s>=0.5).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,s])=>`${names[k]||k} ${Math.round(s)}s`).join(', ')||'—';
const isoDe=(ts)=>{try{return new Date(ts*1000).toISOString();}catch{return undefined;}};

/* Número com rótulo: um par <dt>/<dd> dentro de <dl className="stats">. */
function Stat({ic,label,value,danger}){
  return(
    <div className={"stat"+(danger?' perigo':'')}>
      <dt>{ic&&<Icon n={ic}/>}{label}</dt>
      <dd>{value}</dd>
    </div>
  );
}

          <Stat ic="users" label="Pessoas" value={r.pessoas.length}/>

                      <span className="event-corpo">
                        <span className="event-title">
                          {e.tipo==='possivel_queda'

                        <span className="event-meta">{e.nome||(e.track_id!=null?`Pessoa ${e.track_id}`:'Pessoa')} · {ArgosStream.formatDuration(e.inicio)} → {ArgosStream.formatDuration(e.fim)} ({e.duracao}s)</span>
                      </span>

                    <tr key={p.track_id}>
                      <th scope="row">{p.nome||('#'+p.track_id)}</th>

                      <td>{Object.entries(p.faltando_s||{}).filter(([,s])=>s>=1).map(([k,s])=>(

                      ))}{!Object.values(p.faltando_s||{}).some(s=>s>=1)&&'—'}</td>

            </div>
            {(r.epis_exigidos||[]).length>0&&(
              <div className="aj-linha" style={{marginTop:12}}>
                <span className="aj-rot" data-dica="EPIs exigidos"><Icon n="helmet"/></span>
