        </div>
      </>)}
    </section>
  );
}

function AnalysesPage({token,backendUrl,availableModels,defaultModel,onToast,focusId}){
  const [jobs,setJobs]=useState([]);
  const [selected,setSelected]=useState(focusId||null);
  const [detail,setDetail]=useState(null);
  const [file,setFile]=useState(null);
  const [mode,setMode]=useState('detalhado');
  const [model,setModel]=useState('');
  const [uploadPct,setUploadPct]=useState(null);
  const videoRef=useRef(null);
  const idModelo=useId();
  const fileUrl=(job,rel)=>`${backendUrl}/analises/${job.id}/arquivo/${rel}?token=${encodeURIComponent(token)}`;

  const load=useCallback(async()=>{
    try{const r=await authFetch(backendUrl+'/analises',token);if(r.ok){const d=await r.json();setJobs(d.analises||[]);}}catch{}
  },[backendUrl,token]);
  const loadDetail=useCallback(async(id)=>{
    try{
      const r=await authFetch(backendUrl+'/analises/'+id,token);
      if(r.ok){const d=await r.json();setDetail(d.analise);}
      else if(r.status===404){setSelected(null);setDetail(null);}
    }catch{}
  },[backendUrl,token]);

  const anyActive=jobs.some(j=>!['concluido','erro'].includes(j.status));
  useEffect(()=>{load();},[load]);
  useEffect(()=>{if(focusId) setSelected(focusId);},[focusId]);
  useEffect(()=>{if(selected) loadDetail(selected); else setDetail(null);},[selected,loadDetail]);
  useEffect(()=>{
    if(!anyActive) return;
    const iv=setInterval(()=>{load();if(selected) loadDetail(selected);},2000);
    return()=>clearInterval(iv);
  },[anyActive,selected,load,loadDetail]);

  const send=async()=>{
    if(!file) return;
    setUploadPct(0);
    try{
      const job=await ArgosStream.uploadAnalysisFile({backendUrl,token,file,mode,model,name:file.name,onProgress:p=>setUploadPct(Math.round(p*100))});
      onToast('Vídeo enviado para a fila de análise');
      setFile(null);
      setSelected(job.id);
      load();
    }catch(e){onToast(mensagemErro(e),'err');}
    setUploadPct(null);
  };
  const remove=async(job)=>{
    const running=!['concluido','erro'].includes(job.status);
    if(!await confirmar(running?{titulo:`Cancelar a análise "${job.nome}"?`,botao:'Cancelar análise',ic:'x'}:{titulo:`Remover a análise "${job.nome}"?`,texto:'O vídeo analisado e os alertas dele serão apagados.'})) return;
    await authFetch(backendUrl+'/analises/'+job.id,token,{method:'DELETE'}).catch(()=>{});
    setSelected(null);
    load();
  };
  const seek=(t)=>{
    const v=videoRef.current;
    if(!v) return;
    v.currentTime=Math.max(0,t-1);
    v.play().catch(()=>{});
    v.scrollIntoView({behavior:'smooth',block:'center'});
  };

  return(
    <Pagina ic="film" titulo="Análises" total={jobs.length}>
      <form className="bloco" onSubmit={enviar(send)} aria-label="Enviar vídeo para análise">
        <div className="envio">
          <label className={"arquivo"+(file?' cheio':'')}>
            <Icon n={file?'film':'upload'}/><span>{file?file.name:'Escolher vídeo'}</span>
            <input type="file" accept="video/*" className="sr" onChange={e=>{setFile((e.target.files&&e.target.files[0])||null);e.target.value='';}}/>
          </label>
          <Opcoes rotulo="Modo de análise" valor={mode} onChange={setMode}
            opcoes={[{id:'detalhado',ic:'target',txt:'Detalhado'},{id:'super',ic:'zoom',txt:'Super',dica:'Super detalhado: mais preciso, mais lento'}]}/>
          <label className="aj-rot" data-dica="Modelo de IA" htmlFor={idModelo}><Icon n="chip"/><span className="sr">Modelo de IA</span></label>
          <select id={idModelo} value={model} onChange={e=>setModel(e.target.value)}>
            <option value="">Padrão{defaultModel?` (${defaultModel})`:''}</option>
            {availableModels.map(m=><option key={m.name} value={m.name}>{m.display_name||m.name}</option>)}
          </select>
          <button type="submit" className="btn btn-primary" disabled={!file||uploadPct!==null}><Icon n="upload"/>{uploadPct!==null?`${uploadPct}%`:'Analisar'}</button>
        </div>
        {uploadPct!==null&&<progress className="barra progresso-envio" max={100} value={uploadPct} aria-label="Envio do vídeo">{uploadPct}%</progress>}
      </form>

      {jobs.length===0&&(
        <Vazio ic="film" titulo="Nenhuma análise">
          <Passos itens={[{ic:'target',txt:'Gravar no modo detalhado'},{ic:'upload',txt:'Ou enviar um vídeo'},{ic:'alert',txt:'Ver os alertas'}]}/>
        </Vazio>
      )}
      {jobs.length>0&&(
        <ul className="jobs" aria-label="Vídeos analisados">
          {jobs.map(j=>{
            const pct=Math.round((j.progresso||0)*100);
            const ativo=!['concluido','erro'].includes(j.status);
            return(
              <li key={j.id}>
                <article className={"job"+(selected===j.id?' ativo':'')}>
                  <span className={"job-ico s-"+j.status}><Icon n={JOB_ICONE[j.status]||'clock'}/></span>
                  <div className="job-corpo">
                    <h2 className="job-nome"><button type="button" className="job-abrir" onClick={()=>setSelected(j.id)} aria-pressed={selected===j.id}>{j.nome}</button></h2>
                    <p className="job-meta"><time dateTime={isoDe(j.criado_em)}>{new Date(j.criado_em*1000).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</time> · {JOB_STATUS[j.status]||j.status}{JOB_ACTIVE.includes(j.status)?` ${pct}%`:''}</p>
                    {ativo&&<progress className="barra" max={100} value={pct} aria-label="Progresso">{pct}%</progress>}
                    {j.resumo&&(
                      <ul className="diag" aria-label="Resumo">
                        <li className={"chip"+(j.resumo.eventos>0?' alerta':'')}><Icon n="alert"/>{j.resumo.eventos}<span className="sr"> alerta(s)</span></li>
                        <li className="chip"><Icon n="users"/>{j.resumo.pessoas}<span className="sr"> pessoa(s)</span></li>
                        {j.resumo.percentual_seguro!=null&&<li className="chip"><Icon n="shield"/>{j.resumo.percentual_seguro}%<span className="sr"> do tempo seguro</span></li>}
                      </ul>
                    )}
                  </div>
                </article>
              </li>
            );
          })}
        </ul>
      )}
      {detail&&<AnalysisDetail job={detail} fileUrl={fileUrl} videoRef={videoRef} onSeek={seek} onRemove={()=>remove(detail)}/>}
    </Pagina>
  );
}

/* ═══ ALARME SONORO ══════════════════════════════════════════
   O navegador só libera áudio depois de um gesto do usuário; por isso o
   contexto é criado no primeiro clique/tecla e reaproveitado depois.      */
const Alarme={ctx:null};
function prepararAlarme(){
  if(Alarme.ctx) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  try{ Alarme.ctx=new AC(); }catch(e){}
}
if(typeof document!=='undefined'){
  const libera=()=>{prepararAlarme(); if(Alarme.ctx&&Alarme.ctx.state==='suspended') Alarme.ctx.resume();};
  document.addEventListener('pointerdown',libera);
  document.addEventListener('keydown',libera);
}
function bipAlarme(){
  const ctx=Alarme.ctx;
  if(!ctx||ctx.state!=='running') return;
  // duas notas curtas: lê como alarme, não como notificação
  [0,0.22].forEach((atraso,i)=>{
    const osc=ctx.createOscillator(),g=ctx.createGain();
    const t0=ctx.currentTime+atraso;
    osc.type='square';
    osc.frequency.setValueAtTime(i?760:980,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(0.16,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+0.18);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+0.2);
  });
}
function useAlarme(ativo,ligado){
  useEffect(()=>{
    if(!ativo||!ligado) return;
    bipAlarme();
    const id=setInterval(bipAlarme,2200);
    return ()=>clearInterval(id);
  },[ativo,ligado]);
}

/* ═══ GRÁFICOS ═══════════════════════════════════════════════
   Série única em todos: uma cor só (o azul do sistema). O índice de
   conformidade é estado, então vem com número + ícone + rótulo.
   Cada gráfico é uma lista: o leitor de tela lê "Capacete, 4" em vez de barras. */
function BarrasCategoria({dados,rotulo,valor,vazio,icone}){
  if(!dados||!dados.length) return <p className="graf-vazio">{vazio}</p>;
  const max=Math.max(...dados.map(valor),1);
  return(
    <ul className="barras">
      {dados.map((d,i)=>{
        const v=valor(d);
        return(
          <li key={i} className="barra-linha">
            <span className="barra-rot" title={rotulo(d)}>{icone&&icone(d)}{rotulo(d)}</span>
            <span className="barra-trilho" aria-hidden="true"><span className="barra-preenche" style={{display:'block',width:Math.max(v/max*100,2)+'%'}}/></span>
            <data className="barra-val" value={v}>{v}</data>
          </li>
        );
      })}
    </ul>
  );
}

function ColunasPorDia({dados}){
  if(!dados||!dados.length) return <p className="graf-vazio">Nenhuma violação no período</p>;
  const max=Math.max(...dados.map(d=>d.violacoes),1);
  const dia=(s)=>{const p=String(s||'').split('-');return p.length===3?p[2]+'/'+p[1]:s;};
  return(
    <div>
      <ol className="colunas">
        {dados.map(d=>(
          <li key={d.dia} className="coluna" title={dia(d.dia)+': '+d.violacoes+' violação(ões) · '+Math.round(d.segundos)+'s'}>
            <span className="sr"><time dateTime={d.dia}>{dia(d.dia)}</time>: {d.violacoes} violação(ões)</span>
            {d.violacoes>0&&<span className="coluna-val" aria-hidden="true">{d.violacoes}</span>}
            <span className="coluna-preenche" aria-hidden="true" style={{display:'block',height:Math.max(d.violacoes/max*100,1.5)+'%'}}/>
          </li>
        ))}
      </ol>
      <div className="colunas-eixo" aria-hidden="true">{dados.map(d=><span key={d.dia}>{dia(d.dia)}</span>)}</div>
    </div>
  );
}

function IndiceConformidade({valor,media,semRegistros,dias}){
  // Sem nenhum registro no periodo o indice nao e 100: e desconhecido. Marcar como
  // "boa conformidade" quem o sistema nunca identificou diz o contrario da verdade.
  if(semRegistros){
    return(
      <div className="indice sem-dado">
        <Icon n="scan-face"/>
        <p className="indice-num" aria-hidden="true">—</p>
        <div style={{minWidth:0}}>
          <p className="indice-lbl">Sem registros em {dias} dias</p>
          <p className="indice-sub">Pode ser que as câmeras não tenham reconhecido o rosto.</p>
        </div>
      </div>
    );
  }
  const nivel=valor>=80?'bom':valor>=50?'medio':'ruim';
  const texto={bom:'Boa conformidade',medio:'Atenção',ruim:'Crítico'}[nivel];
  const icone={bom:'shield',medio:'alert',ruim:'alert'}[nivel];
  return(
    <div className={"indice "+nivel}>
      <Icon n={icone}/>
      <p className="indice-num"><data value={valor}>{valor}</data><span className="sr"> de 100</span></p>
      <div style={{minWidth:0}}>
        <p className="indice-lbl">{texto}</p>
        <p className="indice-sub">{media} violação(ões) por dia</p>
      </div>
    </div>
  );
}

/* ═══ FICHA DE DESEMPENHO DO FUNCIONÁRIO ════════════════════ */
function FuncDesempenho({func,token,backendUrl,onClose}){
  const [dados,setDados]=useState(null);
  const [erro,setErro]=useState('');
  const [dias,setDias]=useState(30);

  useEffect(()=>{
    let vivo=true;
    setDados(null);setErro('');
    authFetch(backendUrl+'/funcionarios/'+func.id+'/desempenho?dias='+dias,token)
      .then(r=>r.json().then(d=>{if(!r.ok) throw new Error(d.error||'Erro');return d;}))
      .then(d=>{if(vivo) setDados(d);})
      .catch(e=>{if(vivo) setErro(mensagemErro(e));});
    return ()=>{vivo=false;};
  },[func.id,dias,token,backendUrl]);

  const quando=(ts)=>new Date(ts*1000).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  const dur=(s)=>!s?'—':s<60?Math.round(s)+'s':Math.floor(s/60)+'min '+Math.round(s%60)+'s';
  const urlFoto=(f)=>backendUrl+'/auditoria/evidencia/'+f+'?token='+token;

  return(
    <Janela titulo={func.nome} ic="chart" onClose={onClose} tamanho="largo">
      <Opcoes rotulo="Período" valor={dias} onChange={setDias}
        opcoes={[7,30,90].map(n=>({id:n,ic:'calendar',txt:n+' dias'}))}/>

      {erro&&<p className="err-msg"><Icon n="alert"/>{erro}</p>}
      {!dados&&!erro&&<p className="dica-linha" role="status"><span className="giro"/>Carregando...</p>}

      {dados&&(<>
        <IndiceConformidade valor={dados.indice_conformidade} media={dados.media_por_dia}
          semRegistros={dados.sem_registros} dias={dados.dias}/>

        {dados.nao_atribuidas>0&&(
          <p className="aviso" title="O sistema viu alguém sem EPI, mas não reconheceu o rosto. Cadastre ao menos 3 fotos de rosto de cada funcionário.">
            <Icon n="scan-face"/>
            <span>{dados.nao_atribuidas} violação(ões) sem rosto reconhecido no período</span>
          </p>
        )}

        <dl className="stats">
          <Stat ic="alert" label="Violações" value={dados.total_violacoes} danger={dados.total_violacoes>0}/>
          <Stat ic="clock" label="Tempo sem EPI" value={dur(dados.segundos_em_violacao)}/>
          <Stat ic="calendar" label="Média por dia" value={dados.media_por_dia}/>
        </dl>

        <section className="graf">
          <h3 className="graf-titulo"><Icon n="chart"/>Por dia</h3>
          <ColunasPorDia dados={dados.por_dia}/>
        </section>

        <section className="graf">
          <h3 className="graf-titulo"><Icon n="helmet"/>EPI mais esquecido</h3>
          <BarrasCategoria dados={dados.por_epi} rotulo={d=>d.label||d.epi} valor={d=>d.violacoes}
            icone={d=><EpiSelo item={d.epi} sm rotulo={d.label}/>}
            vazio="Nenhuma violação de EPI"/>
        </section>

        <section className="graf">
          <h3 className="graf-titulo"><Icon n="map"/>Por área</h3>
          <BarrasCategoria dados={dados.por_area} rotulo={d=>d.area} valor={d=>d.violacoes}
            vazio="Nenhuma violação ligada a uma área"/>
        </section>

        <section className="graf">
          <h3 className="graf-titulo"><Icon n="clock"/>Linha do tempo ({(dados.ultimos_eventos||[]).length})</h3>
          {(dados.ultimos_eventos||[]).length===0
            ? <p className="graf-vazio">Nada registrado em {dados.dias} dias</p>
            : <ol className="linha-tempo">
                {dados.ultimos_eventos.map(ev=>(
                  <li key={ev.id} className="evento">
                    <time className="evento-quando" dateTime={isoDe(ev.ts)}>{quando(ev.ts)}</time>
                    <div className="evento-corpo">
                      <p className={"evento-tipo"+(ev.tipo==='queda'?' queda':'')}>
                        {ev.tipo==='queda'
                          ? <><Icon n="alert"/>Possível queda</>
                          : <>{ev.epi&&<EpiSelo item={ev.epi} estado="falta" sm rotulo={ev.epi_label}/>}Sem {String(ev.epi_label||ev.epi||'EPI').toLowerCase()}</>}
                      </p>
                      <ul className="evento-meta">
                        {ev.area_nome&&<li><Icon n="map"/><span className="sr">Área: </span>{ev.area_nome}</li>}
                        {ev.stream_id&&<li><Icon n="camera"/><span className="sr">Câmera: </span>{ev.stream_id}</li>}
                        {ev.duracao?<li><Icon n="clock"/><span className="sr">Duração: </span>{dur(ev.duracao)}</li>:null}
                      </ul>
                      {(ev.fotos||[]).length>0&&(
                        <ul className="evidencias" aria-label="Fotos de evidência">
                          {ev.fotos.map(f=>(
                            <li key={f}>
                              <a href={urlFoto(f)} target="_blank" rel="noopener" title="Abrir evidência em nova aba">
                                <img src={urlFoto(f)} alt="Evidência do momento da violação" onError={e=>{e.target.style.display='none';}}/>
                              </a>
                            </li>
                          ))}
                        </ul>
                      )}
                    </div>
                  </li>
                ))}
              </ol>}
          <p className="dica-linha" style={{marginTop:10}}><Icon n="clock"/>Fotos de evidência somem após 7 dias</p>
        </section>
      </>)}
    </Janela>
  );
}

/* ═══ ÁREAS DE RISCO ═════════════════════════════════════════ */
function AreaCard({area,episDisponiveis,onSalvar,onRemover,nivel=3}){
  const [edit,setEdit]=useState(false);
  const [form,setForm]=useState(area);
  const idTitulo=useId();
  useEffect(()=>{setForm(area);},[area]);
  const toggle=(key)=>setForm(p=>{
    const atuais=p.epis_obrigatorios||[];
    return {...p,epis_obrigatorios:atuais.includes(key)?atuais.filter(k=>k!==key):[...atuais,key]};
  });
  const rotulos=Object.fromEntries(episDisponiveis.map(e=>[e.key,e.label]));
  const exigidos=area.epis_obrigatorios||[];

  return(
    <article className="card area-card" style={{borderLeftColor:area.cor}} aria-labelledby={idTitulo}>
      <header className="card-topo">
        <span className="area-swatch" style={{background:area.cor}}/>
        <Titulo n={nivel} className="card-nome" id={idTitulo} style={{flex:1}}>{area.nome}</Titulo>
        <button type="button" className={"ib sm"+(edit?' ativo':'')} onClick={()=>setEdit(v=>!v)} aria-expanded={edit} aria-label={edit?'Cancelar edição':'Editar área'} data-dica={edit?'Cancelar':'Editar'}><Icon n={edit?'x':'pencil'}/></button>
        <button type="button" className="ib sm perigo dica-dir" onClick={()=>onRemover(area)} aria-label={'Remover '+area.nome} data-dica="Remover"><Icon n="trash"/></button>
      </header>

      {!edit&&(
        exigidos.length
          ? <EpiSelos itens={exigidos} max={9} rotulos={rotulos} titulo="EPIs obrigatórios"/>
          : <p className="area-vazia"><Icon n="bell-off"/>Área livre: sem alarme</p>
      )}

      {edit&&(
        <form onSubmit={enviar(()=>{onSalvar(form);setEdit(false);})}>
          <div className="field-row">
            <Campo ic="text" rotulo="Nome da área"><input value={form.nome} onChange={e=>setForm(p=>({...p,nome:e.target.value}))} required/></Campo>
            <p className="field"><label className="sr" htmlFor={idTitulo+'-cor'}>Cor no vídeo</label><input id={idTitulo+'-cor'} type="color" value={form.cor} onChange={e=>setForm(p=>({...p,cor:e.target.value}))}/></p>
          </div>
          <fieldset className="epi-opcoes">
            <legend className="sr">EPIs obrigatórios nesta área</legend>
            {episDisponiveis.map(e=>{
              const on=(form.epis_obrigatorios||[]).includes(e.key);
              return(
                <label key={e.key} className={"epi-opcao"+(on?' on':'')}>
                  <input type="checkbox" className="sr" checked={on} onChange={()=>toggle(e.key)}/>
                  <span className="epi-b sm"><EpiGlifo item={e.key}/></span>{e.label}
                </label>
              );
            })}
          </fieldset>
          <footer className="modal-actions" style={{marginTop:12}}>
            <button type="submit" className="btn btn-primary btn-sm"><Icon n="check"/>Salvar</button>
          </footer>
        </form>
      )}
    </article>
  );
}

function AreasBoard({token,backendUrl,onToast}){
  const [areas,setAreas]=useState([]);
  const [epis,setEpis]=useState([]);
  const [novo,setNovo]=useState('');
  const idTitulo=useId();

  const carregar=useCallback(()=>{
    authFetch(backendUrl+'/areas',token).then(r=>r.json())
      .then(d=>{setAreas(d.areas||[]);setEpis(d.epis_disponiveis||[]);})
      .catch(()=>{});
  },[token,backendUrl]);
  useEffect(()=>{carregar();},[carregar]);

  const criar=async()=>{
    const nome=novo.trim();
    if(!nome) return;
    try{
      const r=await authFetch(backendUrl+'/areas',token,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({nome})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Erro');
      setNovo('');carregar();onToast&&onToast('Área criada! Escolha os EPIs e desenhe na câmera.');
    }catch(e){onToast&&onToast(mensagemErro(e),'err');}
  };

  const salvar=async(area)=>{
    try{
      const r=await authFetch(backendUrl+'/areas/'+area.id,token,{method:'PUT',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(area)});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Erro');
      carregar();onToast&&onToast('Área salva!');
    }catch(e){onToast&&onToast(mensagemErro(e),'err');}
  };

  const remover=async(area)=>{
    if(!await confirmar({titulo:`Remover a área "${area.nome}"?`,texto:'Os desenhos dela saem de todas as câmeras.'})) return;
    try{
      await authFetch(backendUrl+'/areas/'+area.id,token,{method:'DELETE'});
      carregar();onToast&&onToast('Área removida!');
    }catch(e){onToast&&onToast(mensagemErro(e),'err');}
  };

  return(
    <section className="bloco" aria-labelledby={idTitulo}>
      <header className="bloco-titulo">
        <Icon n="map"/><h2 id={idTitulo}>Áreas de risco</h2>
        <form className="acoes-dir criar-linha" onSubmit={enviar(criar)} aria-label="Nova área">
          <Campo ic="text" rotulo="Nome da nova área"><input value={novo} placeholder="Nova área (ex.: Solda)" onChange={e=>setNovo(e.target.value)}/></Campo>
          <button type="submit" className="btn btn-primary btn-sm" disabled={!novo.trim()}><Icon n="plus"/>Criar</button>
        </form>
      </header>
      {areas.length===0
        ? <div className="vazio">
            <Passos itens={[{ic:'plus',txt:'Criar a área'},{ic:'helmet',txt:'Marcar os EPIs'},{ic:'map',txt:'Desenhar na câmera'}]}/>
          </div>
        : <ul className="cards">
            {areas.map(a=><li key={a.id}><AreaCard area={a} episDisponiveis={epis} onSalvar={salvar} onRemover={remover}/></li>)}
          </ul>}
    </section>
  );
}

/* ═══ EDITOR DE ZONAS (desenha a área sobre o vídeo) ═════════ */
function ZonaEditor({streamId,token,backendUrl,onClose,onToast}){
  const [frame,setFrame]=useState(null);
  const [areas,setAreas]=useState([]);
  const [zonas,setZonas]=useState([]);
  const [areaAtual,setAreaAtual]=useState('');
  const [pontos,setPontos]=useState([]);
  const [salvando,setSalvando]=useState(false);
  const svgRef=useRef();
  const nomeGrupo=useId();

  useEffect(()=>{
    authFetch(backendUrl+'/streams/'+streamId+'/zonas',token).then(r=>r.json())
      .then(d=>{
        setZonas(d.zonas||[]);setAreas(d.areas||[]);
        if((d.areas||[]).length) setAreaAtual(d.areas[0].id);
      }).catch(()=>{});
    authFetch(backendUrl+'/frame?stream='+streamId,token)
      .then(r=>r.status===204?null:r.json())
      .then(d=>{if(d&&d.frame) setFrame('data:image/jpeg;base64,'+d.frame);})
      .catch(()=>{});
  },[streamId,token,backendUrl]);

  const areaPorId=(id)=>areas.find(a=>a.id===id);
  const corDe=(id)=>(areaPorId(id)||{}).cor||'#c81e1e';

  const clique=(e)=>{
    const r=svgRef.current.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
    setPontos(p=>[...p,[Math.min(Math.max(x,0),1),Math.min(Math.max(y,0),1)]]);
  };

  const fecharPoligono=()=>{
    if(pontos.length<3){onToast&&onToast('Marque pelo menos 3 pontos para fechar a área.','err');return;}
    if(!areaAtual){onToast&&onToast('Crie uma área primeiro, em Ajustes.','err');return;}
    setZonas(z=>[...z,{id:'z'+Date.now(),area_id:areaAtual,pontos}]);
    setPontos([]);
  };

  const salvar=async()=>{
    setSalvando(true);
    try{
      const r=await authFetch(backendUrl+'/streams/'+streamId+'/zonas',token,
        {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({zonas})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Erro');
      onToast&&onToast('Áreas mapeadas nesta câmera!');
      onClose();
    }catch(e){onToast&&onToast(mensagemErro(e),'err');}
    setSalvando(false);
  };

  const pathDe=(pts)=>pts.map(p=>(p[0]*100)+','+(p[1]*100)).join(' ');

  return(
    <Janela titulo="Mapear áreas" ic="map" onClose={onClose} tamanho="largo">
      {areas.length===0&&(
        <p className="err-msg"><Icon n="alert"/>Crie as áreas primeiro em Ajustes → Áreas de risco.</p>
      )}

      {frame
        ? <figure className="zona-palco">
            <img src={frame} alt="Imagem atual da câmera"/>
            <svg ref={svgRef} className="zona-svg" viewBox="0 0 100 100" preserveAspectRatio="none" onClick={clique}
              role="img" aria-label={'Desenho das áreas: '+zonas.length+' área(s), '+pontos.length+' ponto(s) no desenho atual'}>
              {zonas.map(z=>(
                <polygon key={z.id} points={pathDe(z.pontos)} fill={corDe(z.area_id)} fillOpacity="0.28"
                  stroke={corDe(z.area_id)} strokeWidth="0.5" vectorEffect="non-scaling-stroke"/>
              ))}
              {pontos.length>1&&(
                <polyline points={pathDe(pontos)} fill="none" stroke={corDe(areaAtual)} strokeWidth="2"
                  strokeDasharray="4 3" vectorEffect="non-scaling-stroke"/>
              )}
              {pontos.map((p,i)=>(
                <circle key={i} cx={p[0]*100} cy={p[1]*100} r="1.1" fill="#fff"
                  stroke={corDe(areaAtual)} strokeWidth="2" vectorEffect="non-scaling-stroke"/>
              ))}
            </svg>
          </figure>
        : <p className="zona-sem-frame"><Icon n="video-off"/>Ligue a câmera e abra de novo</p>}

      {areas.length>0&&(
        <fieldset className="zona-areas">
          <legend className="sr">Área que estou desenhando</legend>
          {areas.map(a=>(
            <label key={a.id} className={"zona-area"+(areaAtual===a.id?' ativo':'')}>
              <input type="radio" className="sr" name={nomeGrupo} checked={areaAtual===a.id} onChange={()=>setAreaAtual(a.id)}/>
              <span className="area-swatch" style={{background:a.cor}}/>{a.nome}
            </label>
          ))}
        </fieldset>
      )}

      <div className="aj-linha">
        <p className="dica-linha"><Icon n="pointer"/>Clique nos cantos · {pontos.length} ponto(s)</p>
        <button type="button" className="btn btn-secondary btn-sm" onClick={fecharPoligono} disabled={pontos.length<3}><Icon n="check"/>Fechar área</button>
        <button type="button" className="ib sm" onClick={()=>setPontos(p=>p.slice(0,-1))} disabled={!pontos.length} aria-label="Desfazer ponto" data-dica="Desfazer"><Icon n="undo"/></button>
      </div>

      {zonas.length>0&&(
        <ul className="zona-legenda" aria-label="Áreas desenhadas nesta câmera">
          {zonas.map(z=>(
            <li key={z.id} className="zona-item">
              <span className="area-swatch" style={{background:corDe(z.area_id)}}/>
              {(areaPorId(z.area_id)||{}).nome||'Área removida'}
              <button type="button" className="ib sm perigo" style={{width:28,height:28}} onClick={()=>setZonas(list=>list.filter(x=>x.id!==z.id))} aria-label="Apagar este desenho"><Icon n="x"/></button>
            </li>
          ))}
        </ul>
      )}

      <footer className="modal-actions">
        <button type="button" className="btn btn-secondary" onClick={onClose}>Cancelar</button>
        <button type="button" className="btn btn-primary" onClick={salvar} disabled={salvando}><Icon n="check"/>{salvando?'Salvando...':'Salvar'}</button>
      </footer>
    </Janela>
  );
}

/* ═══ APP ════════════════════════════════════════════════════ */
const PAGINAS=NAV_ITEMS.map(i=>i.id);
const paginaDoHash=()=>{
  const h=decodeURIComponent(window.location.hash.slice(1));
  return PAGINAS.includes(h)?h:'cameras';
};

function App(){
  const [token,setToken]=useState(()=>localStorage.getItem('epi_token')||'');
  const [user,setUser]=useState(null);
  // a página vem do endereço (#cameras, #epis...): link direto e "voltar" funcionam
  const [page,setPage]=useState(paginaDoHash);
  const [backendUrl,setBackendUrl]=useState(INITIAL_API);
  const [backendSource,setBackendSource]=useState(CONFIG_BACKEND_URL?'fixo':(CONFIG_HUB_URL?'hub':'manual'));
  const [resolvingBackend,setResolvingBackend]=useState(false);
  const [online,setOnline]=useState(false);
  const [streams_list,setStreamsList]=useState([]);
  const [defaultModel,setDefaultModel]=useState(()=>localStorage.getItem('epi_defaultModel')||'yolo26n.pt');
  const [device,setDevice]=useState(()=>localStorage.getItem('epi_device')||'auto');
  const [serverLinks,setServerLinks]=useState({});
  const [toast,setToast]=useState(null);
  const [paused,setPaused]=useState(false);
  // id estavel do backend (vem de /status); vai no link do celular para o hub achar o servidor
  const [nodeId,setNodeId]=useState('');
  // alarme sonoro do monitoramento: fica ligado por padrão e a escolha persiste
  const [alarmeLigado,setAlarmeLigado]=useState(()=>localStorage.getItem('epi_alarme')!=='0');
  // modo projetor: tudo maior e com mais contraste, para a tela ser projetada
  const [modoProjetor,setModoProjetor]=useState(()=>localStorage.getItem('epi_projetor')==='1');
  // tema: 'sistema' (padrão) segue o aparelho; 'claro' e 'escuro' mandam no aparelho
  const [tema,setTema]=useState(()=>localStorage.getItem('epi_tema')||'sistema');
  useEffect(()=>{
    document.documentElement.classList.toggle('modo-projetor',modoProjetor);
    localStorage.setItem('epi_projetor',modoProjetor?'1':'0');
  },[modoProjetor]);
  useEffect(()=>{
    localStorage.setItem('epi_tema',tema);
    // Projetor lava cor escura: enquanto ele está ligado o tema é sempre o claro
    // de alto contraste, independente do que o usuário escolheu aqui.
    const efetivo=modoProjetor?'claro':tema;
    if(efetivo==='sistema') document.documentElement.removeAttribute('data-tema');
    else document.documentElement.setAttribute('data-tema',efetivo);
    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta){
      const escuro=efetivo==='escuro'||(efetivo==='sistema'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
      meta.setAttribute('content',escuro?'#080a1d':'#3740b4');
    }
  },[tema,modoProjetor]);
  useEffect(()=>{
    const aoMudar=()=>{setPage(paginaDoHash());window.scrollTo({top:0});};
    window.addEventListener('hashchange',aoMudar);
    return()=>window.removeEventListener('hashchange',aoMudar);
  },[]);
  const [availableModels,setAvailableModels]=useState([]);
  const [uploadingModel,setUploadingModel]=useState(false);
  const [uploadPct,setUploadPct]=useState(0);
  const [camTokens,setCamTokens]=useState([]);
  const [epis,setEpis]=useState([]);
  const [funcs,setFuncs]=useState([]);
  const [showNovoEpi,setShowNovoEpi]=useState(false);
  const [showNovoFunc,setShowNovoFunc]=useState(false);
  const [showNetCam,setShowNetCam]=useState(false);
  const [treinandoFaces,setTreinandoFaces]=useState(false);
  const [rostos,setRostos]=useState(null);   // situação do reconhecimento facial
  const [analysisFocus,setAnalysisFocus]=useState(null);
  // modo de visualização das câmeras; vazio = decide sozinho pelo número de câmeras
  const [visual,setVisual]=useState(()=>localStorage.getItem('epi_visual')||'');
  const escolherVisual=(v)=>{setVisual(v);localStorage.setItem('epi_visual',v);};
  const nextIndex=useRef(0);
  // FIX remover câmera: conjunto de streams gerenciados localmente
  const managedStreams=useRef(new Set());
  const idServidor=useId();

  const loadTokens=useCallback(async(bUrl,tok)=>{
    try{const r=await fetch((bUrl||INITIAL_API)+'/cam_tokens',{headers:{'Authorization':'Bearer '+(tok||token),'ngrok-skip-browser-warning':'true'}});
    if(r.ok){const d=await r.json();if(d.tokens)setCamTokens(d.tokens);}}catch{}
  },[token]);

  const loadEpis=useCallback(async()=>{
    try{const r=await authFetch(backendUrl+'/epis',token);if(r.ok){const d=await r.json();setEpis(d.epis||[]);}}catch{}
  },[token,backendUrl]);

  const loadFuncs=useCallback(async()=>{
    try{const r=await authFetch(backendUrl+'/funcionarios',token);if(r.ok){const d=await r.json();setFuncs(d.funcionarios||[]);}}catch{}
  },[token,backendUrl]);

  const addToken=async()=>{
    const n=await pedirTexto({titulo:'Novo celular',ic:'phone',placeholder:'Nome (ex.: Celular da portaria)',botao:'Criar link'});if(!n)return;
    try{await authFetch(backendUrl+'/cam_tokens',token,{method:'POST',body:JSON.stringify({nome:n})});loadTokens(backendUrl,token);}catch{}
  };
  const delToken=async(t)=>{
    if(!await confirmar({titulo:'Remover este celular?',texto:'O link para de funcionar e a transmissão dele para na hora.'}))return;
    try{await authFetch(backendUrl+'/cam_tokens/'+t,token,{method:'DELETE'});loadTokens(backendUrl,token);}catch{}
  };

  const showToast=(msg,type='ok')=>{setToast({msg,type});setTimeout(()=>setToast(null),3000);};
  const copyURL=(t)=>{try{navigator.clipboard.writeText(t);}catch{} showToast('Link copiado!');};

  const refreshBackendFromHub=useCallback(async({attempts=6,delayMs=1200}={})=>{
    if(!CONFIG_HUB_URL) return;
    setResolvingBackend(true);
    try{
      const url=await resolveBackendFromHub({attempts,delayMs});
      if(url){
        setBackendUrl(url);
        setBackendSource('hub');
        localStorage.setItem('epi_backendUrl',url);
        showToast('Backend selecionado pelo hub');
      }
    }catch(e){
      showToast(mensagemErro(e,'Hub indisponivel'),'err');
    }
    setResolvingBackend(false);
  },[]);

  useEffect(()=>{
    if(CONFIG_HUB_URL && !backendUrl){
      refreshBackendFromHub({attempts:10,delayMs:1000});
    }
  },[backendUrl,refreshBackendFromHub]);

  const onLogin=(tok,usr)=>{
    setToken(tok);setUser(usr);
    localStorage.setItem('epi_token',tok);
  };

  const logout=()=>{
    authFetch(backendUrl+'/auth/logout',token,{method:'POST'}).catch(()=>{});
    setToken('');setUser(null);localStorage.removeItem('epi_token');
    setStreamsList([]);
    managedStreams.current.clear();
  };

  useEffect(()=>{
    if(!token || !backendUrl) return;
    authFetch(backendUrl+'/auth/me',token).then(r=>r.json()).then(d=>{
      if(d.user){setUser(d.user);loadTokens(backendUrl,token);}
      else{setToken('');localStorage.removeItem('epi_token');}
    }).catch(()=>{});
    authFetch(backendUrl+'/models',token).then(r=>r.json()).then(d=>{
      if(d.models&&d.models.length>0){setAvailableModels(d.models);const serverDefault=(d.models.find(m=>m.is_default)||{}).name;const saved=localStorage.getItem('epi_defaultModel');const pick=serverDefault||saved||d.models[0].name;setDefaultModel(pick);localStorage.setItem('epi_defaultModel',pick);}
    }).catch(()=>{});
  },[token,backendUrl]);

  useEffect(()=>{
    if(!token || !backendUrl) return;
    const iv=setInterval(async()=>{
      try{
        const r=await af(backendUrl+'/status');
        if(r.ok){
          setOnline(true);
          const d=await r.json();if(typeof d.paused==='boolean')setPaused(d.paused);
          if(d.node_id) setNodeId(d.node_id);
        }
        // Sincroniza streams EXTERNOS (criados por cam.html / outros dispositivos)
        // mas NUNCA readiciona streams que o usuário removeu (managedStreams controla isso)
        try{
          const rs=await authFetch(backendUrl+'/streams',token);
          if(rs.ok){
            const ds=await rs.json();
            if(ds.streams){
              setStreamsList(prev=>{
                const localIds=new Set(prev.map(s=>s.streamId));
                const toAdd=ds.streams.filter(s=>{
                  // Só adiciona se: não está na lista local E não foi o usuário que gerenciou (não é do managedStreams)
                  // Streams do managedStreams são gerenciados localmente — não readicionar se foram removidos
                  if(localIds.has(s.stream_id)) return false;
                  // Se começa com "cam_" é stream externo (de cam.html) — sempre mostrar
                  if(s.stream_id.startsWith('cam_')) return true;
                  // Se nunca foi gerenciado localmente, também mostrar (sessão anterior)
                  if(!managedStreams.current.has(s.stream_id)) return true;
                  return false;
                });
                if(toAdd.length===0) return prev;
                const novos=toAdd.map(s=>({streamId:s.stream_id,index:nextIndex.current++}));
                return [...prev,...novos];
              });
            }
          }
        }catch{}
      }catch{setOnline(false);}
    },3000);
    af(backendUrl+'/tunnels').then(r=>r.json()).then(d=>setServerLinks(d)).catch(()=>{});
    const iv2=setInterval(()=>af(backendUrl+'/tunnels').then(r=>r.json()).then(d=>setServerLinks(d)).catch(()=>{}),10000);
    return()=>{clearInterval(iv);clearInterval(iv2);};
  },[token,backendUrl]);

  const loadModels=useCallback(async()=>{
    try{
      const r=await af(backendUrl+'/models',{headers:{'Authorization':'Bearer '+token,'ngrok-skip-browser-warning':'true'}});
      if(r.ok){const d=await r.json();if(d.models){setAvailableModels(d.models);const serverDefault=(d.models.find(m=>m.is_default)||{}).name; if(serverDefault){setDefaultModel(serverDefault);localStorage.setItem('epi_defaultModel',serverDefault);} }}
    }catch{}
  },[token,backendUrl]);

  const setModelAsDefault=async(modelName)=>{
    try{
      const r=await authFetch(backendUrl+'/models/'+encodeURIComponent(modelName)+'/default',token,{method:'POST'});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Erro ao definir padrão');
      localStorage.setItem('epi_defaultModel',modelName);
      setDefaultModel(modelName);
      showToast('Modelo padrão salvo!');
      loadModels();
    }catch(e){showToast(mensagemErro(e,'Erro ao definir padrão'),'err');}
  };

  const go=(p)=>{
    if(window.location.hash==='#'+p) setPage(p);
    else window.location.hash=p;
  };

  const uploadModelFile=async(file)=>{
    if(!file) return;
    if(!String(file.name||'').toLowerCase().endsWith('.pt')){showToast('Envie um arquivo .pt','err');return;}
    setUploadingModel(true);
    setUploadPct(0);
    try{
      const fd=new FormData();
      fd.append('model',file);
      await new Promise((resolve,reject)=>{
        const xhr=new XMLHttpRequest();
        xhr.open('POST', backendUrl+'/models/upload');
        xhr.setRequestHeader('Authorization','Bearer '+token);
        xhr.setRequestHeader('ngrok-skip-browser-warning','true');
        xhr.upload.onprogress=(e)=>{if(e.lengthComputable) setUploadPct(Math.max(1,Math.round((e.loaded/e.total)*100)));};
        xhr.onload=()=>{
          try{
            const d=JSON.parse(xhr.responseText||'{}');
            if(xhr.status>=200&&xhr.status<300) resolve(d);
            else reject(new Error(d.error||'Erro ao enviar modelo'));
          }catch(err){reject(err);}
        };
        xhr.onerror=()=>reject(new Error('Falha no upload do modelo'));
        xhr.send(fd);
      });
      setUploadPct(100);
      await loadModels();
      showToast('Modelo enviado com sucesso!');
      go('config');
    }catch(e){showToast(mensagemErro(e,'Erro ao enviar modelo'),'err');}
    setTimeout(()=>setUploadPct(0),700);
    setUploadingModel(false);
  };

  useEffect(()=>{
    if(token&&page==='epis') loadEpis();
    if(token&&page==='funcionarios'){ loadFuncs(); carregarRostos(); }
    if(token&&page==='devices') loadTokens(backendUrl,token);
    // Recarregar modelos ao abrir qualquer aba (pode ter novos modelos treinados)
    if(token&&page==='cameras') loadModels();
    if(token&&page==='config') loadModels();
    if(token&&page==='analises') loadModels();
  },[page,token]);

  const addStream=()=>{
    const idx=nextIndex.current++;
    const sid=user.id+'_'+idx;
    managedStreams.current.add(sid);
    setStreamsList(p=>[...p,{streamId:sid,index:idx}]);
  };

  const addDiscoveredStream=async(stream)=>{
    const url=String(stream?.uri||'').trim();
    if(!url){showToast('Stream sem URL','err');return;}
    const idx=nextIndex.current++;
    const sid=user.id+'_'+idx;
    const source=url.toLowerCase().startsWith('rtsp://')?'rtsp':'http';
    managedStreams.current.add(sid);
    localStorage.setItem('epi_source_'+sid,source);
    localStorage.setItem('epi_camurl_'+sid,url);
    localStorage.setItem('epi_sm_'+sid,defaultModel);
    setStreamsList(p=>[...p,{streamId:sid,index:idx}]);
    try{
      const modelCfg=getModelRequiredItems(findModelByValue(availableModels,defaultModel));
      const r=await authFetch(backendUrl+'/streams/add',token,{method:'POST',body:JSON.stringify({
        model:defaultModel,
        device,
        camera:url,
        stream_id:sid,
        required_items:modelCfg
      })});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||'Erro ao iniciar stream');
      showToast('Camera adicionada');
    }catch(e){
      showToast(mensagemErro(e,'Camera adicionada; clique em Ligar para iniciar'),'err');
    }
  };

  // FIX remover câmera: remove apenas localmente + avisa o servidor
  const removeStream=async(sid)=>{
    managedStreams.current.delete(sid);
    setStreamsList(p=>p.filter(s=>s.streamId!==sid));
    try{await authFetch(backendUrl+'/streams/remove',token,{method:'POST',body:JSON.stringify({stream_id:sid})});}catch{}
  };

  const togglePause=async()=>{
    try{
      const r=await authFetch(backendUrl+'/pause',token,{method:'POST',body:JSON.stringify({paused:!paused})});
      const d=await r.json();setPaused(d.paused);
    }catch{}
  };

  const criarEpi=async(form)=>{
    setShowNovoEpi(false);
    const r=await authFetch(backendUrl+'/epis',token,{method:'POST',body:JSON.stringify(form)});
    if(r.ok){await loadEpis();showToast('EPI criado!');}
    else showToast('Erro ao criar EPI','err');
  };

  const criarFunc=async(form)=>{
    setShowNovoFunc(false);
    const r=await authFetch(backendUrl+'/funcionarios',token,{method:'POST',body:JSON.stringify(form)});
    if(r.ok){await loadFuncs();showToast('Funcionário cadastrado!');}
    else showToast('Erro ao cadastrar','err');
  };

  const carregarRostos=useCallback(async()=>{
    if(!token||!backendUrl) return;
    try{
      const r=await authFetch(backendUrl+'/funcionarios/reconhecimento/status',token);
      if(r.ok) setRostos(await r.json());
    }catch(e){}
  },[token,backendUrl]);

  // Não há mais treino: o rosto vira um vetor no momento do upload. Este botão
  // só reprocessa fotos que ficaram sem vetor (enviadas antes da mudança, ou
  // quando o modelo de rosto não estava disponível).
  const treinarFaces=async()=>{
    setTreinandoFaces(true);
    try{
      const r=await authFetch(backendUrl+'/funcionarios/reconhecimento/status',token);
      const st=await r.json();
      if(st.pendentes===0){
        showToast('Todos os rostos já estão processados.');
      }else{
        const rr=await authFetch(backendUrl+'/funcionarios/treinar_reconhecimento',token,{method:'POST'});
        const d=await rr.json();
        if(!rr.ok) throw new Error(d.error||'Erro');
        showToast(d.message||'Processando rostos...');
        setTimeout(()=>{carregarRostos();loadFuncs();},4000);
      }
    }catch(e){showToast(mensagemErro(e,'Erro ao processar rostos'),'err');}
    setTreinandoFaces(false);
    carregarRostos();
  };

  const aviso=toast&&<Aviso toast={toast} onClose={()=>setToast(null)}/>;

  if(!backendUrl){
    return(<>
      <main className="auth-wrap">
        <header className="auth-hero">
          <h1 className="auth-hero-marca">
            {LOGO_URL&&<img src={LOGO_URL} alt=""/>}
            <Brand size="xl" logo={false}/>
          </h1>
        </header>
        <section className="auth-box" aria-label="Conexão com o servidor">
          <p className="err-msg" role="status">{resolvingBackend?<span className="giro"/>:<Icon n="server"/>}{resolvingBackend?'Procurando o servidor...':'Servidor não encontrado'}</p>
          {CONFIG_HUB_URL&&<button type="button" className="btn btn-primary btn-full" onClick={()=>refreshBackendFromHub()} disabled={resolvingBackend}><Icon n="refresh"/>{resolvingBackend?'Procurando...':'Procurar de novo'}</button>}
          <div style={{marginTop:16}}><Campo ic="server" rotulo="Endereço do servidor"><input type="url" value={backendUrl} onChange={e=>{const v=cleanUrl(e.target.value);setBackendUrl(v);setBackendSource('manual');localStorage.setItem('epi_backendUrl',v);}} placeholder="Endereço do servidor (https://...)"/></Campo></div>
        </section>
      </main>
      {aviso}
    </>);
  }

  if(!token||!user) return <AuthScreen onLogin={onLogin} backendUrl={backendUrl}/>;

  // Sem escolha do usuário: uma câmera sozinha abre em "grande", várias em "médio".
  const visualAtivo=visual||(streams_list.length<=1?'grande':'medio');

  const flURL=serverLinks.frontend_local||null;
  const cfURL=serverLinks.cloudflare_url;
  const trocarAlarme=(v)=>{setAlarmeLigado(v);localStorage.setItem('epi_alarme',v?'1':'0');};

  return(
    <div className="app">
      <header className="topbar">
        <a className="brand-link" href="#cameras" aria-label="Argos EPI: início"><Brand/></a>
        <div className="topo-dir">
          <span className="rede" role="status" data-dica={online?'Servidor online':'Servidor offline'}>
            <Icon n="server"/><span className={"dot"+(online?' on':'')}/><span className="sr">{online?'Servidor online':'Servidor offline'}</span>
          </span>
          <button type="button" className={"ib"+(alarmeLigado?'':' aceso')} onClick={()=>trocarAlarme(!alarmeLigado)}
            aria-pressed={alarmeLigado} aria-label="Alarme sonoro"
            data-dica={alarmeLigado?'Alarme ligado':'Alarme mudo'}><Icon n={alarmeLigado?'bell':'bell-off'}/></button>
          {online&&<button type="button" className={"ib"+(paused?' aceso':'')} onClick={togglePause}
            aria-label={paused?'Retomar IA':'Pausar IA'} data-dica={paused?'IA pausada: retomar':'Pausar IA'}><Icon n={paused?'play':'pause'}/></button>}
          <abbr className="avatar" title={user.nome}>{iniciais(user.nome)}</abbr>
          <button type="button" className="ib dica-dir" onClick={logout} aria-label="Sair" data-dica="Sair"><Icon n="logout"/></button>
        </div>
      </header>

      <nav className="rail" aria-label="Menu principal">
        <ul className="rail-lista">
          {NAV_ITEMS.map(item=>(
            <li key={item.id}>
              <a href={'#'+item.id} className={"rail-item"+(page===item.id?' ativo':'')}
                aria-current={page===item.id?'page':undefined}>
                <Icon n={item.icon}/><span>{item.label}</span>
              </a>
            </li>
          ))}
        </ul>
      </nav>

      <main className="main">

      {page==='cameras'&&(
        <Pagina ic="camera" titulo="Câmeras" total={streams_list.length} acoes={streams_list.length>0&&<>
          <SeletorVisual valor={visualAtivo} onChange={escolherVisual}/>
          <button type="button" className="btn btn-claro" onClick={()=>setShowNetCam(true)} aria-label="Buscar câmeras na rede"><Icon n="wifi"/><span className="btn-rotulo" aria-hidden="true">Rede</span></button>
          <button type="button" className="btn btn-gold" onClick={addStream} aria-label="Adicionar câmera"><Icon n="plus"/><span className="btn-rotulo" aria-hidden="true">Câmera</span></button>
        </>}>
          {streams_list.length===0&&(
            <Vazio ic="camera" titulo="Nenhuma câmera">
              <p className="acoes">
                <button type="button" className="btn btn-gold" onClick={addStream}><Icon n="plus"/>Câmera</button>
                <button type="button" className="btn btn-claro" onClick={()=>setShowNetCam(true)}><Icon n="wifi"/>Buscar na rede</button>
                <a className="btn btn-claro" href="#devices"><Icon n="phone"/>Usar celular</a>
              </p>
            </Vazio>
          )}
          {streams_list.length>0&&(
            <ul className={"grade v-"+visualAtivo} aria-label="Câmeras">
              {streams_list.map(s=>(
                <li key={s.streamId}>
                  <StreamCard streamId={s.streamId} token={token} backendUrl={backendUrl}
                    availableModels={availableModels} defaultModel={defaultModel} device={device} index={s.index}
                    alarmeLigado={alarmeLigado} onToast={showToast} visual={visualAtivo}
                    onRemove={()=>removeStream(s.streamId)}/>
                </li>
              ))}
            </ul>
          )}
        </Pagina>
      )}

      {page==='analises'&&(
        <AnalysesPage token={token} backendUrl={backendUrl} availableModels={availableModels} defaultModel={defaultModel} onToast={showToast} focusId={analysisFocus}/>
      )}

      {page==='epis'&&(
        <Pagina ic="helmet" titulo="EPIs" total={epis.length} acoes={epis.length>0&&
          <button type="button" className="btn btn-gold" onClick={()=>setShowNovoEpi(true)} aria-label="Adicionar EPI"><Icon n="plus"/><span className="btn-rotulo" aria-hidden="true">EPI</span></button>}>
          {epis.length===0&&(
            <Vazio ic="helmet" titulo="Nenhum EPI">
              <Passos itens={[{ic:'plus',txt:'Criar o EPI'},{ic:'image',txt:'Enviar 5+ fotos'},{ic:'dumbbell',txt:'Treinar'}]}/>
              <p className="acoes"><button type="button" className="btn btn-gold" onClick={()=>setShowNovoEpi(true)}><Icon n="plus"/>EPI</button></p>
            </Vazio>
          )}
          {epis.length>0&&(
            <ul className="cards" aria-label="EPIs cadastrados">
              {epis.map(epi=>(
                <li key={epi.id}>
                  <EpiCard epi={epi} token={token} backendUrl={backendUrl} onUpdate={loadEpis} onDelete={loadEpis} onToast={showToast}/>
                </li>
              ))}
            </ul>
          )}
          {showNovoEpi&&<ModalNovoEpi onClose={()=>setShowNovoEpi(false)} onSave={criarEpi}/>}
        </Pagina>
      )}

      {page==='funcionarios'&&(
        <Pagina ic="users" titulo="Equipe" total={funcs.length} acoes={funcs.length>0&&
          <button type="button" className="btn btn-gold" onClick={()=>setShowNovoFunc(true)} aria-label="Cadastrar funcionário"><Icon n="user-plus"/><span className="btn-rotulo" aria-hidden="true">Funcionário</span></button>}>
          {rostos&&!rostos.disponivel&&(
            <p className="err-msg"><Icon n="scan-face"/>Reconhecimento facial indisponível: {rostos.erro||'motor não carregado'}</p>
          )}
          {rostos&&funcs.length>0&&(
            <section className="bloco" aria-labelledby="titulo-rostos">
              <header className="bloco-titulo">
                <Icon n="scan-face"/><h2 id="titulo-rostos">Reconhecimento facial</h2>
                {rostos.pendentes>0&&(
                  <div className="acoes-dir">
                    <button type="button" className="btn btn-secondary btn-sm" onClick={treinarFaces} disabled={treinandoFaces}
                      title="Recalcula o rosto das fotos que ainda não foram processadas">
                      <Icon n="refresh"/>{treinandoFaces?'Processando...':'Processar'}
                    </button>
                  </div>
                )}
              </header>
              <dl className="stats">
                <Stat ic="image" label="Fotos de rosto" value={rostos.fotos}/>
                <Stat ic="check" label="Prontos" value={rostos.rostos_prontos}/>
                <Stat ic="clock" label="Pendentes" value={rostos.pendentes} danger={rostos.pendentes>0}/>
              </dl>
            </section>
          )}
          {funcs.length===0&&(
            <Vazio ic="users" titulo="Nenhum funcionário">
              <Passos itens={[{ic:'user-plus',txt:'Cadastrar'},{ic:'scan-face',txt:'3 fotos do rosto'},{ic:'camera',txt:'Reconhecido nas câmeras'}]}/>
              <p className="acoes"><button type="button" className="btn btn-gold" onClick={()=>setShowNovoFunc(true)}><Icon n="user-plus"/>Funcionário</button></p>
            </Vazio>
          )}
          {funcs.length>0&&(
            <ul className="cards" aria-label="Funcionários">
              {funcs.map(func=>(
                <li key={func.id}>
                  <FuncCard func={func} token={token} backendUrl={backendUrl} onUpdate={loadFuncs} onDelete={loadFuncs} onToast={showToast}/>
                </li>
              ))}
            </ul>
          )}
          {showNovoFunc&&<ModalNovoFunc onClose={()=>setShowNovoFunc(false)} onSave={criarFunc}/>}
        </Pagina>
      )}


      {page==='devices'&&(
        <Pagina ic="phone" titulo="Dispositivos remotos" total={camTokens.length} acoes={camTokens.length>0&&
          <button type="button" className="btn btn-gold" onClick={addToken} aria-label="Criar link para celular"><Icon n="plus"/><span className="btn-rotulo" aria-hidden="true">Link</span></button>}>
          {camTokens.length===0&&(
            <Vazio ic="phone" titulo="Celular como câmera">
              <Passos itens={[{ic:'link',txt:'Criar o link'},{ic:'phone',txt:'Abrir no celular'},{ic:'camera',txt:'Câmera ao vivo'}]}/>
              <p className="acoes"><button type="button" className="btn btn-gold" onClick={addToken}><Icon n="plus"/>Criar link</button></p>
            </Vazio>
          )}
          {camTokens.length>0&&(
            <ul className="cards" aria-label="Dispositivos com acesso">
              {camTokens.map(t=>(
                <li key={t.token}>
                  <article className="card" aria-label={t.nome}>
                    <header className="card-topo">
                      <span className="card-ico"><Icon n="phone"/></span>
                      <div className="card-txt">
                        <h2 className="card-nome">{t.nome}</h2>
                        <p className="token" title="Código do celular (se o link não abrir, cole no celular)"><Icon n="key"/><code>{t.token}</code></p>
                      </div>
                    </header>
                    <footer className="card-acoes">
                      <button type="button" className="btn btn-primary btn-sm" onClick={()=>copyURL(buildCamLink(t.token,{nodeId,fallback:cfURL||flURL||backendUrl}))}><Icon n="link"/>Copiar link</button>
                      <button type="button" className="ib sm perigo dica-dir" onClick={()=>delToken(t.token)} aria-label={'Remover '+t.nome} data-dica="Remover"><Icon n="trash"/></button>
                    </footer>
                  </article>
                </li>
              ))}
            </ul>
          )}
        </Pagina>
      )}

      {page==='config'&&(
        <Pagina ic="gear" titulo="Ajustes">
          <section className="bloco" aria-labelledby="titulo-preferencias">
            <h2 className="sr" id="titulo-preferencias">Preferências</h2>
            <ul className="pref-lista">
              <li>
                <div className="pref">
                  <span className="pref-ico"><Icon n="palette"/></span>
                  <span className="pref-nome" aria-hidden="true">Tema</span>
                  <Opcoes rotulo="Tema" valor={tema} onChange={setTema}
                    opcoes={[{id:'sistema',ic:'monitor',txt:'Auto'},{id:'claro',ic:'sun',txt:'Claro'},{id:'escuro',ic:'moon',txt:'Escuro'}]}/>
                </div>
              </li>
              <li>
                <label className="pref" title="Letras maiores e mais contraste para projetar na parede">
                  <span className="pref-ico"><Icon n="projector"/></span>
                  <span className="pref-nome">Modo projetor</span>
                  <span className="switch">
                    <input type="checkbox" role="switch" checked={modoProjetor} onChange={e=>setModoProjetor(e.target.checked)}/>
                    <span className="switch-trilho"/><span className="switch-bolha"/>
                  </span>
                </label>
              </li>
              <li>
                <label className="pref" title="Toca um aviso quando alguém aparece sem o EPI obrigatório">
                  <span className="pref-ico"><Icon n={alarmeLigado?'bell':'bell-off'}/></span>
                  <span className="pref-nome">Alarme sonoro</span>
                  <span className="switch">
                    <input type="checkbox" role="switch" checked={alarmeLigado} onChange={e=>trocarAlarme(e.target.checked)}/>
                    <span className="switch-trilho"/><span className="switch-bolha"/>
                  </span>
                </label>
              </li>
            </ul>
            {modoProjetor&&tema!=='claro'&&(
              <p className="pref-aviso"><Icon n="projector"/>Projetor ligado: tema claro fixo</p>
            )}
          </section>

          {/* o link para abrir o sistema em outro aparelho so aparecia no log do servidor */}
          <section className="bloco" aria-labelledby="titulo-acesso">
            <header className="bloco-titulo"><Icon n="globe"/><h2 id="titulo-acesso">Abrir em outro aparelho</h2></header>
            {cfURL
              ? <div className="aj-linha">
                  <code className="chip" style={{fontSize:'.85rem'}}>{cfURL}</code>
                  <button type="button" className="btn btn-primary btn-sm" onClick={()=>copyURL(cfURL)}><Icon n="link"/>Copiar link</button>
                </div>
              : <p className="dica-linha"><Icon n="globe"/>O link aparece aqui quando o servidor estiver publicado na internet.</p>}
            {flURL&&<p className="dica-linha" style={{marginTop:8}}><Icon n="wifi"/>Na mesma rede Wi-Fi: {flURL}</p>}
          </section>

          <AreasBoard token={token} backendUrl={backendUrl} onToast={showToast}/>

          <section className="bloco" aria-labelledby="titulo-conta">
            <h2 className="sr" id="titulo-conta">Minha conta</h2>
            <div className="conta">
              <abbr className="avatar grande" title={user.nome}>{iniciais(user.nome)}</abbr>
              <div className="card-txt">
                <p className="card-nome">{user.nome}</p>
                <p className="card-sub">{user.email}{user.setor?' · '+user.setor:''}</p>
              </div>
              <button type="button" className="btn btn-danger btn-sm" onClick={logout}><Icon n="logout"/>Sair</button>
            </div>
          </section>

          <details className="avancado">
            <summary><Icon n="server"/><h2>Avançado</h2><Icon n="chevron" className="seta"/></summary>
            <div className="avancado-corpo">
              <section className="bloco" aria-labelledby={idServidor}>
                <header className="bloco-titulo"><Icon n="server"/><h3 id={idServidor}>Servidor</h3></header>
                <form className="form-grade" onSubmit={enviar(()=>{})}>
                  <p className="field"><label htmlFor={idServidor+'-url'}><Icon n="globe"/>Endereço</label><input id={idServidor+'-url'} type="url" value={backendUrl} onChange={e=>{const v=cleanUrl(e.target.value);setBackendUrl(v);setBackendSource('manual');localStorage.setItem('epi_backendUrl',v);}}/></p>
                  <p className="field"><span className="field-rot"><Icon n="refresh"/>Hub</span><button type="button" className="btn btn-secondary" onClick={()=>refreshBackendFromHub()} disabled={!CONFIG_HUB_URL||resolvingBackend}><Icon n="refresh"/>{CONFIG_HUB_URL?(resolvingBackend?'Buscando...':'Atualizar via hub'):('Origem: '+backendSource)}</button></p>
                  <p className="field"><label htmlFor={idServidor+'-modelo'}><Icon n="chip"/>Modelo padrão</label>
                    <select id={idServidor+'-modelo'} value={defaultModel} onChange={e=>{setDefaultModel(e.target.value);localStorage.setItem('epi_defaultModel',e.target.value);}}>
                      {availableModels.length>0
                        ? availableModels.map(m=>{
                            const label=m.display_name||(m.tipo==='customizado'?'★ '+m.name:m.name);
                            const val=m.name;
                            return <option key={m.name} value={val}>{label} ({m.size_mb}MB)</option>;
                          })
                        : <>
                            <option value="yolo26n.pt">YOLO26 Nano</option>
                            <option value="yolo26s.pt">YOLO26 Small</option>
                          </>
                      }
                    </select>
                  </p>
                  <p className="field"><label htmlFor={idServidor+'-hw'}><Icon n="gauge"/>Hardware</label>
                    <select id={idServidor+'-hw'} value={device} onChange={e=>{setDevice(e.target.value);localStorage.setItem('epi_device',e.target.value);}}>
                      <option value="auto">Auto</option>
                      <option value="0">GPU NVIDIA</option>
                      <option value="dml">GPU AMD/Intel</option>
                      <option value="cpu">CPU</option>
                    </select>
                  </p>
                </form>
                <ul className="diag" style={{marginTop:12}} aria-label="Situação">
                  <li className={"chip"+(online?' bom':' alerta')}><Icon n="server"/>{online?'online':'offline'}</li>
                  {paused&&<li className="chip alerta"><Icon n="pause"/>IA pausada</li>}
                  <li className="chip"><Icon n="id"/>{user.doc}</li>
                </ul>
              </section>

              <section className="bloco" aria-labelledby="titulo-modelos">
                <header className="bloco-titulo">
                  <Icon n="chip"/><h3 id="titulo-modelos">Modelos de IA</h3>
                  <div className="acoes-dir">
                    <label className="btn btn-primary btn-sm" style={{cursor:'pointer'}}>
                      <Icon n="upload"/>{uploadingModel?'Enviando...':'Enviar .pt'}
                      <input type="file" accept=".pt" className="sr" disabled={uploadingModel} onChange={e=>{const f=e.target.files&&e.target.files[0]; if(f) uploadModelFile(f); e.target.value='';}}/>
                    </label>
                  </div>
                </header>
                {uploadingModel&&(
                  <p className="progresso" style={{marginBottom:12}}>
                    <Icon n="upload"/><progress className="barra" max={100} value={uploadPct||0} aria-label="Envio do modelo">{uploadPct}%</progress><span aria-hidden="true">{uploadPct}%</span>
                  </p>
                )}
                <ul className="cards" aria-label="Modelos disponíveis">
                  {availableModels.map(model=><li key={model.name}><ModelCard model={model} token={token} backendUrl={backendUrl} onRefresh={loadModels} onToast={showToast} onSetDefault={setModelAsDefault} defaultModel={defaultModel}/></li>)}
                </ul>
              </section>
            </div>
          </details>
        </Pagina>
      )}
      </main>
      <footer className="rodape"><small>Argos EPI · SENAI Lauro de Freitas/BA · TCC Desenvolvimento de Sistemas</small></footer>

      <Perguntas/>
      <NetworkCameraModal open={showNetCam} onClose={()=>setShowNetCam(false)} backendUrl={backendUrl} token={token} onUseStream={addDiscoveredStream} onToast={showToast}/>
      {aviso}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body></html>
