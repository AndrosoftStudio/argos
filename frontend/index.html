/* Link do celular-câmera. Sem endereço fixo configurado, cai no túnel (como antes).
   Com endereço fixo, o link é permanente e leva o node para a página achar o
   backend pelo hub, mesmo depois de o túnel trocar de endereço. */
function buildCamLink(token,{nodeId,fallback,conta}={}){
  if(!CAM_SHARE_BASE) return `${fallback||''}/cam?token=${encodeURIComponent(token)}&auto=1`;
  const q=new URLSearchParams({token,auto:'1'});
  if(conta) q.set('conta',conta);
  if(nodeId) q.set('node',nodeId);
  return `${CAM_SHARE_BASE}/cam.html?${q}`;
}
/* Link da TV de avisos (sirene e voz): mesma ideia do link do celular. */
function buildTvLink(token,{fallback,conta}={}){
  if(!CAM_SHARE_BASE) return `${fallback||''}/tv?token=${encodeURIComponent(token)}`;
  const q=new URLSearchParams({token});
  if(conta) q.set('conta',conta);
  return `${CAM_SHARE_BASE}/tv.html?${q}`;
}

// escudo: EPI cadastrado fora da taxonomia
const EPI_ESCUDO=<path d="M50 12 86 26v28Q86 80 50 90 14 80 14 54V26z"/>;
const EPI_ORDEM=['capacete','protetor_facial','oculos','mascara','protetor_auricular','colete','vestimenta','luvas','botas'];
const ordenarEpis=(itens)=>[...(itens||[])].sort((a,b)=>{
  const ia=EPI_ORDEM.indexOf(a), ib=EPI_ORDEM.indexOf(b);
  return (ia<0?99:ia)-(ib<0?99:ib);
});

/* Selo de um EPI. estado: 'falta' (vermelho, riscado), 'ok' (verde) ou neutro. */
function EpiSelo({item,estado,sm,rotulo}){

  const dica=estado==='falta'?'Sem '+nome.toLowerCase():nome;
  return(

/* Lista de EPIs como <ul>: o leitor de tela anuncia "lista, 3 itens" e o nome de cada um. */
function EpiSelos({itens,estado,sm,max=6,rotulos,titulo}){
  const lista=ordenarEpis(itens);
  if(!lista.length) return null;
  return(
    <ul className="epis" aria-label={titulo||(estado==='falta'?'EPIs faltando':'EPIs')}>

      {lista.length>max&&<li className="epi-mais">+{lista.length-max}</li>}

/* Botões de EPI: cada ícone liga ou desliga um EPI. Ligado = fiscalizado (na câmera ou na área).
   São os mesmos desenhos que aparecem sobre as pessoas no vídeo. */
function EpiBotoes({disponiveis,ativos,onToggle,titulo,sm,rotulos,desligado,comNomes}){
  const lista=ordenarEpis(disponiveis);
  if(!lista.length) return null;
  const nomeDe=(k)=>(rotulos&&rotulos[k])||ArgosStream.itemLabel(k);
  const ligados=lista.filter(k=>(ativos||[]).includes(k));
  return(
    <div className="epi-botoes-caixa">
      <div className={"epi-botoes"+(sm?' sm':'')} role="group" aria-label={titulo}>
        {lista.map(k=>{
          const on=ligados.includes(k);
          return(
            <button key={k} type="button" className={"epi-botao"+(on?' on':'')} aria-pressed={on} disabled={desligado}
              onClick={()=>onToggle(k,!on)} aria-label={nomeDe(k)} data-dica={nomeDe(k)+(on?' · fiscalizado':' · desligado')}>
              <EpiGlifo item={k}/>
            </button>

        })}

      {comNomes&&<p className="epi-botoes-nomes">{ligados.length?ligados.map(nomeDe).join(' · '):'Nenhum EPI ligado: sem alarme'}</p>}

/* EPI cadastrado pelo usuário tem nome livre ("Farda SENAI", "Capacete azul"):
   o nome aponta para o desenho mais próximo da taxonomia. */
function epiDoNome(nome){
  const s=String(nome||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const regras=[
    ['protetor_facial',/facial|viseira/],['protetor_auricular',/auricular|abafador|ouvido|plug/],
    ['capacete',/capacete|helmet/],['colete',/colete|\bvest\b|refletiv/],['luvas',/luva|glove/],
    ['botas',/bota|calcado|sapato|boot/],['oculos',/oculos|goggle|glass/],['mascara',/mascara|respirador|mask/],
    ['vestimenta',/vestimenta|macacao|farda|uniforme|jaleco/],
  ];
  const r=regras.find(([,re])=>re.test(s));
  return r?r[0]:'';
}

/* Janela: <dialog> nativo aberto com showModal(), que já prende o foco,
   escurece o fundo e fecha no Esc. Clique fora (no fundo) também fecha. */
function Janela({titulo,ic,onClose,tamanho,children,fecharFora=true}){
  const ref=useRef(null);
  const idTitulo=useId();
  useEffect(()=>{
    const d=ref.current;
    if(!d||d.open) return;
    try{d.showModal();}catch{d.setAttribute('open','');}
    const alvo=d.querySelector('[data-foco]');
    if(alvo) alvo.focus();
  },[]);
  return(
    <dialog ref={ref} className={"modal"+(tamanho?' '+tamanho:'')} aria-labelledby={idTitulo}
      onCancel={e=>{e.preventDefault();onClose();}}
      // o Esc também é tratado aqui: nem todo navegador dispara o "cancel" do <dialog>
      onKeyDown={e=>{if(e.key==='Escape'){e.preventDefault();onClose();}}}
      onClick={e=>{if(fecharFora&&e.target===e.currentTarget) onClose();}}>
      <div className="modal-corpo">
        <header className="modal-titulo">
          <Icon n={ic}/><h2 id={idTitulo}>{titulo}</h2>
          <button type="button" className="ib sm dica-dir" onClick={onClose} aria-label="Fechar" data-dica="Fechar"><Icon n="x"/></button>
        </header>
        {children}
      </div>
    </dialog>
  );
}

/* Aviso rápido: <output> (resultado de uma ação) em popover, para aparecer
   por cima inclusive de uma janela aberta. */
function Aviso({toast,onClose}){
  const ref=useRef(null);
  useEffect(()=>{
    const el=ref.current;
    if(el&&el.showPopover&&!el.matches(':popover-open')){try{el.showPopover();}catch{}}
  });
  return(
    <output ref={ref} popover="manual" className={"toast "+(toast.type==='ok'?'ok':'err')} onClick={onClose}>
      <Icon n={toast.type==='ok'?'check':'alert'}/>{toast.msg}
    </output>
  );
}

/* ═══ PERGUNTAS NA TELA ═══════════════════════════════════════
   No lugar das caixas cinzas do navegador (confirm, prompt, alert), uma janela
   do próprio sistema: ícone, frase curta e botões com o nome da ação.
   Uso: if(!await confirmar({titulo:'Remover a câmera?'})) return;           */
let _abrirPergunta=null;
function _perguntar(opcoes,reserva){
  return new Promise(res=>{
    if(_abrirPergunta) _abrirPergunta({...opcoes,res});
    else res(reserva());   // sem o componente montado (não deve acontecer), cai na caixa do navegador
  });
}
const confirmar=(o)=>_perguntar({tipo:'confirmar',ic:'trash',perigo:true,botao:'Remover',...o},
  ()=>window.confirm([o.titulo,o.texto].filter(Boolean).join('\n')));
const pedirTexto=(o)=>_perguntar({tipo:'texto',ic:'text',botao:'Salvar',...o},
  ()=>window.prompt(o.titulo)||null);
const informar=(o)=>_perguntar({tipo:'info',ic:'check',botao:'Entendi',...o},
  ()=>{window.alert([o.titulo,o.texto].filter(Boolean).join('\n'));return true;});
// 'salvar' | 'descartar' | null (cancelou: continua editando)
const perguntarSalvar=(o={})=>_perguntar({tipo:'salvar',ic:'save',titulo:'Salvar as alterações?',texto:'Você mudou os ajustes e ainda não salvou.',...o},
  ()=>window.confirm('Salvar as alterações?')?'salvar':'descartar');

function Perguntas(){
  const [p,setP]=useState(null);
  const [valor,setValor]=useState('');
  useEffect(()=>{
    _abrirPergunta=(nova)=>{setValor(nova.valor||'');setP(nova);};
    return()=>{_abrirPergunta=null;};
  },[]);
  if(!p) return null;
  const responder=(v)=>{setP(null);p.res(v);};
  const cancelar=()=>responder(p.tipo==='texto'||p.tipo==='salvar'?null:false);
  if(p.tipo==='salvar') return(
    <Janela titulo={p.titulo} ic={p.ic} onClose={cancelar} fecharFora={false}>
      {p.texto&&<p className="pergunta-texto">{p.texto}</p>}
      <footer className="modal-actions">
        <button type="button" className="btn btn-secondary" onClick={cancelar}>Cancelar</button>
        <button type="button" className="btn btn-danger" onClick={()=>responder('descartar')}><Icon n="x"/>Não salvar</button>
        <button type="button" className="btn btn-primary" onClick={()=>responder('salvar')} data-foco><Icon n="check"/>Salvar</button>
      </footer>
    </Janela>
  );
  const ok=()=>{
    if(p.tipo==='texto'){const v=valor.trim();if(!v) return;responder(v);}
    else responder(true);
  };
  return(
    <Janela titulo={p.titulo} ic={p.ic} onClose={cancelar}>
      <form onSubmit={enviar(ok)}>
        {p.texto&&<p className="pergunta-texto">{p.texto}</p>}
        {p.tipo==='texto'&&(
          <Campo ic={p.ic} rotulo={p.titulo}><input value={valor} onChange={e=>setValor(e.target.value)} placeholder={p.placeholder||''} data-foco required/></Campo>
        )}
        <footer className="modal-actions">
          {p.tipo!=='info'&&<button type="button" className="btn btn-secondary" onClick={cancelar}>Cancelar</button>}
          <button type="submit" className={'btn '+(p.perigo&&p.tipo==='confirmar'?'btn-danger':'btn-primary')} data-foco={p.tipo!=='texto'||undefined}>
            <Icon n={p.icBotao||(p.perigo&&p.tipo==='confirmar'?'trash':'check')}/>{p.botao}
          </button>
        </footer>
      </form>
    </Janela>
  );
}

/* Erro que a pessoa entende. "Failed to fetch" e afins viram "sem conexão". */
function mensagemErro(e,padrao='Algo deu errado. Tente de novo.'){
  const m=String((e&&e.message)||e||'');
  if(/failed to fetch|networkerror|load failed|network request failed/i.test(m))
    return 'Sem conexão com o servidor. Confira a internet e tente de novo.';
  if(/unexpected token|json/i.test(m)) return 'O servidor respondeu de um jeito inesperado. Tente de novo.';
  return m||padrao;
}

const maskCameraUrl=(value)=>{

  s=s.replace(/(rtsp:\/\/)([^@/\s]+)@/i,(m,p,cred)=>{
    const user=cred.split(':')[0]||'usuario';
    return p+user+':***@';
  });

/* ═══ CONTA E SERVIDORES ═════════════════════════════════════
   As contas ficam no site (API da Vercel + Supabase). Cada servidor (Docker,
   iniciar.bat ou iniciar.sh) é vinculado a uma conta e só processa para ela;
   o painel pergunta à API quais servidores a conta tem e fala direto com eles. */
const ARGOS_API = cleanUrl(window.ARGOS_API_URL || 'https://argosepi.vercel.app/api');
const RENOVAR_MS = 12*3600*1000;

async function apiSite(caminho,{token,method='GET',body}={}){
  const headers={};
  if(token) headers.Authorization='Bearer '+token;
  if(body!==undefined) headers['Content-Type']='application/json';
  let r;
  try{
    r=await fetch(ARGOS_API+caminho,{method,headers,body:body!==undefined?JSON.stringify(body):undefined,cache:'no-store'});
  }catch{throw new Error('Sem conexão com o site do Argos. Verifique a internet.');}
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(d.error||('Erro '+r.status));e.status=r.status;e.dados=d;throw e;}
  return d;
}

async function entrarComGoogle(){
  if(typeof window.argosGoogleLogin!=='function') throw new Error('O login com o Google ainda está carregando. Tente de novo em instantes.');
  let idToken;
  try{ idToken=await window.argosGoogleLogin(); }
  catch(e){
    const c=String((e&&e.code)||'');
    if(c.includes('popup-closed')||c.includes('cancelled-popup')) return null;
    if(c.includes('unauthorized-domain')) throw new Error('O login com o Google só funciona pelo site (argosepi.vercel.app) ou por localhost. Use CPF/e-mail e senha aqui.');
    if(c.includes('popup-blocked')) throw new Error('O navegador bloqueou a janela do Google. Libere pop-ups para este site.');
    throw new Error('Não foi possível entrar com o Google. Tente de novo.');
  }
  return apiSite('/auth/google',{method:'POST',body:{idToken}});
}

function BotaoGoogle({onLogin,onErro,rotulo='Entrar com Google'}){
  const [carregando,setCarregando]=useState(false);
  const clicar=async()=>{
    setCarregando(true);onErro&&onErro('');
    try{
      const d=await entrarComGoogle();
      if(d) onLogin(d.token,d.user,{novo:d.novo});

/* ── Achar os servidores da conta ───────────────────────────── */
async function sondarServidor(base,esperado,ms=5000){
  base=cleanUrl(base);
  if(!base) return null;
  // página em https (Vercel) não pode chamar http (rede local): o navegador bloqueia
  if(window.location.protocol==='https:'&&base.startsWith('http:')) return null;
  const ctl=new AbortController();
  const t=setTimeout(()=>ctl.abort(),ms);
  const inicio=performance.now();
  try{
    const r=await af(base+'/status',{cache:'no-store',signal:ctl.signal});
    if(!r.ok) return null;
    const st=await r.json().catch(()=>({}));
    // o endereço antigo de um túnel pode ter ido para outro servidor: confere o id
    if(esperado&&st.servidor_id&&st.servidor_id!==esperado) return null;
    return {base,status:st,ping:Math.round(performance.now()-inicio)};
  }catch{return null;}
  finally{clearTimeout(t);}
}

async function localizarServidores(lista){
  const candidatos=(s)=>{
    const urls=[];
    if(LOCAL_BACKEND_ORIGIN) urls.push(LOCAL_BACKEND_ORIGIN);
    urls.push(s.url_local,s.url);
    return [...new Set(urls.filter(Boolean).map(cleanUrl))];
  };
  const achados=await Promise.all((lista||[]).map(async s=>{
    for(const base of candidatos(s)){
      const r=await sondarServidor(base,s.id);
      if(r&&r.status.servidor_id===s.id) return [s.id,r];
    }
    return [s.id,null];
  }));
  return Object.fromEntries(achados);
}

function melhorServidor(lista,alcance){
  const vivos=(lista||[]).filter(s=>alcance[s.id]);
  if(!vivos.length) return null;
  // aberto pelo próprio servidor (localhost ou rede local): fica nele
  const local=vivos.find(s=>alcance[s.id].base===LOCAL_BACKEND_ORIGIN);
  if(local) return local;
  vivos.sort((a,b)=>{
    const sa=alcance[a.id].status, sb=alcance[b.id].status;
    return (Number(sb.availability||0)-Number(sa.availability||0))
      || (Number(sa.active_streams||0)-Number(sb.active_streams||0))
      || (alcance[a.id].ping-alcance[b.id].ping);
  });
  return vivos[0];
}

/* Programa do servidor (Windows/Linux) pronto para baixar. Os arquivos ficam no R2;
   o downloads.json (tamanhos, nomes) vem junto do site e é gerado pelo empacotamento. */
const DOWNLOADS_URL=String(window.ARGOS_DOWNLOADS_URL||'https://pub-6b5befc214654d93bdc0345875151ea0.r2.dev/argosepi-discovery/').replace(/\/?$/,'/');
const PLACAS={nvidia:{txt:'NVIDIA',dica:'GeForce, RTX, Quadro (CUDA)',ic:'zap'},dml:{txt:'AMD ou Intel',dica:'Radeon, Arc, Iris Xe (DirectML)',ic:'chip'},cpu:{txt:'Só o processador',dica:'Qualquer computador',ic:'gauge'}};
function detectarSistema(){
  const p=((navigator.userAgentData&&navigator.userAgentData.platform)||navigator.platform||'')+' '+navigator.userAgent;
  return /linux|x11/i.test(p)&&!/android/i.test(p)?'linux':'windows';
}
function detectarPlaca(){
  try{
    const gl=document.createElement('canvas').getContext('webgl');
    const ext=gl&&gl.getExtension('WEBGL_debug_renderer_info');
    const r=ext?String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)||''):'';
    // "ANGLE (NVIDIA, NVIDIA GeForce RTX 4060 Ti (0x...) Direct3D11 ...)" -> "NVIDIA GeForce RTX 4060 Ti"
    const nome=((r.match(/ANGLE \([^,]+,\s*([^(,]+)/)||[])[1]||r).trim();
    if(/nvidia|geforce|rtx|gtx|quadro/i.test(r)) return {placa:'nvidia',nome};
    if(/radeon|amd|intel.*\b(arc|iris)\b/i.test(r)) return {placa:'dml',nome};
    return {placa:'cpu',nome};
  }catch{return {placa:'cpu',nome:''};}
}
const tamTxt=(b)=>!b?'':b>=1073741824?(b/1073741824).toFixed(1).replace('.',',')+' GB':Math.max(1,Math.round(b/1048576))+' MB';

function BaixarServidor(){
  const [man,setMan]=useState(undefined);
  const [so,setSo]=useState(detectarSistema);
  const detectada=useMemo(detectarPlaca,[]);
  // Linux não tem instalador que pergunte a placa: sugere pela placa deste computador
  const [placaLinux,setPlacaLinux]=useState(detectada.placa==='nvidia'?'nvidia':'cpu');
  const [placaPen,setPlacaPen]=useState(detectada.placa);
  useEffect(()=>{
    let vivo=true;
    fetch('downloads.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(vivo) setMan(j&&j.versao?j:null);}).catch(()=>{if(vivo) setMan(null);});

      const totais=['nvidia','dml','cpu'].map(total).filter(Boolean);
      if(totais.length){
        // um instalador só: ele vê a placa de vídeo do computador, pergunta e baixa o pacote certo
        link=DOWNLOADS_URL+((w.setup||{}).url||'ArgosEPI-Servidor-Setup.exe');
        tamanho=(w.setup||{}).tamanho||0;
        faixa=Math.min(...totais)===Math.max(...totais)?tamTxt(totais[0]):`de ${tamTxt(Math.min(...totais))} a ${tamTxt(Math.max(...totais))}`;
        const pl=prog[placaPen]?placaPen:'cpu';
        pendrive=[{nome:link.split('/').pop(),url:link,onde:''},{nome:'latest.json',url:DOWNLOADS_URL+'latest.json',onde:''},
          ...[w.base,w.midia,(w.motor||{})[pl],(w.nucleo||{})[pl],prog[pl]].filter(Boolean).map(a=>({nome:a.url.split('/').pop(),url:DOWNLOADS_URL+a.url,onde:'win',tam:a.tamanho}))];

    }else{
      const l=(man.linux||{})[placaLinux]||(man.linux||{}).cpu;

      const outra=placaLinux==='nvidia'?'cpu':'nvidia';

  return(

          <p><b>Linux</b>: um pacote .tar.gz por tipo de placa (NVIDIA ou só o processador; AMD/Intel usam o do processador). Depois de baixar: <code>tar -xzf</code> no arquivo, entre na pasta <code>argos-epi-servidor</code> e rode <code>./instalar.sh</code>. Ubuntu, Debian, Mint, Fedora e parecidos (x64, com interface gráfica). Não rode como root.</p>

                    <li>Baixe os arquivos abaixo (no <code>latest.json</code>: botão direito &gt; “Salvar link como”).</li>

                    <li>No outro computador, abra o instalador direto do pendrive.</li>
                  </ol>
                  <ul className="baixar-arquivos">
                    {pendrive.map(a=>(
                      <li key={a.nome}><a href={a.url} download>{a.onde?a.onde+' / ':''}{a.nome}</a>{a.tam?<span> · {tamTxt(a.tam)}</span>:null}</li>
                    ))}
                  </ul>

              )}
              {so==='linux'&&(
                <div className="baixar-linux">
                  <pre><code>{`tar -xzf ${link.split('/').pop()}\ncd argos-epi-servidor && ./instalar.sh`}</code></pre>

          : <p className="aviso"><Icon n="clock"/>O instalador {nomeSo} ainda está sendo publicado. Por enquanto: baixe o projeto em github.com/AndrosoftStudio/argos e rode {so==='linux'?'configurar.sh e iniciar.sh':'configurar.bat e iniciar.bat (ou instalar_docker.bat)'}.</p>}
    </section>
  );
}

const quandoFoi=(ts)=>{
  if(!ts) return 'nunca';
  const s=Math.max(0,Date.now()/1000-ts);
  if(s<90) return 'agora';
  if(s<3600) return `há ${Math.round(s/60)} min`;
  if(s<86400) return `há ${Math.round(s/3600)} h`;
  return new Date(ts*1000).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
};
const gb=(b)=>b?(b/1073741824).toFixed(0)+' GB':'—';

/* Placa de vídeo ou processador: escolhido em cada servidor e guardado nele (dados/hardware.json).
   As câmeras ligadas recarregam no hardware novo sozinhas. */
const NOME_GPU={nvidia:'NVIDIA',dml:'AMD/Intel'};
function HardwareServidor({s,alc,token,onToast}){
  const [hw,setHw]=useState(null);
  const [salvando,setSalvando]=useState(false);
  const base=alc&&alc.base;
  useEffect(()=>{
    if(!base||!token){setHw(null);return;}
    let vivo=true;
    authFetch(base+'/servidor/hardware',token).then(r=>r.ok?r.json():null).then(j=>{if(vivo&&j) setHw(j);}).catch(()=>{});
    return()=>{vivo=false;};
  },[base,token]);
  const h=s.hardware||{};
  const escolha=(hw&&hw.dispositivo)||h.dispositivo||'auto';
  const gpu=hw?hw.gpu:(h.gpu!==undefined?h.gpu:(s.tipo&&s.tipo!=='cpu'?s.tipo:''));
  const nomeGpu=(hw&&hw.gpu_nome)||h.gpu_name||NOME_GPU[gpu]||'';
  const trocar=async(v)=>{
    if(!base||v===escolha) return;
    setSalvando(true);
    try{
      const r=await authFetch(base+'/servidor/hardware',token,{method:'POST',body:JSON.stringify({dispositivo:v})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(j.error||'Não deu para trocar.');
      setHw(j);
      onToast(v==='cpu'?`${s.nome}: processando só no processador.`:v==='gpu'?`${s.nome}: processando na placa de vídeo.`:`${s.nome}: escolha automática.`);
    }catch(e){onToast(mensagemErro(e),'err');}
    finally{setSalvando(false);}
  };
  const idRot=useId();
  return(
    <div className={"hw-servidor"+(salvando?' ocupado':'')} role="group" aria-labelledby={idRot}>
      <p className="hw-rot" id={idRot}><Icon n="gauge"/>Processar câmeras com
        <Ajuda titulo="Placa de vídeo ou processador" resumo="Onde a IA deste servidor roda. Vale na hora para as câmeras ligadas.">
          <p><b>Automático</b>: usa a placa de vídeo se houver uma compatível; senão, o processador.</p>
          <p><b>Placa de vídeo</b>: mais quadros por segundo. Precisa de uma placa compatível neste servidor (NVIDIA, ou AMD/Intel no Windows).</p>
          <p><b>Processador</b>: deixa a placa de vídeo livre para outros programas; as câmeras ficam mais lentas.</p>
          <p>A escolha fica guardada no próprio servidor e as câmeras ligadas recarregam sozinhas. Para trocar daqui, o servidor precisa estar ligado e ao alcance deste navegador.</p>
        </Ajuda></p>
      <Opcoes rotulo="Processar câmeras com" valor={escolha} onChange={trocar}
        opcoes={[
          {id:'auto',ic:'zap',txt:'Automático',dica:'Placa de vídeo se houver, senão o processador',off:!base},
          {id:'gpu',ic:'chip',txt:'Placa de vídeo',dica:gpu?nomeGpu:'Nenhuma placa compatível neste servidor',off:!base||!gpu},
          {id:'cpu',ic:'gauge',txt:'Processador',dica:'Deixa a placa de vídeo livre',off:!base},
        ]}/>
      <p className="dica-linha">
        {!base
          ? <><Icon n="wifi"/>Fora de alcance daqui: não dá para trocar agora.</>
          : !gpu
            ? <><Icon n="info"/>Sem placa de vídeo compatível.</>
            : hw&&gpu==='nvidia'&&hw.rosto_na_gpu===false
              ? <><Icon n="alert"/>{nomeGpu}: câmeras na placa; o reconhecimento de rosto ainda na CPU (atualize o servidor).</>
              : <><Icon n="chip"/>{nomeGpu}{hw&&hw.em_uso?` · em uso: ${hw.em_uso==='gpu'?'placa de vídeo':'processador'}`:''}</>}
      </p>
    </div>
  );
}

/* ═══ STREAM CARD ═══════════════════════════════════════════ */
const MODO_ICONE={tempo_real:'zap',detalhado:'target',super:'zoom'};
const FONTES=[
  {id:'cam',txt:'Câmera deste aparelho'},
  {id:'remote',txt:'Celular (link)'},
  {id:'screen',txt:'Tela do computador'},
  {id:'rtsp',txt:'Câmera IP (RTSP)'},
  {id:'http',txt:'Stream HTTP'},
  {id:'file_url',txt:'Vídeo por URL'},
];

/* O que falta nesta câmera: ícones dos EPIs (ou o texto, se o servidor não mandou as chaves). */
function Faltas({status,sm}){
  const itens=(status&&status.missing_items)||[];
  if(itens.length) return <EpiSelos itens={itens} estado="falta" sm={sm}/>;
  const txt=(status&&status.missing)||[];
  return txt.length?<span className="faltas-txt">{txt.join(', ')}</span>:null;
}

/* ═══ AJUSTES DA CÂMERA ═══════════════════════════════════════
   Janela no meio da tela, com o fundo embaçado. Nada vale enquanto não salvar: a pessoa mexe à
   vontade e decide no fim (Salvar ou Cancelar). Fechar pelo X, pelo Esc ou tocando fora pergunta
   antes se há mudança sem salvar. Ao salvar, tudo é aplicado na hora, com a câmera ligada.      */
const atrasoTxt=(ms)=>ms==null?'':ms<1000?Math.round(ms)+' ms':(ms/1000).toFixed(1)+' s';

function CameraAjustes({nome,inicial,remoto,rodando,availableModels,episDoModeloAtual,servidores,diag,onSalvar,onClose}){
  const [r,setR]=useState(inicial);
  const [salvando,setSalvando]=useState(false);
  const [erro,setErro]=useState('');
  const id=useId();
  const mudar=(patch)=>setR(prev=>({...prev,...patch}));
  const sujo=JSON.stringify(r)!==JSON.stringify(inicial);
  const precisaUrl=r.sourceType==='rtsp'||r.sourceType==='http'||r.sourceType==='file_url';
  const modelo=findModelByValue(availableModels,r.streamModel);
  // trocou o modelo: os EPIs disponíveis passam a ser os do modelo novo
  const episDisp=r.streamModel===inicial.streamModel?episDoModeloAtual:getModelRequiredItems(modelo);
  const padrao=getModelRequiredItems(modelo).length?getModelRequiredItems(modelo):episDisp;
  const ativos=Array.isArray(r.epis)?r.epis:padrao;
  const todos=[...new Set([...episDisp,...ativos])];
  const toggleEpi=(item,ligar)=>mudar({epis:ligar?[...ativos.filter(k=>k!==item),item]:ativos.filter(k=>k!==item)});

  const salvar=async()=>{
    if(precisaUrl&&!r.camUrl.trim()){setErro('Informe o endereço da câmera.');return;}
    setSalvando(true);setErro('');
    try{await onSalvar(r);onClose();}
    catch(e){setErro(mensagemErro(e,'Não foi possível salvar os ajustes.'));setSalvando(false);}
  };
  const tentarFechar=async()=>{
    if(salvando) return;
    if(!sujo){onClose();return;}
    const v=await perguntarSalvar({texto:`Você mudou os ajustes de "${nome}" e ainda não salvou.`});
    if(v==='salvar') salvar();
    else if(v==='descartar') onClose();
  };

  return(
    <Janela titulo={'Ajustes · '+nome} ic="sliders" onClose={tentarFechar} tamanho="medio">
      <form className="cam-modal" onSubmit={enviar(salvar)}>
        <p className="field"><label htmlFor={id+'-nome'}><Icon n="text"/>Nome da câmera</label>
          <input id={id+'-nome'} value={r.apelido} onChange={e=>mudar({apelido:e.target.value})} placeholder={nome} maxLength={40} data-foco/></p>

        <div className="field-row">
          <p className="field"><label htmlFor={id+'-fonte'}><Icon n="video"/>Fonte do vídeo</label>
            <select id={id+'-fonte'} value={r.sourceType} onChange={e=>mudar({sourceType:e.target.value})} disabled={remoto}>
              {FONTES.map(f=><option key={f.id} value={f.id}>{f.txt}</option>)}
            </select></p>
          <p className="field"><label htmlFor={id+'-modelo'}><Icon n="chip"/>Modelo de IA</label>
            <select id={id+'-modelo'} value={r.streamModel} onChange={e=>mudar({streamModel:e.target.value,epis:null})}>
              {availableModels.length>0
                ? availableModels.map(m=><option key={m.name} value={m.name}>{m.display_name||(m.tipo==='customizado'?'★ '+m.name:m.name)} ({m.size_mb}MB)</option>)
                : <><option value="yolo26n.pt">YOLO26 Nano</option><option value="yolo26s.pt">YOLO26 Small</option></>}
            </select></p>
        </div>
        {precisaUrl&&(
          <p className="field"><label htmlFor={id+'-url'}><Icon n="link"/>Endereço da câmera</label>
            <input id={id+'-url'} type="url" value={r.camUrl} onChange={e=>mudar({camUrl:e.target.value})} placeholder={r.sourceType==='rtsp'?'rtsp://usuario:senha@192.168.0.10/...':'http://...'}/></p>
        )}

        <div className="cam-modal-grupo">
          <p className="cam-modal-rot"><Icon n="zap"/>Modo de análise
            <Ajuda titulo="Modos de análise" resumo="Tempo real: imediato, sem guardar vídeo. Detalhado e Super: mais precisos, com atraso de 1,5 s e 4 s.">
              <p><b>Tempo real</b>: nada é guardado. O servidor analisa sempre o quadro mais novo e o resultado sai na hora; o atraso é só o da rede e o da análise. O vídeo vai direto para o servidor (WebRTC) quando a rede deixa.</p>
              <p><b>Detalhado</b> (cerca de 1,5 s de atraso): modelos maiores, e cada EPI é decidido olhando um pouco antes e um pouco depois.</p>
              <p><b>Super detalhado</b> (cerca de 4 s): o mais preciso; revisa cada pessoa ampliada.</p>
            </Ajuda></p>
          <div className="aj-linha">
            <Opcoes rotulo="Modo de análise" valor={r.modo} onChange={k=>mudar({modo:k})}
              opcoes={Object.entries(ArgosStream.MODES).map(([k,m])=>({id:k,txt:m.nome,ic:MODO_ICONE[k]||'zap',dica:m.descricao}))}/>
            <select value={r.fps} onChange={e=>mudar({fps:Number(e.target.value)})} aria-label="Quadros por segundo">
              {ArgosStream.FPS_OPTIONS.map(f=><option key={f} value={f}>{f} fps</option>)}
            </select>
            <select value={r.resolucao} onChange={e=>mudar({resolucao:Number(e.target.value)})} aria-label="Resolução">
              {ArgosStream.RES_OPTIONS.map(v=><option key={v} value={v}>{v}p</option>)}
            </select>
          </div>
        </div>

        <div className="cam-modal-grupo">
          <p className="cam-modal-rot"><Icon n="helmet"/>EPIs fiscalizados nesta câmera
            {Array.isArray(r.epis)&&<button type="button" className="chip" onClick={()=>mudar({epis:null})} title="Voltar aos EPIs padrão do modelo"><Icon n="undo"/>Padrão</button>}</p>
          {todos.length>0
            ? <EpiBotoes disponiveis={todos} ativos={ativos} onToggle={toggleEpi} titulo="EPIs fiscalizados nesta câmera" comNomes/>
            : <p className="dica-linha">Este modelo não reconhece EPIs</p>}
        </div>

        <div className="cam-modal-grupo">
          <label className="pref compacta">
            <span className="pref-ico"><Icon n="scan-face"/></span>
            <span className="pref-nome">Reconhecer o rosto</span>
            <Ajuda titulo="Reconhecer o rosto" resumo="Ligado: identifica o funcionário. Desligado: só confere os EPIs (mais leve para computador fraco).">
              <p><b>Ligado</b> (padrão): a câmera compara o rosto com os funcionários cadastrados. A falta fica com o nome da pessoa, entra no desempenho dela e a TV chama pelo nome.</p>
              <p><b>Desligado</b>: a câmera só confere se a pessoa está com os EPIs. Fica mais leve para um computador sem placa de vídeo, mas as faltas ficam sem nome ("pessoa não identificada") e não entram no desempenho de ninguém.</p>
            </Ajuda>
            <span className="switch">
              <input type="checkbox" role="switch" checked={r.rosto!==false} onChange={e=>mudar({rosto:e.target.checked})}/>
              <span className="switch-trilho"/><span className="switch-bolha"/>
            </span>
          </label>
        </div>

        {servidores.length>0&&(
          <div className="cam-modal-grupo">
            <p className="field" style={{marginBottom:0}}><label htmlFor={id+'-serv'}><Icon n="server"/>Servidor que processa esta câmera
              <Ajuda titulo="Servidor da câmera" resumo="Escolha qual computador da conta analisa esta câmera.">
                <p>Cada câmera é analisada por um dos servidores da conta. Escolha aqui qual; a mudança vale ao salvar.</p>
                <p><b>Câmera IP (RTSP)</b> precisa ficar no servidor que está na mesma rede que ela (por exemplo, o da mesma filial).</p>
                <p><b>Celular (link)</b>: o celular recebe o aviso e reconecta sozinho no servidor escolhido; ele precisa estar transmitindo agora.</p>
              </Ajuda></label>
              <select id={id+'-serv'} value={r.base} onChange={e=>mudar({base:e.target.value})} disabled={servidores.length<2}>
                {!servidores.some(v=>v.base===r.base)&&<option value={r.base}>Servidor atual</option>}
                {servidores.map((v,i)=><option key={v.id} value={v.base}>{v.nome}{i===0&&servidores.length>1?' (mais livre)':''} · livre {v.status.availability??'?'}%</option>)}
              </select></p>
          </div>
        )}

        <details className="cam-modal-diag">
          <summary><Icon n="info"/>Diagnóstico</summary>
          {diag}
        </details>

        {erro&&<p className="err-msg" role="alert"><Icon n="alert"/>{erro}</p>}
        <footer className="modal-actions">
          {rodando&&sujo&&<span className="dica-linha" style={{marginRight:'auto'}}><Icon n="zap"/>Vale na hora, com a câmera ligada</span>}
          <button type="button" className="btn btn-secondary" onClick={onClose} disabled={salvando}>Cancelar</button>
          <button type="submit" className="btn btn-primary" disabled={salvando||!sujo}><Icon n="check"/>{salvando?'Salvando...':'Salvar alterações'}</button>
        </footer>
      </form>
    </Janela>
  );
}

function StreamCard({streamId,token,backendUrl,availableModels,defaultModel,device,index,onRemove,alarmeLigado,onToast,visual='medio',servidorNome,servidores=[],onMudarServidor}){
  const [status,setStatus]=useState(null);
  const [info,setInfo]=useState(null);
  const [showZonas,setShowZonas]=useState(false);
  const [usingCam,setUsingCam]=useState(false);
  const inferredSource = /^remote_cam_|^cam_/.test(streamId) ? 'remote' : 'cam';
  const [sourceType,setSourceType]=useState(()=>inferredSource==='remote' ? 'remote' : (localStorage.getItem('epi_source_'+streamId)||inferredSource));
  const [showLongInfo,setShowLongInfo]=useState(false);
  // os ajustes abrem numa janela: quem só acompanha não precisa deles
  const [ajustes,setAjustes]=useState(false);
  // vídeo direto (WebRTC) chegando para esta câmera: o <video> mostra, o canvas só leva as caixas
  const [direto,setDireto]=useState(false);
  const idTitulo=useId();
  // apelido da câmera ("Portaria", "Solda 2"): fica no navegador de quem configurou
  const [apelido,setApelido]=useState(()=>localStorage.getItem('epi_apelido_'+streamId)||'');
  useEffect(()=>{
    if(apelido) localStorage.setItem('epi_apelido_'+streamId,apelido);
    else localStorage.removeItem('epi_apelido_'+streamId);
  },[apelido,streamId]);
  const manualModelRef=useRef(Boolean(localStorage.getItem('epi_sm_'+streamId)));
  const [camUrl,setCamUrl]=useState(()=>localStorage.getItem('epi_camurl_'+streamId)||'');
  const [applying,setApplying]=useState(false);
  const [streamModel,setStreamModel]=useState(()=>localStorage.getItem('epi_sm_'+streamId)||defaultModel||'yolo26n.pt');
  // modo, fps e resolução ficam no servidor: valem para a câmera deste navegador, o celular e as câmeras IP
  const [config,setConfig]=useState({modo:'tempo_real',fps:60,resolucao:720,rosto:true,imediato:true});
  const [net,setNet]=useState(null);
  const [conn,setConn]=useState('');
  const [playStats,setPlayStats]=useState(null);
  const selectedModel=findModelByValue(availableModels,streamModel);
  const videoRef=useRef(null);
  const canvasRef=useRef(null);
  const playerRef=useRef(null);
  const senderRef=useRef(null);
  const streamRef=useRef(null);
  const kindRef=useRef('camera');
  const videoOuterRef=useRef(null);
  const removedRef=useRef(false);
  const lastStatusAt=useRef(0);

  useEffect(()=>{
    if(!localStorage.getItem('epi_sm_'+streamId) && defaultModel && streamModel!==defaultModel){
      setStreamModel(defaultModel);
    }
  },[defaultModel,streamId]);

  useEffect(()=>{
    if(!localStorage.getItem('epi_sm_'+streamId) && status && status.model && streamModel!==status.model){
      setStreamModel(status.model);
    }
  },[status ? status.model : '',streamId]);

  useEffect(()=>{
    localStorage.setItem('epi_source_'+streamId, sourceType);
  },[sourceType,streamId]);
  useEffect(()=>{
    if(camUrl) localStorage.setItem('epi_camurl_'+streamId, camUrl);
    else localStorage.removeItem('epi_camurl_'+streamId);
  },[camUrl,streamId]);

  useEffect(()=>{
    authFetch(backendUrl+'/streams/'+encodeURIComponent(streamId)+'/config',token)
      .then(r=>r.ok?r.json():null).then(d=>{if(d&&d.config) setConfig(d.config);}).catch(()=>{});
  },[streamId,backendUrl,token]);

  // o resultado chega a cada quadro (até 60 por segundo); o painel atualiza 4 vezes por segundo
  const onResult=useCallback(d=>{
    const t=performance.now();
    if(t-lastStatusAt.current<250) return;
    lastStatusAt.current=t;
    setStatus(prev=>({...(prev||{}),...d}));
  },[]);
  const onInfo=useCallback(d=>{
    setInfo(d);
    if(d.config) setConfig(d.config);
    setStatus(prev=>({...(prev||{}),model:d.model,required_labels:d.required_labels,required_items:d.required_items,
      epis_disponiveis:d.epis_disponiveis,epis_da_camera:d.epis_da_camera,
      classes:d.classes,pose:d.pose,camera:d.camera}));
  },[]);

  useEffect(()=>{
    const player=new ArgosStream.LivePlayer({
      canvas:canvasRef.current,
      getFrame:seq=>senderRef.current?senderRef.current.frameBlob(seq):null,
      onStats:setPlayStats,
    });
    playerRef.current=player;
    return()=>{player.close();playerRef.current=null;};
  },[]);

  // Streams do servidor (dispositivo remoto, RTSP, HTTP, arquivo): vídeo + resultado pelo WebSocket.
  useEffect(()=>{
    if(usingCam||!playerRef.current) return;
    const viewer=new ArgosStream.LiveViewer({
      backendUrl,token,streamId,player:playerRef.current,onResult,onInfo,
      videoEl:videoRef.current,onDireto:on=>setDireto(Boolean(on)),
      onStatus:st=>setConn(st),
    });
    viewer.start();
    return()=>{viewer.stop();setDireto(false);if(playerRef.current) playerRef.current.clear();setConn('');};
  },[streamId,token,backendUrl,usingCam]);

  // câmera deste navegador em tempo real: a tela mostra o vídeo ao vivo e só as caixas vêm do servidor
  useEffect(()=>{
    if(!usingCam||!playerRef.current) return;
    // vídeo direto: a prévia sai com um atraso mínimo e a caixa de cada quadro no lugar (Alinhador)
    const snd=senderRef.current;
    playerRef.current.atrasar=Boolean(snd&&snd.diretoLigado);
    playerRef.current.setLive(config.imediato?videoRef.current:null,{alinhador:snd&&snd.diretoLigado?snd.alinhador:null});
  },[usingCam,config.imediato,Boolean(net&&net.direto)]);

  const enterFs=()=>{
    const el=videoOuterRef.current;
    if(!el) return;
    if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  };
  const exitFs=()=>{
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
  };

  const stopCam=useCallback(async()=>{
    const sender=senderRef.current;
    senderRef.current=null;
    if(sender){
      sender.stop();
      authFetch(backendUrl+'/streams/stop_external',token,{method:'POST',body:JSON.stringify({stream_id:streamId})}).catch(()=>{});
    }
    if(streamRef.current){streamRef.current.getTracks().forEach(t=>t.stop());streamRef.current=null;}
    if(videoRef.current) videoRef.current.srcObject=null;
    if(playerRef.current){playerRef.current.setLive(null);playerRef.current.clear();}
    setUsingCam(false);
    setNet(null);
  },[backendUrl,token,streamId]);
  const stopCamRef=useRef(stopCam);
  stopCamRef.current=stopCam;
  useEffect(()=>()=>{stopCamRef.current();},[]);

  const openLocal=async(cfg,kind)=>{
    const stream=await ArgosStream.openCamera({fps:cfg.fps,height:cfg.resolucao,screen:kind==='screen'});
    const v=videoRef.current;
    if(!v){stream.getTracks().forEach(t=>t.stop());return false;}
    const old=streamRef.current;
    streamRef.current=stream;
    v.srcObject=stream;
    v.play().catch(()=>{});
    await new Promise(res=>{
      if(v.readyState>=2) return res();
      v.onloadeddata=res;
      setTimeout(res,2500);
    });
    if(old) old.getTracks().forEach(t=>t.stop());
    return true;
  };

  const startCam=async(kind,v={})=>{
    const base=v.base||backendUrl, modelo=v.streamModel||streamModel;
    kindRef.current=kind;
    if(!await openLocal(v.config||config,kind)) return;
    const r=await authFetch(base+'/update',token,{method:'POST',body:JSON.stringify({model:modelo,device,camera:'webcam',stream_id:streamId,required_items:getModelRequiredItems(findModelByValue(availableModels,modelo))})});
    if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'Falha ao iniciar a IA');}
    setUsingCam(true);
    const sender=new ArgosStream.LiveSender({
      video:videoRef.current,backendUrl:base,token,streamId,
      onResult:d=>{if(playerRef.current) playerRef.current.pushResult(d);onResult(d);},
      onInfo,
      onStats:s=>setNet(s),
      onConfig:(c,old)=>{
        setConfig(c);
        // tela compartilhada não reabre sozinha (o navegador pediria permissão de novo)
        if(kindRef.current!=='screen'&&old&&(old.fps!==c.fps||old.resolucao!==c.resolucao)){
          openLocal(c,kindRef.current).catch(()=>{});
        }
      },
      onStatus:st=>{
        if(st==='removido') stopCamRef.current();
        if(playerRef.current) playerRef.current.setMessage(st==='reconectando'?'Sem conexão · guardando quadros e tentando de novo...':'');
        setConn(st);
      },
    });
    senderRef.current=sender;
    sender.start();
  };

  const apply=async(v={})=>{
    const fonte=v.sourceType||sourceType, url=v.camUrl!==undefined?v.camUrl:camUrl;
    const base=v.base||backendUrl, modelo=v.streamModel||streamModel;
    setApplying(true);
    try{
      if(usingCam) await stopCam();
      if(fonte==='cam'||fonte==='screen') await startCam(fonte==='screen'?'screen':'camera',v);
      else{
        const remoteCamera = fonte==='remote' ? 'webcam' : url;
        const r=await authFetch(base+'/update',token,{method:'POST',body:JSON.stringify({model:modelo,device,camera:remoteCamera,stream_id:streamId,required_items:getModelRequiredItems(findModelByValue(availableModels,modelo))})});
        if(!r.ok){const d=await r.json().catch(()=>({}));onToast&&onToast(d.error||'Não foi possível ligar a câmera.','err');}
      }
    }catch(e){
      await stopCam();
      onToast&&onToast('Não foi possível ligar a câmera: '+mensagemErro(e),'err');
    }
    setApplying(false);
  };

  // botão grande de play no vídeo vazio: liga a fonte escolhida; sem endereço, abre os ajustes
  const precisaUrl=sourceType==='rtsp'||sourceType==='http'||sourceType==='file_url';
  const iniciar=()=>{
    if(precisaUrl&&!camUrl.trim()){setAjustes(true);return;}
    apply();
  };

  const changeConfig=async(patch)=>{
    const next={...config,...patch};
    setConfig(next);
    try{
      const r=await authFetch(backendUrl+'/streams/'+encodeURIComponent(streamId)+'/config',token,{method:'POST',body:JSON.stringify(next)});
      if(r.ok){const d=await r.json();if(d.config) setConfig(d.config);}
    }catch{}
  };

  /* Salvar da janela de ajustes: aplica tudo de uma vez, na hora, com a câmera ligada.
     Ordem: servidor (se mudou) -> configuração (modo, fps, resolução, EPIs, rosto) -> fonte e modelo. */
  const salvarAjustes=async(r)=>{
    const rodando=usingCam||Boolean(status&&status.frame_w)||direto;
    const mudouServidor=r.base!==backendUrl;
    const mudouFonte=r.sourceType!==sourceType||(r.camUrl||'')!==(camUrl||'');
    const mudouModelo=r.streamModel!==streamModel;
    setApelido(r.apelido.trim());
    if(mudouServidor){
      const alvo=servidores.find(v=>v.base===r.base);
      if(!alvo||!onMudarServidor) throw new Error('O servidor escolhido não está respondendo agora.');
      if(usingCam) await stopCam();
      await onMudarServidor(streamId,alvo,{remoto:sourceType==='remote',baseAtual:backendUrl});
    }
    const cfg={modo:r.modo,fps:r.fps,resolucao:r.resolucao,epis:r.epis,rosto:r.rosto!==false};
    const resp=await authFetch(r.base+'/streams/'+encodeURIComponent(streamId)+'/config',token,{method:'POST',body:JSON.stringify(cfg)});
    const d=await resp.json().catch(()=>({}));
    if(!resp.ok) throw new Error(d.error||'O servidor não aceitou os ajustes.');
    if(d.config) setConfig(d.config);
    setStatus(prev=>({...(prev||{}),epis_da_camera:Array.isArray(r.epis),...(Array.isArray(r.epis)?{required_items:r.epis}:{})}));
    setSourceType(r.sourceType);
    setCamUrl(r.camUrl);
    if(mudouModelo){
      manualModelRef.current=true;
      setStreamModel(r.streamModel);
      localStorage.setItem('epi_sm_'+streamId,r.streamModel);
    }
    // fonte, modelo ou servidor novos: a câmera que estava ligada recomeça já com eles
    const celular=r.sourceType==='remote';
    if(mudouServidor&&celular){onToast&&onToast('Ajustes salvos. O celular vai reconectar no servidor escolhido.');return;}
    if((mudouFonte||mudouServidor)&&(rodando||mudouFonte)&&!celular){
      await apply({sourceType:r.sourceType,camUrl:r.camUrl,streamModel:r.streamModel,base:r.base,config:d.config||cfg});
    }else if(mudouModelo&&(rodando||celular)){
      const fonteAtual=usingCam||celular?'webcam':((status&&status.camera)||r.camUrl||'webcam');
      await authFetch(r.base+'/update',token,{method:'POST',body:JSON.stringify({model:r.streamModel,device,camera:fonteAtual,stream_id:streamId,
        required_items:getModelRequiredItems(findModelByValue(availableModels,r.streamModel))})}).catch(()=>{});
    }
    onToast&&onToast('Ajustes salvos.');
  };

  const handleRemove=()=>{
    removedRef.current=true;
    stopCam();
    onRemove();
  };

  const st=status&&status.status;
  const isPerigo=st==='perigo';
  const isOk=st==='seguro';
  const fallOnly=isPerigo&&!(status.missing||[]).length&&(status.alerts||[]).some(a=>a.includes('queda'));
  // alarme: toca enquanto houver EPI faltando ou queda nesta câmera
  useAlarme(isPerigo,alarmeLigado);
  const estado=isPerigo?'perigo':isOk?'seguro':'espera';
  const estadoIco=isPerigo?'alert':isOk?'shield':st==='verificando'?'search':st==='sem_pessoa'?'user':'hourglass';
  const estadoTxt=isPerigo?(fallOnly?'Possível queda':'Falta EPI'):isOk?'Seguro':st==='verificando'?'Verificando':st==='sem_pessoa'?'Sem pessoas':'Aguardando';
  const persons=(status&&status.persons)||[];
  const exigidos=(status&&status.required_items)||[];
  // câmera desligada: os botões já aparecem com o que o modelo escolhido sabe procurar
  const episAtivos=Array.isArray(config.epis)?config.epis:(status&&status.required_items)||getModelRequiredItems(selectedModel);
  const episDisp=[...new Set([...((status&&status.epis_disponiveis)||getModelRequiredItems(selectedModel)),...episAtivos])];
  const episProprios=Array.isArray(config.epis)||Boolean(status&&status.epis_da_camera);
  const pipe=(info&&info.pipeline)||{};
  const connLabel={ws:'WebSocket',http:'HTTP (reserva)',reconectando:'reconectando...',aguardando:'aguardando a câmera',erro:'erro'}[conn]||conn||'—';
  const hasImage=Boolean(playStats&&playStats.fps>0)||Boolean(status&&status.frame_w)||direto;
  const videoDireto=direto||Boolean(usingCam&&net&&net.direto);
  const cameraDisplay=sourceType==='remote'
    ? 'Celular (link)'
    : (usingCam?(sourceType==='screen'?'Tela deste navegador':'Câmera deste navegador'):maskCameraUrl((status&&status.camera)||camUrl)||'—');

  // Apelido: "Portaria", "Solda 2"... fica no navegador de quem configurou.
  const nome=apelido||('Câmera '+(index+1));
  const fps=Math.round((playStats&&playStats.fps)||0);
  const zonasN=(status&&(status.zonas||[]).length)||0;
  const PESSOAS_VISIVEIS=4;

  // modo lista: uma linha por câmera, sem vídeo
  if(visual==='lista'){
    return(
      <article className={"cam-linha "+estado} aria-labelledby={idTitulo}>
        <span className="estado-ico" role="img" aria-label={estadoTxt} data-dica={estadoTxt}><Icon n={estadoIco}/></span>
        <h2 className="cam-linha-nome" id={idTitulo} title={streamId}>{nome}</h2>
        {isPerigo&&<Faltas status={status} sm/>}
        <span className="pessoas"><Icon n="users"/>{persons.length}<span className="sr"> pessoa(s)</span></span>
        <button type="button" className="ib sm perigo dica-dir" onClick={handleRemove} aria-label={'Remover '+nome} data-dica="Remover"><Icon n="trash"/></button>
      </article>
    );
  }

  return(
    <article className={"cam v-"+visual+" "+estado} aria-labelledby={idTitulo}>
      <header className="cam-topo">
        {/* o nome é editável ali mesmo; o título (para leitor de tela) acompanha */}
        <h2 className="sr" id={idTitulo}>{nome}</h2>
        <label className="sr" htmlFor={idTitulo+'-nome'}>Nome da câmera</label>
        <input id={idTitulo+'-nome'} className="cam-nome" value={nome}
          onChange={e=>setApelido(e.target.value)}
          onFocus={e=>e.target.select()}/>
        {servidorNome&&<span className="cam-servidor" title="Servidor que processa esta câmera"><Icon n="server"/>{servidorNome}</span>}
        {usingCam&&<button type="button" className="ib sm perigo" onClick={stopCam} aria-label="Parar câmera" data-dica="Parar"><Icon n="stop"/></button>}
        <button type="button" className="ib sm" onClick={()=>setShowZonas(true)}
          aria-label={'Áreas desta câmera'+(zonasN>0?` (${zonasN} desenhada(s))`:'')} data-dica={zonasN>0?`Áreas (${zonasN})`:'Áreas'}><Icon n="map"/></button>
        <button type="button" className="ib sm" onClick={()=>setAjustes(true)}
          aria-haspopup="dialog" aria-label="Ajustes da câmera" data-dica="Ajustes"><Icon n="sliders"/></button>
        <button type="button" className="ib sm perigo" onClick={handleRemove} aria-label="Remover câmera" data-dica="Remover"><Icon n="trash"/></button>
      </header>
      <figure className="cam-video" ref={videoOuterRef} aria-label={'Vídeo ao vivo: '+nome}>
        <video ref={videoRef} className="video-live" autoPlay playsInline muted style={{display:(usingCam||direto)?'block':'none'}}/>
        <canvas ref={canvasRef} className="video-overlay" aria-hidden="true"/>
        {!hasImage&&!usingCam&&(
          <div className="sem-sinal">
            {sourceType==='remote'
              ? <><Icon n="phone"/><span>{conn==='aguardando'?'Aguardando o celular':'Aguardando...'}</span></>
              : <button type="button" className="play-grande" onClick={iniciar} disabled={applying} aria-label="Ligar câmera" data-dica="Ligar"><Icon n="play"/></button>}
          </div>
        )}
        {(hasImage||usingCam)&&<span className="fps" title={videoDireto?'Vídeo direto (WebRTC): imediato':config.imediato?'Imediato (quadros pelo servidor)':'Atraso do modo de análise'}><Icon n={MODO_ICONE[config.modo]||'zap'}/>{fps} fps{pipe.atraso_ms!=null?` · ${atrasoTxt(pipe.atraso_ms)}`:''}{videoDireto?' · direto':''}</span>}
        <button type="button" className="ib sm tela-cheia dica-dir" onClick={enterFs} aria-label="Tela cheia" data-dica="Tela cheia"><Icon n="maximize"/></button>
        <button type="button" className="btn btn-sm sair-fs" onClick={exitFs}><Icon n="x"/>Sair</button>
      </figure>

            );
          })}
          {persons.length>PESSOAS_VISIVEIS&&(
            <li>
              <button type="button" className="chip" onClick={()=>setShowLongInfo(v=>!v)} aria-expanded={showLongInfo}>
                {showLongInfo?'Menos':'+'+(persons.length-PESSOAS_VISIVEIS)}
              </button>
            </li>
          )}
        </ul>
      )}

      {ajustes&&(
        <CameraAjustes nome={nome} remoto={inferredSource==='remote'} rodando={hasImage||usingCam}
          inicial={{apelido,sourceType,camUrl,streamModel,modo:config.modo,fps:config.fps,resolucao:config.resolucao,
            epis:Array.isArray(config.epis)?config.epis:null,rosto:config.rosto!==false,base:backendUrl}}
          availableModels={availableModels} episDoModeloAtual={episDisp} servidores={servidores}
          onSalvar={salvarAjustes} onClose={()=>setAjustes(false)}
          diag={
            <ul className="diag" aria-label="Diagnóstico">
              <li className="chip" title={cameraDisplay}><Icon n="video"/>{cameraDisplay}</li>
              <li className={"chip"+(conn==='reconectando'?' alerta':videoDireto?' bom':'')} title={videoDireto?'O vídeo vai direto para o servidor (WebRTC), sem passar pelo túnel':'O vídeo vai em quadros pelo endereço do servidor'}><Icon n="wifi"/>{videoDireto?'vídeo direto'+(net&&net.rota==='retransmitida'?' (retransmitido)':''):connLabel}</li>
              {usingCam&&net&&!net.direto&&net.diretoMotivo&&<li className="chip" title="O envio segue em quadros pelo endereço do servidor"><Icon n="info"/>sem vídeo direto: {net.diretoMotivo}</li>}
              {pipe.atraso_ms!=null&&<li className="chip" title={config.imediato?'Da chegada do quadro ao resultado':'Atraso do modo de análise'}><Icon n="clock"/>{atrasoTxt(pipe.atraso_ms)}</li>}
              {pipe.fps_analise!=null&&<li className="chip" title="IA analisa / servidor recebe (quadros por segundo)"><Icon n="chip"/>{pipe.fps_analise}/{pipe.fps_entrada} q/s</li>}
              {pipe.sem_sinal&&<li className="chip alerta"><Icon n="video-off"/>sem sinal</li>}
              {config.rosto===false&&<li className="chip" title="Esta câmera só confere os EPIs"><Icon n="scan-face"/>sem reconhecer rosto</li>}
              {info&&info.ajuda&&<li className="chip" title={'Outro servidor da conta, na mesma rede, adianta parte da análise desta câmera: rostos '+info.ajuda.rosto+' q/s, EPIs '+info.ajuda.epi+' q/s'}><Icon n="server"/>ajuda de {(info.ajuda.pares||[]).join(', ')||'outro servidor'}</li>}
              {pipe.enganos>0&&<li className="chip" title="Vezes em que o modelo deixou de ver o EPI por alguns quadros e o sistema não contou como falta, porque a pessoa tinha sido vista com ele e ele reapareceu"><Icon n="shield"/>{pipe.enganos} engano(s) ignorado(s)</li>}
              {usingCam&&net&&<li className="chip" title="Envio desta câmera"><Icon n="upload"/>{net.sentFps.toFixed(0)} q/s · {(net.kbps/1000).toFixed(1)} Mb/s</li>}
              {status&&status.classes&&status.classes.length>0&&<li className="chip" title={status.classes.join(', ')}><Icon n="helmet"/>{status.classes.length} classes</li>}
              {status&&status.pose===false&&<li className="chip">só detector</li>}
            </ul>
          }/>
      )}
      {showZonas&&<ZonaEditor streamId={streamId} token={token} backendUrl={backendUrl}
        onClose={()=>setShowZonas(false)} onToast={onToast}/>}
    </article>
  );
}

/* ═══ EPI CARD ═══════════════════════════════════════════════ */
function EpiCard({epi,token,backendUrl,onUpdate,onDelete,onToast,nivel=2}){
  const [uploading,setUploading]=useState(false);
  const [treinando,setTreinando]=useState(false);
  const [importando,setImportando]=useState(false);
  const [editando,setEditando]=useState(false);
  const fileRef=useRef();
  const roboRef=useRef();
  const idTitulo=useId();

  const salvarEdicao=async(form)=>{
    try{
      const r=await authFetch(backendUrl+'/epis/'+epi.id,token,{method:'PUT',body:JSON.stringify({nome:form.nome.trim(),descricao:(form.descricao||'').trim(),cor:form.cor})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||'Não foi possível salvar.');
      setEditando(false);
      onToast&&onToast('EPI atualizado!');
      onUpdate();
    }catch(e){onToast&&onToast(mensagemErro(e),'err');}
  };

  const uploadFoto=async(e)=>{
    const files=[...e.target.files];
    if(!files.length) return;
    setUploading(true);
    for(const file of files){
      const fd=new FormData();
      fd.append('foto',file);
      await authFetchForm(backendUrl+'/epis/'+epi.id+'/fotos',token,fd).catch(()=>{});
    }
    setUploading(false);
    e.target.value='';
    onUpdate();
  };

  const deleteFoto=async(fid)=>{
    await authFetch(backendUrl+'/epis/'+epi.id+'/fotos/'+fid,token,{method:'DELETE'}).catch(()=>{});
    onUpdate();
  };

  const importarDataset=async(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    if(!file.name.toLowerCase().endsWith('.zip')){onToast&&onToast('Escolha um arquivo .zip exportado do Roboflow.','err');e.target.value='';return;}
    setImportando(true);
    const fd=new FormData();
    fd.append('dataset',file);
    try{
      const r=await authFetchForm(backendUrl+'/epis/'+epi.id+'/importar_dataset',token,fd);
      const d=await r.json();
      if(r.ok){
        informar({titulo:'Dataset importado',ic:'box',texto:`${d.total} imagens, ${d.anotadas} com marcação feita à mão.`+(d.sem_label?` ${d.sem_label} sem marcação: nelas o EPI vale para a foto inteira.`:'')});
        onUpdate();
      }else{onToast&&onToast(d.error||'Não foi possível importar o arquivo.','err');}
    }catch(e){onToast&&onToast(mensagemErro(e),'err');}
    setImportando(false);
    e.target.value='';
  };

  const treinar=async()=>{
    if(!await confirmar({titulo:`Treinar "${epi.nome}"?`,texto:'O treino roda no servidor e leva alguns minutos. Pode continuar usando o sistema.',ic:'dumbbell',perigo:false,botao:'Treinar'})) return;
    setTreinando(true);
    const r=await authFetch(backendUrl+'/epis/'+epi.id+'/treinar',token,{method:'POST'}).catch(()=>null);
    if(r&&r.status===202) onToast&&onToast('Treino iniciado. O selo fica verde quando terminar.');
    else onToast&&onToast('Não foi possível iniciar o treino.','err');
    setTreinando(false);
    onUpdate();
  };

  const deleteEpi=async()=>{
    if(!await confirmar({titulo:`Remover "${epi.nome}"?`,texto:'As fotos e o modelo treinado deste EPI também serão apagados.'})) return;
    await authFetch(backendUrl+'/epis/'+epi.id,token,{method:'DELETE'}).catch(()=>{});
    onUpdate();
  };

  const fotos=epi.fotos||[];
  const faltam=Math.max(0,5-fotos.length);
  return(
    <article className="card" aria-labelledby={idTitulo}>
      <header className="card-topo">
        <span className="card-ico" style={{background:epi.cor||'var(--brand)'}}><EpiGlifo item={epiDoNome(epi.nome)}/></span>
        <div className="card-txt">
          <Titulo n={nivel} className="card-nome" id={idTitulo}>{epi.nome}</Titulo>
          {epi.descricao&&<p className="card-sub">{epi.descricao}</p>}
        </div>
        {epi.modelo_treinado
          ? <span className="selo ok dica-dir" data-dica="Modelo treinado" role="img" aria-label="Modelo treinado"><Icon n="check"/></span>
          : <span className="selo pendente dica-dir" data-dica="Ainda sem treino" role="img" aria-label="Ainda sem treino"><Icon n="clock"/></span>}
      </header>
      <ul className="fotos" aria-label="Fotos">
        {fotos.map((f,i)=>(
          <li key={f.id} className="foto">
            <img src={backendUrl+'/epis/foto/'+f.id+'?token='+token} alt={'Foto '+(i+1)+' de '+epi.nome}/>
            <button type="button" className="foto-del" onClick={()=>deleteFoto(f.id)} aria-label={'Remover foto '+(i+1)}><Icon n="x"/></button>
          </li>
        ))}
        <li>
          <button type="button" className="foto-add" onClick={()=>fileRef.current.click()} aria-label="Adicionar fotos" data-dica="Adicionar fotos" disabled={uploading}>
            {uploading?<span className="giro"/>:<Icon n="plus"/>}
          </button>
        </li>
      </ul>
      <input ref={fileRef} type="file" accept="image/*" multiple hidden onChange={uploadFoto}/>
      <Progresso atual={fotos.length} meta={5} ic="image" dica="Fotos para treinar (mínimo 5)"/>
      <footer className="card-acoes">
        <button type="button" className="btn btn-secondary btn-sm" onClick={treinar} disabled={treinando||faltam>0}
          title={faltam>0?`Faltam ${faltam} foto(s)`:'Treinar modelo YOLO'}>
          <Icon n="dumbbell"/>{treinando?'Treinando...':'Treinar'}
        </button>
        <button type="button" className="ib sm" onClick={()=>roboRef.current.click()} disabled={importando}
          aria-label="Importar dataset .zip do Roboflow" data-dica="Importar .zip (Roboflow)">
          {importando?<span className="giro"/>:<Icon n="box"/>}
        </button>
        <button type="button" className="ib sm" onClick={()=>setEditando(true)} aria-label={'Editar '+epi.nome} data-dica="Editar"><Icon n="pencil"/></button>
        <button type="button" className="ib sm perigo dica-dir" onClick={deleteEpi} aria-label={'Remover '+epi.nome} data-dica="Remover"><Icon n="trash"/></button>
      </footer>
      {editando&&<ModalNovoEpi inicial={{nome:epi.nome||'',descricao:epi.descricao||'',cor:epi.cor||'#3740b4'}} onClose={()=>setEditando(false)} onSave={salvarEdicao}/>}
      <input ref={roboRef} type="file" accept=".zip" hidden onChange={importarDataset}/>
    </article>
  );
}

/* ═══ FUNCIONARIO CARD ═══════════════════════════════════════ */
function FuncCard({func,token,backendUrl,onUpdate,onDelete,onToast,nivel=2}){
  const [uploading,setUploading]=useState(false);
  const [verDesempenho,setVerDesempenho]=useState(false);
  const [editando,setEditando]=useState(false);
  const fileRef=useRef();
  const idTitulo=useId();

  // nome, cargo e matrícula: o nome novo vale na hora nas câmeras ligadas e na voz da TV
  const salvarEdicao=async(form)=>{
    try{
      const r=await authFetch(backendUrl+'/funcionarios/'+func.id,token,{method:'PUT',body:JSON.stringify({nome:form.nome.trim(),cargo:(form.cargo||'').trim(),matricula:(form.matricula||'').trim()})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||'Não foi possível salvar.');
      setEditando(false);
      onToast&&onToast('Funcionário atualizado!');
      onUpdate();
    }catch(e){onToast&&onToast(mensagemErro(e),'err');}
  };

  const uploadFoto=async(e)=>{
    const files=[...e.target.files];
    if(!files.length) return;
    setUploading(true);
    let enviadas=0;
    for(const file of files){
      const fd=new FormData();
      fd.append('foto',file);
      try{
        const r=await authFetchForm(backendUrl+'/funcionarios/'+func.id+'/fotos',token,fd);
        const d=await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(d.error||('Erro '+r.status));
        enviadas++;
      }catch(err){
        onToast&&onToast('Falha ao enviar "'+file.name+'": '+err.message,'err');
      }
    }
    setUploading(false);
    e.target.value='';
    if(enviadas) onToast&&onToast(enviadas+' foto'+(enviadas>1?'s':'')+' salva'+(enviadas>1?'s':'')+'!');
    onUpdate();
  };

  const deleteFoto=async(fid)=>{
    await authFetch(backendUrl+'/funcionarios/'+func.id+'/fotos/'+fid,token,{method:'DELETE'}).catch(()=>{});
    onUpdate();
  };

  const deleteFunc=async()=>{
    if(!await confirmar({titulo:`Remover ${func.nome}?`,texto:'As fotos do rosto saem do sistema e a pessoa deixa de ser reconhecida nas câmeras.'})) return;
    await authFetch(backendUrl+'/funcionarios/'+func.id,token,{method:'DELETE'}).catch(()=>{});
    onUpdate();
  };

  const fotos=func.fotos_rosto||[];
  const urlFoto=(f)=>backendUrl+'/funcionarios/foto/'+f.id+'?token='+token;
  return(
    <article className="card" aria-labelledby={idTitulo}>
      <header className="card-topo">
        {/* a primeira foto do rosto vira o avatar; sem foto (ou se falhar), ficam as iniciais */}
        <span className="avatar grande" aria-hidden="true">{iniciais(func.nome)}{fotos[0]&&<img src={urlFoto(fotos[0])} alt="" onError={e=>{e.target.style.display='none';}}/>}</span>
        <div className="card-txt">
          <Titulo n={nivel} className="card-nome" id={idTitulo}>{func.nome}</Titulo>
          {(func.cargo||func.matricula)&&<p className="card-sub">{[func.cargo,func.matricula&&('Nº '+func.matricula)].filter(Boolean).join(' · ')}</p>}
        </div>
        <button type="button" className="ib sm dica-dir" onClick={()=>setEditando(true)} aria-label={'Editar '+func.nome} data-dica="Editar"><Icon n="pencil"/></button>
      </header>
      <ul className="fotos" aria-label="Fotos do rosto">
        {fotos.map((f,i)=>(
          <li key={f.id} className="foto">
            <img src={urlFoto(f)} alt={'Rosto '+(i+1)+' de '+func.nome}/>
            <button type="button" className="foto-del" onClick={()=>deleteFoto(f.id)} aria-label={'Remover foto '+(i+1)}><Icon n="x"/></button>
          </li>
        ))}
        <li>
          <button type="button" className="foto-add" onClick={()=>fileRef.current.click()} aria-label="Adicionar fotos do rosto" data-dica="Fotos do rosto" disabled={uploading}>
            {uploading?<span className="giro"/>:<Icon n="plus"/>}
          </button>
        </li>
      </ul>
      <input ref={fileRef} type="file" accept="image/*" multiple hidden onChange={uploadFoto}/>
      <Progresso atual={fotos.length} meta={3} ic="scan-face" dica="Fotos do rosto (ideal 3)"/>
      <footer className="card-acoes">
        <button type="button" className="btn btn-secondary btn-sm" onClick={()=>setVerDesempenho(true)}><Icon n="chart"/>Desempenho</button>
        <button type="button" className="ib sm perigo dica-dir" onClick={deleteFunc} aria-label={'Remover '+func.nome} data-dica="Remover"><Icon n="trash"/></button>
      </footer>
      {verDesempenho&&<FuncDesempenho func={func} token={token} backendUrl={backendUrl} onClose={()=>setVerDesempenho(false)}/>}
      {editando&&<ModalNovoFunc inicial={{nome:func.nome||'',cargo:func.cargo||'',matricula:func.matricula||''}} onClose={()=>setEditando(false)} onSave={salvarEdicao}/>}
    </article>
  );
}
