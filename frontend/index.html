// Relógio que só anda enquanto há algo em andamento: tempo decorrido de uma tarefa demorada.
function useAgora(ativo){
  const [t,setT]=useState(()=>Date.now());
  useEffect(()=>{
    if(!ativo) return;
    setT(Date.now());
    const id=setInterval(()=>setT(Date.now()),1000);
    return()=>clearInterval(id);
  },[ativo]);
  return t;
}
const tempoCorrido=(seg)=>{
  const s=Math.max(0,Math.round(seg)),m=Math.floor(s/60);
  return m?`${m} min ${String(s%60).padStart(2,'0')} s`:`${s} s`;
};

/* Instala o onnx e o TensorRT no servidor (só com GPU NVIDIA). Vários cards podem
   mostrar o botão: todos leem o mesmo estado do servidor. */
function InstalarTensorRT({token,backendUrl,onPronto,onToast}){
  const [st,setSt]=useState(null);
  const [pedindo,setPedindo]=useState(false);
  const ler=async()=>{
    try{const r=await authFetch(backendUrl+'/tensorrt/dependencias',token);const d=await r.json();if(r.ok) setSt(d);return d;}catch{return null;}
  };
  useEffect(()=>{ler();},[backendUrl,token]);
  const instalando=st&&st.status==='instalando';
  useEffect(()=>{
    if(!instalando) return;
    const iv=setInterval(async()=>{
      const d=await ler();
      if(d&&d.status==='pronto'){onToast&&onToast('TensorRT instalado! Já dá para converter o modelo.');onPronto&&onPronto();}
      if(d&&d.status==='erro') onToast&&onToast('Não deu para instalar o TensorRT: '+(d.erro||'erro'),'err');
    },3000);
    return()=>clearInterval(iv);
  },[instalando]);
  const instalar=async()=>{
    if(!await confirmar({titulo:'Instalar o TensorRT neste servidor?',ic:'download',perigo:false,icBotao:'download',
      texto:`Baixa o onnx e o TensorRT da NVIDIA (${(st&&st.tamanho)||'~2 GB'}). Pode levar de 5 a 20 minutos, dependendo da internet. As câmeras continuam funcionando enquanto isso.`,botao:'Instalar'})) return;
    setPedindo(true);
    try{
      const r=await authFetch(backendUrl+'/tensorrt/dependencias',token,{method:'POST'});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||'Erro ao instalar');
      setSt(d);
      if(d.status==='pronto'){onToast&&onToast('O TensorRT já está instalado.');onPronto&&onPronto();}
    }catch(e){onToast&&onToast(mensagemErro(e,'Erro ao instalar'),'err');}
    setPedindo(false);
  };
  const agora=useAgora(instalando);
  if(instalando){
    const corrido=st.inicio?Math.max(0,(agora/1000)-st.inicio):0;
    return(
      <div className="tarefa" role="status">
        <p className="tarefa-linha"><span className="giro" aria-hidden="true"/><span>{st.etapa||'Instalando o TensorRT'}</span></p>
        <progress className="barra" max={100} value={st.pct!=null?st.pct:undefined} aria-label="Instalação do TensorRT">{st.pct!=null?st.pct+'%':''}</progress>
        <p className="tarefa-dica">Começou há {tempoCorrido(corrido)}. As câmeras continuam funcionando; o programa do servidor também mostra este andamento.</p>
      </div>
    );
  }
  return(
    <div className="instalar-trt">
      {st&&st.status==='erro'&&<p className="err-msg" style={{margin:0}}><Icon n="alert"/>{st.erro}</p>}
      <button type="button" className="btn btn-secondary btn-sm" onClick={instalar} disabled={pedindo}>
        <Icon n="download"/>{pedindo?'Começando...':(st&&st.status==='erro'?'Tentar instalar de novo':'Instalar dependências do TensorRT')}
      </button>
    </div>
  );
}

function ModelCard({model,token,backendUrl,onRefresh,onToast,onSetDefault,defaultModel,nivel=4}){
  const [saving,setSaving]=useState(false);
  const [converting,setConverting]=useState(false);
  const [requiredText,setRequiredText]=useState((model.required_items||[]).join(', '));
  const idTitulo=useId();
  const classes=(model.classes||[]);
  const canConfig=model.configurable!==false;
  const isDefault=defaultModel===model.name;
  const trt=model.tensorrt||{};
  const trtJob=trt.job||{};
  const trtRunning=trtJob.status==='running';
  // sem placa NVIDIA o TensorRT não se aplica, e "falta instalar" se resolve no bloco do servidor: nenhum dos dois é erro do modelo
  const trtForaDoModelo=!!(trt.sem_gpu||trt.pode_instalar);
  const trtError=trtForaDoModelo?'':(trt.dependency_error||trtJob.error||'');
  const trtStatusText=trt.engine_exists?'pronto':(trtRunning?'convertendo...':(trt.sem_gpu?'só com placa NVIDIA':(trt.pode_instalar?'falta instalar':(trtError?(trt.dependency_error?'dependência faltando':'erro'):(trt.available?'pode converter':'indisponível')))));
  const trtStatusColor=trt.engine_exists?'var(--ok)':(trtRunning?'var(--wn)':(trt.sem_gpu?'var(--mt)':(trt.pode_instalar?'var(--wn)':(trtError?'var(--dn)':(trt.available?'var(--wn)':'var(--dn)')))));
  const canConvertTensorRT=trt.available&&!converting&&!trtRunning&&!trt.dependency_error;
  const trtButtonText=trt.engine_exists?'Converter de novo para TensorRT':(converting||trtRunning?'Convertendo...':(trtError&&!trt.dependency_error?'Tentar converter de novo':(trt.sem_gpu?'TensorRT: só com placa NVIDIA':(trt.dependency_error?'Instale o TensorRT no servidor primeiro':'Converter para TensorRT'))));
  useEffect(()=>{
    if(!trtRunning) return;
    const id=setInterval(()=>onRefresh&&onRefresh(),5000);
    return()=>clearInterval(id);
  },[trtRunning,model.name]);
  // conversão: o TensorRT não informa andamento, então mostramos há quanto tempo começou e a estimativa
  const agora=useAgora(trtRunning);
  const trtCorrido=trtRunning&&trtJob.started_at?Math.max(0,agora/1000-trtJob.started_at):0;
  const trtEstimativa=Number(trt.estimativa_s)||0;
  const estavaConvertendo=useRef(false);
  useEffect(()=>{
    if(estavaConvertendo.current&&!trtRunning){
      if(trt.engine_exists) onToast&&onToast('Modelo convertido para TensorRT'+(trtJob.duracao_s?` (levou ${tempoCorrido(trtJob.duracao_s)})`:'')+'. As câmeras passam a usar na próxima análise.');
      else if(trtJob.error) onToast&&onToast('A conversão para TensorRT falhou: '+trtJob.error,'err');
    }
    estavaConvertendo.current=trtRunning;
  },[trtRunning]);
  const saveConfig=async()=>{
    if(!canConfig){onToast&&onToast('Faça login para configurar modelos','err');return;}
    setSaving(true);
    try{
      const required_items=requiredText.split(',').map(x=>x.trim()).filter(Boolean);
      const r=await authFetch(backendUrl+'/models/'+encodeURIComponent(model.name)+'/config',token,{method:'PUT',body:JSON.stringify({required_items,classes:model.classes||[]})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Erro ao salvar');
      onToast&&onToast(model.tipo==='base'?'Cópia da regra salva no seu usuário!':'Configuração salva!');
      onRefresh&&onRefresh();
    }catch(e){onToast&&onToast(mensagemErro(e,'Erro ao salvar'),'err');}
    setSaving(false);
  };
  const removeModel=async()=>{
    if(!model.editable) return;
    if(!await confirmar({titulo:'Remover este modelo?',texto:'Câmeras que usam este modelo passam a usar o modelo padrão.'})) return;
    try{
      const r=await authFetch(backendUrl+'/models/'+encodeURIComponent(model.name),token,{method:'DELETE'});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Erro ao remover');
      onToast&&onToast('Modelo removido!');
      onRefresh&&onRefresh();
    }catch(e){onToast&&onToast(mensagemErro(e,'Erro ao remover'),'err');}
  };
  const convertTensorRT=async()=>{
    setConverting(true);
    try{
      const r=await authFetch(backendUrl+'/models/'+encodeURIComponent(model.name)+'/tensorrt',token,{method:'POST'});
      const d=await r.json();
      if(!r.ok) throw new Error(d.tensorrt?.error||d.error||'Erro ao converter');
      onToast&&onToast('Conversão iniciada. O tempo aparece aqui e no programa do servidor.');
      onRefresh&&onRefresh();
    }catch(e){onToast&&onToast(mensagemErro(e,'Erro ao converter'),'err');}
    setConverting(false);
  };
  const exigidos=requiredText.split(',').map(x=>x.trim()).filter(Boolean);
  return(
    <article className="card" aria-labelledby={idTitulo}>
      <header className="card-topo">
        <span className="card-ico sm"><Icon n="chip"/></span>
        <div className="card-txt">
          <Titulo n={nivel} className="card-nome" id={idTitulo}>{model.display_name||model.name}</Titulo>
          <p className="card-sub" title={classes.join(', ')}>{model.size_mb} MB · {classes.length?classes.length+' classes':'classes não lidas'}</p>
        </div>
        {isDefault&&<span className="selo ok dica-dir" data-dica="Modelo padrão" role="img" aria-label="Modelo padrão"><Icon n="star"/></span>}
      </header>
      <ul className="diag" aria-label="Situação">
        <li className="chip">{model.editable?'meu':'base'}</li>
        {model.user_override&&<li className="chip">minha regra</li>}
        <li className="chip" style={{color:trtStatusColor}}><Icon n="zap"/>TensorRT: {trtStatusText}</li>
      </ul>
      {trtError&&!trtRunning&&<p className="err-msg" style={{margin:0}}><Icon n="alert"/>{trtError}</p>}
      {trtRunning&&(
        <div className="tarefa" role="status">
          <p className="tarefa-linha"><span className="giro" aria-hidden="true"/><span>Convertendo para TensorRT · há {tempoCorrido(trtCorrido)}</span></p>
          <progress className="barra" max={100} value={trtEstimativa?Math.min(96,trtCorrido/trtEstimativa*100):undefined} aria-label="Conversão para TensorRT"/>
          <p className="tarefa-dica">{trtEstimativa?`Da última vez levou ${tempoCorrido(trtEstimativa)} neste servidor.`:'Costuma levar de 3 a 10 minutos (até 20 com a placa de vídeo ocupada).'} A conversão usa a placa de vídeo: a análise das câmeras pode ficar mais lenta até terminar.</p>
        </div>
      )}
      <form className="field" style={{margin:0}} onSubmit={enviar(saveConfig)}>
        <label htmlFor={idTitulo+'-epis'}><Icon n="helmet"/>{model.tipo==='base'?'Minha regra (EPIs)':'EPIs obrigatórios'}</label>
        <input id={idTitulo+'-epis'} value={requiredText} onChange={e=>setRequiredText(e.target.value)} disabled={!canConfig} placeholder="capacete, colete"/>
        {exigidos.length>0&&<EpiSelos itens={exigidos} sm max={9} titulo="EPIs obrigatórios"/>}
      </form>
      <footer className="card-acoes">
        <button type="button" className="btn btn-primary btn-sm" onClick={saveConfig} disabled={!canConfig||saving}><Icon n="check"/>{saving?'Salvando...':'Salvar'}</button>
        <button type="button" className={"ib sm"+(isDefault?' ativo':'')} onClick={()=>onSetDefault&&onSetDefault(model.name)} aria-pressed={isDefault} aria-label="Usar como padrão" data-dica={isDefault?'Modelo padrão':'Usar como padrão'}><Icon n="star"/></button>
        <button type="button" className="ib sm" onClick={convertTensorRT} disabled={!canConvertTensorRT} aria-label={trtButtonText} data-dica={trtButtonText}><Icon n="zap"/></button>
        {model.editable&&<button type="button" className="ib sm perigo dica-dir" onClick={removeModel} aria-label="Remover modelo" data-dica="Remover"><Icon n="trash"/></button>}
      </footer>
    </article>
  );
}

/* Modelos de IA de cada servidor: os arquivos .pt, o TensorRT e a conversão ficam na máquina,
   então a lista é de um servidor por vez (com vários na conta, escolhe-se qual). */
function ModelosDoServidor({servidores,alcance,token,onToast,onMudou}){
  const vivos=servidores.filter(s=>alcance[s.id]).map(s=>({id:s.id,nome:s.nome,base:alcance[s.id].base}));
  const [sel,setSel]=useState('');
  const atual=vivos.find(v=>v.id===sel)||vivos[0];
  const base=atual?atual.base:'';
  const [modelos,setModelos]=useState(null);
  const [enviando,setEnviando]=useState(false);
  const [pct,setPct]=useState(0);
  const carregar=useCallback(async()=>{
    if(!base) return;
    try{
      const r=await authFetch(base+'/models',token);
      const d=await r.json().catch(()=>({}));
      if(r.ok&&d.models) setModelos(d.models);
    }catch{}
  },[base,token]);
  useEffect(()=>{setModelos(null);carregar();},[carregar]);
  if(!atual) return null;
  const padrao=((modelos||[]).find(m=>m.is_default)||{}).name||'';
  // o TensorRT é instalado uma vez por servidor (não por modelo): o botão e o andamento ficam aqui
  const faltaTrt=(modelos||[]).some(m=>(m.tensorrt||{}).pode_instalar&&m.configurable!==false);
  const definirPadrao=async(nome)=>{
    try{
      const r=await authFetch(base+'/models/'+encodeURIComponent(nome)+'/default',token,{method:'POST'});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||'Erro ao definir padrão');
      onToast('Modelo padrão salvo!');
      await carregar();
      onMudou&&onMudou();
    }catch(e){onToast(mensagemErro(e,'Erro ao definir padrão'),'err');}
  };
  const enviarModelo=async(file)=>{
    if(!file) return;
    if(!String(file.name||'').toLowerCase().endsWith('.pt')){onToast('Envie um arquivo .pt','err');return;}
    setEnviando(true);setPct(0);
    try{
      const fd=new FormData();
      fd.append('model',file);
      await new Promise((ok,falha)=>{
        const xhr=new XMLHttpRequest();
        xhr.open('POST',base+'/models/upload');
        xhr.setRequestHeader('Authorization','Bearer '+token);
        xhr.setRequestHeader('ngrok-skip-browser-warning','true');
        xhr.upload.onprogress=(e)=>{if(e.lengthComputable) setPct(Math.max(1,Math.round((e.loaded/e.total)*100)));};
        xhr.onload=()=>{
          try{
            const d=JSON.parse(xhr.responseText||'{}');
            if(xhr.status>=200&&xhr.status<300) ok(d); else falha(new Error(d.error||'Erro ao enviar modelo'));
          }catch(err){falha(err);}
        };
        xhr.onerror=()=>falha(new Error('Falha no envio do modelo'));
        xhr.send(fd);
      });
      await carregar();
      onMudou&&onMudou();
      onToast('Modelo enviado para '+atual.nome+'!');
    }catch(e){onToast(mensagemErro(e,'Erro ao enviar modelo'),'err');}
    setEnviando(false);setPct(0);
  };
  return(
    <section className="bloco" aria-labelledby="titulo-modelos">
      <header className="bloco-titulo">
        <Icon n="chip"/><h2 id="titulo-modelos">Modelos de IA</h2>
        <Ajuda titulo="Modelos de IA" resumo="Os modelos ficam em cada servidor. O TensorRT deixa a detecção mais rápida em placa NVIDIA.">
          <p>O <b>modelo</b> é o arquivo que reconhece as pessoas e os EPIs na imagem. Cada servidor tem os seus: enviar um arquivo .pt aqui manda só para o servidor escolhido.</p>
          <p>A estrela marca o <b>modelo padrão</b> das câmeras novas daquele servidor. “Minha regra” é a lista de EPIs que o modelo cobra por padrão.</p>
          <p><b>TensorRT</b> (só placa NVIDIA): deixa a detecção bem mais rápida. Primeiro instale as dependências (cerca de 2 GB, uma vez por servidor) e depois toque no raio para converter o modelo. A conversão leva alguns minutos e ocupa a placa de vídeo enquanto roda.</p>
        </Ajuda>
        <div className="acoes-dir">
          <label className="btn btn-primary btn-sm" style={{cursor:'pointer'}}>
            <Icon n="upload"/>{enviando?'Enviando...':'Enviar .pt'}
            <input type="file" accept=".pt" className="sr" disabled={enviando} onChange={e=>{const f=e.target.files&&e.target.files[0]; if(f) enviarModelo(f); e.target.value='';}}/>
          </label>
        </div>
      </header>
      {vivos.length>1&&(
        <Opcoes rotulo="Servidor dos modelos" valor={atual.id} onChange={setSel} className="filtros"
          opcoes={vivos.map(v=>({id:v.id,ic:'server',txt:v.nome}))}/>
      )}
      {vivos.length===1&&<p className="dica-linha" style={{marginBottom:12}}><Icon n="server"/>Modelos do servidor {atual.nome}</p>}
      {enviando&&(
        <p className="progresso" style={{marginBottom:12}}>
          <Icon n="upload"/><progress className="barra" max={100} value={pct||0} aria-label="Envio do modelo">{pct}%</progress><span aria-hidden="true">{pct}%</span>
        </p>
      )}
      {faltaTrt&&(
        <div className="trt-servidor">
          <p className="dica-linha"><Icon n="zap"/>O TensorRT deixa a detecção mais rápida na placa NVIDIA. Ainda não está instalado em {atual.nome}.</p>
          <InstalarTensorRT key={atual.id} token={token} backendUrl={base} onPronto={carregar} onToast={onToast}/>
        </div>
      )}
      {modelos===null
        ? <p className="dica-linha" role="status"><span className="giro" aria-hidden="true"/>Lendo os modelos do servidor...</p>
        : <ul className="cards" aria-label={'Modelos de '+atual.nome}>
            {modelos.map(model=><li key={atual.id+model.name}><ModelCard model={model} token={token} backendUrl={base} onRefresh={carregar} onToast={onToast} onSetDefault={definirPadrao} defaultModel={padrao} nivel={3}/></li>)}
          </ul>}
    </section>
  );
}

// Busca câmeras na rede de cada servidor da conta (um servidor por filial, por exemplo).
// Cada servidor só enxerga a rede em que está, então a câmera achada fica nele.
function NetworkCameraModal({open,onClose,backendUrl,token,servidores,onUseStream,onToast}){
  const [username,setUsername]=useState(()=>localStorage.getItem('epi_scan_user')||'');
  const [password,setPassword]=useState('');
  const [subnet,setSubnet]=useState('');
  const [alvo,setAlvo]=useState('todos');
  const [buscas,setBuscas]=useState({});        // id do servidor -> {jobId, job, result, erro}
  const [choices,setChoices]=useState({});
  const [cred,setCred]=useState({});            // servidor|ip -> {usuario, senha, rodando, erro}
  const [addedUris,setAddedUris]=useState({});
  const lista=(servidores&&servidores.length)?servidores:[{id:'_',nome:'',base:backendUrl}];
  const varios=lista.length>1;
  const loading=Object.values(buscas).some(b=>b.job&&b.job.status==='running');
  const ativos=Object.entries(buscas).filter(([,b])=>b.jobId).map(([id,b])=>id+':'+b.jobId).join(',');
  const nomeDe=(id)=>(lista.find(s=>s.id===id)||{}).nome||'';

  const runScan=async(extra={},soId)=>{
    localStorage.setItem('epi_scan_user',username||'');
    const ids=soId?[soId]:(alvo==='todos'?lista.map(s=>s.id):[alvo]);
    if(!soId){setChoices({});setCred({});}
    setBuscas(p=>{const n=soId?{...p}:{};for(const id of ids) n[id]={job:{status:'running'}};return n;});
    await Promise.all(ids.map(async id=>{
      const srv=lista.find(s=>s.id===id);
      try{
        const r=await authFetch(srv.base+'/cameras/scan/start',token,{method:'POST',body:JSON.stringify({
          username:(extra.username ?? username).trim(),
          password:extra.password ?? password,
          subnet:(extra.subnet ?? subnet).trim(),
          timeout:0.35,
          include_onvif:true
        })});
        const d=await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(d.error||'Erro ao iniciar analise');
        setBuscas(p=>({...p,[id]:{jobId:d.job_id,job:d.job}}));
      }catch(e){
        setBuscas(p=>({...p,[id]:{erro:mensagemErro(e,'Erro ao analisar a rede')}}));
      }
    }));
  };

  useEffect(()=>{
    if(!open||!ativos) return;
    let alive=true;
    const pendentes=ativos.split(',').map(x=>x.split(':'));
    const poll=async()=>{
      await Promise.all(pendentes.map(async([id,jobId])=>{
        const srv=lista.find(s=>s.id===id);
        if(!srv) return;
        try{
          const r=await authFetch(srv.base+'/cameras/scan/jobs/'+jobId,token,{method:'GET'});
          const d=await r.json().catch(()=>({}));
          if(!alive) return;
          if(!r.ok) throw new Error(d.error||'Erro ao acompanhar analise');
          if(d.job.status==='done'){
            setBuscas(p=>({...p,[id]:{job:d.job,result:d.job.result||{devices:[]}}}));
            onToast&&onToast(`${d.job.result?.count||0} câmera(s) encontradas`+(varios?' em '+srv.nome:''));
          }else if(d.job.status==='error'){
            setBuscas(p=>({...p,[id]:{erro:d.job.error||'Erro ao analisar a rede'}}));
          }else{
            setBuscas(p=>p[id]&&p[id].jobId===jobId?{...p,[id]:{...p[id],job:d.job}}:p);
          }
        }catch(e){
          if(alive) setBuscas(p=>({...p,[id]:{erro:mensagemErro(e,'Erro ao acompanhar analise')}}));
        }
      }));
    };
    poll();
    const iv=setInterval(poll,900);
    return()=>{alive=false;clearInterval(iv);};
  },[open,ativos,token]);

  const streamLabel=(st,i)=>{
    const bits=[st.label||('Stream '+(i+1))];
    if(st.resolution) bits.push(st.resolution);
    bits.push(st.source==='onvif'?'ONVIF':st.verified?'confirmado':'sugerido');
    return bits.join(' | ');
  };
  const chave=(srv,dev)=>srv.id+'|'+dev.ip;
  const selectedStreamFor=(srv,dev)=>{
    const streams=dev.streams||[];
    if(!streams.length) return null;
    const idx=Number(choices[chave(srv,dev)]||0);
    return streams[Math.max(0,Math.min(idx,streams.length-1))]||streams[0];
  };
  // Adicionar não mexe na lista: dá para adicionar várias em seguida. Só "Atualizar" busca de novo.
  const addDevice=(srv,dev)=>{
    const st=selectedStreamFor(srv,dev);
    if(!st) return;
    onUseStream&&onUseStream({...st,device:dev},srv.base);
    setAddedUris(p=>({...p,[srv.id+'|'+st.uri]:true}));
  };
  // Câmera com senha: confere só ela (com o usuário e a senha digitados no cartão dela) e troca
  // o cartão pelo resultado. As outras câmeras da lista ficam como estão.
  const conferir=async(srv,dev)=>{
    const k=chave(srv,dev);
    const c=cred[k]||{};
    setCred(p=>({...p,[k]:{...c,rodando:true,erro:''}}));
    try{
      const r=await authFetch(srv.base+'/cameras/scan',token,{method:'POST',body:JSON.stringify({
        subnet:dev.ip,username:(c.usuario||'').trim(),password:c.senha||'',timeout:0.6,include_onvif:true})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||'Não foi possível conferir esta câmera.');
      const novo=(d.devices||[]).find(x=>x.ip===dev.ip);
      if(!novo) throw new Error('A câmera não respondeu agora. Tente de novo.');
      setBuscas(p=>{
        const b=p[srv.id];
        if(!b||!b.result) return p;
        return {...p,[srv.id]:{...b,result:{...b.result,devices:b.result.devices.map(x=>x.ip===dev.ip?novo:x)}}};
      });
      const serviu=(novo.streams||[]).length>0&&!novo.precisa_senha;
      setCred(p=>({...p,[k]:{...c,rodando:false,erro:serviu?'':'Usuário ou senha não conferem. Confira e tente de novo.'}}));
    }catch(e){
      setCred(p=>({...p,[k]:{...c,rodando:false,erro:mensagemErro(e)}}));
    }
  };

  const Dispositivo=(srv,dev)=>{
    const streams=dev.streams||[];
    const selected=selectedStreamFor(srv,dev);
    const selectedUri=selected?.uri||'';
    const alreadyAdded=Boolean(selectedUri&&addedUris[srv.id+'|'+selectedUri]);
    const k=chave(srv,dev);
    const c=cred[k]||{};
    const pedeSenha=!streams.length||dev.precisa_senha;
    const nomeDev=dev.display_name||('Câmera '+dev.ip);
    const mudaCred=(patch)=>setCred(p=>({...p,[k]:{...(p[k]||{}),...patch,erro:''}}));
    return(
      <li key={dev.ip}>
        <article className={"scan-device"+(pedeSenha?' credential-open':'')} aria-label={nomeDev}>
          <header className="scan-device-top">
            <span className="card-ico sm"><Icon n={pedeSenha?'lock':'camera'}/></span>
            <div className="scan-device-main">
              <h3 className="scan-title" title={nomeDev}>{nomeDev}</h3>
              <ul className="diag" style={{marginTop:4}}>
                <li className="chip"><Icon n="globe"/>{dev.ip}</li>
                {streams.length>1&&<li className="chip">{streams.length} faixas</li>}
                {(dev.discovery||[]).includes('onvif')&&<li className="chip">ONVIF</li>}
                {(dev.open_ports||[]).includes(554)&&<li className="chip">RTSP</li>}
                {dev.senha_ok&&<li className="chip bom"><Icon n="check"/>senha conferida</li>}
                {alreadyAdded&&<li className="chip bom"><Icon n="check"/>adicionada</li>}
              </ul>
            </div>
          </header>
          {pedeSenha?(
            <form className="inline-cred" onSubmit={enviar(()=>conferir(srv,dev))} aria-label={'Senha de '+nomeDev}>
              <p className="scan-meta" style={{fontWeight:700}}><Icon n="lock"/>Digite a senha desta câmera para poder usar</p>
              <div className="scan-form">
                <Campo ic="user" rotulo="Usuário da câmera (se ela pedir)"><input value={c.usuario??username} onChange={e=>mudaCred({usuario:e.target.value})} placeholder="Usuário (vazio = admin)" autoComplete="off"/></Campo>
                <Campo ic="lock" rotulo="Senha da câmera"><input type="password" value={c.senha??password} onChange={e=>mudaCred({senha:e.target.value})} placeholder="Senha" autoComplete="off"/></Campo>
                <button type="submit" className="btn btn-primary" disabled={c.rodando}>{c.rodando?<><span className="giro"/>Conferindo...</>:<><Icon n="check"/>Conferir</>}</button>
              </div>
              {c.erro&&<p className="dica-linha alerta" role="alert"><Icon n="alert"/>{c.erro}</p>}
            </form>
          ):(
            <div className="scan-device-controls">
              <div style={{minWidth:0}}>
                <select className="scan-select largo" value={choices[k]||0} onChange={e=>setChoices(p=>({...p,[k]:e.target.value}))} aria-label={'Stream de '+nomeDev}>
                  {streams.slice(0,24).map((st,i)=><option key={(st.uri||'')+i} value={i}>{streamLabel(st,i)}</option>)}
                </select>
                <p className="scan-uri" title={maskCameraUrl(selected?.masked_uri||selected?.uri)}><code>{maskCameraUrl(selected?.masked_uri||selected?.uri)}</code></p>
              </div>
              <button type="button" className={alreadyAdded?'btn btn-secondary btn-sm':'btn btn-primary btn-sm'} onClick={()=>addDevice(srv,dev)} disabled={alreadyAdded}>
                <Icon n={alreadyAdded?'check':'plus'}/>{alreadyAdded?'Adicionada':'Adicionar'}
              </button>
            </div>
          )}
        </article>
      </li>
    );
  };

  if(!open) return null;

  const grupos=lista.filter(s=>buscas[s.id]);
  const totalCams=grupos.reduce((n,s)=>n+((buscas[s.id].result?.devices||[]).length),0);
  const terminou=grupos.length>0&&!loading;

  return(
    <Janela titulo="Câmeras na rede" ic="wifi" onClose={onClose} tamanho="medio" fecharFora={false}>
      <div className="net-corpo">
        {varios&&<p className="dica-linha"><Icon n="server"/>Cada servidor procura na rede em que está (por exemplo, na própria filial). A câmera encontrada fica no servidor que a encontrou.</p>}
        {varios&&(
          <div className="scan-alvo">
            <Campo ic="server" rotulo="Buscar na rede de">
              <select value={alvo} onChange={e=>setAlvo(e.target.value)}>
                <option value="todos">Todos os servidores ({lista.length})</option>
                {lista.map(s=><option key={s.id} value={s.id}>{s.nome}</option>)}
              </select>
            </Campo>
          </div>
        )}
        <form className="scan-form" onSubmit={enviar(()=>runScan())} aria-label="Buscar câmeras">
          <Campo ic="user" rotulo="Usuário das câmeras (opcional)"><input value={username} onChange={e=>setUsername(e.target.value)} placeholder="Usuário (opcional)" autoComplete="off" data-foco/></Campo>
          <Campo ic="lock" rotulo="Senha das câmeras (opcional)"><input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Senha (opcional)" autoComplete="off"/></Campo>
          <Campo ic="globe" rotulo="Faixa de IP (auto ou 192.168.1.0/24)"><input value={subnet} onChange={e=>setSubnet(e.target.value)} placeholder="Faixa: auto" title="auto ou 192.168.1.0/24"/></Campo>
          <button type="submit" className="btn btn-primary" disabled={loading}><Icon n={grupos.length?'refresh':'search'}/>{loading?'Buscando...':grupos.length?'Atualizar':'Buscar'}</button>
        </form>
        <p className="dica-linha"><Icon n="info"/>A busca acha também as câmeras com senha: a senha é pedida no cartão de cada uma. Adicionar não refaz a busca.</p>
        {loading&&<div className="scan-bar" role="progressbar" aria-label="Buscando câmeras"><span/></div>}
        {!grupos.length&&<p className="scan-empty"><Icon n="wifi"/>Toque em Buscar</p>}
        {terminou&&totalCams===0&&grupos.every(s=>!buscas[s.id].erro)&&<p className="scan-empty"><Icon n="video-off"/>Nenhuma câmera encontrada</p>}
        {grupos.length>0&&(
          <div className="scan-results">
            {grupos.map(srv=>{
              const b=buscas[srv.id];
              const devices=b.result?.devices||[];
              const streamTotal=devices.reduce((acc,d)=>acc+(d.streams?.length||0),0);
              return(
                <section key={srv.id} className="scan-grupo" aria-label={varios?'Câmeras na rede de '+srv.nome:'Câmeras encontradas'}>
                  {varios&&<h3 className="scan-grupo-titulo"><Icon n="server"/>{srv.nome}</h3>}
                  {b.erro&&<p className="dica-linha alerta"><Icon n="alert"/>{b.erro}</p>}
                  {b.job&&b.job.status==='running'&&varios&&<p className="dica-linha"><span className="giro"/>Procurando na rede deste servidor...</p>}
                  {b.result&&(
                    <ul className="diag" aria-label="Resultado">
                      <li className="chip"><Icon n="camera"/>{devices.length} câmera(s)</li>
                      <li className="chip"><Icon n="video"/>{streamTotal} stream(s)</li>
                      <li className="chip"><Icon n="globe"/>{(b.result.networks||[]).join(', ')||'auto'}</li>
                    </ul>
                  )}
                  {devices.length>0&&<ul className="scan-lista" aria-label={'Câmeras encontradas'+(varios?' em '+srv.nome:'')}>{devices.map(dev=>Dispositivo(srv,dev))}</ul>}
                </section>
              );
            })}
          </div>
        )}
      </div>
    </Janela>
  );
}

/* ═══ COMPONENTES DE PAINEL ═════════════════════════════════ */
const isoDe=(ts)=>{try{return new Date(ts*1000).toISOString();}catch{return undefined;}};

/* Número com rótulo: um par <dt>/<dd> dentro de <dl className="stats">. */
function Stat({ic,label,value,danger}){
  return(
    <div className={"stat"+(danger?' perigo':'')}>
      <dt>{ic&&<Icon n={ic}/>}{label}</dt>
      <dd>{value}</dd>
    </div>
  );

/* ═══ ALARME SONORO ══════════════════════════════════════════
   O navegador só libera áudio depois de um gesto do usuário; por isso o
   contexto é criado no primeiro clique/tecla e reaproveitado depois.      */
const Alarme={ctx:null,sirene:null,tocando:null};
function prepararAlarme(){
  if(Alarme.ctx) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  try{ Alarme.ctx=new AC(); }catch(e){ return; }
  // o mesmo som de sirene da TV (frontend/sons/sirene.wav)
  fetch('sons/sirene.wav').then(r=>r.arrayBuffer()).then(b=>Alarme.ctx.decodeAudioData(b)).then(buf=>{Alarme.sirene=buf;}).catch(()=>{});
}
if(typeof document!=='undefined'){
  const libera=()=>{prepararAlarme(); if(Alarme.ctx&&Alarme.ctx.state==='suspended') Alarme.ctx.resume();};
  document.addEventListener('pointerdown',libera);
  document.addEventListener('keydown',libera);
}
function bipAlarme(){
  const ctx=Alarme.ctx;
  if(!ctx||ctx.state!=='running') return;
  if(Alarme.sirene){
    if(Alarme.tocando) return;      // várias câmeras em alerta: uma sirene só
    const fonte=ctx.createBufferSource(),g=ctx.createGain();
    fonte.buffer=Alarme.sirene;
    g.gain.value=0.5;
    fonte.connect(g); g.connect(ctx.destination);
    fonte.onended=()=>{Alarme.tocando=null;};
    Alarme.tocando=fonte;
    fonte.start();
    return;
  }
  // sem o arquivo da sirene (rede caiu ao abrir): duas notas curtas no lugar
  [0,0.22].forEach((atraso,i)=>{
    const osc=ctx.createOscillator(),g=ctx.createGain();
    const t0=ctx.currentTime+atraso;
    osc.type='square';
    osc.frequency.setValueAtTime(i?760:980,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(0.16,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+0.18);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+0.2);
  });
}
function useAlarme(ativo,ligado){
  useEffect(()=>{
    if(!ativo||!ligado) return;
    bipAlarme();
    const id=setInterval(bipAlarme,4500);
    return ()=>{clearInterval(id);if(Alarme.tocando){try{Alarme.tocando.stop();}catch(e){}Alarme.tocando=null;}};
  },[ativo,ligado]);
}

/* ═══ GRÁFICOS ═══════════════════════════════════════════════
   Série única em todos: uma cor só (o azul do sistema). O índice de
   conformidade é estado, então vem com número + ícone + rótulo.
   Cada gráfico é uma lista: o leitor de tela lê "Capacete, 4" em vez de barras. */
function BarrasCategoria({dados,rotulo,valor,vazio,icone}){
  if(!dados||!dados.length) return <p className="graf-vazio">{vazio}</p>;
  const max=Math.max(...dados.map(valor),1);
  return(
    <ul className="barras">
      {dados.map((d,i)=>{
        const v=valor(d);
        return(
          <li key={i} className="barra-linha">
            <span className="barra-rot" title={rotulo(d)}>{icone&&icone(d)}{rotulo(d)}</span>
            <span className="barra-trilho" aria-hidden="true"><span className="barra-preenche" style={{display:'block',width:Math.max(v/max*100,2)+'%'}}/></span>
            <data className="barra-val" value={v}>{v}</data>
          </li>
        );
      })}
    </ul>
  );
}

function IndiceConformidade({valor,media,semRegistros,dias}){
  // Sem nenhum registro no periodo o indice nao e 100: e desconhecido. Marcar como
  // "boa conformidade" quem o sistema nunca identificou diz o contrario da verdade.
  if(semRegistros){
    return(
      <div className="indice sem-dado">
        <Icon n="scan-face"/>
        <p className="indice-num" aria-hidden="true">—</p>
        <div style={{minWidth:0}}>
          <p className="indice-lbl">Sem registros em {dias} dias</p>
          <p className="indice-sub">Pode ser que as câmeras não tenham reconhecido o rosto.</p>
        </div>
      </div>
    );
  }
  const nivel=valor>=80?'bom':valor>=50?'medio':'ruim';
  const texto={bom:'Boa conformidade',medio:'Atenção',ruim:'Crítico'}[nivel];
  const icone={bom:'shield',medio:'alert',ruim:'alert'}[nivel];
  return(
    <div className={"indice "+nivel}>
      <Icon n={icone}/>
      <p className="indice-num"><data value={valor}>{valor}</data><span className="sr"> de 100</span></p>
      <div style={{minWidth:0}}>
        <p className="indice-lbl">{texto}</p>
        <p className="indice-sub">{media} violação(ões) por dia</p>
      </div>
    </div>
  );
}

/* ═══ GRÁFICOS DO DESEMPENHO (SVG, sem biblioteca) ═════════════
   Cores em painel.css (--viz-*): paleta categórica validada nos temas claro e
   escuro. Marcas finas, grade discreta, rótulo só no pico, dica ao passar o
   mouse ou navegar com as setas do teclado, e uma tabela com os mesmos números. */
const VIZ_CORES=['var(--viz-1)','var(--viz-2)','var(--viz-3)','var(--viz-4)','var(--viz-5)'];

function useLargura(){
  const ref=useRef(null);
  const [w,setW]=useState(0);
  useEffect(()=>{
    const el=ref.current;
    if(!el) return;
    const ro=new ResizeObserver(([e])=>setW(Math.round(e.contentRect.width)));
    ro.observe(el);
    return()=>ro.disconnect();
  },[]);
  return [ref,w];
}

// teto "redondo" do eixo Y e de 3 a 5 marcas (1, 2 ou 5 vezes uma potência de 10)
function escalaY(max){
  if(!(max>0)) return {max:1,marcas:[0,1]};
  let mag=Math.pow(10,Math.floor(Math.log10(max)));
  for(let volta=0;volta<4;volta++,mag*=10){
    for(const p of [1,2,5]){
      const passo=p*mag;
      if(max/passo<=4){
        const topo=Math.ceil(max/passo-1e-9)*passo;
        const marcas=[];
        for(let v=0;v<=topo+passo/2;v+=passo) marcas.push(Number(v.toFixed(6)));
        return {max:topo,marcas};
      }
    }
  }
  return {max,marcas:[0,max]};
}

// navegação por teclado comum aos gráficos: setas, Home, End e Esc
const navegarTeclas=(n,setAtivo)=>(e)=>{
  const mover={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key];
  if(mover){e.preventDefault();setAtivo(a=>a==null?(mover>0?0:n-1):Math.max(0,Math.min(n-1,a+mover)));}
  else if(e.key==='Home'){e.preventDefault();setAtivo(0);}
  else if(e.key==='End'){e.preventDefault();setAtivo(n-1);}
  else if(e.key==='Escape') setAtivo(null);
};

function VizDica({x,largura,cor,valor,rotulo}){
  // ao lado da mira; perto da borda direita, vai para a esquerda dela
  const esquerda=x>largura*0.62;
  return(
    <div className={"viz-dica"+(esquerda?' esq':'')} style={{left:esquerda?x-10:x+10}} role="status">
      <span className="viz-chave" style={{background:cor}} aria-hidden="true"/>
      <strong>{valor}</strong><span>{rotulo}</span>
    </div>
  );
}

/* Linha no tempo: um ponto por dia do período (dias sem registro valem 0). */
function GraficoLinha({pontos,nome,cor='var(--viz-1)',formatar=String,eixo=String}){
  const [ref,w]=useLargura();
  const [ativo,setAtivo]=useState(null);
  const n=pontos.length;
  const H=176,M={t:22,r:18,b:24,l:40};
  const iw=Math.max(w-M.l-M.r,10),ih=H-M.t-M.b;
  const esc=escalaY(Math.max(0,...pontos.map(p=>p.valor)));
  const x=i=>M.l+(n<=1?iw/2:i*iw/(n-1));
  const y=v=>M.t+ih-(v/esc.max)*ih;
  const linha=pontos.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(p.valor).toFixed(1)).join('');
  const area=linha+'L'+x(n-1).toFixed(1)+','+(M.t+ih)+'L'+x(0).toFixed(1)+','+(M.t+ih)+'Z';
  const pico=pontos.reduce((b,p,i)=>p.valor>pontos[b].valor?i:b,0);
  const temPico=n>0&&pontos[pico].valor>0;
  const marcasX=[...new Set([0,Math.floor((n-1)/2),n-1])].filter(i=>i>=0);
  const mover=(e)=>{
    const r=e.currentTarget.getBoundingClientRect();
    const i=Math.round((e.clientX-r.left-M.l)/(n<=1?1:iw/(n-1)));
    setAtivo(Math.max(0,Math.min(n-1,i)));
  };
  const resumo=nome+': '+n+' dias'+(temPico?', pico de '+formatar(pontos[pico].valor)+' em '+pontos[pico].rotulo:', sem registros')+'. Use as setas para ler cada dia.';
  return(
    <figure className="viz" ref={ref}>
      {w>0&&n>0&&(
        <svg width={w} height={H} className="viz-svg" role="img" aria-label={resumo} tabIndex={0}
          onPointerMove={mover} onPointerLeave={()=>setAtivo(null)} onKeyDown={navegarTeclas(n,setAtivo)} onBlur={()=>setAtivo(null)}>
          {esc.marcas.map(t=>(
            <g key={t}>
              <line x1={M.l} x2={w-M.r} y1={y(t)} y2={y(t)} className={t===0?'viz-base':'viz-grade'}/>
              <text x={M.l-8} y={y(t)} className="viz-eixo-y">{eixo(t)}</text>
            </g>
          ))}
          {marcasX.map(i=>(
            <text key={i} x={x(i)} y={H-6} className="viz-eixo-x" textAnchor={n<=1?'middle':i===0?'start':i===n-1?'end':'middle'}>{pontos[i].rotulo}</text>
          ))}
          <path d={area} className="viz-area" style={{fill:cor}}/>
          <path d={linha} className="viz-linha" style={{stroke:cor}}/>
          {temPico&&ativo==null&&(
            <g>
              <circle cx={x(pico)} cy={y(pontos[pico].valor)} r={4} className="viz-ponto" style={{fill:cor}}/>
              <text x={x(pico)} y={y(pontos[pico].valor)-10} className="viz-rotulo"
                textAnchor={x(pico)>w-70?'end':x(pico)<M.l+40?'start':'middle'}>pico {formatar(pontos[pico].valor)}</text>
            </g>
          )}
          {ativo!=null&&(
            <g>
              <line x1={x(ativo)} x2={x(ativo)} y1={M.t} y2={M.t+ih} className="viz-mira"/>
              <circle cx={x(ativo)} cy={y(pontos[ativo].valor)} r={4.5} className="viz-ponto" style={{fill:cor}}/>
            </g>
          )}
        </svg>
      )}
      {ativo!=null&&pontos[ativo]&&<VizDica x={x(ativo)} largura={w} cor={cor} valor={formatar(pontos[ativo].valor)} rotulo={pontos[ativo].rotulo}/>}
    </figure>
  );
}

/* Colunas com rótulo no eixo X (ex.: as 24 horas do dia). */
function GraficoColunas({pontos,nome,cor='var(--viz-1)',formatar=String,rotuloEixo}){
  const [ref,w]=useLargura();
  const [ativo,setAtivo]=useState(null);
  const n=pontos.length;
  const H=176,M={t:22,r:8,b:24,l:32};
  const iw=Math.max(w-M.l-M.r,10),ih=H-M.t-M.b;
  const esc=escalaY(Math.max(0,...pontos.map(p=>p.valor)));
  const banda=iw/Math.max(n,1);
  const bw=Math.max(2,Math.min(24,banda-2));
  const x0=i=>M.l+i*banda+(banda-bw)/2;
  const y=v=>M.t+ih-(v/esc.max)*ih;
  // topo arredondado (4px), base reta
  const barra=(i,v)=>{
    const h=Math.max(0,(v/esc.max)*ih),bx=x0(i),by=M.t+ih-h,r=Math.min(4,bw/2,h);
    return `M${bx},${by+h}V${by+r}Q${bx},${by} ${bx+r},${by}H${bx+bw-r}Q${bx+bw},${by} ${bx+bw},${by+r}V${by+h}Z`;
  };
  const pico=pontos.reduce((b,p,i)=>p.valor>pontos[b].valor?i:b,0);
  const temPico=n>0&&pontos[pico].valor>0;
  const resumo=nome+(temPico?': mais registros às '+pontos[pico].rotulo+' ('+formatar(pontos[pico].valor)+')':': sem registros')+'. Use as setas para ler cada coluna.';
  return(
    <figure className="viz" ref={ref}>
      {w>0&&n>0&&(
        <svg width={w} height={H} className="viz-svg" role="img" aria-label={resumo} tabIndex={0}
          onPointerLeave={()=>setAtivo(null)} onKeyDown={navegarTeclas(n,setAtivo)} onBlur={()=>setAtivo(null)}>
          {esc.marcas.map(t=>(
            <g key={t}>
              <line x1={M.l} x2={w-M.r} y1={y(t)} y2={y(t)} className={t===0?'viz-base':'viz-grade'}/>
              <text x={M.l-8} y={y(t)} className="viz-eixo-y">{formatar(t)}</text>
            </g>
          ))}
          {pontos.map((p,i)=>(
            <g key={i} onPointerEnter={()=>setAtivo(i)}>
              <rect x={M.l+i*banda} y={M.t} width={banda} height={ih} className="viz-alvo"/>
              {p.valor>0&&<path d={barra(i,p.valor)} className={"viz-coluna"+(ativo!=null&&ativo!==i?' apagada':'')} style={{fill:cor}}/>}
              {rotuloEixo(p,i)&&<text x={M.l+i*banda+banda/2} y={H-6} className="viz-eixo-x" textAnchor="middle">{rotuloEixo(p,i)}</text>}
            </g>
          ))}
          {temPico&&ativo==null&&(
            <text x={x0(pico)+bw/2} y={y(pontos[pico].valor)-7} className="viz-rotulo"
              textAnchor={x0(pico)>w-50?'end':x0(pico)<M.l+30?'start':'middle'}>{formatar(pontos[pico].valor)}</text>
          )}
          {ativo!=null&&<rect x={M.l+ativo*banda} y={M.t} width={banda} height={ih} className="viz-foco"/>}
        </svg>
      )}
      {ativo!=null&&pontos[ativo]&&<VizDica x={x0(ativo)+bw/2} largura={w} cor={cor} valor={formatar(pontos[ativo].valor)} rotulo={pontos[ativo].rotulo}/>}
    </figure>
  );
}

/* Rosca (parte do todo): até 5 fatias + "Outros". A legenda ao lado mostra
   quantidade e porcentagem de cada fatia, então nada depende só da cor. */
function GraficoRosca({fatias,total,rotuloTotal,formatar=String}){
  const [ativo,setAtivo]=useState(null);
  const R=62,ESP=22,C=2*Math.PI*R,TAM=2*R+ESP+4;
  const soma=fatias.reduce((a,f)=>a+f.valor,0)||1;
  let acumulado=0;
  const arcos=fatias.map((f,i)=>{
    const tam=f.valor/soma*C;
    const a={...f,i,inicio:acumulado,tam:Math.max(tam-(fatias.length>1?2:0),0.5)};
    acumulado+=tam;
    return a;
  });
  const sel=ativo!=null?fatias[ativo]:null;
  const pct=(v)=>Math.round(v/soma*100)+'%';
  return(
    <div className="rosca">
      <svg width={TAM} height={TAM} viewBox={`0 0 ${TAM} ${TAM}`} className="rosca-svg" role="img"
        aria-label={fatias.map(f=>f.rotulo+': '+formatar(f.valor)+' ('+pct(f.valor)+')').join('; ')}>
        <g transform={`rotate(-90 ${TAM/2} ${TAM/2})`}>
          {arcos.map(a=>(
            <circle key={a.chave} cx={TAM/2} cy={TAM/2} r={R} fill="none" strokeWidth={ESP}
              className={"rosca-fatia"+(ativo!=null&&ativo!==a.i?' apagada':'')} style={{stroke:a.cor}}
              strokeDasharray={`${a.tam} ${C}`} strokeDashoffset={-a.inicio}
              onPointerEnter={()=>setAtivo(a.i)} onPointerLeave={()=>setAtivo(null)}/>
          ))}
        </g>
        <text x="50%" y="47%" className="rosca-num" textAnchor="middle">{sel?formatar(sel.valor):formatar(total)}</text>
        <text x="50%" y="61%" className="rosca-sub" textAnchor="middle">{sel?pct(sel.valor):rotuloTotal}</text>
      </svg>
      <ul className="rosca-legenda" aria-label="Legenda">
        {fatias.map((f,i)=>(
          <li key={f.chave} className={(ativo===i?'ativa ':'')+(f.icone?'':'sem-icone')} tabIndex={0} title={f.detalhe||f.rotulo}
            onPointerEnter={()=>setAtivo(i)} onPointerLeave={()=>setAtivo(null)} onFocus={()=>setAtivo(i)} onBlur={()=>setAtivo(null)}>
            <span className="rosca-cor" style={{background:f.cor}} aria-hidden="true"/>
            {f.icone}
            <span className="rosca-nome">{f.rotulo}</span>
            <data className="rosca-val" value={f.valor}>{formatar(f.valor)}</data>
            <span className="rosca-pct">{pct(f.valor)}</span>
          </li>
        ))}
      </ul>
    </div>
  );
}

const dataLocal=(d)=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
// um ponto por dia do período, do mais antigo para hoje (dias sem registro = 0)
function diasDoPeriodo(porDia,dias){
  const mapa=Object.fromEntries((porDia||[]).map(d=>[d.dia,d]));
  const hoje=new Date();
  const lista=[];
  for(let i=dias-1;i>=0;i--){
    const d=new Date(hoje.getFullYear(),hoje.getMonth(),hoje.getDate()-i);
    const k=dataLocal(d);
    const r=mapa[k]||{};
    lista.push({chave:k,rotulo:String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'),
      violacoes:r.violacoes||0,minutos:Math.round((r.segundos||0)/6)/10});
  }
  return lista;
}

const minutosTxt=(m)=>!m?'0':m<1?Math.round(m*60)+'s':(Number.isInteger(m)?m:m.toFixed(1))+' min';
const minutosEixo=(m)=>!m?'0':m<1?Math.round(m*60)+'s':m+'m';

// A cor segue o EPI, não a posição: ao trocar o período, quem continua na rosca
// mantém a cor (só quem entra pega uma cor livre). memoria = {epi: índice da cor}
function coresPorEpi(epis,memoria){
  const usadas=new Set();
  const cor={};
  for(const e of epis){
    const k=memoria[e];
    if(k!=null&&!usadas.has(k)){cor[e]=k;usadas.add(k);}
  }
  for(const e of epis){
    if(cor[e]!=null) continue;
    const ocupadas=new Set(Object.values(memoria));
    let k=VIZ_CORES.findIndex((_,i)=>!usadas.has(i)&&!ocupadas.has(i));
    if(k<0) k=VIZ_CORES.findIndex((_,i)=>!usadas.has(i));
    cor[e]=k;usadas.add(k);
    for(const [outro,i] of Object.entries(memoria)) if(i===k) delete memoria[outro];
    memoria[e]=k;
  }
  return cor;
}

function DashboardDesempenho({dados,memoriaCores}){
  const dias=diasDoPeriodo(dados.por_dia,dados.dias);
  const porEpi=dados.por_epi||[];
  const top=porEpi.slice(0,5);
  const resto=porEpi.slice(5);
  const cores=coresPorEpi(top.map((e,i)=>e.epi||String(i)),memoriaCores||{});
  const fatias=top.map((e,i)=>({chave:e.epi||String(i),rotulo:e.label||e.epi,valor:e.violacoes,cor:VIZ_CORES[cores[e.epi||String(i)]],
    icone:<EpiSelo item={e.epi} sm rotulo={e.label}/>}));
  if(resto.length) fatias.push({chave:'_outros',rotulo:'Outros ('+resto.length+')',valor:resto.reduce((a,e)=>a+e.violacoes,0),
    cor:'var(--viz-outros)',detalhe:resto.map(e=>(e.label||e.epi)+': '+e.violacoes).join(', ')});
  const horas=(dados.por_hora||[]).map(h=>({rotulo:String(h.hora).padStart(2,'0')+'h',valor:h.violacoes}));
  const comRegistro=dias.filter(d=>d.violacoes||d.minutos);
  const horasCom=horas.filter(h=>h.valor);
  return(
    <div className="dash">
      <section className="graf" aria-labelledby="g-viol">
        <h3 className="graf-titulo" id="g-viol"><Icon n="chart"/>Violações por dia</h3>
        <GraficoLinha nome="Violações por dia" pontos={dias.map(d=>({rotulo:d.rotulo,valor:d.violacoes}))} cor="var(--viz-1)"
          formatar={v=>v+(v===1?' violação':' violações')} eixo={String}/>
      </section>
      <section className="graf" aria-labelledby="g-tempo">
        <h3 className="graf-titulo" id="g-tempo"><Icon n="clock"/>Tempo sem EPI por dia</h3>
        <GraficoLinha nome="Tempo sem EPI por dia" pontos={dias.map(d=>({rotulo:d.rotulo,valor:d.minutos}))} cor="var(--viz-1)"
          formatar={minutosTxt} eixo={minutosEixo}/>
      </section>
      <section className="graf" aria-labelledby="g-epis">
        <h3 className="graf-titulo" id="g-epis"><Icon n="helmet"/>Quais EPIs faltaram</h3>
        {fatias.length
          ? <GraficoRosca fatias={fatias} total={dados.total_violacoes} rotuloTotal="violações"/>
          : <p className="graf-vazio">Nenhuma violação de EPI</p>}
        {resto.length>0&&(
          <details className="viz-mais">
            <summary>Ver todos os {porEpi.length} EPIs</summary>
            <BarrasCategoria dados={porEpi} rotulo={d=>d.label||d.epi} valor={d=>d.violacoes}
              icone={d=><EpiSelo item={d.epi} sm rotulo={d.label}/>} vazio=""/>
          </details>
        )}
      </section>
      {dados.por_hora&&(
        <section className="graf" aria-labelledby="g-hora">
          <h3 className="graf-titulo" id="g-hora"><Icon n="clock"/>Horário das violações</h3>
          {horasCom.length
            ? <GraficoColunas nome="Violações por horário" pontos={horas} cor="var(--viz-1)" formatar={String}
                rotuloEixo={(p,i)=>i%6===0||i===23?p.rotulo:''}/>
            : <p className="graf-vazio">Nenhuma violação no período</p>}
        </section>
      )}
      {(comRegistro.length>0||horasCom.length>0)&&(
        <details className="viz-tabela largo">
          <summary><Icon n="chart"/>Ver os números em tabela</summary>
          <div className="viz-tabelas">
            {comRegistro.length>0&&(
              <table>
                <caption>Dias com registro</caption>
                <thead><tr><th scope="col">Dia</th><th scope="col">Violações</th><th scope="col">Tempo sem EPI</th></tr></thead>
                <tbody>{comRegistro.map(d=><tr key={d.chave}><th scope="row">{d.rotulo}</th><td>{d.violacoes}</td><td>{minutosTxt(d.minutos)}</td></tr>)}</tbody>
              </table>
            )}
            {horasCom.length>0&&(
              <table>
                <caption>Horários com registro</caption>
                <thead><tr><th scope="col">Hora</th><th scope="col">Violações</th></tr></thead>
                <tbody>{horasCom.map(h=><tr key={h.rotulo}><th scope="row">{h.rotulo}</th><td>{h.valor}</td></tr>)}</tbody>
              </table>
            )}
          </div>
        </details>
      )}
    </div>
  );
}

/* ═══ FICHA DE DESEMPENHO DO FUNCIONÁRIO ════════════════════ */
function FuncDesempenho({func,token,backendUrl,onClose}){
  const [dados,setDados]=useState(null);
  const [erro,setErro]=useState('');
  const [dias,setDias]=useState(30);
  const memoriaCores=useRef({});      // cor de cada EPI na rosca, mantida ao trocar o período

  useEffect(()=>{
    let vivo=true;
    setDados(null);setErro('');
    authFetch(backendUrl+'/funcionarios/'+func.id+'/desempenho?dias='+dias,token)
      .then(r=>r.json().then(d=>{if(!r.ok) throw new Error(d.error||'Erro');return d;}))
      .then(d=>{if(vivo) setDados(d);})
      .catch(e=>{if(vivo) setErro(mensagemErro(e));});
    return ()=>{vivo=false;};
  },[func.id,dias,token,backendUrl]);

  const quando=(ts)=>new Date(ts*1000).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  const hora=(ts)=>new Date(ts*1000).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const dia=(ts)=>new Date(ts*1000).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  // de quando até quando a pessoa ficou sem o EPI
  const periodo=(ev)=>ev.em_andamento
    ? `desde ${hora(ev.ts)} · em andamento`
    : ev.fim&&ev.fim>ev.ts ? `das ${hora(ev.ts)} às ${hora(ev.fim)} · ${dur(ev.duracao||ev.fim-ev.ts)}` : `às ${hora(ev.ts)}`;
  // o nome da câmera é o apelido dado neste navegador
  const nomeCamera=(sid)=>localStorage.getItem('epi_apelido_'+sid)||(/^remote_/.test(sid)?'Celular (link)':'Câmera '+String(sid).slice(-6));
  const dur=(s)=>!s?'—':s<60?Math.round(s)+'s':Math.floor(s/60)+'min '+Math.round(s%60)+'s';
  const urlFoto=(f)=>backendUrl+'/auditoria/evidencia/'+f+'?token='+token;
  // "foi engano" / "foi falta mesmo": a decisão de quem olha vale sobre a do sistema e refaz os gráficos
  const validar=async(ev,engano)=>{
    try{
      const r=await authFetch(backendUrl+'/auditoria/eventos/'+ev.id+'/validacao',token,{method:'POST',body:JSON.stringify({engano})});
      if(!r.ok) throw new Error('Erro');
      const d=await (await authFetch(backendUrl+'/funcionarios/'+func.id+'/desempenho?dias='+dias,token)).json();
      setDados(d);
    }catch(e){setErro(mensagemErro(e));}
  };

  return(
    <Janela titulo={func.nome} ic="chart" onClose={onClose} tamanho="largo">
      <Opcoes rotulo="Período" valor={dias} onChange={setDias}
        opcoes={[7,30,90].map(n=>({id:n,ic:'calendar',txt:n+' dias'}))}/>

      {erro&&<p className="err-msg"><Icon n="alert"/>{erro}</p>}
      {!dados&&!erro&&<p className="dica-linha" role="status"><span className="giro"/>Carregando...</p>}

      {dados&&(<>
        <IndiceConformidade valor={dados.indice_conformidade} media={dados.media_por_dia}
          semRegistros={dados.sem_registros} dias={dados.dias}/>

        {dados.nao_atribuidas>0&&(
          <p className="aviso" title="O sistema viu alguém sem EPI, mas não reconheceu o rosto. Cadastre ao menos 3 fotos de rosto de cada funcionário.">
            <Icon n="scan-face"/>
            <span>{dados.nao_atribuidas} violação(ões) sem rosto reconhecido no período</span>
          </p>
        )}

        {dados.enganos_descartados>0&&(
          <p className="aviso neutro" title="Faltas curtas em que o modelo só deixou de achar o EPI e ele reapareceu logo depois. Ficam na linha do tempo, marcadas, e não entram nos gráficos.">
            <Icon n="shield"/>
            <span>{dados.enganos_descartados} registro(s) tratado(s) como provável engano do sistema: fora dos gráficos</span>
          </p>
        )}

        <dl className="stats">
          <Stat ic="alert" label="Violações" value={dados.total_violacoes} danger={dados.total_violacoes>0}/>
          <Stat ic="clock" label="Tempo sem EPI" value={dur(dados.segundos_em_violacao)}/>
          <Stat ic="calendar" label="Média por dia" value={dados.media_por_dia}/>
        </dl>

        <DashboardDesempenho dados={dados} memoriaCores={memoriaCores.current}/>

        <section className="graf">
          <h3 className="graf-titulo"><Icon n="map"/>Por área</h3>
          <BarrasCategoria dados={dados.por_area} rotulo={d=>d.area} valor={d=>d.violacoes}
            vazio="Nenhuma violação ligada a uma área"/>
        </section>

        <section className="graf">
          <h3 className="graf-titulo"><Icon n="clock"/>Linha do tempo ({(dados.ultimos_eventos||[]).length})</h3>
          {(dados.ultimos_eventos||[]).length===0
            ? <p className="graf-vazio">Nada registrado em {dados.dias} dias</p>
            : <ol className="linha-tempo">
                {dados.ultimos_eventos.map(ev=>(
                  <li key={ev.id} className={"evento"+(ev.validacao==='engano'?' engano':'')}>
                    <time className="evento-quando" dateTime={isoDe(ev.ts)}>{dia(ev.ts)}<br/>{hora(ev.ts)}</time>
                    <div className="evento-corpo">
                      <p className={"evento-tipo"+(ev.tipo==='queda'?' queda':'')}>
                        {ev.tipo==='queda'
                          ? <><Icon n="alert"/>Possível queda</>
                          : <>{ev.epi&&<EpiSelo item={ev.epi} estado="falta" sm rotulo={ev.epi_label}/>}Sem {String(ev.epi_label||ev.epi||'EPI').toLowerCase()}</>}
                        {ev.em_andamento&&<span className="selo-andamento"><Icon n="clock"/>Em andamento</span>}
                        {ev.validacao==='engano'&&<span className="selo-engano" title={ev.validacao_motivo||''}><Icon n="shield"/>Provável engano</span>}
                        {ev.validacao==='confirmada'&&<span className="selo-confirmada"><Icon n="check"/>Conferida</span>}
                      </p>
                      {ev.validacao==='engano'&&ev.validacao_motivo&&<p className="evento-motivo">{ev.validacao_motivo} Não entra nos gráficos.</p>}
                      <dl className="evento-dados">
                        <div><dt><Icon n="clock"/>Período</dt><dd>{periodo(ev)}</dd></div>
                        {ev.tipo==='violacao'&&<div><dt><Icon n="helmet"/>EPIs exigidos</dt>
                          <dd>{(ev.exigidos||[]).length?<EpiSelos itens={ev.exigidos} sm max={9} titulo="EPIs exigidos naquele momento"/>:<span className="mudo">não registrado</span>}</dd></div>}
                        <div><dt><Icon n="map"/>Área</dt><dd>{ev.area_nome||<span className="mudo">fora das áreas cadastradas</span>}</dd></div>
                        {ev.stream_id&&<div><dt><Icon n="camera"/>Câmera</dt><dd title={ev.stream_id}>{nomeCamera(ev.stream_id)}</dd></div>}
                      </dl>
                      {(ev.avisos||[]).length>0&&(
                        <ul className="evento-avisos" aria-label="Avisos falados pela TV">
                          {ev.avisos.map((a,i)=>(
                            <li key={i}><Icon n="volume"/>
                              <span><b>{hora(a.ts)}</b> · {a.tv||'TV'}{a.volume!=null?` · volume ${a.volume}%`:''}{a.falou===false?' · só a sirene':''}
                                {a.frase&&<q>{a.frase}</q>}</span>
                            </li>
                          ))}
                        </ul>
                      )}
                      {ev.tipo==='violacao'&&(
                        <p className="evento-acoes">
                          {ev.validacao==='engano'
                            ? <button type="button" className="chip" onClick={()=>validar(ev,false)}><Icon n="alert"/>Foi falta mesmo</button>
                            : <button type="button" className="chip" onClick={()=>validar(ev,true)}><Icon n="shield"/>Foi engano do sistema</button>}
                        </p>
                      )}
                      {(ev.fotos||[]).length>0&&(
                        <ul className="evidencias" aria-label="Fotos de evidência">
                          {ev.fotos.map(f=>(
                            <li key={f}>
                              <a href={urlFoto(f)} target="_blank" rel="noopener" title="Abrir evidência em nova aba">
                                <img src={urlFoto(f)} alt="Evidência do momento da violação" onError={e=>{e.target.style.display='none';}}/>
                              </a>
                            </li>
                          ))}
                        </ul>
                      )}
                    </div>
                  </li>
                ))}
              </ol>}
          <p className="dica-linha" style={{marginTop:10}}><Icon n="clock"/>Fotos de evidência somem após 7 dias</p>
        </section>
      </>)}
    </Janela>
  );
}
