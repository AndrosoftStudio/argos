function AreaCard({area,episDisponiveis,onSalvar,onRemover,nivel=3}){
  const [edit,setEdit]=useState(false);
  const [form,setForm]=useState(area);
  const idTitulo=useId();
  useEffect(()=>{setForm(area);},[area]);
  const toggle=(key)=>setForm(p=>{
    const atuais=p.epis_obrigatorios||[];
    return {...p,epis_obrigatorios:atuais.includes(key)?atuais.filter(k=>k!==key):[...atuais,key]};
  });
  const rotulos=Object.fromEntries(episDisponiveis.map(e=>[e.key,e.label]));
  const exigidos=area.epis_obrigatorios||[];

  return(
    <article className="card area-card" style={{borderLeftColor:area.cor}} aria-labelledby={idTitulo}>
      <header className="card-topo">
        <span className="area-swatch" style={{background:area.cor}}/>
        <Titulo n={nivel} className="card-nome" id={idTitulo} style={{flex:1}}>{area.nome}</Titulo>
        <button type="button" className={"ib sm"+(edit?' ativo':'')} onClick={()=>setEdit(v=>!v)} aria-expanded={edit} aria-label={edit?'Cancelar edição':'Editar área'} data-dica={edit?'Cancelar':'Editar'}><Icon n={edit?'x':'pencil'}/></button>
        <button type="button" className="ib sm perigo dica-dir" onClick={()=>onRemover(area)} aria-label={'Remover '+area.nome} data-dica="Remover"><Icon n="trash"/></button>
      </header>

      {/* os mesmos botões da câmera: tocar num EPI liga ou desliga a exigência nesta área e já salva */}
      {!edit&&(
        <EpiBotoes disponiveis={episDisponiveis.map(e=>e.key)} ativos={exigidos} rotulos={rotulos} comNomes
          titulo={'EPIs obrigatórios em '+area.nome}
          onToggle={(k,ligar)=>onSalvar({...area,epis_obrigatorios:ligar?[...exigidos.filter(x=>x!==k),k]:exigidos.filter(x=>x!==k)},true)}/>
      )}

      {edit&&(
        <form onSubmit={enviar(()=>{onSalvar(form);setEdit(false);})}>
          <div className="field-row">
            <Campo ic="text" rotulo="Nome da área"><input value={form.nome} onChange={e=>setForm(p=>({...p,nome:e.target.value}))} required/></Campo>
            <p className="field"><label className="sr" htmlFor={idTitulo+'-cor'}>Cor no vídeo</label><input id={idTitulo+'-cor'} type="color" value={form.cor} onChange={e=>setForm(p=>({...p,cor:e.target.value}))}/></p>
          </div>
          <EpiBotoes disponiveis={episDisponiveis.map(e=>e.key)} ativos={form.epis_obrigatorios||[]} rotulos={rotulos} comNomes
            titulo="EPIs obrigatórios nesta área" onToggle={k=>toggle(k)}/>
          <footer className="modal-actions" style={{marginTop:12}}>
            <button type="submit" className="btn btn-primary btn-sm"><Icon n="check"/>Salvar</button>
          </footer>
        </form>
      )}
    </article>
  );
}

function AreasBoard({token,backendUrl,onToast}){
  const [areas,setAreas]=useState([]);
  const [epis,setEpis]=useState([]);
  const [novo,setNovo]=useState('');
  const idTitulo=useId();

  const carregar=useCallback(()=>{
    authFetch(backendUrl+'/areas',token).then(r=>r.json())
      .then(d=>{setAreas(d.areas||[]);setEpis(d.epis_disponiveis||[]);})
      .catch(()=>{});
  },[token,backendUrl]);
  useEffect(()=>{carregar();},[carregar]);

  const criar=async()=>{
    const nome=novo.trim();
    if(!nome) return;
    try{
      const r=await authFetch(backendUrl+'/areas',token,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({nome})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Erro');
      setNovo('');carregar();onToast&&onToast('Área criada! Escolha os EPIs e desenhe na câmera.');
    }catch(e){onToast&&onToast(mensagemErro(e),'err');}
  };

  const salvar=async(area,quieto)=>{
    if(quieto) setAreas(l=>l.map(a=>a.id===area.id?area:a));   // botão de EPI: a tela responde na hora
    try{
      const r=await authFetch(backendUrl+'/areas/'+area.id,token,{method:'PUT',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(area)});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Erro');
      carregar();if(!quieto) onToast&&onToast('Área salva!');
    }catch(e){carregar();onToast&&onToast(mensagemErro(e),'err');}
  };

  const remover=async(area)=>{
    if(!await confirmar({titulo:`Remover a área "${area.nome}"?`,texto:'Os desenhos dela saem de todas as câmeras.'})) return;
    try{
      await authFetch(backendUrl+'/areas/'+area.id,token,{method:'DELETE'});
      carregar();onToast&&onToast('Área removida!');
    }catch(e){onToast&&onToast(mensagemErro(e),'err');}
  };

  return(
    <section className="bloco" aria-labelledby={idTitulo}>
      <header className="bloco-titulo">
        <Icon n="map"/><h2 id={idTitulo}>Áreas de risco</h2>
        <form className="acoes-dir criar-linha" onSubmit={enviar(criar)} aria-label="Nova área">
          <Campo ic="text" rotulo="Nome da nova área"><input value={novo} placeholder="Nova área (ex.: Solda)" onChange={e=>setNovo(e.target.value)}/></Campo>
          <button type="submit" className="btn btn-primary btn-sm" disabled={!novo.trim()}><Icon n="plus"/>Criar</button>
        </form>
      </header>
      {areas.length===0
        ? <div className="vazio">
            <Passos itens={[{ic:'plus',txt:'Criar a área'},{ic:'helmet',txt:'Marcar os EPIs'},{ic:'map',txt:'Desenhar na câmera'}]}/>
          </div>
        : <ul className="cards">
            {areas.map(a=><li key={a.id}><AreaCard area={a} episDisponiveis={epis} onSalvar={salvar} onRemover={remover}/></li>)}
          </ul>}
    </section>
  );
}

/* ═══ EDITOR DE ZONAS (desenha a área sobre o vídeo) ═════════
   Desenhar: clique nos cantos; fecha clicando no 1º ponto, com duplo clique ou Enter.
   Editar: clique num desenho para selecionar, arraste os pontos, troque a área ou apague.
   A imagem da câmera se atualiza sozinha enquanto a janela está aberta.          */
const CORES_AREA=['#e53935','#fb8c00','#fdd835','#43a047','#1e88e5','#8e24aa','#00acc1','#6d4c41'];
const limitar01=(v)=>Math.min(Math.max(v,0),1);
// "câmera inteira": a área que cobre o quadro todo, criada pelo botão (sem desenhar)
const zonaInteira=(z)=>z.pontos.length===4&&z.pontos.every(p=>(p[0]===0||p[0]===1)&&(p[1]===0||p[1]===1));
function centroDe(pts){
  if(!pts.length) return [0.5,0.5];
  const s=pts.reduce((a,p)=>[a[0]+p[0],a[1]+p[1]],[0,0]);
  return [s[0]/pts.length,s[1]/pts.length];
}

function ZonaEditor({streamId,token,backendUrl,onClose,onToast}){
  const [frame,setFrame]=useState(null);
  const [aoVivo,setAoVivo]=useState(true);
  const [areas,setAreas]=useState([]);
  const [episDisp,setEpisDisp]=useState([]);
  const [zonas,setZonas]=useState([]);
  const [areaAtual,setAreaAtual]=useState('');
  const [pontos,setPontos]=useState([]);          // desenho em andamento
  const [selecionada,setSelecionada]=useState(''); // id da zona em edição
  const [arrastando,setArrastando]=useState(false);
  const arrasteRef=useRef(null);                   // {zona:'id'|'', i, moveu}
  const [salvando,setSalvando]=useState(false);
  const [mudou,setMudou]=useState(false);
  const [novaArea,setNovaArea]=useState(null);     // formulário de área nova
  const [prop,setProp]=useState(16/9);             // largura/altura da imagem: o palco usa a mesma proporção
  const svgRef=useRef();
  const nomeGrupo=useId();

  const carregarAreas=useCallback(async(escolher)=>{
    try{
      const r=await authFetch(backendUrl+'/areas',token);const d=await r.json();
      setAreas(d.areas||[]);setEpisDisp(d.epis_disponiveis||[]);
      if(escolher) setAreaAtual(escolher);
      else setAreaAtual(a=>a||((d.areas||[])[0]||{}).id||'');
    }catch{}
  },[token,backendUrl]);

  useEffect(()=>{
    authFetch(backendUrl+'/streams/'+streamId+'/zonas',token).then(r=>r.json())
      .then(d=>{setZonas(d.zonas||[]);}).catch(()=>{});
    carregarAreas();
  },[streamId,token,backendUrl,carregarAreas]);

  // imagem ao vivo: um quadro novo a cada 1,5 s (pausa enquanto arrasta um ponto)
  useEffect(()=>{
    let vivo=true;
    // cru=1: a imagem limpa da câmera (sem caixas nem os desenhos antigos por cima), inteira
    const buscar=()=>authFetch(backendUrl+'/frame?cru=1&stream='+streamId,token)
      .then(r=>r.status===204?null:r.json())
      .then(d=>{if(vivo&&d&&d.frame) setFrame('data:image/jpeg;base64,'+d.frame);})
      .catch(()=>{});
    buscar();
    if(!aoVivo) return()=>{vivo=false;};
    const iv=setInterval(()=>{if(!document.hidden) buscar();},1500);
    return()=>{vivo=false;clearInterval(iv);};
  },[streamId,token,backendUrl,aoVivo]);

  const areaPorId=(id)=>areas.find(a=>a.id===id);
  const corDe=(id)=>(areaPorId(id)||{}).cor||'#c81e1e';
  const zonaSel=zonas.find(z=>z.id===selecionada)||null;

  const posicao=(e)=>{
    const r=svgRef.current.getBoundingClientRect();
    return [limitar01((e.clientX-r.left)/r.width),limitar01((e.clientY-r.top)/r.height)];
  };
  // perto do 1º ponto (em pixels da tela): clicar ali fecha o desenho
  const pertoDoInicio=(e)=>{
    if(pontos.length<3) return false;
    const r=svgRef.current.getBoundingClientRect();
    const dx=(pontos[0][0]*r.width+r.left)-e.clientX, dy=(pontos[0][1]*r.height+r.top)-e.clientY;
    return Math.hypot(dx,dy)<14;
  };

  const fecharPoligono=useCallback(()=>{
    if(pontos.length<3){onToast&&onToast('Marque pelo menos 3 cantos para fechar a área.','err');return;}
    if(!areaAtual){onToast&&onToast('Escolha ou crie a área antes de desenhar.','err');return;}
    const id='z'+Date.now();
    setZonas(z=>[...z,{id,area_id:areaAtual,pontos}]);
    setPontos([]);setSelecionada(id);setMudou(true);
  },[pontos,areaAtual,onToast]);

  const cliqueNoPalco=(e)=>{
    const arraste=arrasteRef.current;
    arrasteRef.current=null;
    if(arraste&&arraste.moveu) return;     // fim de um arraste, não é clique
    if(e.detail>1) return;                 // o duplo clique fecha (abaixo), sem somar ponto
    if(pertoDoInicio(e)){fecharPoligono();return;}
    if(selecionada&&!pontos.length){
      setSelecionada('');
      // clique fora tira a seleção; com a câmera inteira selecionada não existe "fora": já começa o desenho
      if(!(zonaSel&&zonaInteira(zonaSel))) return;
    }
    setPontos(p=>[...p,posicao(e)]);
  };
  const duploClique=(e)=>{e.preventDefault();if(pontos.length>=3) fecharPoligono();};

  const selecionarZona=(e,z)=>{
    if(pontos.length) return;              // desenhando: o clique vira ponto
    e.stopPropagation();
    setSelecionada(z.id);setAreaAtual(z.area_id);
  };

  // arrastar um ponto: só conta como arraste se o mouse andou; sem andar, vira clique
  // (clicar no 1º ponto fecha o desenho)
  const comecarArrasto=(e,zona,i)=>{
    e.stopPropagation();
    arrasteRef.current={zona,i,moveu:false,x:e.clientX,y:e.clientY};
    setArrastando(true);
  };
  const mover=(e)=>{
    const a=arrasteRef.current;
    if(!a||!arrastando) return;
    if(!a.moveu&&Math.hypot(e.clientX-a.x,e.clientY-a.y)<4) return;
    a.moveu=true;
    const p=posicao(e);
    if(!a.zona) setPontos(l=>l.map((q,j)=>j===a.i?p:q));
    else{setZonas(l=>l.map(z=>z.id!==a.zona?z:{...z,pontos:z.pontos.map((q,j)=>j===a.i?p:q)}));setMudou(true);}
  };
  const soltar=()=>{
    setArrastando(false);
    const a=arrasteRef.current;
    if(a&&a.moveu) setTimeout(()=>{if(arrasteRef.current===a) arrasteRef.current=null;},0);
  };

  const apagarSelecionada=useCallback(()=>{
    if(!selecionada) return;
    setZonas(l=>l.filter(z=>z.id!==selecionada));setSelecionada('');setMudou(true);
  },[selecionada]);
  const apagarPonto=(zonaId,i)=>{
    setZonas(l=>l.map(z=>z.id!==zonaId||z.pontos.length<=3?z:{...z,pontos:z.pontos.filter((_,j)=>j!==i)}));
    setMudou(true);
  };
  const trocarArea=(id)=>{
    setAreaAtual(id);
    if(selecionada){setZonas(l=>l.map(z=>z.id===selecionada?{...z,area_id:id}:z));setMudou(true);}
  };
  // a câmera inteira como área: sem desenhar nada, todo mundo que aparece é cobrado pelos EPIs dela
  const telaInteira=()=>{
    if(!areaAtual){onToast&&onToast('Escolha ou crie a área antes.','err');return;}
    const id='z'+Date.now();
    setZonas(z=>[...z.filter(x=>!zonaInteira(x)),{id,area_id:areaAtual,pontos:[[0,0],[1,0],[1,1],[0,1]]}]);
    setPontos([]);setSelecionada(id);setMudou(true);
  };
  // EPIs da área escolhida, pelos mesmos botões da câmera (salva na hora)
  const areaSel=areas.find(a=>a.id===areaAtual)||null;
  const toggleEpiArea=async(k,ligar)=>{
    if(!areaSel) return;
    const atuais=areaSel.epis_obrigatorios||[];
    const nova={...areaSel,epis_obrigatorios:ligar?[...atuais.filter(x=>x!==k),k]:atuais.filter(x=>x!==k)};
    setAreas(l=>l.map(a=>a.id===nova.id?nova:a));
    try{
      const r=await authFetch(backendUrl+'/areas/'+nova.id,token,{method:'PUT',body:JSON.stringify(nova)});
      if(!r.ok) throw new Error((await r.json()).error||'Erro');
    }catch(e){carregarAreas(nova.id);onToast&&onToast(mensagemErro(e),'err');}
  };

  // teclado: Enter fecha, Esc cancela, Backspace desfaz, Delete apaga o desenho selecionado
  useEffect(()=>{
    const tecla=(e)=>{
      const alvo=e.target&&e.target.tagName;
      if(['INPUT','TEXTAREA','SELECT'].includes(alvo)) return;
      if(e.key==='Enter'&&pontos.length>=3){e.preventDefault();fecharPoligono();}
      else if(e.key==='Escape'&&(pontos.length||selecionada)){e.preventDefault();e.stopPropagation();setPontos([]);setSelecionada('');}
      else if((e.key==='Backspace'||(e.key==='z'&&(e.ctrlKey||e.metaKey)))&&pontos.length){e.preventDefault();setPontos(p=>p.slice(0,-1));}
      else if(e.key==='Delete'&&selecionada){e.preventDefault();apagarSelecionada();}
    };
    window.addEventListener('keydown',tecla,true);
    return()=>window.removeEventListener('keydown',tecla,true);
  },[pontos,selecionada,fecharPoligono,apagarSelecionada]);

  const criarArea=async()=>{
    const nome=(novaArea.nome||'').trim();
    if(!nome){onToast&&onToast('Dê um nome à área.','err');return;}
    try{
      const r=await authFetch(backendUrl+'/areas',token,{method:'POST',
        body:JSON.stringify({nome,cor:novaArea.cor,epis_obrigatorios:novaArea.epis})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Erro');
      const area=d.area||{};
      setNovaArea(null);
      await carregarAreas(area.id);
      if(selecionada&&area.id){setZonas(l=>l.map(z=>z.id===selecionada?{...z,area_id:area.id}:z));setMudou(true);}
      onToast&&onToast('Área criada! Agora desenhe onde ela fica.');
    }catch(e){onToast&&onToast(mensagemErro(e),'err');}
  };

  const salvar=async()=>{
    if(pontos.length>=3){onToast&&onToast('Feche o desenho atual (Enter) ou cancele (Esc) antes de salvar.','err');return;}
    setSalvando(true);
    try{
      const r=await authFetch(backendUrl+'/streams/'+streamId+'/zonas',token,
        {method:'POST',body:JSON.stringify({zonas})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Erro');
      onToast&&onToast('Áreas mapeadas nesta câmera!');
      setMudou(false);
      onClose();
    }catch(e){onToast&&onToast(mensagemErro(e),'err');}
    setSalvando(false);
  };
  const fechar=async()=>{
    if(mudou&&!await confirmar({titulo:'Sair sem salvar?',texto:'Os desenhos novos desta câmera serão descartados.',botao:'Sair',ic:'x'})) return;
    onClose();
  };

  const pathDe=(pts)=>pts.map(p=>(p[0]*100)+','+(p[1]*100)).join(' ');
  const alca=(p,i,zona,cor)=>(
    <g key={(zona||'novo')+'-'+i}>
      <circle cx={p[0]*100} cy={p[1]*100} r="2.6" fill="#000" fillOpacity="0" pointerEvents="all" className="zona-alca-area"
        onPointerDown={e=>comecarArrasto(e,zona,i)}
        onClick={zona?(e=>{e.stopPropagation();arrasteRef.current=null;}):undefined}
        onDoubleClick={zona?(e=>{e.stopPropagation();apagarPonto(zona,i);}):undefined}/>
      <circle cx={p[0]*100} cy={p[1]*100} r={(!zona&&i===0&&pontos.length>=3)?1.6:1.1} fill="#fff"
        stroke={cor} strokeWidth="2" vectorEffect="non-scaling-stroke" pointerEvents="none"/>
    </g>
  );
  const dica=pontos.length
    ? (pontos.length<3?`Clique nos cantos da área · ${pontos.length} ponto(s)`:'Clique no 1º ponto, dê duplo clique ou Enter para fechar · Esc cancela')
    : (zonaSel?'Arraste os pontos para ajustar · duplo clique num ponto apaga o ponto · Delete apaga o desenho'
              :'Clique na imagem para começar a desenhar · clique num desenho para editar');

  return(
    <Janela titulo="Mapear áreas" ic="map" onClose={fechar} tamanho="tela" fecharFora={false}>
     <div className="zona-editor">
      <div className="zona-col-imagem">
      {/* o palco tem a proporção da câmera e cabe inteiro na janela: nada é cortado, em pé ou deitada */}
      <figure className={"zona-palco"+(frame?'':' vazio')} style={{'--prop':prop}}>
        {frame
          ? <img src={frame} alt="Imagem atual da câmera" draggable={false}
              onLoad={e=>{const i=e.target;if(i.naturalWidth&&i.naturalHeight) setProp(i.naturalWidth/i.naturalHeight);}}/>
          : <p className="zona-sem-frame"><Icon n="video-off"/>Câmera desligada: dá para usar “Câmera inteira” ou desenhar no escuro; ligue a câmera para ver a imagem</p>}
            <svg ref={svgRef} className={"zona-svg"+(arrastando?' arrastando':'')} viewBox="0 0 100 100" preserveAspectRatio="none"
              onClick={cliqueNoPalco} onDoubleClick={duploClique} onPointerMove={mover} onPointerUp={soltar} onPointerCancel={soltar}
              role="img" aria-label={'Desenho das áreas: '+zonas.length+' área(s), '+pontos.length+' ponto(s) no desenho atual'}>
              {zonas.map(z=>{
                const sel=z.id===selecionada;
                return(
                  /* a câmera inteira fica por baixo e não pega o clique (senão não daria para desenhar outra
                     área por cima dela); ela é selecionada pela lista de áreas desenhadas, embaixo */
                  <polygon key={z.id} points={pathDe(z.pontos)} fill={corDe(z.area_id)} fillOpacity={zonaInteira(z)?(sel?0.2:0.1):(sel?0.38:0.24)}
                    stroke={sel?'#fff':corDe(z.area_id)} strokeWidth={sel?2.5:1.5} strokeDasharray={sel?'6 3':undefined}
                    vectorEffect="non-scaling-stroke" className="zona-poligono" pointerEvents={zonaInteira(z)?'none':undefined}
                    onClick={e=>selecionarZona(e,z)}/>
                );
              })}
              {pontos.length>1&&(
                <polyline points={pathDe(pontos)} fill="none" stroke={corDe(areaAtual)} strokeWidth="2"
                  strokeDasharray="4 3" vectorEffect="non-scaling-stroke" pointerEvents="none"/>
              )}
              {zonaSel&&zonaSel.pontos.map((p,i)=>alca(p,i,zonaSel.id,corDe(zonaSel.area_id)))}
              {pontos.map((p,i)=>alca(p,i,'',corDe(areaAtual)))}
            </svg>
            {zonas.map(z=>{
              const c=centroDe(z.pontos);const a=areaPorId(z.area_id);
              return <span key={'r'+z.id} className="zona-rotulo" style={{left:(c[0]*100)+'%',top:(c[1]*100)+'%',background:corDe(z.area_id)}}>{(a||{}).nome||'Área removida'}</span>;
            })}
            {frame&&<button type="button" className={"zona-vivo"+(aoVivo?' on':'')} onClick={()=>setAoVivo(v=>!v)}
              aria-pressed={aoVivo} title={aoVivo?'Congelar a imagem':'Voltar a atualizar a imagem'}>
              <Icon n={aoVivo?'pause':'play'}/>{aoVivo?'Ao vivo':'Congelada'}
            </button>}
      </figure>
      <p className="dica-linha" style={{marginTop:10}}><Icon n="pointer"/>{dica}</p>
      </div>

      <div className="zona-col-lado">
      <fieldset className="zona-areas">
        <legend className="sr">{selecionada?'Área do desenho selecionado':'Área que estou desenhando'}</legend>
        {areas.map(a=>(
          <label key={a.id} className={"zona-area"+(areaAtual===a.id?' ativo':'')}>
            <input type="radio" className="sr" name={nomeGrupo} checked={areaAtual===a.id} onChange={()=>trocarArea(a.id)}/>
            <span className="area-swatch" style={{background:a.cor}}/>{a.nome}
            {(a.epis_obrigatorios||[]).length>0&&<EpiSelos itens={a.epis_obrigatorios} sm max={4}/>}
          </label>
        ))}
        <button type="button" className="zona-area" onClick={()=>setNovaArea(novaArea?null:{nome:'',cor:CORES_AREA[areas.length%CORES_AREA.length],epis:[]})}
          aria-expanded={Boolean(novaArea)}><Icon n={novaArea?'x':'plus'}/>{novaArea?'Cancelar':'Nova área'}</button>
      </fieldset>

      {areaSel&&!novaArea&&episDisp.length>0&&(
        <div className="zona-epis">
          <p className="dica-linha"><Icon n="helmet"/>EPIs exigidos em <strong>{areaSel.nome}</strong></p>
          <EpiBotoes disponiveis={episDisp.map(e=>e.key)} ativos={areaSel.epis_obrigatorios||[]} onToggle={toggleEpiArea}
            rotulos={Object.fromEntries(episDisp.map(e=>[e.key,e.label]))} titulo={'EPIs exigidos em '+areaSel.nome} comNomes/>
        </div>
      )}

      {novaArea&&(
        <form className="zona-nova" onSubmit={enviar(criarArea)} aria-label="Nova área">
          <div className="field-row">
            <Campo ic="text" rotulo="Nome da área"><input autoFocus value={novaArea.nome} placeholder="Nome (ex.: Solda, Andaime)" onChange={e=>setNovaArea(p=>({...p,nome:e.target.value}))}/></Campo>
            <p className="field"><label className="sr" htmlFor={nomeGrupo+'-cor'}>Cor</label><input id={nomeGrupo+'-cor'} type="color" value={novaArea.cor} onChange={e=>setNovaArea(p=>({...p,cor:e.target.value}))}/></p>
          </div>
          {episDisp.length>0&&(<>
            <p className="dica-linha">EPIs obrigatórios nesta área (nenhum = área livre, sem alarme)</p>
            <EpiBotoes disponiveis={episDisp.map(e=>e.key)} ativos={novaArea.epis} comNomes
              rotulos={Object.fromEntries(episDisp.map(e=>[e.key,e.label]))} titulo="EPIs obrigatórios na área nova"
              onToggle={(k,ligar)=>setNovaArea(p=>({...p,epis:ligar?[...p.epis,k]:p.epis.filter(x=>x!==k)}))}/>
          </>)}
          <p className="acoes"><button type="submit" className="btn btn-primary btn-sm" disabled={!novaArea.nome.trim()}><Icon n="check"/>Criar área</button></p>
        </form>
      )}

      <div className="aj-linha zona-ferramentas">
        {pontos.length>0
          ? <>
              <button type="button" className="btn btn-primary btn-sm" onClick={fecharPoligono} disabled={pontos.length<3}><Icon n="check"/>Fechar área</button>
              <button type="button" className="btn btn-secondary btn-sm" onClick={()=>setPontos(p=>p.slice(0,-1))}><Icon n="undo"/>Desfazer ponto</button>
              <button type="button" className="btn btn-secondary btn-sm" onClick={()=>setPontos([])}><Icon n="x"/>Cancelar desenho</button>
            </>
          : <>
              <button type="button" className="btn btn-secondary btn-sm" onClick={telaInteira} disabled={!areaAtual}
                title="Usa a câmera inteira como área, sem desenhar"><Icon n="maximize"/>Câmera inteira</button>
              {zonaSel&&<button type="button" className="btn btn-danger btn-sm" onClick={apagarSelecionada}><Icon n="trash"/>Apagar desenho</button>}
            </>}
      </div>

      {zonas.length>0&&(
        <ul className="zona-legenda" aria-label="Áreas desenhadas nesta câmera">
          {zonas.map(z=>(
            <li key={z.id} className={"zona-item"+(z.id===selecionada?' ativo':'')}>
              <button type="button" className="zona-item-nome" onClick={()=>{setPontos([]);setSelecionada(z.id);setAreaAtual(z.area_id);}}>
                <span className="area-swatch" style={{background:corDe(z.area_id)}}/>
                {(areaPorId(z.area_id)||{}).nome||'Área removida'}
              </button>
              <button type="button" className="ib sm perigo" style={{width:28,height:28}} onClick={()=>{setZonas(list=>list.filter(x=>x.id!==z.id));if(selecionada===z.id)setSelecionada('');setMudou(true);}} aria-label="Apagar este desenho"><Icon n="x"/></button>
            </li>
          ))}
        </ul>
      )}

      <p className="dica-linha" style={{marginTop:10}}><Icon n="user"/>A pessoa conta como dentro da área pelo ponto dos pés. Onde duas áreas se cruzam vale a menor (a mais específica). Fora de todas valem os EPIs ligados nos botões da câmera.</p>

      <footer className="modal-actions">
        <button type="button" className="btn btn-secondary" onClick={fechar}>Cancelar</button>
        <button type="button" className="btn btn-primary" onClick={salvar} disabled={salvando}><Icon n="check"/>{salvando?'Salvando...':'Salvar'}</button>
      </footer>
      </div>
     </div>
    </Janela>
  );
}

/* ═══ APP ════════════════════════════════════════════════════ */
// #servidores abre Ajustes já na aba Servidores (fora do menu, mas o endereço antigo continua valendo)
const PAGINAS=[...NAV_ITEMS.map(i=>i.id),'servidores'];
const paginaDoHash=()=>{
  const h=decodeURIComponent(window.location.hash.slice(1));
  return PAGINAS.includes(h)?h:'cameras';
};

function App(){
  const [token,setToken]=useState(()=>localStorage.getItem('epi_token')||'');
  const [user,setUser]=useState(null);
  // a página vem do endereço (#cameras, #epis...): link direto e "voltar" funcionam
  const [page,setPage]=useState(paginaDoHash);
  // servidor principal deste painel (EPIs, equipe, áreas, modelos). As câmeras podem
  // rodar em qualquer servidor da conta: cada uma guarda o endereço do seu.
  const [backendUrl,setBackendUrl]=useState(CONFIG_BACKEND_URL);
  const [servidores,setServidores]=useState([]);
  const [alcance,setAlcance]=useState({});
  const [principalId,setPrincipalId]=useState('');
  const [buscandoServidores,setBuscandoServidores]=useState(false);
  const [servidoresCarregados,setServidoresCarregados]=useState(false);
  const [completarCadastro,setCompletarCadastro]=useState(false);
  const [online,setOnline]=useState(false);
  const [streams_list,setStreamsList]=useState([]);
  const [defaultModel,setDefaultModel]=useState(()=>localStorage.getItem('epi_defaultModel')||'yolo26n.pt');
  // GPU ou CPU é escolhido por servidor (Ajustes > Servidores); a câmera só pede 'auto'
  const device='auto';
  const [serverLinks,setServerLinks]=useState({});
  const [toast,setToast]=useState(null);
  const [paused,setPaused]=useState(false);
  // id estavel do backend (vem de /status); vai no link do celular para o hub achar o servidor
  const [nodeId,setNodeId]=useState('');
  // A sirene e a voz saem na TV (Dispositivos > link de TV). Neste painel o som vem desligado
  // e só toca se alguém ligar aqui (quem não tem TV pode querer ouvir no computador).
  const [alarmeLigado,setAlarmeLigado]=useState(()=>localStorage.getItem('epi_som_painel')==='1');
  // modo projetor: tudo maior e com mais contraste, para a tela ser projetada
  const [modoProjetor,setModoProjetor]=useState(()=>localStorage.getItem('epi_projetor')==='1');
  // tema: 'sistema' (padrão) segue o aparelho; 'claro' e 'escuro' mandam no aparelho
  const [tema,setTema]=useState(()=>localStorage.getItem('epi_tema')||'sistema');
  useEffect(()=>{
    document.documentElement.classList.toggle('modo-projetor',modoProjetor);
    localStorage.setItem('epi_projetor',modoProjetor?'1':'0');
  },[modoProjetor]);
  useEffect(()=>{
    localStorage.setItem('epi_tema',tema);
    // Projetor lava cor escura: enquanto ele está ligado o tema é sempre o claro
    // de alto contraste, independente do que o usuário escolheu aqui.
    const efetivo=modoProjetor?'claro':tema;
    if(efetivo==='sistema') document.documentElement.removeAttribute('data-tema');
    else document.documentElement.setAttribute('data-tema',efetivo);
    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta){
      const escuro=efetivo==='escuro'||(efetivo==='sistema'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
      meta.setAttribute('content',escuro?'#080a1d':'#3740b4');
    }
  },[tema,modoProjetor]);
  useEffect(()=>{
    const aoMudar=()=>{setPage(paginaDoHash());window.scrollTo({top:0});};
    window.addEventListener('hashchange',aoMudar);
    return()=>window.removeEventListener('hashchange',aoMudar);
  },[]);
  const [availableModels,setAvailableModels]=useState([]);
  const [uploadingModel,setUploadingModel]=useState(false);
  const [uploadPct,setUploadPct]=useState(0);
  const [camTokens,setCamTokens]=useState([]);
  const [epis,setEpis]=useState([]);
  const [funcs,setFuncs]=useState([]);
  const [showNovoEpi,setShowNovoEpi]=useState(false);
  const [showNovoFunc,setShowNovoFunc]=useState(false);
  const [showNetCam,setShowNetCam]=useState(false);
  const [treinandoFaces,setTreinandoFaces]=useState(false);
  const [rostos,setRostos]=useState(null);   // situação do reconhecimento facial
  // modo de visualização das câmeras; vazio = decide sozinho pelo número de câmeras
  const [visual,setVisual]=useState(()=>localStorage.getItem('epi_visual')||'');
  const escolherVisual=(v)=>{setVisual(v);localStorage.setItem('epi_visual',v);};
  const nextIndex=useRef(0);
  // FIX remover câmera: conjunto de streams gerenciados localmente
  const managedStreams=useRef(new Set());
  const alcanceRef=useRef({});
  const principalRef=useRef('');
  useEffect(()=>{alcanceRef.current=alcance;},[alcance]);
  const idServidor=useId();

  const loadTokens=useCallback(async(bUrl,tok)=>{
    try{const r=await fetch((bUrl||INITIAL_API)+'/cam_tokens',{headers:{'Authorization':'Bearer '+(tok||token),'ngrok-skip-browser-warning':'true'}});
    if(r.ok){const d=await r.json();if(d.tokens)setCamTokens(d.tokens);}}catch{}
  },[token]);

  const loadEpis=useCallback(async()=>{
    try{const r=await authFetch(backendUrl+'/epis',token);if(r.ok){const d=await r.json();setEpis(d.epis||[]);}}catch{}
  },[token,backendUrl]);

  const loadFuncs=useCallback(async()=>{
    try{const r=await authFetch(backendUrl+'/funcionarios',token);if(r.ok){const d=await r.json();setFuncs(d.funcionarios||[]);}}catch{}
  },[token,backendUrl]);

  const [novoDisp,setNovoDisp]=useState(false);
  const [filtroDisp,setFiltroDisp]=useState('todos');
  const addToken=()=>setNovoDisp(true);
  const criarDispositivo=async({tipo,nome})=>{
    setNovoDisp(false);
    try{
      const r=await authFetch(backendUrl+'/cam_tokens',token,{method:'POST',body:JSON.stringify({nome,tipo})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||'Não foi possível criar o link.');
      // servidor de versão antiga ignora o tipo e cria um link de câmera: avisa em vez de entregar o link errado
      if(tipo==='tv'&&!String((d.token||{}).token||'').startsWith('tv_')){
        showToast('Este servidor ainda não tem a TV de avisos. Atualize o Argos EPI Servidor.','err');
        if(d.token&&d.token.token) authFetch(backendUrl+'/cam_tokens/'+d.token.token,token,{method:'DELETE'}).catch(()=>{});
      }else showToast(tipo==='tv'?'Link de TV criado. Copie e abra na TV.':'Link criado. Copie e abra no celular.');
      loadTokens(backendUrl,token);
    }catch(e){showToast(mensagemErro(e),'err');}
  };
  const delToken=async(t)=>{
    const tv=t.tipo==='tv';
    if(!await confirmar({titulo:tv?'Remover esta TV?':'Remover este celular?',texto:tv?'O link para de funcionar e a TV deixa de tocar os avisos.':'O link para de funcionar e a transmissão dele para na hora.'}))return;
    try{await authFetch(backendUrl+'/cam_tokens/'+t.token,token,{method:'DELETE'});loadTokens(backendUrl,token);}catch{}
  };
  const renomearToken=async(t)=>{
    const nome=await pedirTexto({titulo:'Nome do dispositivo',ic:t.tipo==='tv'?'tv':'phone',valor:t.nome,placeholder:'Nome'});
    if(!nome||nome===t.nome) return;
    try{
      const r=await authFetch(backendUrl+'/cam_tokens/'+t.token,token,{method:'PUT',body:JSON.stringify({nome})});
      if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||'Não foi possível renomear.');
      loadTokens(backendUrl,token);
    }catch(e){showToast(mensagemErro(e),'err');}
  };
  const testarTv=async()=>{
    try{
      const r=await authFetch(backendUrl+'/tv/teste',token,{method:'POST',body:'{}'});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||'Não foi possível enviar o teste.');
      showToast(`Aviso de teste enviado para ${d.tvs} TV(s).`+((d.voz||{}).status==='pronta'?'':' A voz ainda não está instalada neste servidor: sai só a sirene.'));
    }catch(e){showToast(mensagemErro(e),'err');}
  };

  const showToast=(msg,type='ok')=>{setToast({msg,type});setTimeout(()=>setToast(null),3000);};
  const copyURL=(t)=>{try{navigator.clipboard.writeText(t);}catch{} showToast('Link copiado!');};

  const onLogin=(tok,usr,extra={})=>{
    setToken(tok);setUser(usr);
    localStorage.setItem('epi_token',tok);
    // primeiro login pelo Google: pede o resto do cadastro (dá para deixar para depois)
    if(extra.novo) setCompletarCadastro(true);
  };

  const logout=()=>{
    setToken('');setUser(null);localStorage.removeItem('epi_token');
    setStreamsList([]);setServidores([]);setAlcance({});setPrincipalId('');principalRef.current='';setServidoresCarregados(false);
    if(!CONFIG_BACKEND_URL) setBackendUrl('');
    managedStreams.current.clear();
  };

  // a sessão vem do site: confere e renova o token ao abrir e a cada 12 h
  useEffect(()=>{
    if(!token) return;
    let vivo=true;
    const renovar=()=>apiSite('/auth/renovar',{token,method:'POST'}).then(d=>{
      if(!vivo) return;
      setUser(d.user);
      if(d.token&&d.token!==token){localStorage.setItem('epi_token',d.token);setToken(d.token);}
    }).catch(e=>{
      if(!vivo) return;
      if(e.status===401||e.status===403){setToken('');setUser(null);localStorage.removeItem('epi_token');}
    });
    if(!user) renovar();
    const iv=setInterval(renovar,RENOVAR_MS);
    return()=>{vivo=false;clearInterval(iv);};
  },[token]);

  // servidores da conta: lista do site + teste de quais respondem daqui
  const carregarServidores=useCallback(async({trocarPrincipal=false}={})=>{
    if(!token) return;
    setBuscandoServidores(true);
    try{
      const d=await apiSite('/servidores',{token});
      const lista=d.servidores||[];
      const alc=await localizarServidores(lista);
      setServidores(lista);setAlcance(alc);
      if(!CONFIG_BACKEND_URL){
        const atual=principalRef.current;
        const manter=!trocarPrincipal&&atual&&alc[atual];
        const escolhido=manter?lista.find(s=>s.id===atual):melhorServidor(lista,alc);
        principalRef.current=escolhido?escolhido.id:'';
        setPrincipalId(principalRef.current);
        setBackendUrl(escolhido?alc[escolhido.id].base:'');
      }
    }catch(e){
      if(e.status===401){setToken('');setUser(null);localStorage.removeItem('epi_token');}
    }
    setBuscandoServidores(false);
    setServidoresCarregados(true);
  },[token]);
  useEffect(()=>{
    if(!token) return;
    carregarServidores();
    const iv=setInterval(()=>{if(!document.hidden) carregarServidores();},30000);
    return()=>clearInterval(iv);
  },[token,carregarServidores]);
  const usarServidor=(s)=>{
    const a=alcance[s.id];
    if(!a) return;
    principalRef.current=s.id;setPrincipalId(s.id);setBackendUrl(a.base);
    showToast('Painel usando '+s.nome);
  };
  const nomeServidor=(base)=>{
    if(servidores.length<2) return '';
    const s=servidores.find(x=>alcance[x.id]&&alcance[x.id].base===base);
    return s?s.nome:'';
  };
  // servidores da conta que respondem daqui, do mais livre para o mais ocupado
  const servidoresVivos=()=>servidores.filter(s=>alcance[s.id])
    .map(s=>({id:s.id,nome:s.nome,base:alcance[s.id].base,status:alcance[s.id].status||{}}))
    .sort((a,b)=>(Number(b.status.availability||0)-Number(a.status.availability||0))
      ||(Number(a.status.active_streams||0)-Number(b.status.active_streams||0)));
  // nova câmera vai para o servidor mais livre da conta
  const servidorParaCamera=()=>{
    const vivos=servidoresVivos();
    return vivos.length?vivos[0].base:backendUrl;
  };
  const [escolherServ,setEscolherServ]=useState(false);
  const novoSid=()=>user.id+'_'+Math.random().toString(36).slice(2,8);

  useEffect(()=>{
    if(!token || !backendUrl) return;
    loadTokens(backendUrl,token);
    authFetch(backendUrl+'/models',token).then(r=>r.json()).then(d=>{
      if(d.models&&d.models.length>0){setAvailableModels(d.models);const serverDefault=(d.models.find(m=>m.is_default)||{}).name;const saved=localStorage.getItem('epi_defaultModel');const pick=serverDefault||saved||d.models[0].name;setDefaultModel(pick);localStorage.setItem('epi_defaultModel',pick);}
    }).catch(()=>{});
  },[token,backendUrl]);

  useEffect(()=>{
    if(!token || !backendUrl) return;
    const iv=setInterval(async()=>{
      try{
        const r=await authFetch(backendUrl+'/status',token);
        if(r.ok){
          setOnline(true);
          const d=await r.json();if(typeof d.paused==='boolean')setPaused(d.paused);
          if(d.node_id) setNodeId(d.node_id);
        }else setOnline(false);
        // Sincroniza streams EXTERNOS (criados por cam.html / outros dispositivos) de todos
        // os servidores da conta, mas NUNCA readiciona os que o usuário removeu
        const bases=[...new Set([backendUrl,...Object.values(alcanceRef.current).filter(Boolean).map(a=>a.base)])];
        await Promise.all(bases.map(async base=>{try{
          const rs=await authFetch(base+'/streams',token);
          if(rs.ok){
            const ds=await rs.json();
            if(ds.streams){
              setStreamsList(prev=>{
                const localIds=new Set(prev.map(s=>s.streamId));
                const toAdd=ds.streams.filter(s=>{
                  // Só adiciona se: não está na lista local E não foi o usuário que gerenciou (não é do managedStreams)
                  // Streams do managedStreams são gerenciados localmente — não readicionar se foram removidos
                  if(localIds.has(s.stream_id)) return false;
                  // Se começa com "cam_" é stream externo (de cam.html) — sempre mostrar
                  if(s.stream_id.startsWith('cam_')) return true;
                  // Se nunca foi gerenciado localmente, também mostrar (sessão anterior)
                  if(!managedStreams.current.has(s.stream_id)) return true;
                  return false;
                });
                if(toAdd.length===0) return prev;
                const novos=toAdd.map(s=>({streamId:s.stream_id,index:nextIndex.current++,base}));
                return [...prev,...novos];
              });
            }
          }
        }catch{}}));
      }catch{setOnline(false);}
    },3000);
    af(backendUrl+'/tunnels').then(r=>r.json()).then(d=>setServerLinks(d)).catch(()=>{});
    const iv2=setInterval(()=>af(backendUrl+'/tunnels').then(r=>r.json()).then(d=>setServerLinks(d)).catch(()=>{}),10000);
    return()=>{clearInterval(iv);clearInterval(iv2);};
  },[token,backendUrl]);

  const loadModels=useCallback(async()=>{
    try{
      const r=await af(backendUrl+'/models',{headers:{'Authorization':'Bearer '+token,'ngrok-skip-browser-warning':'true'}});
      if(r.ok){const d=await r.json();if(d.models){setAvailableModels(d.models);const serverDefault=(d.models.find(m=>m.is_default)||{}).name; if(serverDefault){setDefaultModel(serverDefault);localStorage.setItem('epi_defaultModel',serverDefault);} }}
    }catch{}
  },[token,backendUrl]);

  const setModelAsDefault=async(modelName)=>{
    try{
      const r=await authFetch(backendUrl+'/models/'+encodeURIComponent(modelName)+'/default',token,{method:'POST'});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||'Erro ao definir padrão');
      localStorage.setItem('epi_defaultModel',modelName);
      setDefaultModel(modelName);
      showToast('Modelo padrão salvo!');
      loadModels();
    }catch(e){showToast(mensagemErro(e,'Erro ao definir padrão'),'err');}
  };

  const go=(p)=>{
    if(window.location.hash==='#'+p) setPage(p);
    else window.location.hash=p;
  };

  const uploadModelFile=async(file)=>{
    if(!file) return;
    if(!String(file.name||'').toLowerCase().endsWith('.pt')){showToast('Envie um arquivo .pt','err');return;}
    setUploadingModel(true);
    setUploadPct(0);
    try{
      const fd=new FormData();
      fd.append('model',file);
      await new Promise((resolve,reject)=>{
        const xhr=new XMLHttpRequest();
        xhr.open('POST', backendUrl+'/models/upload');
        xhr.setRequestHeader('Authorization','Bearer '+token);
        xhr.setRequestHeader('ngrok-skip-browser-warning','true');
        xhr.upload.onprogress=(e)=>{if(e.lengthComputable) setUploadPct(Math.max(1,Math.round((e.loaded/e.total)*100)));};
        xhr.onload=()=>{
          try{
            const d=JSON.parse(xhr.responseText||'{}');
            if(xhr.status>=200&&xhr.status<300) resolve(d);
            else reject(new Error(d.error||'Erro ao enviar modelo'));
          }catch(err){reject(err);}
        };
        xhr.onerror=()=>reject(new Error('Falha no upload do modelo'));
        xhr.send(fd);
      });
      setUploadPct(100);
      await loadModels();
      showToast('Modelo enviado com sucesso!');
      go('config');
    }catch(e){showToast(mensagemErro(e,'Erro ao enviar modelo'),'err');}
    setTimeout(()=>setUploadPct(0),700);
    setUploadingModel(false);
  };

  useEffect(()=>{
    if(token&&page==='epis') loadEpis();
    if(token&&page==='funcionarios'){ loadFuncs(); carregarRostos(); }
    if(token&&page==='devices') loadTokens(backendUrl,token);
    // Recarregar modelos ao abrir qualquer aba (pode ter novos modelos treinados)
    if(token&&page==='cameras') loadModels();
    if(token&&page==='config') loadModels();
    if(token&&page==='servidores') carregarServidores();
  },[page,token,backendUrl]);

  useEffect(()=>{
    if(!token||!backendUrl||page!=='devices') return;
    const iv=setInterval(()=>{if(!document.hidden) loadTokens(backendUrl,token);},5000);
    return()=>clearInterval(iv);
  },[page,token,backendUrl]);

  /* Ajustes da câmera > Servidor: passa a câmera para outro servidor da conta.
     Câmera do painel: sai do servidor antigo (quem salva os ajustes religa no novo).
     Celular: o servidor atual avisa o celular, que reconecta no escolhido. */
  const mudarServidorDaCamera=async(sid,alvo,{remoto,baseAtual})=>{
    if(remoto){
      const r=await authFetch(baseAtual+'/streams/'+encodeURIComponent(sid)+'/mover',token,{method:'POST',body:JSON.stringify({servidor_id:alvo.id})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||'Não foi possível mudar o servidor desta câmera.');
    }else{
      try{await authFetch(baseAtual+'/streams/remove',token,{method:'POST',body:JSON.stringify({stream_id:sid})});}catch{}
    }
    setStreamsList(lista=>lista.map(x=>x.streamId===sid?{...x,base:alvo.base}:x));
  };

  const criarCamera=(base)=>{
    const idx=nextIndex.current++;
    const sid=novoSid();
    managedStreams.current.add(sid);
    setStreamsList(p=>[...p,{streamId:sid,index:idx,base}]);
  };
  // Com vários servidores (ex.: um por filial) pergunta onde: câmera IP só
  // funciona no servidor que está na mesma rede que ela.
  const addStream=()=>{
    if(servidoresVivos().length>1){setEscolherServ(true);return;}
    criarCamera(servidorParaCamera());
  };

  const addDiscoveredStream=async(stream,baseServidor)=>{
    const base=baseServidor||backendUrl;
    const url=String(stream?.uri||'').trim();
    if(!url){showToast('Stream sem URL','err');return;}
    const idx=nextIndex.current++;
    const sid=novoSid();
    const source=url.toLowerCase().startsWith('rtsp://')?'rtsp':'http';
    managedStreams.current.add(sid);
    localStorage.setItem('epi_source_'+sid,source);
    localStorage.setItem('epi_camurl_'+sid,url);
    localStorage.setItem('epi_sm_'+sid,defaultModel);
    // a câmera achada fica no servidor que a encontrou: só ele está na rede dela
    setStreamsList(p=>[...p,{streamId:sid,index:idx,base}]);
    try{
      const modelCfg=getModelRequiredItems(findModelByValue(availableModels,defaultModel));
      const r=await authFetch(base+'/streams/add',token,{method:'POST',body:JSON.stringify({
        model:defaultModel,
        device,
        camera:url,
        stream_id:sid,
        required_items:modelCfg
      })});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||'Erro ao iniciar stream');
      showToast('Camera adicionada');
    }catch(e){
      showToast(mensagemErro(e,'Camera adicionada; clique em Ligar para iniciar'),'err');
    }
  };

  // FIX remover câmera: remove apenas localmente + avisa o servidor
  const removeStream=async(sid)=>{
    const base=(streams_list.find(s=>s.streamId===sid)||{}).base||backendUrl;
    managedStreams.current.delete(sid);
    setStreamsList(p=>p.filter(s=>s.streamId!==sid));
    try{await authFetch(base+'/streams/remove',token,{method:'POST',body:JSON.stringify({stream_id:sid})});}catch{}
  };

  const togglePause=async()=>{
    try{
      const r=await authFetch(backendUrl+'/pause',token,{method:'POST',body:JSON.stringify({paused:!paused})});
      const d=await r.json();setPaused(d.paused);
    }catch{}
  };

  const criarEpi=async(form)=>{
    setShowNovoEpi(false);
    const r=await authFetch(backendUrl+'/epis',token,{method:'POST',body:JSON.stringify(form)});
    if(r.ok){await loadEpis();showToast('EPI criado!');}
    else showToast('Erro ao criar EPI','err');
  };

  const criarFunc=async(form)=>{
    setShowNovoFunc(false);
    const r=await authFetch(backendUrl+'/funcionarios',token,{method:'POST',body:JSON.stringify(form)});
    if(r.ok){await loadFuncs();showToast('Funcionário cadastrado!');}
    else showToast('Erro ao cadastrar','err');
  };

  const carregarRostos=useCallback(async()=>{
    if(!token||!backendUrl) return;
    try{
      const r=await authFetch(backendUrl+'/funcionarios/reconhecimento/status',token);
      if(r.ok) setRostos(await r.json());
    }catch(e){}
  },[token,backendUrl]);

  // Não há mais treino: o rosto vira um vetor no momento do upload. Este botão
  // só reprocessa fotos que ficaram sem vetor (enviadas antes da mudança, ou
  // quando o modelo de rosto não estava disponível).
  const treinarFaces=async()=>{
    setTreinandoFaces(true);
    try{
      const r=await authFetch(backendUrl+'/funcionarios/reconhecimento/status',token);
      const st=await r.json();
      if(st.pendentes===0){
        showToast('Todos os rostos já estão processados.');
      }else{
        const rr=await authFetch(backendUrl+'/funcionarios/treinar_reconhecimento',token,{method:'POST'});
        const d=await rr.json();
        if(!rr.ok) throw new Error(d.error||'Erro');
        showToast(d.message||'Processando rostos...');
        setTimeout(()=>{carregarRostos();loadFuncs();},4000);
      }
    }catch(e){showToast(mensagemErro(e,'Erro ao processar rostos'),'err');}
    setTreinandoFaces(false);
    carregarRostos();
  };

  const aviso=toast&&<Aviso toast={toast} onClose={()=>setToast(null)}/>;

  if(!token||!user) return <><AuthScreen onLogin={onLogin}/>{aviso}</>;
  const atualizarConta=(tok,usr)=>{if(tok){setToken(tok);localStorage.setItem('epi_token',tok);}setUser(usr);};
  // páginas que dependem de um servidor ligado
  const precisaServidor=!['servidores','config'].includes(page);
  const semServidor=!backendUrl;

  // Sem escolha do usuário: uma câmera sozinha abre em "grande", várias em "médio".
  const visualAtivo=visual||(streams_list.length<=1?'grande':'medio');

  const flURL=serverLinks.frontend_local||null;
  const cfURL=serverLinks.cloudflare_url;
  const trocarAlarme=(v)=>{setAlarmeLigado(v);localStorage.setItem('epi_som_painel',v?'1':'0');};

  return(
    <div className="app">
      <header className="topbar">
        <a className="brand-link" href="#cameras" aria-label="Argos EPI: início"><Brand/></a>
        <div className="topo-dir">
          <span className="rede" role="status" data-dica={backendUrl?(online?'Servidor online':'Servidor offline'):'Nenhum servidor ligado'}>
            <Icon n="server"/><span className={"dot"+(online?' on':'')}/><span className="sr">{online?'Servidor online':'Servidor offline'}</span>
          </span>
          <button type="button" className={"ib"+(alarmeLigado?'':' aceso')} onClick={()=>trocarAlarme(!alarmeLigado)}
            aria-pressed={alarmeLigado} aria-label="Sirene neste painel"
            data-dica={alarmeLigado?'Sirene neste painel: ligada':'Sirene neste painel: desligada'}><Icon n={alarmeLigado?'bell':'bell-off'}/></button>
          {online&&<button type="button" className={"ib"+(paused?' aceso':'')} onClick={togglePause}
            aria-label={paused?'Retomar IA':'Pausar IA'} data-dica={paused?'IA pausada: retomar':'Pausar IA'}><Icon n={paused?'play':'pause'}/></button>}
          <abbr className="avatar" title={user.nome}>{iniciais(user.nome)}</abbr>
          <button type="button" className="ib dica-dir" onClick={logout} aria-label="Sair" data-dica="Sair"><Icon n="logout"/></button>
        </div>
      </header>

      <nav className="rail" aria-label="Menu principal">
        <ul className="rail-lista">
          {NAV_ITEMS.map(item=>{
            const ativo=page===item.id||(item.id==='config'&&page==='servidores');
            return(
            <li key={item.id}>
              <a href={'#'+item.id} className={"rail-item"+(ativo?' ativo':'')}
                aria-current={ativo?'page':undefined}>
                <Icon n={item.icon}/><span>{item.label}</span>
              </a>
            </li>
          );})}
        </ul>
      </nav>

      <main className="main">

      {user.perfil_incompleto&&page!=='config'&&(
        <p className="faixa-aviso" role="status"><Icon n="id"/>Complete seu cadastro (CPF, telefone e setor) quando puder.
          <a className="btn btn-secondary btn-sm" href="#config">Completar</a></p>
      )}

      {precisaServidor&&semServidor&&(
        <Pagina ic="server" titulo="Nenhum servidor ligado">
          {!servidoresCarregados||buscandoServidores
            ? <p className="dica-linha"><span className="giro"/>Procurando os servidores da sua conta...</p>
            : servidores.length===0
              ? <Vazio ic="server" titulo="Vincule o primeiro servidor"><ComoVincular/></Vazio>
              : <Vazio ic="server" titulo="Nenhum servidor da conta respondeu">
                  <p className="dica-linha">Ligue um dos servidores ({servidores.map(s=>s.nome).join(', ')}) e aguarde alguns segundos.</p>
                  <p className="acoes"><button type="button" className="btn btn-primary" onClick={()=>carregarServidores({trocarPrincipal:true})}><Icon n="refresh"/>Procurar de novo</button>
                    <a className="btn btn-claro" href="#servidores"><Icon n="server"/>Servidores</a></p>
                </Vazio>}
        </Pagina>
      )}

      {page==='cameras'&&!semServidor&&(
        <Pagina ic="camera" titulo="Câmeras" total={streams_list.length} acoes={streams_list.length>0&&<>
          <SeletorVisual valor={visualAtivo} onChange={escolherVisual}/>
          <button type="button" className="btn btn-claro" onClick={()=>setShowNetCam(true)} aria-label="Buscar câmeras na rede"><Icon n="wifi"/><span className="btn-rotulo" aria-hidden="true">Rede</span></button>
          <button type="button" className="btn btn-gold" onClick={addStream} aria-label="Adicionar câmera"><Icon n="plus"/><span className="btn-rotulo" aria-hidden="true">Câmera</span></button>
        </>}>
          {streams_list.length===0&&(
            <Vazio ic="camera" titulo="Nenhuma câmera">
              <p className="acoes">
                <button type="button" className="btn btn-gold" onClick={addStream}><Icon n="plus"/>Câmera</button>
                <button type="button" className="btn btn-claro" onClick={()=>setShowNetCam(true)}><Icon n="wifi"/>Buscar na rede</button>
                <a className="btn btn-claro" href="#devices"><Icon n="phone"/>Usar celular</a>
              </p>
            </Vazio>
          )}
          {streams_list.length>0&&(
            <ul className={"grade v-"+visualAtivo} aria-label="Câmeras">
              {streams_list.map(s=>(
                <li key={s.streamId}>
                  <StreamCard streamId={s.streamId} token={token} backendUrl={s.base||backendUrl}
                    availableModels={availableModels} defaultModel={defaultModel} device={device} index={s.index}
                    alarmeLigado={alarmeLigado} onToast={showToast} visual={visualAtivo} servidorNome={nomeServidor(s.base||backendUrl)}
                    servidores={servidoresVivos()} onMudarServidor={mudarServidorDaCamera}
                    onRemove={()=>removeStream(s.streamId)}/>
                </li>
              ))}
            </ul>
          )}
        </Pagina>
      )}

      {page==='servidores'&&(
        <ServidoresPage servidores={servidores} alcance={alcance} principalId={principalId} carregando={buscandoServidores}
          onAtualizar={()=>carregarServidores()} onUsar={usarServidor} token={token} onToast={showToast} onModelos={loadModels}/>
      )}

      {page==='epis'&&!semServidor&&(
        <Pagina ic="helmet" titulo="EPIs" total={epis.length} acoes={epis.length>0&&
          <button type="button" className="btn btn-gold" onClick={()=>setShowNovoEpi(true)} aria-label="Adicionar EPI"><Icon n="plus"/><span className="btn-rotulo" aria-hidden="true">EPI</span></button>}>
          {epis.length===0&&(
            <Vazio ic="helmet" titulo="Nenhum EPI">
              <Passos itens={[{ic:'plus',txt:'Criar o EPI'},{ic:'image',txt:'Enviar 5+ fotos'},{ic:'dumbbell',txt:'Treinar'}]}/>
              <p className="acoes"><button type="button" className="btn btn-gold" onClick={()=>setShowNovoEpi(true)}><Icon n="plus"/>EPI</button></p>
            </Vazio>
          )}
          {epis.length>0&&(
            <ul className="cards" aria-label="EPIs cadastrados">
              {epis.map(epi=>(
                <li key={epi.id}>
                  <EpiCard epi={epi} token={token} backendUrl={backendUrl} onUpdate={loadEpis} onDelete={loadEpis} onToast={showToast}/>
                </li>
              ))}
            </ul>
          )}
          {showNovoEpi&&<ModalNovoEpi onClose={()=>setShowNovoEpi(false)} onSave={criarEpi}/>}
        </Pagina>
      )}

      {page==='funcionarios'&&!semServidor&&(
        <Pagina ic="users" titulo="Equipe" total={funcs.length} acoes={funcs.length>0&&
          <button type="button" className="btn btn-gold" onClick={()=>setShowNovoFunc(true)} aria-label="Cadastrar funcionário"><Icon n="user-plus"/><span className="btn-rotulo" aria-hidden="true">Funcionário</span></button>}>
          {rostos&&!rostos.disponivel&&(
            <p className="err-msg"><Icon n="scan-face"/>Reconhecimento facial indisponível: {rostos.erro||'motor não carregado'}</p>
          )}
          {rostos&&funcs.length>0&&(
            <section className="bloco" aria-labelledby="titulo-rostos">
              <header className="bloco-titulo">
                <Icon n="scan-face"/><h2 id="titulo-rostos">Reconhecimento facial</h2>
                {rostos.pendentes>0&&(
                  <div className="acoes-dir">
                    <button type="button" className="btn btn-secondary btn-sm" onClick={treinarFaces} disabled={treinandoFaces}
                      title="Recalcula o rosto das fotos que ainda não foram processadas">
                      <Icon n="refresh"/>{treinandoFaces?'Processando...':'Processar'}
                    </button>
                  </div>
                )}
              </header>
              <dl className="stats">
                <Stat ic="image" label="Fotos de rosto" value={rostos.fotos}/>
                <Stat ic="check" label="Prontos" value={rostos.rostos_prontos}/>
                <Stat ic="clock" label="Pendentes" value={rostos.pendentes} danger={rostos.pendentes>0}/>
              </dl>
            </section>
          )}
          {funcs.length===0&&(
            <Vazio ic="users" titulo="Nenhum funcionário">
              <Passos itens={[{ic:'user-plus',txt:'Cadastrar'},{ic:'scan-face',txt:'3 fotos do rosto'},{ic:'camera',txt:'Reconhecido nas câmeras'}]}/>
              <p className="acoes"><button type="button" className="btn btn-gold" onClick={()=>setShowNovoFunc(true)}><Icon n="user-plus"/>Funcionário</button></p>
            </Vazio>
          )}
          {funcs.length>0&&(
            <ul className="cards" aria-label="Funcionários">
              {funcs.map(func=>(
                <li key={func.id}>
                  <FuncCard func={func} token={token} backendUrl={backendUrl} onUpdate={loadFuncs} onDelete={loadFuncs} onToast={showToast}/>
                </li>
              ))}
            </ul>
          )}
          {showNovoFunc&&<ModalNovoFunc onClose={()=>setShowNovoFunc(false)} onSave={criarFunc}/>}
        </Pagina>
      )}


      {page==='devices'&&!semServidor&&(()=>{
        const nCam=camTokens.filter(t=>t.tipo!=='tv').length, nTv=camTokens.length-nCam;
        const visiveis=camTokens.filter(t=>filtroDisp==='todos'||(filtroDisp==='tv')===(t.tipo==='tv'));
        const tvAberta=camTokens.some(t=>t.tipo==='tv'&&t.aberta);
        return(
        <Pagina ic="phone" titulo="Dispositivos" total={camTokens.length} acoes={camTokens.length>0&&
          <button type="button" className="btn btn-gold" onClick={addToken} aria-label="Criar link de celular ou de TV"><Icon n="plus"/><span className="btn-rotulo" aria-hidden="true">Link</span></button>}>
          {camTokens.length===0&&(
            <Vazio ic="phone" titulo="Celular como câmera e TV de avisos">
              <Passos itens={[{ic:'link',txt:'Criar o link'},{ic:'phone',txt:'Abrir no celular ou na TV'},{ic:'camera',txt:'Câmera ao vivo / sirene e voz'}]}/>
              <p className="acoes"><button type="button" className="btn btn-gold" onClick={addToken}><Icon n="plus"/>Criar link</button></p>
            </Vazio>
          )}
          {camTokens.length>0&&servidores.length>0&&!servidores.some(s=>s.online&&s.url)&&(
            <p className="aviso" role="status"><Icon n="alert"/><span>Nenhum servidor da conta está com endereço de internet agora, então os links não abrem fora da rede do servidor. {(((servidores.find(s=>s.online&&!s.url)||{}).estado||{}).tunel||{}).erro||'A rede do computador do servidor pode estar bloqueando o túnel.'} Veja a linha “Internet” na tela Início do programa do servidor.</span></p>
          )}
          {camTokens.length>0&&(
            <div className="barra-filtros">
              <Opcoes rotulo="Mostrar dispositivos" valor={filtroDisp} onChange={setFiltroDisp} className="filtros"
                opcoes={[{id:'todos',ic:'link',txt:`Todos (${camTokens.length})`},{id:'camera',ic:'phone',txt:`Câmeras (${nCam})`},{id:'tv',ic:'tv',txt:`TVs (${nTv})`}]}/>
              <Ajuda titulo="Dispositivos" resumo="Links para um celular virar câmera e para uma TV tocar a sirene e falar os avisos.">
                <p><b>Celular como câmera</b>: crie o link, abra no celular e toque em Iniciar. No modo tempo real o vídeo vai direto do celular para o servidor.</p>
                <p><b>TV de avisos</b>: crie o link de TV e abra no navegador da TV (ou num computador ligado nela por HDMI). Na primeira vez, toque em “Ativar som”. Quando alguém aparece sem EPI, a TV toca a sirene e fala, por exemplo: “André Jorge, por favor, coloque o capacete e os óculos de proteção, na área Solda”. O volume é ajustado na própria TV e fica registrado no desempenho do funcionário junto com a frase.</p>
                <p>Por padrão o som sai só na TV; este painel fica em silêncio (dá para ligar em Ajustes &gt; Sirene neste painel).</p>
                <p>Cada link vale para um aparelho. Removendo o dispositivo aqui, o link para de funcionar.</p>
              </Ajuda>
              {nTv>0&&<button type="button" className="btn btn-claro btn-sm" onClick={testarTv} disabled={!tvAberta} title={tvAberta?'Toca a sirene e uma frase de teste nas TVs abertas':'Nenhuma TV aberta agora'}><Icon n="volume"/>Testar som das TVs</button>}
            </div>
          )}
          {camTokens.length>0&&visiveis.length===0&&<p className="dica-linha vazio-filtro"><Icon n="info"/>Nenhum dispositivo deste tipo.</p>}
          {visiveis.length>0&&(
            <ul className="cards" aria-label="Dispositivos com acesso">
              {visiveis.map(t=>{
                const tv=t.tipo==='tv';
                const link=tv?buildTvLink(t.token,{conta:user.id,fallback:cfURL||flURL||backendUrl})
                  :buildCamLink(t.token,{nodeId,conta:user.id,fallback:cfURL||flURL||backendUrl});
                return(
                <li key={t.token}>
                  <article className={"card"+(tv?' card-tv':'')} aria-label={t.nome}>
                    <header className="card-topo">
                      <span className="card-ico"><Icon n={tv?'tv':'phone'}/></span>
                      <div className="card-txt">
                        <h2 className="card-nome">{t.nome}</h2>
                        <p className="card-sub">{tv?'TV de avisos':'Celular como câmera'}</p>
                      </div>
                      <button type="button" className="ib sm dica-dir" onClick={()=>renomearToken(t)} aria-label={'Renomear '+t.nome} data-dica="Renomear"><Icon n="pencil"/></button>
                    </header>
                    {tv&&(
                      <ul className="diag" aria-label="Situação da TV">
                        <li className={"chip"+(t.aberta?' bom':'')}><span className={"dot"+(t.aberta?' on':'')}/>{t.aberta?'aberta agora':'fechada'}</li>
                        {t.aberta&&t.volume!=null&&<li className="chip"><Icon n="volume"/>volume {t.volume}%</li>}
                        {t.aberta&&t.som===false&&<li className="chip alerta" title="Na TV, toque em “Ativar som”"><Icon n="bell-off"/>som não ativado</li>}
                      </ul>
                    )}
                    <p className="token" title={tv?'Código da TV':'Código do celular (se o link não abrir, cole no celular)'}><Icon n="key"/><code>{t.token}</code></p>
                    <footer className="card-acoes">
                      <button type="button" className="btn btn-primary btn-sm" onClick={()=>copyURL(link)}><Icon n="link"/>Copiar link</button>
                      <button type="button" className="ib sm perigo dica-dir" onClick={()=>delToken(t)} aria-label={'Remover '+t.nome} data-dica="Remover"><Icon n="trash"/></button>
                    </footer>
                  </article>
                </li>
              );})}
            </ul>
          )}
          {novoDisp&&<ModalNovoDispositivo onClose={()=>setNovoDisp(false)} onSave={criarDispositivo}/>}
        </Pagina>
        );
      })()}

      {page==='config'&&(
        <Pagina ic="gear" titulo="Ajustes">
          <AbasAjustes atual="config"/>
          <section className="bloco" aria-labelledby="titulo-preferencias">
            <h2 className="sr" id="titulo-preferencias">Preferências</h2>
            <ul className="pref-lista">
              <li>
                <div className="pref">
                  <span className="pref-ico"><Icon n="palette"/></span>
                  <span className="pref-nome" aria-hidden="true">Tema</span>
                  <Opcoes rotulo="Tema" valor={tema} onChange={setTema}
                    opcoes={[{id:'sistema',ic:'monitor',txt:'Auto'},{id:'claro',ic:'sun',txt:'Claro'},{id:'escuro',ic:'moon',txt:'Escuro'}]}/>
                </div>
              </li>
              <li>
                <label className="pref" title="Letras maiores e mais contraste para projetar na parede">
                  <span className="pref-ico"><Icon n="projector"/></span>
                  <span className="pref-nome">Modo projetor</span>
                  <span className="switch">
                    <input type="checkbox" role="switch" checked={modoProjetor} onChange={e=>setModoProjetor(e.target.checked)}/>
                    <span className="switch-trilho"/><span className="switch-bolha"/>
                  </span>
                </label>
              </li>
              <li>
                <label className="pref" title="A sirene e a voz saem na TV (Dispositivos > link de TV). Ligue aqui para ouvir a sirene também neste painel.">
                  <span className="pref-ico"><Icon n={alarmeLigado?'bell':'bell-off'}/></span>
                  <span className="pref-nome">Sirene neste painel</span>
                  <span className="switch">
                    <input type="checkbox" role="switch" checked={alarmeLigado} onChange={e=>trocarAlarme(e.target.checked)}/>
                    <span className="switch-trilho"/><span className="switch-bolha"/>
                  </span>
                </label>
              </li>
            </ul>
            {modoProjetor&&tema!=='claro'&&(
              <p className="pref-aviso"><Icon n="projector"/>Projetor ligado: tema claro fixo</p>
            )}
          </section>

          <MinhaConta user={user} token={token} onAtualizado={atualizarConta} onToast={showToast} onSair={logout}/>

          {/* o link para abrir o sistema em outro aparelho so aparecia no log do servidor */}
          {!semServidor&&<>
          <section className="bloco" aria-labelledby="titulo-acesso">
            <header className="bloco-titulo"><Icon n="globe"/><h2 id="titulo-acesso">Abrir em outro aparelho</h2>
              <Ajuda titulo="Abrir em outro aparelho" resumo="É o endereço do seu servidor na internet (não é do site). Muda quando o servidor reinicia.">
                <p>Este link <b>não é do site</b>: é o endereço do <b>seu servidor</b> (o computador com o Argos EPI Servidor) na internet.</p>
                <p>Ao ligar, o servidor abre um túnel pela Cloudflare (por isso o endereço termina em trycloudflare.com). É por ele que um celular, uma TV ou este painel alcançam o servidor de fora da rede, sem mexer no roteador.</p>
                <p>Abrindo o link em outro aparelho você entra no painel servido direto pelo servidor. O endereço <b>muda cada vez que o servidor é reiniciado</b>; por isso os links de celular e de TV (em Dispositivos) usam o endereço fixo do site, que descobre o túnel atual sozinho.</p>
                <p>“Na mesma rede Wi-Fi” é o endereço local do servidor: só funciona para aparelhos na mesma rede dele, e só se o servidor aceitar conexões da rede local.</p>
              </Ajuda></header>
            {cfURL
              ? <div className="aj-linha">
                  <code className="chip" style={{fontSize:'.85rem'}}>{cfURL}</code>
                  <button type="button" className="btn btn-primary btn-sm" onClick={()=>copyURL(cfURL)}><Icon n="link"/>Copiar link</button>
                </div>
              : <p className="dica-linha"><Icon n="globe"/>O link aparece aqui quando o servidor estiver publicado na internet.</p>}
            {flURL&&<p className="dica-linha" style={{marginTop:8}}><Icon n="wifi"/>Na mesma rede Wi-Fi: {flURL}</p>}
          </section>

          <AreasBoard token={token} backendUrl={backendUrl} onToast={showToast}/>

          <details className="avancado">
            <summary><Icon n="server"/><h2>Avançado</h2><Icon n="chevron" className="seta"/></summary>
            <div className="avancado-corpo">
              <section className="bloco" aria-labelledby={idServidor}>
                <header className="bloco-titulo"><Icon n="server"/><h3 id={idServidor}>Servidor</h3>
                  <Ajuda titulo="Servidor deste painel" resumo="Por qual servidor da conta este painel lê e grava os cadastros agora.">
                    <p><b>Endereço</b>: é por onde este painel está falando com o servidor neste momento. Normalmente é o túnel do servidor (trycloudflare.com); se você abriu o painel no próprio computador do servidor, é o endereço local dele. Não dá para digitar: o painel acha os servidores da conta sozinho.</p>
                    <p><b>Escolher o mais livre</b>: com mais de um servidor na conta, troca para o que estiver com mais folga.</p>
                    <p><b>Modelo padrão</b>: o modelo de IA das câmeras novas. Cada câmera pode usar outro (Ajustes da câmera).</p>
                    <p><b>Placa de vídeo ou CPU</b>: escolhido por servidor, na aba Servidores.</p>
                  </Ajuda></header>
                <form className="form-grade" onSubmit={enviar(()=>{})}>
                  <p className="field"><label htmlFor={idServidor+'-url'}><Icon n="globe"/>Endereço</label><input id={idServidor+'-url'} type="url" value={backendUrl} readOnly/></p>
                  <p className="field"><span className="field-rot"><Icon n="refresh"/>Escolha</span><button type="button" className="btn btn-secondary" onClick={()=>carregarServidores({trocarPrincipal:true})} disabled={buscandoServidores}><Icon n="refresh"/>{buscandoServidores?'Buscando...':'Escolher o mais livre'}</button></p>
                  <p className="field"><label htmlFor={idServidor+'-modelo'}><Icon n="chip"/>Modelo padrão</label>
                    <select id={idServidor+'-modelo'} value={defaultModel} onChange={e=>{setDefaultModel(e.target.value);localStorage.setItem('epi_defaultModel',e.target.value);}}>
                      {availableModels.length>0
                        ? availableModels.map(m=>{
                            const label=m.display_name||(m.tipo==='customizado'?'★ '+m.name:m.name);
                            const val=m.name;
                            return <option key={m.name} value={val}>{label} ({m.size_mb}MB)</option>;
                          })
                        : <>
                            <option value="yolo26n.pt">YOLO26 Nano</option>
                            <option value="yolo26s.pt">YOLO26 Small</option>
                          </>
                      }
                    </select>
                  </p>
                  <p className="field"><span className="field-rot"><Icon n="gauge"/>Placa de vídeo ou CPU</span><a className="btn btn-secondary" href="#servidores"><Icon n="server"/>Escolher em Servidores</a></p>
                  <p className="field"><span className="field-rot"><Icon n="chip"/>Modelos de IA e TensorRT</span><a className="btn btn-secondary" href="#servidores"><Icon n="server"/>Ver em Servidores</a></p>
                </form>
                <ul className="diag" style={{marginTop:12}} aria-label="Situação">
                  <li className={"chip"+(online?' bom':' alerta')}><Icon n="server"/>{online?'online':'offline'}</li>
                  {paused&&<li className="chip alerta"><Icon n="pause"/>IA pausada</li>}
                  {user.doc&&<li className="chip"><Icon n="id"/>{user.doc}</li>}
                </ul>
              </section>

            </div>
          </details>
          </>}
        </Pagina>
      )}
      </main>
      <footer className="rodape"><small>Argos EPI · SENAI Lauro de Freitas/BA · TCC Desenvolvimento de Sistemas</small></footer>

      {completarCadastro&&(
        <Janela titulo="Complete seu cadastro" ic="id" onClose={()=>setCompletarCadastro(false)}>
          <p className="pergunta-texto">Bem-vindo(a) ao Argos EPI! Informe seus dados para completar a conta. Dá para fazer depois em Ajustes.</p>
          <FormPerfil user={user} token={token} botao="Salvar cadastro" onToast={showToast}
            onAtualizado={(tok,usr)=>{atualizarConta(tok,usr);setCompletarCadastro(false);}}
            onDepois={()=>setCompletarCadastro(false)}/>
        </Janela>
      )}
      <Perguntas/>
      <NetworkCameraModal open={showNetCam} onClose={()=>setShowNetCam(false)} backendUrl={backendUrl} token={token} servidores={showNetCam?servidoresVivos():[]} onUseStream={addDiscoveredStream} onToast={showToast}/>
      {escolherServ&&(
        <Janela titulo="Em qual servidor?" ic="server" onClose={()=>setEscolherServ(false)}>
          <p className="dica-linha">Câmera IP (RTSP) precisa ficar no servidor que está na mesma rede que ela, por exemplo o da mesma filial. Câmera de celular ou link funciona em qualquer um.</p>
          <ul className="escolha-servidor" aria-label="Servidores">
            {servidoresVivos().map((v,i)=>(
              <li key={v.id}>
                <button type="button" className="btn btn-claro" onClick={()=>{setEscolherServ(false);criarCamera(v.base);}} data-foco={i===0?'':undefined}>
                  <Icon n="server"/><span className="escolha-nome">{v.nome}</span>
                  <small>{i===0?'mais livre · ':''}livre {v.status.availability??'?'}% · {v.status.active_streams??0} câmera(s)</small>
                </button>
              </li>
            ))}
          </ul>
        </Janela>
      )}
      {aviso}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body></html>
