<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>TV de avisos | Argos EPI</title>
<meta name="theme-color" content="#05075a">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" href="icone-192.png" sizes="192x192">

<style>
/* Tela para ser vista de longe: letras grandes, um estado por vez (tudo certo / falta EPI). */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
[hidden]{display:none !important;}
:root{--navy:#05075a;--brand:#3740b4;--gold:#fbc343;--gold-ink:#5c3d00;--dn:#c81e1e;--ok:#2fbf62;--display:'Anton',Impact,'Arial Narrow',sans-serif;}
html,body{height:100%;background:var(--navy);color:#fff;font-family:'Outfit',system-ui,sans-serif;overflow:hidden;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.ic{width:1em;height:1em;display:block;flex-shrink:0;}
body{display:flex;flex-direction:column;background:radial-gradient(130% 95% at 15% 0%,#0a7bff 0%,#1657da 30%,#1b31a8 58%,#150f63 100%);transition:background .4s;}
body.alerta{background:radial-gradient(130% 95% at 50% 0%,#ff5a4a 0%,#d41e1e 38%,#8a0d0d 100%);animation:pulso 1.1s ease-in-out infinite alternate;}
@keyframes pulso{from{filter:brightness(1);}to{filter:brightness(1.18);}}
@media (prefers-reduced-motion:reduce){body.alerta{animation:none;}}

.topo{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:2.2vh 3vw;}
.logo{font-family:var(--display);font-size:clamp(1.4rem,3.4vh,2.6rem);letter-spacing:.03em;line-height:1;display:flex;align-items:center;gap:.4em;}
.logo img{height:1.5em;width:auto;display:block;}
.logo span{font-size:.45em;letter-spacing:.1em;color:var(--navy);background:var(--gold);padding:.35em .45em .25em;border-radius:.3em;}
.topo-dir{display:flex;align-items:center;gap:1.4vw;font-size:clamp(.9rem,2.2vh,1.5rem);font-weight:600;}
.relogio{font-variant-numeric:tabular-nums;font-size:1.5em;font-weight:700;}
.chip{display:inline-flex;align-items:center;gap:.4em;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:.3em .8em;white-space:nowrap;}
.dot{width:.7em;height:.7em;border-radius:50%;background:#ff8f8f;}
.dot.on{background:#7dffab;box-shadow:0 0 0 .2em rgba(125,255,171,.25);}

.palco{flex:1;display:flex;align-items:stretch;gap:2vw;padding:0 3vw 2vh;min-height:0;}
.info{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;text-align:center;}

/* Cameras ao vivo: o video com as caixas, do jeito que aparece no painel */
.cams{flex:1.8;min-width:0;display:grid;gap:1.2vh 1vw;grid-template-columns:repeat(var(--colunas,1),minmax(0,1fr));grid-auto-rows:minmax(0,1fr);}
.cam{position:relative;background:#02031f;border:.4vh solid rgba(255,255,255,.3);border-radius:1.8vh;overflow:hidden;min-height:0;}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
.cam video{object-fit:contain;}
.cam-nome{position:absolute;left:1vh;top:1vh;z-index:2;background:rgba(2,3,31,.72);border-radius:999px;padding:.3em .8em;font-size:clamp(.8rem,2vh,1.3rem);font-weight:700;max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cam.em-alerta{border-color:#fff;box-shadow:0 0 0 .6vh rgba(255,255,255,.45);}
/* com cameras na tela, o lado dos avisos encolhe para caber */
.com-cams .selo{width:clamp(80px,15vh,170px);height:clamp(80px,15vh,170px);font-size:clamp(44px,8vh,92px);}
.com-cams .titulo{font-size:clamp(2rem,8.5vh,6.5rem);}
.com-cams .sub{font-size:clamp(1rem,2.8vh,2rem);}
.com-cams .falta{min-width:0;flex:1 1 100%;padding:1.6vh 1.2vw;gap:1.1vh;}
.com-cams .falta-nome,.com-cams .faltas:not(.uma) .falta-nome{font-size:clamp(1.3rem,4.2vh,3rem);}
.com-cams .epi canvas,.com-cams .faltas:not(.uma) .epi canvas{width:clamp(32px,5.2vh,62px);height:clamp(32px,5.2vh,62px);}
.com-cams .epi{font-size:clamp(.62rem,1.45vh,1rem);max-width:9.5vh;}
.com-cams .falta-epis{gap:.8vh .7vw;}
.com-cams .frase{font-size:clamp(1rem,2.6vh,1.9rem);max-width:100%;}
@media (orientation:portrait){.palco{flex-direction:column;}.cams{flex:1.2;}}
.selo{width:clamp(110px,24vh,280px);height:clamp(110px,24vh,280px);border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:.5vh solid rgba(255,255,255,.5);font-size:clamp(60px,13vh,150px);}
.ok .selo{background:var(--ok);border-color:#b6ffd0;box-shadow:0 0 0 2vh rgba(47,191,98,.2);}
.titulo{font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,13vh,11rem);letter-spacing:.02em;line-height:.95;text-transform:uppercase;}
.sub{font-size:clamp(1.1rem,3.6vh,2.6rem);font-weight:600;opacity:.92;}

/* Avisos em andamento: um cartao por pessoa */
.faltas{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:2vh 2vw;width:100%;max-height:100%;overflow:hidden;}
.falta{background:rgba(0,0,0,.28);border:.4vh solid rgba(255,255,255,.85);border-radius:2.4vh;padding:2.4vh 2.4vw;display:flex;flex-direction:column;align-items:center;gap:1.6vh;min-width:min(86vw,520px);flex:0 1 calc(50% - 2vw);}
.faltas.uma .falta{flex-basis:auto;min-width:min(90vw,900px);}
.falta-nome{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,7.4vh,6rem);line-height:1;letter-spacing:.02em;text-transform:uppercase;overflow-wrap:anywhere;}
.faltas:not(.uma) .falta-nome{font-size:clamp(1.5rem,5.2vh,4rem);}
.falta-epis{display:flex;flex-wrap:wrap;justify-content:center;gap:1.2vh 1.2vw;}
.epi{display:flex;flex-direction:column;align-items:center;gap:.6vh;font-size:clamp(.85rem,2.2vh,1.5rem);font-weight:700;max-width:22vh;}
.epi canvas{width:clamp(56px,11vh,130px);height:clamp(56px,11vh,130px);background:#fff;border-radius:22%;display:block;}
.faltas:not(.uma) .epi canvas{width:clamp(44px,8vh,96px);height:clamp(44px,8vh,96px);}
.falta-onde{display:flex;flex-wrap:wrap;justify-content:center;gap:1vw;font-size:clamp(1rem,2.8vh,2rem);font-weight:600;}
.frase{font-size:clamp(1.1rem,3.4vh,2.6rem);font-weight:600;max-width:92vw;min-height:1.2em;}

/* Barra de som: aparece ao mexer no controle/mouse e some sozinha */
.barra{display:flex;align-items:center;justify-content:center;gap:1.6vw;padding:1.6vh 3vw 2.2vh;font-size:clamp(.9rem,2.1vh,1.4rem);font-weight:600;transition:opacity .4s;}
body.quieto .barra{opacity:.28;}
.barra label{display:flex;align-items:center;gap:.6em;}
.barra input[type=range]{width:clamp(140px,22vw,360px);accent-color:var(--gold);}
.barra button,.grande{font:inherit;color:var(--gold-ink);background:var(--gold);border:0;border-radius:999px;padding:.5em 1.1em;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:.5em;}
.barra button.sec{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);font-weight:600;}
.barra button[aria-pressed=false]{opacity:.55;text-decoration:line-through;}
:focus-visible{outline:.5vh solid var(--gold);outline-offset:.4vh;}

/* Primeiro toque: o navegador so libera som depois de um gesto */
.veu{position:fixed;inset:0;z-index:20;background:rgba(5,7,90,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;padding:4vw;text-align:center;}
.veu h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,8vh,6rem);letter-spacing:.02em;}
.veu p{font-size:clamp(1rem,3vh,2rem);max-width:60ch;opacity:.9;}
.grande{font-size:clamp(1.2rem,4.4vh,3rem);padding:.6em 1.6em;}
</style>
</head>
<body class="quieto">

<header class="topo">
  <p class="logo"><img src="logo.png" alt="" onerror="this.remove()">ARGOS<span>EPI</span></p>
  <div class="topo-dir">
    <span class="chip" id="chip-rede" role="status"><span class="dot" id="dot"></span><span id="rede-txt">Conectando...</span></span>
    <span class="chip" id="chip-cam" hidden></span>
    <time class="relogio" id="relogio"></time>
  </div>
</header>

<main class="palco ok" id="palco">
  <section class="cams" id="cams" aria-label="Câmeras ao vivo" hidden></section>
  <section class="info" aria-live="assertive">
    <div class="selo" id="selo" aria-hidden="true"></div>
    <h1 class="titulo" id="titulo">Tudo certo</h1>
    <p class="sub" id="sub"></p>
    <ul class="faltas" id="faltas" hidden></ul>
    <p class="frase" id="frase"></p>
  </section>
</main>

<footer class="barra" id="barra">
  <label for="volume"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.6 7.6 0 0 1 0 11"/></svg>
    <span class="sr">Volume dos avisos</span><input type="range" id="volume" min="0" max="100" step="5"><output id="volume-txt" for="volume"></output></label>
  <button type="button" class="sec" id="btn-sirene" aria-pressed="true">Sirene</button>
  <button type="button" class="sec" id="btn-voz" aria-pressed="true">Voz</button>
  <button type="button" class="sec" id="btn-cams" aria-pressed="true">Câmeras</button>
  <button type="button" class="sec" id="btn-teste">Testar som</button>
  <button type="button" class="sec" id="btn-cheia">Tela cheia</button>
</footer>

<div class="veu" id="veu">
  <h1 id="veu-titulo">TV de avisos</h1>
  <p id="veu-texto">Esta tela toca a sirene e fala o aviso quando alguém aparece sem EPI. Toque no botão (ou aperte OK no controle) para ligar o som.</p>
  <button type="button" class="grande" id="btn-ativar">Ativar som</button>
</div>

<script>
const params = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const limpaUrl = (v) => String(v || '').trim().replace(/\/+$/, '');
const TOKEN = params.get('token') || localStorage.getItem('tv_token') || '';
const CONTA = params.get('conta') || '';
const API_SITE = limpaUrl(window.ARGOS_API_URL || 'https://argosepi.vercel.app/api');
if (TOKEN) localStorage.setItem('tv_token', TOKEN);

const ICONES = {
  ok: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  alerta: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17.2v.3"/></svg>',
  espera: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
};

/* ── Som ──────────────────────────────────────────────────────────
   Tudo pelo WebAudio: um volume so para sirene e voz, e o valor dele (0 a 100)
   vai junto com cada aviso falado, para ficar registrado no desempenho. */
const som = { ctx: null, ganho: null, sirene: null, liberado: false, tocando: false, fila: [] };
let volume = Number(localStorage.getItem('tv_volume') ?? 80);
let comSirene = localStorage.getItem('tv_sirene') !== '0';
let comVoz = localStorage.getItem('tv_voz') !== '0';
let comCams = localStorage.getItem('tv_cams') !== '0';      // TV fraca: dá para ficar só com os avisos

function aplicarVolume() {
  $('volume').value = volume;
  $('volume-txt').textContent = volume + '%';
  if (som.ganho) som.ganho.gain.value = Math.pow(volume / 100, 1.6);   // curva de ouvido: 50% soa como metade
  localStorage.setItem('tv_volume', String(volume));
  contarEstado();
}

async function liberarSom() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  if (!som.ctx) {
    som.ctx = new AC();
    som.ganho = som.ctx.createGain();
    som.ganho.connect(som.ctx.destination);
  }
  if (som.ctx.state === 'suspended') await som.ctx.resume().catch(() => {});
  som.liberado = som.ctx.state === 'running';
  aplicarVolume();
  if (!som.sirene) {
    try {
      const r = await fetch('sons/sirene.wav');
      som.sirene = await som.ctx.decodeAudioData(await r.arrayBuffer());
    } catch (e) { console.warn('sirene', e); }
  }
  return som.liberado;
}

function tocarBuffer(buffer, vezes = 1) {
  return new Promise((ok) => {
    if (!buffer || !som.liberado) return ok(false);
    let restam = vezes;
    const uma = () => {
      const fonte = som.ctx.createBufferSource();
      fonte.buffer = buffer;
      fonte.connect(som.ganho);
      fonte.onended = () => (--restam > 0 ? uma() : ok(true));
      fonte.start();
    };
    uma();
  });
}

async function buscarVoz(aviso) {
  if (!aviso.audio) return null;
  try {
    const r = await fetch(`${aviso.base}/tv/audio/${aviso.audio}.wav?token=${encodeURIComponent(TOKEN)}`, { cache: 'force-cache' });
    if (!r.ok) return null;
    return await som.ctx.decodeAudioData(await r.arrayBuffer());
  } catch (e) { return null; }
}

/* Um aviso por vez: sirene, depois a frase. Aviso velho (a fila encheu) e descartado. */
async function tocarFila() {
  if (som.tocando) return;
  som.tocando = true;
  try {
    while (som.fila.length) {
      const aviso = som.fila.shift();
      if (Date.now() / 1000 - aviso.ts > 25 && aviso.tipo !== 'teste') continue;
      $('frase').textContent = aviso.frase || '';
      let tocouSirene = false, falou = false;
      if (som.liberado) {
        // a voz comeca a baixar enquanto a sirene toca
        const voz = comVoz ? buscarVoz(aviso) : Promise.resolve(null);
        if (comSirene && aviso.tipo !== 'teste') tocouSirene = await tocarBuffer(som.sirene, aviso.tipo === 'queda' ? 2 : 1);
        else if (comSirene) tocouSirene = await tocarBuffer(som.sirene, 1);
        const buf = await voz;
        if (buf) falou = await tocarBuffer(buf);
      }
      aviso.confirmar && aviso.confirmar({ id: aviso.id, volume, falou, sirene: tocouSirene });
      await new Promise((ok) => setTimeout(ok, 500));
    }
  } finally {
    som.tocando = false;
    setTimeout(() => { if (!som.tocando) $('frase').textContent = ''; }, 4000);
  }
}

/* ── Servidores da conta ──────────────────────────────────────────
   A TV conecta em todos os servidores ligados da conta (um por filial, por exemplo):
   o aviso sai aqui de qualquer camera. Servida pelo proprio servidor, usa so ele. */
const conexoes = new Map();      // base -> {ws, vivo, estado, tentativa}

async function servidoresDaConta() {
  try {
    const r = await fetch('/tv/estado?token=' + encodeURIComponent(TOKEN), { cache: 'no-store' });
    if (r.ok && (await r.json()).ok) return [''];          // mesma origem e o servidor
    if (r.status === 401 && location.pathname.replace(/\/+$/, '').endsWith('/tv')) return ['__recusado'];
  } catch (e) { /* pagina servida pelo site */ }
  if (!CONTA) return [];
  try {
    const r = await fetch(API_SITE + '/enderecos/' + encodeURIComponent(CONTA), { cache: 'no-store' });
    if (!r.ok) return [];
    const d = await r.json();
    return (d.servidores || []).map((s) => limpaUrl(s.url)).filter(Boolean);
  } catch (e) { return []; }
}

function wsUrl(base) {
  const u = new URL((base || location.origin) + '/ws/tv');
  u.protocol = u.protocol === 'https:' ? 'wss:' : 'ws:';
  u.searchParams.set('token', TOKEN);
  return u.toString();
}

function conectar(base) {
  let c = conexoes.get(base);
  if (!c) { c = { ws: null, vivo: false, estado: null, tentativa: 0, ultima: 0 }; conexoes.set(base, c); }
  if (c.ws) return;
  const ws = c.ws = new WebSocket(wsUrl(base));
  ws.onopen = () => { c.tentativa = 0; contarEstado(); };
  ws.onmessage = (ev) => {
    c.ultima = Date.now();
    let d;
    try { d = JSON.parse(ev.data); } catch (e) { return; }
    if (d.type === 'pronto') { c.vivo = true; c.recusado = false; desenhar(); }
    else if (d.type === 'estado') { c.estado = d; desenhar(); }
    else if (d.type === 'alerta') {
      som.fila.push({ ...d, base, confirmar: (r) => { try { ws.send(JSON.stringify({ type: 'falou', ...r })); } catch (e) { /* */ } } });
      if (som.fila.length > 4) som.fila.splice(0, som.fila.length - 4);
      tocarFila();
    } else if (d.type === 'erro') { c.recusado = true; c.erro = d.error; desenhar(); }
  };
  ws.onclose = () => {
    c.ws = null; c.vivo = false; c.estado = null;
    desenhar();
    setTimeout(() => { if (conexoes.has(base)) conectar(base); }, Math.min(15000, 1500 * 2 ** Math.min(c.tentativa++, 4)));
  };
}

function contarEstado() {
  for (const c of conexoes.values()) {
    if (c.ws && c.ws.readyState === 1) try { c.ws.send(JSON.stringify({ type: 'estado', volume, som: som.liberado })); } catch (e) { /* */ }
  }
}

let semServidorDesde = 0;
async function acharServidores() {
  const bases = await servidoresDaConta();
  if (bases[0] === '__recusado') { mostrarLinkInvalido(); return; }
  for (const b of bases) conectar(b);
  for (const [b, c] of conexoes) if (!bases.includes(b) && !c.vivo) { conexoes.delete(b); if (c.ws) try { c.ws.close(); } catch (e) { /* */ } }
  desenhar();
}

function mostrarLinkInvalido() {
  $('veu').hidden = false;
  $('veu-titulo').textContent = 'Link de TV inválido';
  $('veu-texto').textContent = 'Este link foi removido ou está incompleto. No painel do Argos EPI, abra Dispositivos, crie um link de TV e abra-o aqui.';
  $('btn-ativar').hidden = true;
}

/* ── Tela ─────────────────────────────────────────────────────────── */
function iconeEpi(item) {
  const c = document.createElement('canvas');
  c.width = c.height = 160;
  const x = c.getContext('2d');
  x.translate(22, 22); x.scale(116, 116);
  x.fillStyle = x.strokeStyle = '#c81e1e';
  (ArgosStream.EPI_ICONS[item] || ((k) => { k.beginPath(); k.moveTo(0.5, 0.12); k.lineTo(0.86, 0.26); k.lineTo(0.86, 0.54); k.quadraticCurveTo(0.86, 0.8, 0.5, 0.9); k.quadraticCurveTo(0.14, 0.8, 0.14, 0.54); k.lineTo(0.14, 0.26); k.closePath(); k.fill(); }))(x);
  x.globalAlpha = 1; x.strokeStyle = '#c81e1e'; x.lineWidth = 0.09; x.lineCap = 'round';
  x.beginPath(); x.moveTo(0.04, 0.96); x.lineTo(0.96, 0.04); x.stroke();     // risco: esta faltando
  return c;
}

/* ── Câmeras ao vivo ──────────────────────────────────────────────
   O mesmo vídeo do painel, com as caixas: vídeo direto quando a rede deixa, senão os quadros
   que o servidor manda. Cada câmera fala com o servidor que a processa. */
const cams = new Map();          // base|sid -> {el, video, player, viewer}

function sincronizarCams(lista) {
  const querem = new Map(lista.map((c) => [c.base + '|' + c.sid, c]));
  for (const [k, c] of cams) {
    if (querem.has(k)) continue;
    c.viewer.stop(); c.player.close(); c.el.remove(); cams.delete(k);
  }
  let n = 0;
  for (const [k, c] of querem) {
    n++;
    let atual = cams.get(k);
    if (!atual) {
      const el = document.createElement('article'); el.className = 'cam';
      const video = document.createElement('video'); video.muted = true; video.autoplay = true; video.playsInline = true; video.hidden = true;
      const canvas = document.createElement('canvas');
      const nome = document.createElement('span'); nome.className = 'cam-nome';
      el.append(video, canvas, nome);
      $('cams').append(el);
      const player = new ArgosStream.LivePlayer({ canvas });
      const viewer = new ArgosStream.LiveViewer({
        backendUrl: c.base || location.origin, token: TOKEN, streamId: c.sid, player, videoEl: video,
        onDireto: (on) => { video.hidden = !on; },
      });
      viewer.start();
      atual = { el, video, player, viewer, nome };
      cams.set(k, atual);
    }
    atual.nome.textContent = c.nome || ('Câmera ' + n);
    atual.el.classList.toggle('em-alerta', Boolean(c.alerta));
  }
  const total = cams.size;
  $('cams').hidden = !total;
  $('cams').style.setProperty('--colunas', total <= 1 ? 1 : total <= 4 ? 2 : 3);
  $('palco').classList.toggle('com-cams', total > 0);
}

let chaveDesenhada = '';
function desenhar() {
  const vivos = [...conexoes.values()].filter((c) => c.vivo);
  const recusado = [...conexoes.values()].find((c) => c.recusado);
  if (recusado && !vivos.length) { mostrarLinkInvalido(); return; }
  $('dot').classList.toggle('on', vivos.length > 0);
  $('rede-txt').textContent = vivos.length ? (vivos.length > 1 ? vivos.length + ' servidores' : 'Conectada') : 'Sem servidor';
  let cameras = 0, pessoas = 0;
  const faltas = [];
  const lista = [];
  for (const [base, c] of conexoes) {
    if (!c.vivo) continue;
    const e = c.estado || {};
    cameras += e.cameras || 0; pessoas += e.pessoas || 0;
    for (const f of e.faltas || []) faltas.push(f);
    for (const k of e.cams || []) lista.push({ base, sid: k.sid, nome: k.nome, alerta: (e.faltas || []).some((f) => f.camera === k.sid) });
  }
  sincronizarCams(comCams ? lista.slice(0, 9) : []);
  $('chip-cam').hidden = !vivos.length;
  $('chip-cam').textContent = `${cameras} câmera${cameras === 1 ? '' : 's'} · ${pessoas} pessoa${pessoas === 1 ? '' : 's'}`;
  const palco = $('palco');
  const chave = JSON.stringify([vivos.length, cameras > 0, faltas.map((f) => [f.nome, f.itens, f.area, f.queda, f.camera])]);
  if (chave === chaveDesenhada) return;
  chaveDesenhada = chave;
  const emAlerta = faltas.length > 0;
  document.body.classList.toggle('alerta', emAlerta);
  palco.classList.toggle('ok', !emAlerta && vivos.length > 0 && cameras > 0);
  $('selo').hidden = emAlerta;
  $('sub').hidden = emAlerta;
  $('faltas').hidden = !emAlerta;
  if (!emAlerta) {
    if (!vivos.length) {
      $('selo').innerHTML = ICONES.espera; $('titulo').textContent = 'Sem servidor';
      $('sub').textContent = CONTA || conexoes.size ? 'Procurando o servidor do Argos EPI. Confira se ele está ligado.' : 'Abra esta tela pelo link de TV criado no painel.';
    } else if (!cameras) {
      $('selo').innerHTML = ICONES.espera; $('titulo').textContent = 'Aguardando';
      $('sub').textContent = 'Nenhuma câmera ligada agora.';
    } else {
      $('selo').innerHTML = ICONES.ok; $('titulo').textContent = 'Tudo certo';
      $('sub').textContent = pessoas ? `${pessoas} pessoa${pessoas === 1 ? '' : 's'} com os EPIs em dia.` : 'Ninguém na área das câmeras.';
    }
    return;
  }
  const soQueda = faltas.every((f) => f.queda && !(f.itens || []).length);
  $('titulo').textContent = soQueda ? 'Possível queda' : 'Falta EPI';
  const ul = $('faltas');
  ul.replaceChildren();
  ul.classList.toggle('uma', faltas.length === 1);
  for (const f of faltas.slice(0, 4)) {
    const li = document.createElement('li'); li.className = 'falta';
    const nome = document.createElement('p'); nome.className = 'falta-nome';
    nome.textContent = f.nome ? String(f.nome).replace(/_/g, ' ') : 'Pessoa não identificada';
    li.append(nome);
    if ((f.itens || []).length) {
      const epis = document.createElement('div'); epis.className = 'falta-epis';
      for (const k of f.itens.slice(0, 6)) {
        const e = document.createElement('div'); e.className = 'epi';
        const rot = document.createElement('span'); rot.textContent = ArgosStream.itemLabel(k);
        e.append(iconeEpi(k), rot); epis.append(e);
      }
      li.append(epis);
    }
    const onde = document.createElement('p'); onde.className = 'falta-onde';
    if (f.queda) { const q = document.createElement('span'); q.className = 'chip'; q.textContent = 'Possível queda'; onde.append(q); }
    if (f.area) { const a = document.createElement('span'); a.className = 'chip'; a.textContent = 'Área: ' + f.area; onde.append(a); }
    if (onde.childNodes.length) li.append(onde);
    ul.append(li);
  }
  if (faltas.length > 4) { const li = document.createElement('li'); li.className = 'falta'; li.innerHTML = '<p class="falta-nome"></p>'; li.firstChild.textContent = `+ ${faltas.length - 4}`; ul.append(li); }
}

/* ── Controles ────────────────────────────────────────────────────── */
function relogio() { $('relogio').textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
setInterval(relogio, 5000); relogio();

let quietoEm = null;
function acordarBarra() {
  document.body.classList.remove('quieto');
  clearTimeout(quietoEm);
  quietoEm = setTimeout(() => document.body.classList.add('quieto'), 6000);
}
['pointermove', 'pointerdown', 'keydown'].forEach((ev) => document.addEventListener(ev, acordarBarra));

$('volume').addEventListener('input', (e) => { volume = Number(e.target.value); aplicarVolume(); });
document.addEventListener('keydown', (e) => {
  if (e.target && e.target.id === 'volume') return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { volume = Math.min(100, volume + 5); aplicarVolume(); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { volume = Math.max(0, volume - 5); aplicarVolume(); }
});
function botaoLiga(id, chave, ler, gravar) {
  const b = $(id);
  const pintar = () => b.setAttribute('aria-pressed', String(ler()));
  b.onclick = () => { gravar(!ler()); localStorage.setItem(chave, ler() ? '1' : '0'); pintar(); };
  pintar();
}
botaoLiga('btn-sirene', 'tv_sirene', () => comSirene, (v) => { comSirene = v; });
botaoLiga('btn-voz', 'tv_voz', () => comVoz, (v) => { comVoz = v; });
botaoLiga('btn-cams', 'tv_cams', () => comCams, (v) => { comCams = v; chaveDesenhada = ''; desenhar(); });
$('btn-teste').onclick = async () => {
  await liberarSom();
  await tocarBuffer(som.sirene, 1);
};
$('btn-cheia').onclick = () => {
  const d = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen();
  else (d.requestFullscreen || d.webkitRequestFullscreen || (() => {})).call(d);
};

let trava = null;
async function manterTelaLigada() { try { trava = await navigator.wakeLock?.request('screen'); } catch (e) { /* */ } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { manterTelaLigada(); if (som.ctx) som.ctx.resume().catch(() => {}); } });

async function ativar() {
  const ok = await liberarSom();
  if (!ok) { $('veu-texto').textContent = 'O navegador não liberou o som. Toque de novo; se continuar, confira se a TV não está no mudo.'; return; }
  $('veu').hidden = true;
  manterTelaLigada();
  contarEstado();
  tocarFila();
}
$('btn-ativar').onclick = ativar;
document.addEventListener('keydown', (e) => { if (!$('veu').hidden && !$('btn-ativar').hidden && (e.key === 'Enter' || e.key === ' ')) ativar(); });

aplicarVolume();
if (!TOKEN.startsWith('tv_')) mostrarLinkInvalido();
else {
  acharServidores();
  setInterval(acharServidores, 30000);
  setInterval(contarEstado, 20000);
  // navegador que ja liberou som para este site (ou aberto com autoplay permitido): entra direto
  liberarSom().then((ok) => { if (ok) { $('veu').hidden = true; manterTelaLigada(); contarEstado(); } });
  $('btn-ativar').focus();
}
</script>
