services:
  site:
    build: .
    image: argos-epi-treinamento
    container_name: argos-epi-treinamento
    restart: unless-stopped
    ports:
      - "${PORT_HOST:-8080}:8080"
    environment:
      # hub de discovery: e la que o painel do PC se registra (rotas /training/*)
      HUB_URL: ${HUB_URL:-https://backend-hub-vigilanciaepi.onrender.com}
      # opcionais
      NODE_ID: ${NODE_ID:-}
      PAINEL_URL: ${PAINEL_URL:-}
      PAINEL_TOKEN: ${PAINEL_TOKEN:-}
      HUB_API_KEY: ${HUB_API_KEY:-}
      DESCOBERTA_S: ${DESCOBERTA_S:-20}
